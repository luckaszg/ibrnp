server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /sermones/ → /sermones/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;

    # Fingerprinted assets (CSS, JS, fonts, images) never change: cache for a year.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /pagefind/ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Downloads not in nginx's default MIME list.
    location ~* \.epub$ {
        types { }
        default_type application/epub+zip;
    }
    location ~* \.ics$ {
        types { }
        default_type "text/calendar; charset=utf-8";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/calendar application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
