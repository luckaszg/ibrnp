# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 41
question: ¿Qué beneficios reciben de Cristo los creyentes cuando tenga lugar la resurrección?
answer: Cuando la resurrección tenga lugar, los creyentes, al ser resucitados en gloria, serán reconocidos y absueltos públicamente en el Día del Juicio, y serán hechos bienaventurados perfectamente, tanto en alma como en cuerpo, en el pleno disfrute de Dios, para toda la eternidad.
sections:
  - - q: ¿Es posible que haya una resurrección?
      a: Sí. «¿Por qué se considera increíble entre vosotros que Dios resucite a los muertos?» (Hch. 26:8).
    - q: ¿Es una certeza que habrá una resurrección?
      a: Sí. «Y muchos (es decir, la multitud de ellos) de los que duermen en el polvo de la tierra despertarán» (Dan. 12:2).
    - q: ¿Ha habido ya una resurrección?
      a: Sí, porque «los sepulcros se abrieron, y los cuerpos de muchos santos que habían dormido resucitaron» (Mat. 27:52).
    - q: ¿Se atribuye esta obra al Padre?
      a: Sí, porque «aquel que resucitó al Señor Jesús, a nosotros también nos resucitará» (2 Cor. 4:14).
    - q: ¿[Se atribuye esta obra] al Hijo?
      a: Sí. «Como el Padre levanta a los muertos y les da vida, asimismo el Hijo también da vida a los que Él quiere» (Jua. 5:21).[^59]
    - q: ¿[Se atribuye esta obra] al Espíritu?
      a: Sí. Dios «dará vida a vuestros cuerpos mortales por medio de su Espíritu» (Rom. 8:11).
    - q: ¿Y los santos resucitarán primero?
      a: Sí. «Los muertos en Cristo se levantarán primero» (1 Tes. 4:16).
  - - q: ¿Resucitarán los mismos cuerpos?
      a: Sí. «En mi carne veré a Dios» (Job 19:26).
    - q: Pero, ¿serán muy diferentes de lo que son ahora?
      a: Sí. «Lo que siembras, no siembras el cuerpo que nacerá […] así es también la resurrección de los muertos» (1 Cor. 15:37, 38, 42).
    - q: ¿Estarán libres de todas las debilidades naturales?
      a: Sí. «Se siembra en debilidad, se resucita en poder» (1 Cor. 15:43).
    - q: ¿Estarán libres de toda contaminación moral?
      a: Sí. «Bienaventurado y santo es el que tiene parte en la primera resurrección» (Apo. 20:6).
    - q: ¿Estarán dotados de actividad y vigor?
      a: Sí. «Se siembra un cuerpo natural, se resucita un cuerpo espiritual» (1 Cor. 15:44).
    - q: ¿Serán incorruptibles e inmortales?
      a: Sí. «Porque es necesario que esto corruptible se vista de incorrupción, y esto mortal se vista de inmortalidad» (1 Cor. 15:53).
    - q: ¿Se parecerán en todos estos aspectos al glorioso cuerpo de Cristo?
      a: Sí. «El cual transformará el cuerpo de nuestro estado de humillación en conformidad al cuerpo de su gloria» (Flp. 3:21).
    - q: ¿Y experimentarán un cambio equivalente a la resurrección todos los [creyentes] que se encuentren vivos en la Segunda Venida de Cristo?
      a: Sí. «No todos dormiremos, pero todos seremos transformados» (1 Cor. 15:51).
  - - q: ¿Serán reunidos los santos en el Día del Juicio?
      a: Sí. «En la congregación de los justos» (Sal. 1:5).
    - q: ¿Será esto obra de los ángeles?
      a: Sí. «Él enviará a sus ángeles […] y REUNIRÁN a sus escogidos de los cuatro vientos» (Mat. 24:31).
    - q: ¿Serán separados de los malvados?
      a: Sí. «Como el pastor separa las ovejas de los cabritos» (Mat. 25:32).
    - q: ¿Será esta una separación final {o definitiva}?
      a: Sí. «Hay un gran abismo puesto entre nosotros y vosotros» (Luc. 16:26).
    - q: ¿Acompañarán a Cristo al Juicio?
      a: Sí. «He aquí, el Señor vino con muchos millares de sus santos» (Jud. 14).
    - q: ¿Serán asesores de Cristo en el Juicio?
      a: Sí. «Os sentaréis también sobre doce tronos para juzgar a las doce tribus de Israel» (Mat. 19:28).
    - q: ¿Y declararán su aprobación de todas Sus actuaciones?
      a: "Sí. Dirán: «¡Aleluya! La salvación y la gloria y el poder pertenecen a nuestro Dios, PORQUE SUS JUICIOSSON VERDADEROS Y JUSTOS» (Apo. 19:1, 2)."
  - - q: ¿Serán reconocidos los santos públicamente en el Día del Juicio?
      a: Sí. «Le confesaré delante de mi Padre que está en los cielos» (Mat. 10:32).
    - q: ¿[Serán] absueltos públicamente?
      a: Sí. «“Bien, siervo bueno y fiel”» (Mat. 25:23).
    - q: ¿[Serán] recompensados públicamente?
      a: Sí. «Entra en el gozo de tu Señor» (Ibíd.).
    - q: Entonces, ¿serán recordadas sus buenas obras?
      a: Sí. «Tuve hambre y me disteis de comer» (Mat. 25:35).
    - q: ¿Y [serán] olvidadas aquellas [obras] que fueron malas?
      a: Sí. «“Se buscará la iniquidad de Israel, pero no habrá ninguna”» (Jer. 50:20).
  - - q: ¿Será el Cielo el lugar de residencia de los santos?
      a: Sí. «Elías subió al cielo en un torbellino» (2 Reyes 2:11).
    - q: ¿Ha sido preparado [el Cielo] para ellos?
      a: Sí. «Voy a preparar un lugar» (Jua. 14:2).
    - q: ¿Se les ha prometido [el Cielo]?
      a: Sí. Es la «vida eterna, la cual Dios, que no miente, prometió» (Tit. 1:2).
    - q: ¿Verán a Dios en el Cielo?
      a: Sí. «Bienaventurados los de limpio corazón, pues ellos verán a Dios» (Mat. 5:8).
    - q: ¿Será una visión transformadora?
      a: Sí. «[Serán] semejantes a Él porque le [verán] como Él es» (1 Jua. 3:2).
    - q: ¿Y [será] una [visión] permanente?
      a: Sí. «Así estaremos con el Señor siempre» (1 Tes. 4:17).
    - q: ¿Es esto suficiente para consolarlos cuando pasan por todos los dolores y aflicciones de la vida?
      a: Sí. «Por tanto, confortaos unos a otros con estas palabras» (1 Tes. 4:18).
notes:
  "58": La cita en el original es Jeremías 22:10, pero debería ser 22:19.
  "59": El original dice Juan 5:22, pero en realidad se está citado el versículo 21.
