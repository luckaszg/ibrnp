# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 96
question: ¿Cómo el bautismo y la Cena del Señor llegan a ser medios de salvación eficaces?
answer: El bautismo y la Cena del Señor llegan a ser medios de salvación eficaces, no porque haya alguna virtud en estos o en el que los administra, sino solo por la bendición de Cristo y la obra del Espíritu en aquellos que, por fe, los reciben.
sections:
  - - q: ¿Son señales los sacramentos?
      a: Sí. «Y [Abraham] recibió la señal de la circuncisión» (Rom. 4:11).
    - q: ¿Son señales externas de bendiciones espirituales e invisibles?
      a: Sí. «Ni la circuncisión es la externa, en la carne […] sino […] la del corazón» (Rom. 2:28, 29).
    - q: ¿Significa el bautismo la obra de regeneración realizada en nosotros?
      a: Sí. «Habiendo sido sepultados con Él en el bautismo, en el cual también habéis resucitado con Él» (Col. 2:12).
    - q: ¿Y significa la Cena del Señor la obra de redención que se llevó a cabo por nosotros?
      a: Sí. «Haced esto en memoria de mí» (Luc. 22:19).
    - q: ¿Son útiles estas señales externas para mover los afectos internos?
      a: Sí. «Mis ojos causan dolor a mi alma» (Lam. 3:51).
  - - q: ¿Son los sacramentos un medio de salvación eficaz para todos los que participan de ellos?
      a: No, porque «si eres transgresor de la ley, tu circuncisión se ha vuelto incircuncisión» (Rom. 2:25).
    - q: ¿Pueden salvar los sacramentos por una virtud inherente en ellos mismos?
      a: No, porque el bautismo no salva, pues solamente quita la suciedad de la carne {externamente}. (1 Ped. 3:21).
    - q: ¿O [por una virtud] en quienes los administran?
      a: No, porque «ni el que planta ni el que riega es algo» (1 Cor. 3:7).
    - q: Por tanto, ¿son menos eficaces cuando son administrados por una persona impía?
      a: No. «Porque [Judas] era contado entre nosotros y recibió parte en este ministerio» (Hch. 1:17).
    - q: ¿O [son] más [eficaces] cuando son administrados por alguien piadoso?
      a: No, porque Felipe bautizó a Simón, quien aún estaba «en hiel de amargura» (Hch. 8:13, 23).
    - q: Por tanto, ¿debería esto impedir que se estime a un ministro con parcialidad descuidándose a otros?
      a: Sí. «¿Qué es, pues, Apolos? Y ¿qué es Pablo?» (1 Cor. 3:5).
  - - q: ¿Depende la eficacia de los sacramentos de la bendición y la presencia de Cristo?
      a: Sí. «He aquí, yo estoy con vosotros todos los días» (Mat. 28:20).
    - q: ¿[Depende] de la influencia cooperadora del Espíritu?
      a: Sí. «Por un mismo Espíritu todos fuimos bautizados» (1 Cor. 12:13).
    - q: ¿Y son eficaces solo para aquellos que los reciben por fe?
      a: Sí. «El que crea y sea bautizado será salvo; pero el que no crea será condenado» (Mar. 16:16).
