# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 83
question: ¿Qué se prohíbe en el noveno mandamiento?
answer: El noveno mandamiento prohíbe todo lo que sea perjudicial para la verdad o injurioso para nuestro propio buen nombre, o para el de nuestro prójimo.
sections:
  - - q: ¿Es un gran pecado mentir?
      a: Sí. «Los labios mentirosos son abominación al SEÑOR» (Pro. 12:22).
    - q: ¿Es un pecado que nos hace semejantes al Diablo?
      a: Sí, porque «cuando habla mentira, habla de su propia naturaleza» (Jua. 8:44).
    - q: ¿Es un pecado que no trae ningún beneficio?
      a: Sí. «Conseguir tesoros con lengua mentirosa es un vapor fugaz, es buscar la muerte» (Pro. 21:6).
    - q: ¿Es un pecado que será descubierto?
      a: Sí, porque «la lengua mentirosa [permanecerá] solo por un momento» (Pro. 12:19).
    - q: ¿Y [será] severamente castigado?
      a: Sí, porque «afuera están los perros […] y todo el que ama y practica la mentira» (Apo. 22:15).
    - q: Por tanto, ¿deberíamos odiarlo?
      a: Sí. «Aborrezco y desprecio la mentira» (Sal. 119:163).
    - q: ¿Y [deberíamos] orar contra ello?
      a: Sí. «Quita de mí el camino de la mentira» (Sal. 119:29).
  - - q: ¿Podemos decir mentiras en forma de juego?
      a: No. «Con su maldad alegran al rey, y con sus mentiras a los príncipes» (Ose. 7:3).
    - q: ¿[Podemos decir mentiras] para excusar una falta?
      a: "No. Como Giezi, quien respondió: «Tu siervo no ha ido a ninguna parte» (2 Rey. 5:25)."
    - q: ¿O con la intención de hacer el bien?
      a: No. No debemos hacer el mal para que venga el bien (Rom. 3:8).
  - - q: ¿Es pecado la detracción y la calumnia?
      a: Sí. «Te sientas y hablas contra tu hermano; al hijo de tu propia madre calumnias» (Sal. 50:20).
    - q: Pero, ¿acaso no podemos devolver calumnia por calumnia?
      a: No. «No devolviendo mal por mal» (1 Ped. 3:9).
    - q: ¿También es pecado la adulación?
      a: Sí. «Falsedad habla cada uno a su prójimo; hablan con labios lisonjeros y con doblez de corazón» (Sal. 12:2).
    - q: ¿Es pecado la autodetracción?
      a: Sí. «Hay quien pretende ser pobre, y tiene una gran fortuna» (Pro. 13:7).
    - q: ¿Y la autoadulación?
      a: Sí. «Hay quien pretende ser rico, y nada tiene» (Ibíd.).
  - - q: ¿Prohíbe este mandamiento el perjurio?
      a: Sí. «Seré un testigo veloz contra […] los que juran en falso» (Mal. 3:5).
    - q: ¿[Prohíbe este mandamiento] el soborno?
      a: Sí. Así fue como los judíos presentaron testigos falsos contra Esteban (Hch. 6:11, 13).
    - q: ¿[Prohíbe este mandamiento] las detracciones y los chismes?
      a: Sí. «No andarás de calumniador entre tu pueblo» (Lev. 19:16).
    - q: ¿Y todas las reflexiones censuradoras e inmisericordes?
      a: Sí. «El que habla mal de un hermano o juzga a su hermano, habla mal de la ley y juzga a la ley» (Stg. 4:11).
