# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 49
question: ¿Qué nos enseña el prefacio de los Diez Mandamientos?
answer: El prefacio de los Diez Mandamientos nos enseña que, como Dios es el SEÑOR y es nuestro Dios y Redentor, estamos obligados a guardar todos Sus mandamientos.
sections:
  - - q: ¿Es Dios el Señor?
      a: Sí. «Yo soy el SEÑOR, ése es mi nombre» (Isa. 42:8).
    - q: ¿Es este un nombre que denota autoridad?
      a: Sí. «El SEÑOR, el Altísimo, es digno de ser temido; Rey grande es» (Sal. 47:2).
    - q: Por tanto, ¿es una obligación para nosotros guardar Sus mandamientos?
      a: Sí. «Por tanto, guardaréis mis estatutos y mis leyes […] yo soy el SEÑOR» (Lev. 18:5).
    - q: ¿Es Él nuestro Dios?
      a: Sí. «Oh SEÑOR, Tú eres nuestro Dios» (2 Cró. 14:11).
    - q: ¿Lo es por causa del pacto?
      a: Sí. «“Entré en pacto contigo […] y fuiste mía”» (Eze. 16:8).
    - q: ¿Y [lo es] por nuestra elección?
      a: Sí. «Habéis escogido al SEÑOR» (Jos. 24:22).
    - q: ¿Es esta una razón por la que debemos guardar Sus mandamientos?
      a: Sí. «Amarás, pues, al SEÑOR tu Dios, y guardarás siempre sus mandatos» (Deu. 11:1).
    - q: ¿Y es una razón obligatoria tanto para gentiles como para judíos?
      a: Sí. «¿O es Dios el Dios de los judíos solamente? ¿No es también el Dios de los gentiles? Sí, también de los gentiles» (Rom. 3:29).
  - - q: ¿Es Dios nuestro Redentor?
      a: Sí. «Toda carne sabrá que yo, el SEÑOR, soy tu Salvador y tu Redentor» (Isa. 49:26).
    - q: ¿Nos ha redimido de las angustias externas?
      a: Sí. «El ángel que me ha rescatado de todo mal, bendiga a estos muchachos» (Gén. 48:16).
    - q: ¿[Nos ha redimido] de nuestros enemigos espirituales?
      a: Sí. «Somos librados de las manos de nuestros enemigos» (Luc. 1:74).
    - q: ¿[Nos ha redimido] de la esclavitud del pecado?
      a: Sí. «Él redimirá a Israel de todas sus iniquidades» (Sal. 130:8).
    - q: ¿Y [nos ha redimido] de la ira eterna?
      a: Sí. «Quien nos libra de la ira venidera» (1 Tes. 1:10).
  - - q: Entonces, ¿estamos obligados a obedecer a Dios por causa de la gratitud?
      a: Sí. «Ciertamente yo soy tu siervo, siervo tuyo soy […] tú desataste mis ataduras» (Sal. 116:16).
    - q: ¿[Estamos obligados a obedecer a Dios por causa] de la justicia?
      a: Sí, porque «no sois vuestros» (1 Cor. 6:19).
    - q: ¿Y somos culpables no solo de una horrible ingratitud sino también de una gran impiedad si no obedecemos a Dios?
      a: Sí. «¿Robará el hombre a Dios?» (Mal. 3:8).[^65]
