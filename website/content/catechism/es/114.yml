# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 114
question: ¿Qué enseña la conclusión de La oración del Señor?
answer: "La conclusión de, que es: «Porque tuyo es el reino y el poder y la gloria para siempre jamás. Amén», nos enseña a recibir nuestro ánimo en oración de parte de Dios solamente y alabarlo en nuestras oraciones, atribuyéndole el Reino, el poder y la gloria; y en testimonio de nuestro deseo y seguridad de ser escuchados, decimos: Amén."
sections:
  - - q: ¿Debemos recibir de parte de Dios todo nuestro ánimo en oración?
      a: Sí. «No nos desprecies, por amor a tu nombre» (Jer. 14:21).
    - q: ¿Y no de parte de nosotros mismos?
      a: No. «No es por nuestros propios méritos que presentamos nuestras súplicas delante de ti» (Dan. 9:18).
    - q: ¿Debemos bendecir a Dios en oración?
      a: Sí. «Tus santos te bendecirán» (Sal. 145:10).
    - q: ¿Y será esto un servicio aceptable para Él?
      a: Sí. «El que ofrece sacrificio de acción de gracias me honra» (Sal. 50:23).
  - - q: ¿Le pertenece el Reino al Señor?
      a: Sí. «El SEÑOR reina, vestido está de majestad» (Sal. 93:1).
    - q: ¿Es antiguo Su Reino?
      a: Sí. «Desde la antigüedad está establecido tu trono» (v. 2).
    - q: ¿Y es duradero?
      a: Sí. «Su reino es un reino eterno» (Dan. 7:27).
    - q: ¿Es esto motivo de alabanza?
      a: Sí. «Te exaltaré, Dios mío, oh Rey» (Sal. 145:1).
    - q: ¿[Es] motivo de confianza?
      a: "Sí. «Decid entre las naciones: El SEÑOR reina; ciertamente el mundo está bien afirmado, será inconmovible» (Sal. 96:10)."
    - q: ¿Y podemos hacer uso de ello como una súplica en la oración?
      a: Sí. «¿No eres tú Dios en los cielos? ¿Y no gobiernas tú sobre todos los reinos de las naciones?» (2 Cró. 20:6).
  - - q: ¿Le pertenece el poder a Dios?
      a: Sí. «Si es cuestión de poder, he aquí, Él es poderoso» (Job 9:19).
    - q: ¿Y proviene de Él todo poder?
      a: Sí. «El Dios mismo de Israel da fortaleza y poder al pueblo» (Sal. 68:35).
    - q: Por tanto, ¿debemos tomar para nosotros el consuelo de este atributo?
      a: Sí. «Ciertamente nuestro Dios a quien servimos puede librarnos del horno de fuego ardiente» (Dan. 3:17).
    - q: ¿Y darle a Él la gloria de {dicho} atributo?
      a: Sí. «Tributad al SEÑOR, oh hijos de los poderosos, tributad al SEÑOR gloria y poder» (Sal. 29:1).
    - q: Además, ¿[debemos] alegarlo {lit. suplicarlo} en oración?
      a: Sí. «Pero ahora, yo te ruego que sea engrandecido el poder del Señor, tal como tú lo has declarado» (Núm. 14:17).
  - - q: ¿Se manifiesta la gloria de Dios en todas Sus obras?
      a: Sí. «Llena está la tierra de Su gloria» (Isa. 6:3).
    - q: Entonces, ¿debería ser glorificado por todas Sus obras?
      a: Sí. «Todas las naciones […] glorificarán tu nombre» (Sal. 86:9).
    - q: ¿Se manifiesta Su gloria de una manera particular en la iglesia?
      a: Sí. «Sobre ti amanecerá el SEÑOR, y sobre ti aparecerá su gloria» (Isa. 60:2).
    - q: Por tanto, ¿debería ser mostrada particularmente por la iglesia?
      a: Sí. «A él sea la gloria en la iglesia […] por los siglos de los siglos» (Efe. 3:21).
    - q: Entonces, ¿no podemos gloriarnos en nosotros mismos?
      a: No. «EL QUE SE GLORÍA,QUE SE GLORÍE EN EL SEÑOR» (2 Cor. 10:17).
  - - q: ¿Significa Amén nuestro deseo de ser escuchados?
      a: Sí. «Amén, SEÑOR» (Jer. 11:5).
    - q: ¿Y nuestra seguridad de que seremos escuchados?
      a: "Sí. «Los cuatro seres vivientes decían: Amén; y los veinticuatro ancianos se postraron sobre sus rostros y adoraron al que vive por los siglos de los siglos» (Apo. 5:14 [RVR60]). Cuando [el Amén] es usado por el pueblo en la oración pública,"
    - q: ¿expresa la aprobación del pueblo?
      a: "Sí. «Entonces todo el pueblo dijo: Amén; y alabó al SEÑOR» (1 Cró. 16:36)."
    - q: Por tanto, ¿deberían hacerse tales oraciones en una lengua conocida?
      a: Sí. «De otra manera […] ¿cómo dirá el Amén […] el que ocupa el lugar del que no tiene ese don? (1 Cor. 14:16).
