# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 56
question: ¿Qué se prohíbe en el segundo mandamiento?
answer: El segundo mandamiento prohíbe adorar a Dios por medio de imágenes, o de cualquier otro modo que no esté establecido en Su Palabra.
sections:
  - - q: ¿Es pecado adorar a cualquier criatura?
      a: Sí. «Sirvieron a la criatura en lugar del Creador» (Rom. 1:25).
    - q: ¿O [adorar] la imagen de alguna criatura?
      a: Sí. «“Maldito el hombre que haga ídolo o imagen de fundición, abominación al SEÑOR”» (Deu. 27:15).
    - q: ¿No podemos adorar al ejército del cielo?
      a: No. «No sea que levantes los ojos al cielo y veas el sol, la luna, las estrellas […] y seas impulsado a adorarlos» (Deu. 4:19).
    - q: ¿Ni a los hombres grandes y buenos?
      a: No. «¿Por qué hacéis estas cosas? Nosotros también somos hombres de igual naturaleza que vosotros» (Hch. 14:15).
    - q: ¿Ni a los ángeles buenos?
      a: No. «Nadie os defraude de vuestro premio deleitándose en la humillación de sí mismo y en la adoración de los ángeles» (Col. 2:18).
  - - q: ¿Es pecado contender por los ídolos?
      a: Sí. «¿Contenderéis vosotros por Baal?» (Jue. 6:31).
    - q: ¿[Es pecado] orar a ellos?
      a: Sí. «Aunque alguno clame a él, no responde» (Isa. 46:7).
    - q: ¿[Es pecado] confiar en ellos?
      a: Sí. «Serán […] completamente avergonzados los que confían en ídolos» (Isa. 42:17).
    - q: ¿[Es pecado] atribuirles alguna cosa?
      a: "Sí. «No sea que dijeras: “Mi ídolo las ha hecho”» (Isa. 48:5)."
    - q: ¿O darles alguna parte del culto religioso?
      a: Sí. «Si […] fue mi corazón seducido en secreto, y mi mano tiró un beso de mi boca, eso también hubiera sido iniquidad que merecía juicio» (Job 31:27, 28).
  - - q: ¿Es pecado adorar al Dios verdadero por medio de imágenes?
      a: Sí. «Así que guardaos bien, ya que no visteis ninguna figura» (Deu. 4:15, 16).
    - q: ¿Podemos formar alguna imagen de Dios en nuestra mente?
      a: No. «¿A quién, pues, asemejaréis a Dios?» (Isa. 40:18).
    - q: Entonces, ¿es imposible formar una imagen de Él con nuestras manos?
      a: Sí, porque «no debemos pensar que la naturaleza divina sea semejante a oro, plata o piedra, esculpidos por el arte y el pensamiento humano» (Hch. 17:29).
    - q: Por lo tanto, ¿cometen una gran afrenta contra Él aquellos que lo intentan?
      a: Sí. «[Cambian] la gloria del Dios incorruptible por una imagen en forma de hombre corruptible» (Rom. 1:23).
  - - q: ¿Prohíbe este mandamiento todas las prácticas supersticiosas en el culto?
      a: Sí. «Percibo que sois muy religiosos {o supersticiosos} en todo sentido» (Hch. 17:22).
    - q: ¿Y [prohíbe] todas las complacencias pecaminosas con la invención de los hombres?
      a: "Sí. «¿Por qué […] os sometéis a preceptos tales como: no manipules, no gustes, no toques […] según los preceptos y enseñanzas de los hombres?» (Col. 2:20, 21, 22).[^72]"
    - q: ¿Condena particularmente la idolatría de los papistas al adorar una hostia consagrada?
      a: Sí, porque es pan lo que partimos (1 Cor. 10:16).
    - q: ¿Es suficiente con que estas cosas no estén expresamente prohibidas?
      a: No. «Ofrecieron delante del SEÑOR fuego extraño, que Él no les había ordenado» (Lev. 10:1).
notes:
  "72": El autor solo cita Colosenses 2:21-22 en el original. Para entender mejor la idea, añadimos el inicio de la pregunta desde el versículo 20.
