# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 39
question: ¿Cuáles son los beneficios que en esta vida acompañan o se derivan de la justificación, la adopción y la santificación?
answer: Los beneficios que en esta vida acompañan o se derivan de la justificación, la adopción y la santificación son la seguridad del amor de Dios, la paz de conciencia, el gozo en el Espíritu Santo, el crecimiento en la gracia y la perseverancia en esta hasta el fin.
sections:
  - - q: ¿Han alcanzado los cristianos una plena seguridad del amor de Dios en la vida presente?
      a: Sí. «Hemos llegado a conocer y hemos creído el amor que Dios tiene para nosotros» (1 Jua. 4:16).
    - q: ¿Está basada esta seguridad en el testimonio del Espíritu?
      a: Sí. «El Espíritu mismo da testimonio a nuestro espíritu de que somos hijos de Dios» (Rom. 8:16).
    - q: ¿[Está basada esta seguridad] en el testimonio de la conciencia?
      a: "Sí. «Porque nuestra satisfacción es ésta: el testimonio de nuestra conciencia» (2 Cor. 1:12)."
    - q: ¿[Está basada esta seguridad] en el testimonio concurrente {o coincidente} de la Palabra?
      a: Sí. «A fin de que por medio de la paciencia y del consuelo de las Escrituras tengamos esperanza» (Rom. 15:4).
    - q: ¿Alcanzan todos los santos esta seguridad?
      a: No. Algunos vendrán temblando en pos del Señor (Ose. 11:10).
    - q: ¿Y pueden perder [esta seguridad] los que la han alcanzado?
      a: Sí. «Oh SEÑOR, con tu favor has hecho que mi monte permanezca fuerte; tú escondiste tu rostro, fui conturbado» (Sal. 30:7).
  - - q: ¿Deberían esperar seguridad [del amor de Dios] aquellos que la quieren?
      a: Sí. «Aguardaré al SEÑOR que esconde su rostro» (Isa. 8:17).
    - q: ¿[Deberían] tener esperanza de [recibir esta] seguridad [aquellos que la quieren]?
      a: Sí. «Espera en Dios, pues he de alabarle otra vez» (Sal. 42:11).
    - q: ¿[Deberían] esforzarse por [tener esta seguridad aquellos que la quieren]?
      a: Sí. «Muestre la misma solicitud hasta el fin, para alcanzar la plena seguridad de la esperanza» (Heb. 6:11).
    - q: ¿Deberían estar agradecidos por [esta seguridad] los que la poseen?
      a: Sí. «Me regocijaré en el Dios de mi salvación» (Hab. 3:18).
    - q: ¿Y [deberían] hacerla crecer?
      a: Sí. «Porque delante de mis ojos está tu misericordia, y en tu verdad he andado» (Sal. 26:3).
  - - q: ¿Es la paz de conciencia el privilegio de los santos?
      a: Sí. «Mi paz os doy» (Jua. 14:27).
    - q: ¿Y de nadie más que de los santos?
      a: No. «No hay paz —dice mi Dios—para los impíos» (Isa. 57:21).
    - q: ¿Es esta paz consecuencia de nuestra justificación?
      a: Sí. «Anímate, hijo, tus pecados te son perdonados» (Mat. 9:2).
    - q: ¿Es [esta paz] el fruto de nuestra santificación?
      a: Sí. Es «paz en el creer» (Rom. 15:13).
    - q: ¿Y es [esta paz] la acompañante habitual de una carrera regular de obediencia?
      a: Sí. «Mucha paz tienen los que aman tu ley, y nada los hace tropezar» (Sal. 119:165).
    - q: ¿Es [esta paz] un gran privilegio para los que la poseen?
      a: Sí. «Si nuestro corazón no nos condena, confianza tenemos delante de Dios» (1 Jua. 3:21).
    - q: ¿Los preserva en la vida?
      a: Sí. «La paz de Dios guardará vuestros corazones y vuestras mentes» (Flp. 4:7).
    - q: ¿Los sostiene en la muerte?
      a: Sí. «Porque hay un final dichoso para el hombre de paz» (Sal. 37:37 [RVR60]).
    - q: ¿Y los acompañará al otro mundo?
      a: Sí. «[Entrarán] en la paz» (Isa. 57:2).
  - - q: ¿Tienen los santos gozo en el Espíritu Santo?
      a: Sí. Porque «[al creer nos regocijamos] grandemente con gozo inefable y lleno de gloria» (1 Pedro 1:8).
    - q: ¿Se les ha dado preciosas promesas para que se regocijen?
      a: Sí. «[De estas cosas hablo] para que tengan mi gozo completo en sí mismos» (Jua. 17:13).
    - q: ¿Fue establecido un ministerio evangélico [para que los santos se regocijen]?
      a: Sí. «No es que queramos tener control de vuestra fe, sino que somos colaboradores con vosotros para vuestro gozo» (2 Cor. 1:24).
    - q: ¿Y fueron dadas esperanzas consoladoras [para que los santos se regocijen]?
      a: Sí. «Nos gloriamos en la esperanza de la gloria de Dios» (Rom. 5:2).
    - q: Entonces, ¿es el regocijarse un deber de los santos?
      a: Sí. «Estad siempre gozosos» (1 Tes. 5:16).
    - q: ¿Y de nadie más que de los santos?
      a: No. «No te alegres, Israel, con gran júbilo como las naciones, porque te has prostituido, abandonando a tu Dios» (Ose. 9:1).
  - - q: ¿Es deber de los santos crecer en la gracia?
      a: Sí. «Creced en la gracia» (2 Pedro 3:18).
    - q: ¿Es el deseo de ellos crecer en la gracia?
      a: "Sí. «Señor: ¡Auméntanos la fe!» (Luc. 17:5)."
    - q: ¿Y es seguro que [los santos] crecerán [en la gracia]?
      a: Sí. «Florecerán como la vid» (Ose. 14:7).
    - q: ¿Crecen los santos en toda gracia?
      a: Sí, porque crecen «en todos los aspectos en aquel que es la cabeza, es decir, Cristo» (Efe. 4:15).
    - q: Pero, ¿se manifiesta este crecimiento más visiblemente en algunas gracias que en otras?
      a: Sí. Por eso el apóstol les dice a los tesalonicenses que la fe de ellos aumentaba grandemente y que el amor de cada uno de ellos hacia los demás abundaba más y más (2 Tes. 1:3).
  - - q: ¿Perseverarán hasta el fin los verdaderos creyentes?
      a: Sí. «En pie se [mantendrán], porque poderoso es [Dios] para [sostenerlos] en pie» (Rom. 14:4).
    - q: ¿Serán guardados de errores fundamentales?
      a: Sí, porque «[son] confirmados en la verdad» (2 Pedro 1:12).
    - q: ¿Retienen el principio vital de la gracia implantado en sus almas?
      a: Sí, porque esa es «la parte buena, la cual no [les] será quitada» (Luc. 10:42).
    - q: ¿Y nunca volverán a caer en un rumbo {lit. curso} definitivo de maldad?
      a: No. «Pero nosotros no somos de los que retroceden para perdición» (Heb. 10:39).
  - - q: ¿Se puede renunciar a una profesión religiosa?
      a: Sí. «Demas me ha abandonado» (2 Tim. 4:10).
    - q: ¿Pueden perderse grandes dones?
      a: Sí. «Su brazo se secará por completo y su ojo derecho totalmente se oscurecerá» (Zac. 11:17).
    - q: ¿Pueden desaparecer las apariencias de gracia?
      a: Sí. «Porque [...] al que no tiene, aun lo que cree que tiene se le quitará» (Luc. 8:18).
    - q: ¿Y puede declinar {o decaer} la gracia real?
      a: Sí. «Has dejado tu primer amor» (Apo. 2:4).
    - q: No obstante, ¿puede perderse totalmente [la gracia real]?
      a: No. «La simiente de Dios permanece en él» (1 Jua. 3:9).
