# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 98
question: ¿A quiénes se debe administrar el bautismo?
answer: El bautismo debe ser administrado a todos aquellos que realmente profesen arrepentimiento para con Dios, fe en nuestro Señor Jesucristo y obediencia a Él; y {no debe ser administrado} a ningún otro.
sections:
  - - q: ¿Se debe administrar el bautismo a los que se arrepienten?
      a: Sí. Es «el bautismo de arrepentimiento» (Mar. 1:4).
    - q: ¿[Se debe administrar] a cada uno de los que se arrepienten?
      a: Sí. «Arrepentíos y sed bautizados cada uno de vosotros» (Hch. 2:38).
    - q: ¿Y a nadie más que a los que se arrepienten?
      a: No. «¡Camada de víboras! ¿Quién os enseñó a huir de la ira que vendrá?» (Mat. 3:7).
    - q: ¿Se debería profesar este arrepentimiento en realidad?
      a: Sí. «Confesando sus pecados, eran bautizados por él en el río Jordán» (Mat. 3:6).
    - q: ¿Y [debería] ser notorio [este arrepentimiento] por sus frutos?
      a: Sí. «Dad frutos dignos de arrepentimiento» (Mat. 3:8).
    - q: ¿Y tienen derecho a ser bautizados los peores pecadores después de arrepentirse?
      a: Sí. «Vinieron también unos recaudadores de impuestos para ser bautizados» (Luc. 3:12).
  - - q: ¿Debería preceder la fe al bautismo?
      a: Sí. «Los corintios, al oír, creían y eran bautizados» (Hch. 18:8).
    - q: ¿Justifica una profesión de fe creíble la administración de esta ordenanza?
      a: Sí, porque Simón el Mago creyó y fue bautizado (Hch. 8:13).
    - q: Pero, ¿solo una fe real puede justificar el someterse a {la ordenanza de} el bautismo?
      a: Sí. «Si crees con todo tu corazón, puedes» (Hch. 8:37).
    - q: ¿Y la ordenanza no está disponible donde haya ausencia de fe?
      a: Sí, porque «todo lo que no procede de fe, es pecado» (Rom. 14:23).
  - - q: ¿Deben las personas ser enseñadas primero antes de ser bautizadas?
      a: Sí. «Id, pues, y haced discípulos de todas las naciones, bautizándolos» (Mat. 28:19).
    - q: ¿[Deben] evidenciar que son partícipes del Espíritu Santo?
      a: Sí. «¿Puede acaso alguien negar el agua para que sean bautizados éstos que han recibido el Espíritu Santo lo mismo que nosotros?» (Hch. 10:47).
    - q: ¿[Deben evidenciar] que reciben con gozo la Palabra?
      a: Sí. «Los que habían recibido su palabra fueron bautizados» (Hch. 2:41).
    - q: ¿Y [deben] manifestar una disposición a obedecer?
      a: "Sí. «Hermanos, ¿qué haremos? Y Pedro les dijo: Arrepentíos y sed bautizados» (Hch. 2:37, 38).[^107]"
  - - q: ¿Debería el bautismo ser un asunto voluntario {lit. de elección} en quienes se someten a él?
      a: Sí. «Mira, agua. ¿Qué impide que yo sea bautizado?» (Hch. 8:36).
    - q: ¿[Debería ser] una obra y acto de su propia voluntad?
      a: Sí. «[Acudían] a él […] y […] eran bautizados» (Mar. 1:5).
    - q: ¿[Debería ser] la petición de una buena conciencia?
      a: Sí, porque «el bautismo ahora os salva [ya que] es una petición a Dios de una buena conciencia» (1 Ped. 3:21).
    - q: Y cuando estos requisitos no están, ¿debería negarse el bautismo?
      a: Sí. «No deis lo santo a los perros» (Mat. 7:6).
