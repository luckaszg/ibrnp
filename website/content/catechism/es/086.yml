# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 86
question: ¿Qué se prohíbe en el décimo mandamiento?
answer: El décimo mandamiento prohíbe todo descontento con nuestro propio estado {o condición}, envidiar o afligirse a causa del bienestar de nuestro prójimo y todas las pasiones y afectos desordenados hacia cualquier cosa que le pertenezca.
sections:
  - - q: ¿Es pecado el descontento?
      a: Sí. «La insensatez del hombre pervierte su camino, y su corazón se irrita contra el SEÑOR» (Pro. 19:3).
    - q: ¿Puede mejorar nuestra condición el descontento?
      a: No, porque «¿quién de vosotros podrá, por mucho que se afane, añadir a su estatura un codo?» (Mat. 6:27 [RVR60]).
    - q: ¿Y ciertamente empeorará nuestra condición?
      a: Sí. «Nada de esto me satisface mientras vea al judío Mardoqueo sentado a la puerta del rey» (Est. 5:13).
    - q: ¿Es pecado subestimar las misericordias del presente?
      a: Sí. Como lo hicieron los que aborrecieron la tierra deseable (Sal. 106:24).
    - q: ¿O agravar las aflicciones del presente?
      a: "Sí. Como Ezequías, quien dijo: «Sosegué mi alma hasta la mañana. Como león, Él rompe todos mis huesos» (Isa. 38:13)."
    - q: ¿Viene de Satanás el tener un espíritu descontento?
      a: "Sí. «¿Conque Dios os ha dicho: “No comeréis de ningún árbol del huerto”? (Gén. 3:1). ¿Está ligado [el descontento] a algún tipo de ignominia? Sí. «Estos son murmuradores, quejumbrosos» (Jud. 16). ¿Y hay una maldición atada al descontento? Sí. «Merodean buscando qué devorar, y si no se sacian, gruñen» (Sal. 59:15)."
  - - q: ¿Es pecado la envidia?
      a: Sí. «Andemos decentemente, como de día […] no en pleitos y envidias (Rom. 13:13). ¿Es pecado que los malvados envidien al justo? Sí. «Verán al fin, y se avergonzarán los que envidian a tu pueblo» (Isa. 26:11 [RVR60]). ¿O que los justos envidien a los malvados? Sí. «No envidies al hombre violento» (Pro. 3:31). ¿Y es pecado envidiar por causa del bien de los demás? Sí. «¿Tienes celos por causa mía?» (Núm. 11:29).
  - - q: ¿Es la codicia un gran pecado?
      a: Sí. «Avaricia,[^90] ni siquiera se [mencione] entre vosotros, como corresponde a los santos» (Efe. 5:3).
    - q: ¿[Es] una gran aflicción?
      a: Sí. «El que ama el dinero no se saciará de dinero» (Ecl. 5:10).
    - q: ¿Es un dolor {o un daño} para nuestras familias?
      a: Sí. «Perturba su casa el que tiene ganancias ilícitas» (Pro. 15:27).
    - q: ¿[Es] un perjuicio contra nuestros prójimos?
      a: Sí. Así fue como la codicia de Acab causó el asesinato de Nabot (1 Rey. 21:1).
    - q: Y, sobre todo, ¿[es] una afrenta a Dios?
      a: Sí, porque es «el SEÑOR [quien] empobrece y enriquece» (1 Sam. 2:7).
    - q: ¿Es un pecado que pocas veces queda impune en este mundo?
      a: Sí. «A causa de la iniquidad de su codicia, me enojé y lo herí» (Isa. 57:17).
    - q: Pero, ¿será severamente castigado en el mundo venidero?
      a: Sí, porque «los avaros (…) [no] heredarán el reino de Dios» (1 Cor. 6:9-10).[^91]
    - q: Por tanto, ¿deberíamos luchar contra la codicia?
      a: Sí. «Pero tú, oh hombre de Dios, huye de estas cosas» (1 Tim. 6:11).
    - q: ¿Y [deberíamos] orar contra ello?
      a: Sí. «Inclina mi corazón a tus testimonios y no a la ganancia deshonesta» (Sal. 119:36).
  - - q: ¿Podemos desear deleites ilícitos?
      a: No. No debemos codiciar lo malo (1 Cor. 10:6).
    - q: ¿O deleites lícitos de una manera desmedida?
      a: No. «Trabajad, no por el alimento que perece» (Jua. 6:27).
    - q: ¿Empieza todo pecado en los deseos del corazón?
      a: Sí, porque los pecadores andan en los caminos de su corazón (Ecl. 11:9 [RVR60]).
    - q: Por tanto, ¿deberíamos vigilar {nuestro} corazón constantemente?
      a: Sí. «Con toda diligencia guarda tu corazón, porque de él brotan los manantiales de la vida» (Pro. 4:23).
notes:
  "90": Aunque, en su uso común en español, la avaricia está relacionada con el deseo de tener más dinero, en el contexto de la inmoralidad sexual (como es el caso de este pasaje) es una referencia a la codicia sexual.
  "91": Aunque la referencia que aparece en el original es 1 Corintios 6:9, el autor también está citando el versículo 10.
