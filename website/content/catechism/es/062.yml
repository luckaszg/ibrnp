# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 62
question: ¿Cuál es el cuarto mandamiento?
answer: "El cuarto mandamiento es: «Acuérdate del día de reposo para santificarlo. Seis días trabajarás y harás toda tu obra, mas el séptimo día es día de reposo para el SEÑOR tu Dios; no harás en él obra alguna, tú, ni tu hijo, ni tu hija, ni tu siervo, ni tu sierva, ni tu ganado, ni el extranjero que está contigo. Porque en seis días hizo el SEÑOR los cielos y la tierra, el mar y todo lo que en ellos hay, y reposó en el séptimo día; por tanto, el SEÑOR bendijo el día de reposo y lo santificó»."
sections:
  - - q: ¿Es tan necesario el trabajo como el descanso?
      a: Sí. «Seis días trabajarás» (Deu. 5:13).
    - q: ¿Tiende el trabajo a la abundancia?
      a: Sí. «El alma de los diligentes queda satisfecha» (Pro. 13:4).
    - q: ¿Y añade dulzura a nuestras ganancias?
      a: Sí. «Dulce es el sueño del trabajador» (Ecl. 5:12).
    - q: ¿Tiende la ociosidad a la pobreza?
      a: Sí. «Se vestirá de harapos» (Pro. 23:21).
    - q: ¿Y expone [la ociosidad] a muchas tentaciones?
      a: Sí. «Aprenden a estar ociosas […] y no solo ociosas, sino también charlatanas y entremetidas, hablando de cosas que no son dignas» (1 Tim. 5:13).
    - q: Por tanto, ¿está prohibida la ociosidad bajo las penas más severas?
      a: "Sí. «Os ordenábamos esto: Si alguno no quiere trabajar, que tampoco coma» (2 Tes. 3:10)."
    - q: Por lo tanto, ¿parece que la multiplicidad de días festivos innecesarios es una molestia y un pecado?
      a: Sí. «Observáis los días, los meses, las estaciones y los años. Temo por vosotros» (Gál. 4:10, 11).
  - - q: ¿Debería apartarse cada séptimo día para los servicios de la religión?
      a: Sí. «De día de reposo en día de reposo, todo mortal vendrá a postrarse delante de mí —dice el SEÑOR» (Isa. 66:23).
    - q: Pero, ¿debería limitarse nuestra religión a ese día?
      a: No, porque «todos los días te bendeciré» (Sal. 145:2).
    - q: ¿Los niños deben guardar el día de reposo?
      a: Sí. «Tú […] tu hijo y […] tu hija» (Éxo. 20:10).
    - q: ¿Los siervos [deben guardar el día de reposo]?
      a: Sí. «Para que tu siervo y tu sierva también descansen como tú» (Deu. 5:14).
    - q: ¿Y nuestro ganado?
      a: Sí. «Vi […] a algunos que […] cargaban en asnos […] en el día de reposo. Y les amonesté» (Neh. 13:15).
    - q: ¿Hace el día de reposo una referencia al reposo de Dios de las obras de la creación?
      a: Sí. «En el séptimo día completó Dios [Su] obra» (Gén. 2:2).
    - q: Por tanto, ¿deberíamos acordarnos de Él en Sus obras en este día?
      a: Sí. «Adorad al que hizo el cielo y la tierra, el mar y las fuentes de las aguas» (Apo. 14:7).
    - q: ¿Apunta el día de reposo a un reposo eterno?
      a: Sí. «Queda un reposo [o la observancia de un día de reposo][^74] para el pueblo de Dios» (Heb. 4:9).
    - q: Por tanto, ¿deberíamos tener en cuenta ese reposo y esforzarnos por alcanzarlo?
      a: Sí. «Por tanto, esforcémonos por entrar en ese reposo» (Heb. 4:11).
