# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 35
question: ¿De qué beneficios participan en esta vida los que son llamados eficazmente?
answer: Los que son llamados eficazmente participan en esta vida de la justificación, la adopción, la santificación y de los varios beneficios que en esta vida acompañan o se derivan de estos.
sections:
  - - q: ¿Es el llamamiento eficaz un gran beneficio?
      a: Sí. «La piedad es provechosa para todo» (1 Tim. 4:8).
    - q: ¿Es un beneficio inmediato?
      a: Sí. «Si queréis y obedecéis, comeréis lo mejor de la tierra» (Isa. 1:19).
    - q: ¿[Es] un beneficio eterno?
      a: Sí. «Pues tiene promesa para la vida presente y también para la futura» (1 Tim. 4:8).
    - q: ¿Conduce [el llamamiento eficaz] a un estado de gracia?
      a: Sí. «Porque no estamos bajo la ley, sino bajo la gracia» (Rom. 6:15).
    - q: ¿[Conduce el llamamiento eficaz] a un estado de consolación?
      a: Sí. «Porque los que hemos creído entramos en ese reposo» (Heb. 4:3).
    - q: ¿[Conduce el llamamiento eficaz] a un estado de santidad?
      a: Sí. «Dios no nos ha llamado a impureza, sino a santificación» (1 Tes. 4:7).
    - q: ¿Es este llamamiento eficaz la garantía de la gloria eterna?
      a: Sí. «Porque gracia y gloria da el SEÑOR; nada bueno niega a los que andan en integridad» (Sal. 84:11).
  - - q: ¿Son justificados aquellos que son llamados eficazmente?
      a: Sí. «A los que llamó, a [esos] también justificó» (Rom. 8:30).
    - q: ¿Es la justificación un gran privilegio?
      a: Sí. «Cuán bienaventurado es el hombre a quien el SEÑOR no culpa de iniquidad» (Sal. 32:2).
    - q: ¿Es la justificación el privilegio seguro y duradero de todos los santos?
      a: Sí. «No hay ahora condenación para los que están en Cristo Jesús» (Rom. 8:1).
    - q: ¿Están todos los demás excluidos [de la justificación]?
      a: Sí. «Porque veo que estás en hiel de amargura y en cadena de iniquidad» (Hch. 8:23).
  - - q: ¿Son adoptados todos aquellos que son llamados eficazmente?
      a: Sí. «Todos sois hijos de Dios mediante la fe en Cristo Jesús» (Gál. 3:26).
    - q: ¿Es la adopción un gran ejemplo del amor de Dios?
      a: Sí. «Mirad cuán gran amor nos ha otorgado el Padre, para que seamos llamados hijos de Dios» (1 Jua. 3:1).
    - q: ¿Y [es la adopción] una gran bendición para los hombres?
      a: Sí. «Y si hijos, también herederos» (Rom. 8:17).
    - q: ¿También son santificados [todos] ellos?
      a: Sí. «Han sido santificados en Cristo Jesús» (1 Cor. 1:2).
    - q: ¿Y sin la santificación sería incompleta su felicidad?
      a: Sí. «Buscad la santidad, sin la cual nadie verá al Señor» (Heb. 12:14).
  - - q: ¿Tienen aquellos que son llamados eficazmente el derecho de participar de todas las demás bendiciones del pacto?
      a: Sí. «Todo es vuestro» (1 Cor. 3:22).
    - q: ¿Pueden ellos recibir la consolación [que proviene] de todas las demás bendiciones del pacto?
      a: Sí. «Como no teniendo nada, aunque poseyéndolo todo» (2 Cor. 6:10).
    - q: ¿Y es este el caso de [todos] ellos sin excepción?
      a: Sí. «Pues el mismo Señor es Señor de todos, abundando en riquezas para todos los que le invocan» (Rom. 10:12).
