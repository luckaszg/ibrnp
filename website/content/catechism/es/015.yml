# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 15
question: ¿Qué acto especial de la providencia ejerció Dios para con el hombre en el estado en que [este último] fue creado?
answer: Cuando Dios creó al hombre, hizo un Pacto de Vida con él, a condición de una obediencia perfecta, prohibiéndole comer del árbol del conocimiento del bien y del mal bajo pena de muerte.
sections:
  - - q: ¿Hizo Dios al hombre perfectamente santo?
      a: Sí. «Dios hizo al hombre recto» (Ecl. 7:29 [RVR60]).
    - q: ¿Y [lo hizo] perfectamente feliz?
      a: Sí. Porque Dios «lo bendijo» (Gén. 1:28).
    - q: ¿Le dio una ley?
      a: Sí. «Ordenó el SEÑOR Dios al hombre» (Gén. 2:16).
    - q: ¿Y el hombre como criatura de Dios estaba obligado a obedecer esa ley?
      a: Sí. «Recuerda estas cosas, Jacob, y tú Israel, porque mi siervo eres, Yo te he formado» (Isa. 44:21).
  - - q: ¿Era el pacto que Dios hizo con Adán un Pacto de Vida?
      a: Sí, porque «la ley no es de fe; al contrario, EL QUE LAS HACE, VIVIRÁPOR ELLAS» (Gál. 3:12).
    - q: ¿Se le dio una orden especial a modo de prueba?
      a: Sí. «Del árbol del conocimiento del bien y del mal no comerás» (Gén. 2:17).
    - q: ¿Y se amenazó con la muerte en caso de desobediencia?
      a: Sí. «El día que de él comas, ciertamente morirás» (Gén. 2:17).
    - q: ¿Estaba [Adán] bajo alguna necesidad natural de violar esta ley?
      a: No, porque tenía libertad para comer de cualquier otro árbol del huerto (Gén. 2:16).
  - - q: ¿Se hizo este pacto con Adán como una cabeza pública?
      a: Sí, porque él era «figura del que había de venir» (Rom. 5:14).
    - q: ¿Fue Eva incluida en este pacto?
      a: "Sí, porque «Dios dijo a la mujer: ¿Qué es esto que has hecho?» (Gén. 3:13)."
    - q: ¿Era esta ley digna de Dios?
      a: Sí. «El Juez de toda la tierra, ¿no hará justicia?» (Gén. 18:25).
    - q: ¿Es el segundo pacto mejor que el primero?
      a: Sí, porque Cristo es «el mediador de un mejor pacto» (Heb. 8:6).
