# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 14
question: ¿Qué son las obras de la providencia de Dios?
answer: Las obras de la providencia de Dios son Su santísima, sapientísima y poderosísima preservación y gobierno de todas Sus criaturas y todas las acciones de estas.
sections:
  - - q: ¿Es universal la providencia de Dios?
      a: Sí. «Su reino domina sobre todos» (Sal. 103:19).
    - q: ¿Se extiende [Su providencia] a todos los mundos?
      a: Sí. «Todo cuanto el SEÑOR quiere, lo hace, en los cielos y en la tierra» (Sal. 135:6).
    - q: ¿[Se extiende Su providencia] a todas las criaturas?
      a: Sí. Él «sostiene todas las cosas por la palabra de Su poder» (Heb. 1:3).
    - q: ¿Se extiende [Su providencia] a las criaturas inanimadas?
      a: Sí. Él «ata las cadenas de las Pléyades, y desata las cuerdas de Orión» (Job 38:31).
    - q: ¿[Se extiende Su providencia] a la creación animal?
      a: Sí. «La cigüeña en el cielo conoce sus estaciones» (Jer. 8:7).
    - q: ¿Ordena [Su providencia] todos los eventos relacionados con personas particulares?
      a: Sí. Los «días [de los hombres] están determinados, el número de sus meses te es conocido» (Job 14:5).
    - q: ¿[Ordena Su providencia todos los eventos relacionados] con los reinos y sociedades de los hombres?
      a: Sí. «Él es quien cambia los tiempos y las edades; quita reyes y pone reyes» (Dan. 2:21).
    - q: ¿Ejerce Dios una providencia especial sobre algunos lugares?
      a: Sí. Canaán era «una tierra que el SEÑOR [cuidaba]» (Deu. 11:12).
    - q: ¿Y [ejerce Dios una providencia especial] sobre algunas personas?
      a: Sí. Él es «el Salvador de todos los hombres, especialmente de los creyentes» (1 Tim. 4:10).
    - q: ¿Es algo deseable tener parte en la providencia especial de Dios?
      a: Sí. «Acuérdate de mí, Oh Jehová, según tu benevolencia para con tu pueblo» (Sal. 106:4 [RVR60]).
  - - q: ¿Se extiende la providencia de Dios a todas las acciones?
      a: Sí. «La mente del hombre planea su camino, pero el SEÑOR dirige sus pasos» (Pro. 16:9).
    - q: ¿Se extiende [la providencia de Dios] a todas las acciones naturales?
      a: Sí. «En Él vivimos y nos movemos» (Hch. 17:28).
    - q: ¿[Se extiende la providencia de Dios] a todas las acciones fortuitas?
      a: Sí. «Y un hombre disparó su arco al azar e hirió al rey de Israel por entre la juntura de la armadura» (1 Reyes 22:34).
    - q: ¿[Se extiende la providencia de Dios] a todas las buenas acciones?
      a: Sí. «Por el SEÑOR son ordenados los pasos del hombre» (Sal. 37:23).
    - q: ¿[Se extiende la providencia de Dios] a las malas acciones?
      a: Sí. «No fuisteis vosotros los que me enviasteis aquí, sino Dios» (Gén. 45:8).
    - q: ¿Y puede Dios sacar algo bueno del mal?
      a: Sí. «Vosotros pensasteis hacerme mal, pero Dios lo tornó en bien» (Gén. 50:20).
    - q: ¿Son misteriosas las providencias de Dios?
      a: Sí. Sus «juicios son como profundo abismo» (Sal. 36:6).
    - q: Pero ¿están [todas] Sus providencias en armonía?
      a: Sí. «Todas las cosas cooperan» (Rom. 8:28).
  - - q: ¿Es la preservación un acto de la providencia?
      a: Sí. «Él es quien preservó la vida a nuestra alma» (Sal. 66:9 [RVR60]).
    - q: ¿Nos preservó Dios en nuestro estado infantil?
      a: Sí. «Desde el vientre de mi madre tú eres mi Dios» (Sal. 22:10).
    - q: ¿Nos preservará cuando declinen nuestros años?
      a: Sí. «Hasta las canas os soportaré yo» (Isa. 46:4 [RVR60]).
    - q: ¿Nos da alimento?
      a: Sí. Él es quien «llena vuestros corazones de sustento y de alegría» (Hch. 14:17).
    - q: ¿[Nos da] descanso?
      a: Sí. «A su amado dará Dios el sueño» (Sal. 127:2 [RVR60]).
    - q: ¿Nos protege de los peligros amenazantes?
      a: Sí. «Él guarda todos sus huesos» (Sal. 34:20).
    - q: ¿Nos provee sabiduría para nuestros diversos oficios?
      a: Sí. Bezaleel y Aholiab «fueron llenos del Espíritu de Dios en toda clase de arte» (Éxo. 35:31).
    - q: ¿Se extiende el cuidado de Dios a las criaturas más insignificantes?
      a: Sí. Ni un solo pajarillo «caerá a tierra sin permitirlo vuestro Padre» (Mat. 10:29).
  - - q: ¿Es el gobierno un acto de la providencia también?
      a: Sí. «Él domina con su poder para siempre» (Sal. 66:7).
    - q: ¿Mantiene Dios las leyes y ordenanzas de la naturaleza?
      a: Sí. Así leemos sobre Su «pacto con el día y Su pacto con la noche» (Jer. 33:20).
    - q: Pero ¿a veces las suspende y actúa en sentido contrario a estas?
      a: Sí. «Y el sol se detuvo en medio del cielo y no se apresuró a ponerse como por un día entero» (Jos. 10:13).
    - q: ¿Mantiene Él a todas las criaturas en sus operaciones?
      a: Sí. El águila «se remonta a Su mandato y hace en las alturas su nido (Job 39:27). Pero, ¿también puede Él restringir esas operaciones? Sí. Él «cerró la boca de los leones» (Dan. 6:22). ¿Ejerce Él un gobierno peculiar sobre la Iglesia? Sí. «Dios gobierna en Jacob» (Sal. 59:13).
  - - q: ¿Es supremo el gobierno de Dios?
      a: Sí. Él es «REY DE REYES Y SEÑOR DE SEÑORES» (Apo. 19:16).
    - q: ¿Es justo y legítimo [Su gobierno]?
      a: Sí. «Tuyo es el dominio, Oh SEÑOR» (1 Cró. 29:11).
    - q: ¿Es [Su gobierno] el más sabio?
      a: Sí. «¡Cuán insondables son sus juicios!» (Rom. 11:33).
    - q: ¿Es santo [Su gobierno]?
      a: Sí. «Justo es el SEÑOR en todos sus caminos, y bondadoso en todos sus hechos» (Sal. 145:17).
    - q: ¿Es absoluto y arbitrario [Su gobierno]?
      a: Sí. «¿Por qué contiendes contra Él? Porque Él no da cuenta de ninguna de Sus razones» (Job 33:13 [RVR60]).
    - q: ¿Es eficaz e incontrolable [Su gobierno]?
      a: Sí. «Lo que desea Su alma, eso hace» (Job 23:13).
  - - q: ¿Es el gobierno providencial de Dios un argumento a favor de la certidumbre y la confianza?
      a: Sí. «Encomienda al SEÑOR tu camino» (Sal. 37:5).
    - q: ¿[Es el gobierno providencial de Dios un argumento a favor] del silencio y la sumisión?
      a: Sí. «Estad quietos, y sabed que yo soy Dios» (Sal. 46:10).
    - q: ¿Y [es el gobierno providencial de Dios un argumento a favor] de la alabanza y la gratitud?
      a: Sí. «¡Aleluya! Porque el Señor nuestro Dios Todopoderoso reina» (Apo. 19:6).
notes:
  "32": Esta es una traducción literal de la versión inglesa King James, en donde la frase ןי ִ֑לָי־לַּב es vertida en tiempo pretérito; está siendo interpretada como una alusión a la Caída, cuando el hombre «no permaneció» en ese honor. Las versiones hispanas lo traducen como «no permanecerá» (LBLA, RVR60, BTX), interpretando la frase hebrea según el contexto de este salmo que habla de lo vano de las riquezas y que quienes confían en estas «no permanecerán», y su honra «pasajera» o «vana» pasará.
