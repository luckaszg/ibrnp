# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 10
question: ¿Qué son los decretos de Dios?
answer: Los decretos de Dios son Su propósito eterno conforme al consejo de Su voluntad, según el cual, para Su propia gloria, ha predestinado todo lo que llega a suceder.
sections:
  - - q: ¿Ha predeterminado Dios todos los eventos futuros?
      a: Sí. Él «obra todas las cosas conforme al consejo de Su voluntad» (Efe. 1:11).
    - q: Entonces, ¿nada viene por azar?
      a: No. «La suerte se echa en el regazo, más del SEÑOR viene toda decisión» (Pro. 16:33).
    - q: ¿Se extienden los decretos de Dios a la conducta de los hombres buenos?
      a: Sí. Fueron «creados en Cristo Jesús para hacer buenas obras, las cuales Dios preparó de antemano para que anduvieran en ellas» (Efe. 2:10).
    - q: ¿Y [se extienden los decretos de Dios] a su salvación?
      a: Sí. Son «vasos de misericordia, que de antemano El preparó para gloria» (Rom. 9:23).
    - q: ¿Se extienden los decretos de Dios a la conducta de los hombres malvados?
      a: Sí. «A éste, entregado por el plan predeterminado y el previo conocimiento de Dios, clavasteis en una cruz por manos de impíos y le matasteis» (Hch. 2:23).
    - q: ¿Y [se extienden los decretos de Dios] a su destrucción?
      a: Sí. «Los cuales desde mucho antes estaban marcados para esta condenación» (Jud. 4).
    - q: ¿Es lícito que los hombres cavilen sobre los decretos de Dios?
      a: No. «¿Quién eres tú, Oh hombre, que le contestas a Dios? ¿O no tiene el alfarero derecho sobre el barro de hacer de la misma masa un vaso para uso honroso y otro para uso deshonroso?» (Rom. 9:20).[^28]
  - - q: ¿Son los decretos de Dios soberanos y libres?
      a: Sí. Son «conforme al beneplácito de Su voluntad» (Efe. 1:5).
    - q: ¿Son eternos?
      a: Sí, porque «nos escogió en Él antes de la fundación del mundo» (Efe. 1:4).
    - q: ¿Son infinitamente sabios?
      a: Sí. Leemos sobre «la infinita sabiduría de Dios conforme al propósito eterno» (Efe. 3:10, 11).
    - q: ¿Son santísimos?
      a: Sí. «Tus consejos antiguos son verdad y firmeza» (Isa. 25:1 [RVR60]).
    - q: ¿Son impenetrables e inescrutables?
      a: Sí. «¿QUIÉN HA CONOCIDO LAMENTE DEL SEÑOR?» (Rom. 11:34).
    - q: ¿Son absolutos e inmutables?
      a: Sí. «Si Él determina una cosa, ¿quién lo hará cambiar?» (Job 23:13 [RVR60]).
    - q: ¿Han sido establecidos para Su propia gloria?
      a: Sí. «Todas las cosas ha hecho Jehová para sí mismo» (Pro. 16:4 [RVR60]).
  - - q: ¿Se han cumplido todos los decretos de Dios?
      a: No. Él «declara desde la antigüedad lo que no ha sido hecho» (Isa. 46:10).
    - q: Pero ¿se cumplirán todos ellos?
      a: Sí. «Ciertamente, tal como lo había pensado, así ha sucedido» (Isa. 14:24).
    - q: ¿Ocurrirá algo que Dios no haya decretado?
      a: No. «¿Quién es aquel que habla y así sucede, a menos que el Señor lo haya ordenado?» (Lam. 3:37).
  - - q: ¿Deberíamos sentir curiosidad por conocer los decretos divinos?
      a: No. «Las cosas secretas pertenecen al Señor» (Deu. 29:29).
    - q: Entonces, ¿son los preceptos de Dios, y no Sus decretos, la regla de nuestra conducta?
      a: Sí. «Las cosas reveladas nos pertenecen a nosotros y a nuestros hijos para siempre» (Deu. 29:29).
notes:
  "28": Aunque la referencia que aparece en el original es Romanos 9:20, el autor también está citando el versículo 21.
