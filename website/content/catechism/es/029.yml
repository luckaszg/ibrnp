# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 29
question: ¿Cómo ejerce Cristo el oficio de Rey?
answer: Cristo ejerce el oficio de Rey al someternos a Él, gobernarnos y defendernos, y al restringir y conquistar todos los enemigos Suyos y nuestros.
sections:
  - - q: ¿Es Cristo Rey?
      a: Sí. «Hay otro rey, Jesús» (Hch. 17:7).
    - q: ¿Ejerce Cristo el oficio real [o regio]?
      a: Sí. «La soberanía reposará sobre sus hombros» (Isa. 9:6).
    - q: ¿Está Cristo debidamente cualificado para ejercer este oficio?
      a: Sí. Él es el Cordero con «siete cuernos y siete ojos» (Apo. 5:6).
    - q: ¿Es Él tanto Rey como Mediador?
      a: Sí. Él tiene «autoridad para ejecutar juicio, porque es el Hijo del Hombre» (Jua. 5:27).
    - q: ¿Y está basado Su gobierno mediador en el desempeño de Sus compromisos mediadores?
      a: Sí, porque Él «se humilló a Sí mismo, haciéndose obediente hasta la muerte, y muerte de cruz, por lo cual Dios también le exaltó hasta lo sumo» (Flp. 2:8, 9).[^49]
  - - q: ¿Es Cristo un Rey poderoso?
      a: Sí. «Toda autoridad me ha sido dada en el cielo y en la tierra» (Mat. 28:18).
    - q: ¿Es Él un Rey misericordioso?
      a: Sí. Él es «justo y [está] dotado de salvación» (Zac. 9:9).
    - q: ¿Es Él un Rey universal?
      a: Sí. «Él gobierna las naciones» (Sal. 22:28).
    - q: ¿Es Él un Rey justo?
      a: Sí. «Un rey reinará con justicia» (Isa. 32:1).
    - q: ¿Y es Él [un Rey] legítimo?
      a: Sí. «Le fue dado dominio, gloria y reino, y un reino» (Dan. 7:14).
    - q: Entonces, ¿deberíamos someternos a Su autoridad?
      a: Sí. «Tomad mi yugo sobre vosotros» (Mat. 11:29).
  - - q: ¿Es Cristo el Rey de los santos de una manera especial?
      a: Sí. «Justos y verdaderos son tus caminos, Rey de los santos» (Apo. 15:3 [RVR60]).[^50]
    - q: ¿Son los santos súbditos de otro reino naturalmente?
      a: Sí. «Otros señores fuera de Ti nos han gobernado» (Isa. 26:13).
    - q: Pero, ¿son rescatados y salvados [los santos] a su debido tiempo?
      a: Sí. «Aún los cautivos del poderoso serán recobrados, y rescatada será la presa del tirano» (Isa. 49:25).
    - q: ¿Y gobierna Cristo a los que ha sometido de esta manera?
      a: Sí. «PORQUE DE TI SALDRÁ UN GOBERNANTE QUEPASTOREARÁ A MI PUEBLO ISRAEL» (Mat. 2:6).
  - - q: ¿Es Cristo Rey de la Iglesia?
      a: Sí. «¿No está el SEÑOR en Sión? ¿No está su rey en ella?» (Jer. 8:19).
    - q: ¿Promulga Él leyes en la Iglesia?
      a: Sí. «Enseñándoles a guardar todo lo que os he mandado» (Mat. 28:20).
    - q: ¿Comisiona Él oficiales [en la Iglesia]?
      a: Sí. «Y Él dio a algunos el ser apóstoles, a otros profetas» (Efe. 4:11).
    - q: ¿Y lo ofende la introducción de algo sin Su autoridad?
      a: Sí. «Poniendo su umbral junto a mi umbral, y sus postes junto a mis postes, ellos han profanado mi santo nombre» (Eze. 43:8).
  - - q: ¿Preserva Cristo como Rey a Sus súbditos?
      a: Sí. «Guardados para Jesucristo» (Jud. 1).
    - q: ¿Protege [Cristo como Rey] a Sus súbditos?
      a: Sí. «Como aves que vuelan, así protegerá Él a Jerusalén» (Isa. 31:5).
    - q: ¿Castiga [Cristo como Rey] las faltas de Sus súbditos?
      a: Sí. «AL QUEAMA, DISCIPLINA» (Heb. 12:6).
    - q: ¿Y recompensa [Cristo como Rey] el servicio fiel de Sus súbditos?
      a: Sí. «Su recompensa está [o viene] con Él» (Apo. 22:12).
  - - q: ¿Ejerce Cristo Su poder como Rey al restringir Sus enemigos?
      a: Sí. «Pondré mi garfio en tu nariz y mi freno en tu boca» (Isa. 37:29).
    - q: ¿[Ejerce Cristo Su poder como Rey] al someter a Sus enemigos?
      a: Sí. Él «[ha despojado] a los poderes y autoridades» (Col. 2:15).
    - q: ¿[Ejerce Cristo Su poder como Rey] al destruir a Sus enemigos?
      a: Sí. Él «[los quebrantará] con vara de hierro; [los desmenuzará] como vaso de alfarero» (Sal. 2:9).
    - q: ¿Será gradual la conquista de los enemigos de los santos?
      a: Sí. «Poco a poco los echaré» (Éxo. 23:30).
    - q: Pero, ¿será total [la conquista de los enemigos de los santos]?
      a: Sí. «Pues Cristo debe reinar hasta que haya puesto a todos sus enemigos debajo de sus pies» (1 Cor. 15:25).
notes:
  "49": Aunque la referencia que aparece en el original es Filipenses 2:8, el autor también está citando el versículo 9.
  "50": En Apocalipsis 15:3 hay una variante textual de la última palabra o expresión del texto. Tanto la Reina Valera 1960 como la King James toman la variante que acepta la palabra ἁγίων /jáguion/ (santos), mientras que LBLA toma la variante que acepta la palabra ἐθνῶν /édsnon/ (pueblos, naciones). Otra variante es la que usa la palabra αἰώνων /aiónon/ (siglos). El autor, quien utiliza la versión King James, cita este texto como una prueba de que, aunque Cristo es Rey sobre todas las naciones, es principalmente el Rey de Su pueblo. Una de las formas en que la Palabra de Dios enseña esto es por la posición de Cristo como Cabeza de la Iglesia (Efe. 1:21; 5:23; 1 Cor. 11:3; etc.).
