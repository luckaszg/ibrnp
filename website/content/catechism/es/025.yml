# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 25
question: ¿Cómo Cristo, siendo el Hijo de Dios, se hizo Hombre?
answer: Cristo, el Hijo de Dios, se hizo Hombre al tomar para Sí un cuerpo verdadero y un alma racional, al ser concebido por el poder del Espíritu Santo en el seno de la virgen María y haber nacido de ella, pero sin pecado.
sections:
  - - q: ¿Asumió Cristo un cuerpo?
      a: Sí. «UN CUERPO HAS PREPARADOPARA MÍ» (Heb. 10:5).
    - q: ¿Era un verdadero cuerpo humano?
      a: Sí, porque fue hecho «semejante a los hombres» (Flp. 2:7).
    - q: ¿Tenía [Su cuerpo] todas las propiedades de un cuerpo como el nuestro?
      a: Sí. «Palpadme y ved, porque un espíritu no tiene carne ni huesos como veis que yo tengo» (Luc. 24:39).
    - q: ¿Estaba sujeto [Su cuerpo] a debilidad sin pecado {o debilidad no pecaminosa}?
      a: Sí, porque tuvo hambre y se cansó (Mat. 4:2, Jua. 4:6).
    - q: ¿Era [Su cuerpo] capaz de sufrir?
      a: Sí. «Él os ha reconciliado en su cuerpo de carne, mediante su muerte» (Col. 1:22).[^45]
    - q: ¿Y era un requisito que Él asumiera un cuerpo así?
      a: Sí, porque «tenía que ser hecho semejante a sus hermanos en todo» (Heb. 2:17).
  - - q: ¿Tenía Cristo un alma humana real?
      a: Sí. «Cuando entregue Su alma como ofrenda de expiación» (Isa. 53:10).[^46]
    - q: ¿Era un alma racional?
      a: Sí, porque «crecía en sabiduría» (Luc. 2:52).
    - q: ¿Estaba dotada [el alma humana de Cristo] de pasiones naturales?
      a: Sí. «Mi alma está muy afligida» (Mat. 26:38).
    - q: ¿Era [el alma humana de Cristo] capaz de separarse del cuerpo?
      a: Sí. «Porque derramó su alma hasta la muerte» (Isa. 53:12).
    - q: ¿Fue humillada en gran manera la naturaleza humana de Cristo?
      a: Sí. «Yo soy gusano, y no hombre» (Sal. 22:6).
    - q: ¿Y [fue] exaltada en gran manera [la naturaleza humana de Cristo]?
      a: Sí. «Porque toda la plenitud de la Deidad reside corporalmente en Él» (Col. 2:9).
  - - q: ¿Vino Cristo al mundo de forma ordinaria?
      a: No. «Porque el SEÑOR ha creado algo nuevo en la tierra» (Jer. 31:22).
    - q: ¿Fue concebido por el poder del Espíritu Santo?
      a: Sí. «El Espíritu Santo vendrá sobre ti, y el poder del Altísimo te cubrirá con Su sombra» (Luc. 1:35).
    - q: ¿Nació de una virgen?
      a: Sí. «He aquí, una virgen concebirá y dará a luz un hijo» (Isa. 7:14).
    - q: ¿Tuvo Cristo un padre putativo?
      a: "[^47] Sí. «¿No es [este] el hijo de José?» (Luc. 4:22)."
    - q: Pero ¿no era más que un padre putativo?
      a: No, porque «estando su madre María desposada con José, antes de que se consumara el matrimonio, se halló que había concebido por obra del Espíritu Santo» (Mat. 1:18).
  - - q: ¿Nació Cristo en el tiempo señalado?
      a: Sí. «Cuando vino la plenitud del tiempo, Dios envió a su Hijo» (Gál. 4:4).
    - q: ¿[Nació] en el lugar señalado?
      a: Sí. «Porque os ha nacido hoy, en la ciudad de David, un Salvador» (Luc. 2:11).
    - q: ¿[Nació] del linaje señalado?
      a: Sí. «Porque (...) [Él] ayuda a la descendencia de Abraham» (Heb. 2:16).
    - q: ¿Predijeron los profetas Su nacimiento?
      a: Sí. «Tal como [Dios] lo anunció por boca de Sus santos profetas» (Luc. 1:70).
    - q: ¿Y lo celebraron los ángeles?
      a: Sí. Hubo «una multitud de los ejércitos celestiales, alabando a Dios» (Luc. 2:13).
  - - q: ¿Fue Cristo perfectamente santo?
      a: Sí. Él fue «santo, inocente e inmaculado» (Heb. 7:26).
    - q: ¿Estaba libre de la corrupción original?
      a: Sí. «Viene el príncipe de este mundo, y él no tiene nada en mí» (Jua. 14:30).
    - q: ¿[Estaba libre] del pecado actual?
      a: Sí. «EL CUAL NOCOMETIÓ PECADO» (1 Pedro 2:22).
    - q: ¿Era necesario que fuera así?
      a: Sí. «Convenía que tuviéramos tal sumo sacerdote» (Heb. 7:26).
    - q: Si hubiera sido de otra manera, ¿habrían sido ineficaces Sus sufrimientos?
      a: Sí, porque Él «por el Espíritu eterno se ofreció a Sí mismo sin mancha» (Heb. 9:14).
notes:
  "44": La cita en el original es Lucas 1:46, pero el autor está haciendo referencia también al versículo 47.
  "45": La cita en el original es Colosenses 1:21. Tanto la King James como la Reina Valera contienen estas palabras en el versículo 21; sin embargo, LBLA tiene una separación distinta de ese párrafo, por lo que las palabras a las que hace referencia el autor se encuentran en el versículo 22. Hemos dejado la cita de LBLA para que el lector pueda corroborar en su Biblia el texto al que se hace referencia.
  "46": La palabra hebrea ֙וֹׁש ְפַנ puede ser traducida como ser o vida y también como alma. La King James utiliza la palabra «soul» (alma), mientras que la Reina Valera de 1960 prefiere la palabra «vida». Hemos decidido usar la traducción de LBLA, la cual favorece el uso de «alma» en este caso.
  "47": "La palabra que se utiliza en el original en inglés es «reputed», que puede ser traducida como reputado o con la reputación de. El adjetivo español putativo es el equivalente de la palabra inglesa reputed y significa: «Reputado o tenido por padre, hermano, etc., no siéndolo» (Diccionario de la lengua española, 23. @@a@@ ed., versión 23.4 en línea [Madrid, España: Real Academia Española, 2014], disponible en: ˂https://dle.rae.es˃)."
