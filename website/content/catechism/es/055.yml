# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 55
question: ¿Qué se exige en el segundo mandamiento?
answer: El segundo mandamiento exige recibir, observar y guardar puras e íntegras toda aquella adoración religiosa y todas aquellas ordenanzas que Dios ha establecido en Su Palabra.
sections:
  - - q: ¿Se puede dar honor civil a las criaturas?
      a: Sí. «Se inclinarán a ti los hijos de tu padre» (Gén. 49:8).
    - q: Pero, ¿se debe el culto divino {o la adoración divina} solo a Dios?
      a: Sí. «SOLO A ÉL SERVIRÁS» (Mat. 4:10).
    - q: ¿Es suficiente la luz de la naturaleza para dirigirnos en la adoración a Dios?
      a: No. «Lo que vosotros adoráis sin conocer» (Hch. 17:23).
    - q: Por tanto, ¿deberíamos recurrir a la Palabra escrita?
      a: Sí. «Entonces edificó Josué un altar al SEÑOR […] como está escrito en el libro de la ley de Moisés» (Jos. 8:30, 31).
  - - q: ¿Deberían recibirse todas las ordenanzas de Dios?
      a: Sí. «Recibe, te ruego, la instrucción {o ley} de su boca» (Job 22:22).
    - q: ¿[Deberían] observarse [todas las ordenanzas de Dios]?
      a: Sí. «Observaréis todos mis estatutos (Lev. 19:37). ¿[Deberían] guardarse puras[,] sin adulteración? Sí. «No añadas a sus palabras» (Pro. 30:6). ¿Y [deberían guardarse] completas[,] sin disminución? Sí. «Cuídate de cumplir toda la ley» (Jos. 1:7).[^71] ¿Es este el deber de los ministros especialmente? Sí. «Guarda […] el tesoro que te ha sido encomendado» (2 Tim. 1:14).
  - - q: ¿No pueden ser nuestros propios deseos la regla de nuestro culto {o adoración}?
      a: No. Acuérdate «de […] los mandamientos del SEÑOR […] y no [sigas tu] corazón ni [tus] ojos» (Núm. 15:39).
    - q: ¿No [pueden serlo] las costumbres de los hombres?
      a: No. «No haréis como hacen en la tierra de Egipto […] ni haréis como hacen en la tierra de Canaán» (Lev. 18:3).
    - q: ¿Ni [pueden serlo] las prescripciones de los superiores?
      a: No. «Has de saber, oh rey, que no serviremos a tus dioses» (Dan. 3:18).
    - q: Por tanto, ¿deberíamos ceñirnos a la Palabra de Dios como norma?
      a: Sí. «Y mira que los hagas según el diseño» (Éxo. 25:40).
    - q: ¿Y no [deberíamos] dejarnos intimidar por los mayores reproches o sufrimientos?
      a: No. «Pero de ninguna cosa hago caso» (Hch. 20:24 [RVR60]).
notes:
  "70": La palabra en el original es «infatuating», sin embargo, el Diccionario de la Real Academia Española no reconoce la palabra infatuante (que sería una traducción literal); por esa razón, es necesario describir la acción de este adjetivo y usarlo en forma de sustantivo. La idea es que la idolatría tiene la facultad de hacer fatuo o necio a aquel que comete este pecado.
  "71": "La cita original es Malaquías 2:9. En la versión King James, la parte citada de este texto se lee así: «According as ye have not kept my ways, But have been partial in the law» (Como no han guardado mis caminos, sino que han sido parciales en la ley). Ninguna de nuestras versiones en español refleja esta traducción. Parece que la diferencia está en la forma de traducir la frase םי ִ֖נָּפ םיִ֥אְׂשֹנְו y conectarla con el contexto. Esta frase puede ser traducida literalmente como: «levantar o escoger caras», lo cual es un modismo para hablar de hacer acepción de personas. Es decir, «escoger en base a la cara». Por esta razón, la RVR60 y LBLA traducen esta frase como «en la ley hacéis acepción de personas». Esto implica un cumplimiento parcial de la ley movido por una actitud pecaminosa. Aunque la palabra parcialidad es sinónimo de hacer acepción de personas, la frase hebrea no se refiere a la parcialidad con la que cumplen la ley, sino a la parcialidad con la que escogen a las personas a quienes les aplican la ley. Beddome utiliza este texto considerando la traducción de la King James Bible; sin embargo, aunque el uso de este texto podría ser cuestionado, la verdad detrás de esta pregunta tiene una respuesta que resuena en muchas porciones de la Palabra de Dios. Josué 1:7 es una de ellas."
