# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 110
question: ¿Qué oramos en la tercera petición?
answer: "En la tercera petición, que es: «Hágase tu voluntad, así en la tierra como en el cielo», oramos que Dios, por Su gracia, nos dé la capacidad y disposición para conocer, obedecer y someternos a Su voluntad en todas las cosas, como hacen los ángeles en el Cielo."
sections:
  - - q: ¿Es el propósito de Dios Su voluntad?
      a: Sí. «Él actúa conforme a su voluntad en el ejército del cielo y entre los habitantes de la tierra» (Dan. 4:35).
    - q: ¿Se deberían atener todas nuestras acciones a esta voluntad determinante de Dios?
      a: "Sí. «Debierais decir: Si el Señor quiere, viviremos y haremos esto o aquello» (Stg. 4:15)."
    - q: ¿Y deberíamos someternos a esta en todas las dispensaciones?
      a: "Sí. «Como no se dejaba persuadir, nos callamos, diciéndonos: Que se haga la voluntad del Señor» (Hch. 21:14)."
  - - q: ¿Es consistente esta sumisión {a la voluntad determinante de Dios} con un debido sentido del mal de la aflicción?
      a: Sí. Porque no debemos tener en poco la disciplina del Señor (Heb. 12:5).
    - q: ¿[Es consistente] con un dolor y tristeza moderados por causa de la aflicción?
      a: Sí. «Ezequías lloró amargamente» (Isa. 38:3).
    - q: ¿[Es consistente] con la oración ferviente por liberación?
      a: Sí. «¿Por qué escondes tu rostro y te olvidas de nuestra aflicción?» (Sal. 44:24).
    - q: ¿Y [es consistente] con el uso de todos los medios lícitos para obtener la liberación?
      a: Sí. «Pero sus discípulos tomaron [a Saulo] de noche y lo sacaron por una abertura en la muralla, bajándolo en una canasta» (Hch. 9:25).
  - - q: ¿Debería aprobar nuestro entendimiento las más severas dispensaciones de la providencia?
      a: Sí. «La palabra del SEÑOR que has hablado es buena» (Isa. 39:8).
    - q: ¿[Debería] resignarse nuestra voluntad ante estas?
      a: Sí. «¿Por qué ha de quejarse el ser viviente? ¡Sea valiente frente a sus pecados!» (Lam. 3:39).
    - q: ¿[Deberían] serenarse nuestras pasiones bajo estas?
      a: "Sí. «Si él maldice, y si el SEÑOR le ha dicho: “Maldice a David”, ¿quién, pues, le dirá: “¿Por qué has hecho esto?”?» (2 Sam. 16:10)."
    - q: ¿Y deberíamos orar para que nosotros y otros seamos capacitados para someternos así a la voluntad de Dios?
      a: Sí, para que seamos «fortalecidos con todo poder […] para obtener toda perseverancia y paciencia, con gozo» (Col. 1:11).
  - - q: ¿Son los preceptos de Dios Su voluntad?
      a: Sí. Son «lo que es bueno, aceptable y perfecto» (Rom. 12:2).
    - q: ¿Estamos renuentes por naturaleza a hacer esta voluntad de Dios?
      a: Sí. Somos «inútiles para cualquier obra buena» (Tit. 1:16).
    - q: Por tanto, ¿deberíamos orar para tener la disposición {de hacer Su voluntad}?
      a: Sí. «Inclina mi corazón a tus testimonios» (Sal. 119:36). No obstante, aun cuando estemos dispuestos,
    - q: ¿podemos hacerla siempre?
      a: No. «No practico lo que quiero hacer» (Rom. 7:15).
    - q: Por tanto, ¿deberíamos orar para que Dios no solo ponga el deseo de hacerla sino también la capacidad?
      a: Sí. «Fortaléceme conforme a tu palabra» (Sal. 119:28).
    - q: ¿Y deberíamos desear esto para los demás así como para nosotros mismos?
      a: Sí, para que «os haga aptos en toda obra buena para hacer su voluntad» (Heb. 13:21).
  - - q: ¿Obedecen los ángeles en el Cielo la voluntad de Dios?
      a: Sí. Ellos ejecutan su mandato (Sal. 103:20).
    - q: ¿La hacen con gozo?
      a: Sí. «Bendecid al SEÑOR, vosotros todos sus ejércitos, que le servís haciendo [Su] voluntad» (Sal. 103:21).
    - q: ¿[La hacen] con celo?
      a: Sí. «Que hace de los vientos sus mensajeros, y sus ministros llamas de fuego»[^117] (Sal. 104:4).
    - q: ¿[La hacen] con humildad?
      a: Sí. Se cubren el rostro y los pies con las alas (Isa. 6:2).
    - q: ¿[La hacen] en todas partes {lit. universalmente}?
      a: Sí. Ellos «[van] de frente hacia adelante […] adondequiera que [vaya] el espíritu» (Eze. 1:9, 12).
    - q: ¿[La hacen] de forma constante?
      a: Sí. Ellos «contemplan siempre el rostro de nuestro Padre» (Mat. 18:10).
    - q: ¿Se parecen los santos del otro mundo a los ángeles en su obediencia?
      a: Sí. «Son como los ángeles de Dios en el cielo» (Mat. 22:30).
    - q: ¿Deberían los santos de este mundo procurar tal semejanza?
      a: Sí, para que «el débil [sea] (…) como David, y la casa de David [sea] (…) como el ángel del Señor» (Zac. 12:8).
