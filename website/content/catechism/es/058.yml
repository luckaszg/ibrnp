# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 58
question: ¿Cuál es el tercer mandamiento?
answer: "El tercer mandamiento es: «No tomarás el nombre del SEÑOR tu Dios en vano, porque el SEÑOR no tendrá por inocente al que tome su nombre en vano»."
sections:
  - - q: ¿Por «el nombre de Dios» debemos entender Su naturaleza?
      a: Sí. «En [Él] está mi nombre» —hablando de Cristo (Éxo. 23:21).
    - q: ¿[Por «el nombre de Dios» debemos entender] Sus propiedades esenciales?
      a: Sí. «Yo haré pasar toda mi bondad delante de ti, y proclamaré el nombre del SEÑOR» (Éxo. 33:19).
    - q: ¿[Por «el nombre de Dios» debemos entender] Sus títulos?
      a: "Sí. «Tal vez me digan: “¿Cuál es su nombre?”, ¿qué responderé? Y dijo Dios […] YO SOY EL QUE SOY» (Éxo. 3:13, 14)."
    - q: ¿Y [por «el nombre de Dios» debemos entender] todo aquello por medio de lo cual se ha dado a conocer?
      a: Sí. «He manifestado Tu nombre a los hombres que del mundo me diste» (Jua. 17:6).
  - - q: ¿Deberíamos reverenciar el nombre de Dios?
      a: Sí. «Temiendo este nombre glorioso y temible, el SEÑOR tu Dios» (Deu. 28:58).
    - q: ¿[Deberíamos] confiar en el nombre de Dios?
      a: Sí. «El nombre del SEÑOR es torre fuerte, a ella corre el justo y está a salvo» (Pro. 18:10).
    - q: ¿[Deberíamos] andar en el nombre de Dios?
      a: Sí. «Nosotros andaremos en el nombre del SEÑOR nuestro Dios para siempre jamás» (Miq. 4:5).
    - q: ¿Y no deberíamos hacer esto por ningún otro nombre?
      a: No. «Quitaré de su boca los nombres de los Baales» (Ose. 2:17).
  - - q: ¿Tiene Dios una gran consideración por Su propio nombre?
      a: Sí. «Porque ¿cómo podría ser profanado mi nombre?» (Isa. 48:11).
    - q: Por tanto, ¿es un gran pecado ser descuidados con el nombre de Dios?
      a: Sí. «Ni profanarás el nombre de tu Dios; yo soy el SEÑOR» (Lev. 18:21).
