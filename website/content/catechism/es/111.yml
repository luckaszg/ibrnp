# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 111
question: ¿Qué oramos en la cuarta petición?
answer: "En la cuarta petición, que es: «Danos hoy el pan nuestro de cada día», oramos que, por la dádiva de Dios, podamos recibir una porción adecuada de las cosas buenas de esta vida y disfrutar de Su bendición con estas."
sections:
  - - q: ¿Se pueden perder las bendiciones temporales?
      a: Sí. «Maldita será la tierra por tu causa» (Gén. 3:17).
    - q: Pero, ¿han sido prometidas?
      a: Sí. «Mi Dios proveerá a todas vuestras necesidades» (Flp. 4:19).
    - q: Por tanto, ¿deberíamos orar por ellas?
      a: Sí. «¡Oh, si en verdad me bendijeras, ensancharas mi territorio!» (1 Cró. 4:10).
  - - q: ¿Deberíamos orar por bendiciones temporales desde una perspectiva religiosa?
      a: Sí. «A fin de que tenga qué compartir con el que tiene necesidad» (Efe. 4:28).
    - q: ¿Y deberíamos orar solo por una porción adecuada de estas?
      a: Sí. «Dame a comer mi porción de pan» (Pro. 30:8).
    - q: Pero, sobre todo, ¿deberíamos suplicar la bendición de Dios sobre estas?
      a: Sí. «Y sucedió que al sentarse a la mesa con ellos, tomó pan, y lo bendijo; y partiéndolo, les dio» (Luc. 24:30).
    - q: ¿Y tienen el propósito de traernos más beneficio de esta manera?
      a: Sí. «Porque es santificado mediante la palabra de Dios y la oración» (1 Tim. 4:5).
  - - q: ¿Deberíamos orar por las comodidades de la vida, {y orar} creyendo?
      a: "Sí. «Tú dijiste: “De cierto te haré prosperar”» (Gén. 32:12)."
    - q: Sin embargo, ¿[deberíamos orar] de manera sumisa?
      a: Sí. «Si Él dijera […] “No me complazco en ti”, mira, aquí estoy, que haga conmigo lo que bien le parezca» (2 Sam. 15:26).
    - q: ¿Deberían nuestras oraciones ir acompañadas de esfuerzos adecuados?
      a: Sí. «Cuando comas del trabajo de tus manos» (Sal. 128:2).
    - q: ¿Y deberíamos orar tanto por los demás como por nosotros?
      a: Sí. «No olvides para siempre la vida de tus afligidos» (Sal. 74:19).
  - - q: ¿Debería el pan por el que oramos ser nuestro propio pan?
      a: Sí. «Que […] coman su propio pan» (2 Tes. 3:12).
    - q: ¿No [debería ser] el pan obtenido con falsedad?
      a: No, porque «el pan obtenido con falsedad es dulce al hombre, pero después su boca se llenará de grava» (Pro. 20:17).
    - q: ¿No [debería ser] el pan de opresión?
      a: No, porque Dios aplastará al opresor (Sal. 72:4).
    - q: ¿Ni [debería ser] el pan de la ociosidad?
      a: No, porque se dice de la mujer virtuosa que «no come el pan de la ociosidad» (Pro. 31:27).
    - q: Pero, sobre todo, ¿debemos orar por el pan de nuestras almas?
      a: Sí. «Señor, danos siempre este pan» (Jua. 6:34).
  - - q: ¿Excluye esta petición una consideración ansiosa del futuro?
      a: Sí. «No os preocupéis por el día de mañana» (Mat. 6:34).
    - q: Pero, ¿prohíbe una consideración prudente?
      a: No. «Mira la hormiga, perezoso, observa sus caminos […] prepara en el verano su alimento» (Pro. 6:6, 8).
    - q: ¿Nos enseña a poner todo nuestro cuidado sobre Dios?
      a: Sí. «Porque Él tiene cuidado de nosotros» (1 Ped. 5:7).
    - q: ¿[Nos enseña] a mirar hacia Él para el éxito de nuestras numerosas responsabilidades {lit. llamados}?
      a: Sí. «La obra de nuestras manos confirma» (Sal. 90:17).
    - q: ¿Y [nos enseña] a atribuir a Él toda nuestra prosperidad?
      a: Sí. «Acuérdate del SEÑOR tu Dios, porque Él es el que te da poder para hacer riquezas» (Deu. 8:18).
notes:
  "117": Esta es la lectura alternativa de LBLA.
