# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 52
question: ¿Qué se prohíbe en el primer mandamiento?
answer: El primer mandamiento prohíbe que se niegue o que no se adore y no se glorifique al Dios verdadero como Dios y como nuestro Dios, y prohíbe dar esa adoración y gloria a algún otro, la cual es debida solo a Él.
sections:
  - - q: ¿Es pecado negar a Dios?
      a: Sí. «Niegan a nuestro único Soberano y Señor» (Jud. 4).
    - q: ¿Se puede negar a Dios en Sus atributos?
      a: "Sí. «Dicen: ¿Cómo lo sabe Dios? ¿Y hay conocimiento en el Altísimo? (Sal. 73:11). ¿[Se puede negar a Dios] en Su autoridad? Sí. «¿Quién es señor sobre nosotros?» (Sal. 12:4). ¿[Se puede negar a Dios] en Su providencia? Sí. Dicen que «“ni bien ni mal hará el SEÑOR”» (Sof. 1:12). ¿[Se puede negar a Dios] en Sus verdades? Sí. «Introducirán herejías destructoras, negando incluso al Señor que los compró» (2 Ped. 2:1). ¿Y se puede negar a Dios en la práctica incluso cuando lo reconozcan {lit. lo hagan suyo} de manera doctrinal? Sí. «Profesan conocer a Dios, pero con sus hechos lo niegan» (Tit. 1:16)."
  - - q: ¿Es un gran pecado ignorar a Dios?
      a: Sí. «No conocen el camino del SEÑOR» (Jer. 5:4).
    - q: ¿[Es un gran pecado] olvidarse de Dios?
      a: Sí. «Olvidaste al Dios que te dio a luz» (Deu. 32:18).
    - q: ¿[Es un gran pecado] desconfiar de Dios?
      a: "Sí. «¿Está el SEÑOR entre nosotros o no? (Éxo. 17:7). ¿[Es un gran pecado] despreciar a Dios? Sí. «¿Por qué ha despreciado el impío a Dios?» (Sal. 10:13). ¿Y [es un gran pecado] cualquier disminución de afecto hacia Él? Sí. «“Tengo esto contra ti: que has dejado tu primer amor”» (Apo. 2:4)."
  - - q: ¿Es pecado descuidar la adoración a Dios?
      a: Sí. «No me has invocado, Jacob» (Isa. 43:22).
    - q: ¿[Es pecado] compartirla?
      a: Sí. «Juran por el SEÑOR y juran también por Milcom» (Sof. 1:5).
    - q: ¿[Es pecado] ser negligente en la adoración a Dios?
      a: Sí. «Pues su corazón no era leal para con Él» (Sal. 78:37).
    - q: ¿[Es pecado] adorar a Dios con fines egoístas?
      a: Sí. «“¿Ayunabais en verdad por mí?”» (Zac. 7:5).
  - - q: ¿Es la idolatría un pecado muy atroz?
      a: Sí. «No seáis, pues, idólatras, como fueron algunos de ellos» (1 Cor. 10:7).
    - q: ¿Eran idólatras los gentiles?
      a: Sí. «Habéis visto […] sus ídolos de madera y de piedra» (Deu. 29:17).
    - q: ¿Fueron culpables de la más burda {lit. grosera} idolatría?
      a: Sí. Sacrificaban «a los demonios y no a Dios» (1 Cor. 10:20).
    - q: ¿Son idólatras los papistas?
      a: Sí, porque honran al que «se sienta en el templo de Dios, presentándose como si fuera Dios» (2 Tes. 2:4).
    - q: Pero, ¿existe la idolatría del corazón?
      a: Sí. «Estos hombres han erigido sus ídolos en su corazón» (Eze. 14:3).
    - q: ¿Son idólatras los hombres orgullosos?
      a: "Sí. «Tu corazón se ha enaltecido y has dicho: “Un dios soy”» (Eze. 28:2)."
    - q: ¿[Son idólatras] los codiciosos?
      a: Sí. «Mortifica […] la codicia, que es idolatría»[^68] (Col. 3:5).
    - q: ¿Y [son idólatras] los sensualistas?
      a: Sí. «Cuyo dios es su apetito {o vientre}» (Flp. 3:19).
    - q: ¿Es la adulación indebida una especie de idolatría también?
      a: "Sí. «Y la gente gritaba: ¡Voz de un dios y no de un hombre es esta!» (Hch. 12:22)."
    - q: ¿Es este un pecado que Dios corregirá en este mundo?
      a: Sí. «Cargaréis el castigo de haber adorado a vuestros ídolos» (Eze. 23:49).
    - q: ¿Y lo castigará severamente en el mundo venidero?
      a: Sí, porque «los idólatras […] no heredarán el reino de Dios» (1 Cor. 6:9).
notes:
  "68": Esta es una traducción directa de la versión inglesa (KJV) usada por el autor.
