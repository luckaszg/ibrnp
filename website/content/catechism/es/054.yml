# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 54
question: ¿Cuál es el segundo mandamiento?
answer: "El segundo mandamiento es: «No te harás ídolo, ni semejanza alguna de lo que está arriba en el cielo, ni abajo en la tierra, ni en las aguas debajo de la tierra. No los adorarás ni los servirás; porque yo, el SEÑOR tu Dios, soy Dios celoso, que castigo la iniquidad de los padres sobre los hijos hasta la tercera y cuarta generación de los que me aborrecen, y muestro misericordia a millares, a los que me aman y guardan mis mandamientos»."
sections:
  - - q: ¿Deberíamos tener cuidado para evitar la idolatría?
      a: Sí. «Guardaos bien, no sea que os corrompáis y hagáis para vosotros una imagen tallada» (Deu. 4:15, 16).
    - q: ¿Deberíamos tener cuidado en todos los casos?
      a: "Sí. «Semejante a cualquier figura: semejanza de varón o hembra, semejanza de cualquier animal (…) [o] ave que vuela» (vv. 17, 18)."
    - q: ¿Y [deberíamos tener cuidado] en todos los acercamientos a la idolatría?
      a: Sí. «No mencionéis ni se oiga en vuestros labios el nombre de otros dioses» (Éxo. 23:13).
  - - q: ¿Es la idolatría un pecado que causa infatuación?
      a: "[^70] Sí. «Se vuelven locos por sus horribles ídolos» (Jer. 50:38)."
    - q: ¿Y es un pecado que se extiende?
      a: Sí, porque toda Asia y el mundo entero adoraban a la diosa Diana (Hch. 19:27).
    - q: Por tanto, ¿fue necesario imponer y repetir la prohibición de este pecado?
      a: Sí. «Porque […] mandato sobre mandato, línea sobre línea» (Isa. 28:10).
    - q: ¿Y se prohíbe tanto en el Nuevo Testamento como en el Antiguo?
      a: Sí. «No dejaron de adorar ídolos de oro, de plata […] de piedra y de madera» (Apo. 9:20).
