# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 32
question: ¿Cómo somos hechos partícipes de la redención obtenida por Cristo?
answer: Somos hechos partícipes de la redención obtenida por Cristo mediante la aplicación eficaz de dicha redención a nosotros por Su Espíritu Santo.
sections:
  - - q: ¿Se ha efectuado una redención para el pueblo de Dios?
      a: Sí. «Él ha enviado redención a Su pueblo» (Sal. 111:9).
    - q: ¿Es Cristo el Autor de esta redención?
      a: Sí. Él «[obtuvo] redención eterna» para nosotros (Heb. 9:12).
    - q: ¿Es Su sangre el precio de esta [redención]?
      a: Sí. Fuimos redimidos con la sangre preciosa de Cristo (1 Pedro 1:18, 19).
    - q: ¿Hay muchos que esperan la redención de otra manera?
      a: "Sí. «Aún dices: “Soy inocente, ciertamente su ira se ha apartado de mí”» (Jer. 2:35)."
    - q: Pero, ¿es [la redención obtenida por Cristo] la única forma [de ser redimidos]?
      a: Sí. «Pues nadie puede poner otro fundamento que el que ya está puesto, el cual es Jesucristo» (1 Cor. 3:11).
  - - q: ¿Participan todos de la redención obtenida por Cristo?
      a: No. Algunos no tienen «parte ni suerte en este asunto» (Hch. 8:21).
    - q: ¿Participan de [esta redención] todos los que pretenden tener parte en esta?
      a: No. «Tienes nombre de que vives, pero estás muerto» (Apo. 3:1).
    - q: ¿Participan de [esta redención] todos los creyentes?
      a: Sí. «Somos hechos partícipes de Cristo» (Heb. 3:14).
    - q: ¿Reciben los creyentes al Redentor?
      a: Sí. «Pero a todos los que le recibieron, les dio el derecho de llegar a ser hijos de Dios» (Jua. 1:12).
    - q: ¿Lo reciben en todos Sus oficios?
      a: Sí. «Recibisteis a Cristo Jesús el Señor» (Col. 2:6).
    - q: ¿Y recibe alguno [esta redención] de sí mismo?
      a: No. «Un hombre no puede recibir nada si no le es dado del cielo» (Jua. 3:27).
  - - q: ¿Es necesario que se nos aplique la redención?
      a: Sí. «El cual se hizo para nosotros redención» (1 Cor. 1:30).
    - q: ¿Es [la aplicación de la redención a nosotros] una obra magnífica y eficaz?
      a: Sí, porque «es la extraordinaria grandeza de su poder para con nosotros los que creemos» (Efe. 1:19).
    - q: ¿Es [la redención] una obra dentro de nosotros?
      a: Sí. «Es Cristo en vosotros, la esperanza de la gloria» (Col. 1:27).
    - q: ¿Es la obra del Espíritu?
      a: Sí. «El Espíritu es el que da vida» (Jua. 6:63).
    - q: ¿Es obrada [la redención] solo en los elegidos?
      a: Sí. «Los que fueron escogidos lo alcanzaron» (Rom. 11:7).
    - q: ¿Y serán partícipes de esta redención todos aquellos a quienes esta sea aplicada efectivamente?
      a: Sí. «El que cree en el Hijo tiene vida eterna» (Jua. 3:36).
