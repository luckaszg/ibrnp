# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 6
question: ¿Qué cosas están contenidas principalmente en las Santas Escrituras?
answer: Las Santas Escrituras contienen principalmente lo que el hombre debe creer acerca de Dios y el deber que Dios demanda [o exige] del hombre.
sections:
  - - q: ¿Son los hombres ignorantes por naturaleza acerca de Dios?
      a: Sí. «A mí no me conocen, declara el SEÑOR» (Jer. 9:3).
    - q: ¿[Son ignorantes por naturaleza] acerca del deber?
      a: Sí. «No saben hacer lo recto» (Amós 3:10).
    - q: ¿Conduce la ignorancia al pecado?
      a: Sí. «Lo hice por ignorancia» (1 Tim. 1:13).
    - q: Pero, ¿es eso una excusa para pecar?
      a: No. «Derrama furor sobre las naciones que no te conocen» (Jer. 10:25).
    - q: ¿Fueron designadas las Escrituras para nuestra enseñanza?
      a: Sí. «La exposición de tus palabras imparte luz» (Sal. 119:130).
  - - q: ¿Están contenidas en las Santas Escrituras todas las cosas útiles y necesarias?
      a: Sí. Estas «pueden dar la sabiduría que lleva a la salvación» (2 Tim. 3:15).
    - q: ¿Enseñan las Escrituras de manera clara?
      a: Sí. «Hablamos con mucha franqueza» (2 Cor. 3:12).
    - q: ¿Enseñan de manera poderosa?
      a: Sí. «Porque la palabra de Dios es viva y eficaz» (Heb. 4:12).
    - q: ¿Enseñan a los pecadores?
      a: Sí. «Oh simples, aprended prudencia; y vosotros, necios, aprended sabiduría» (Pro. 8:5).
    - q: ¿Enseñan a los santos?
      a: Sí. «Os hablo como a sabios» (1 Cor. 10:15).
  - - q: ¿Es necesario que los hombres conozcan a Dios?
      a: Sí. «Cede ahora y haz la paz con Él» (Job 22:21).
    - q: ¿Llegan la gracia y la paz al alma de esta manera?
      a: Sí. «Gracia y paz os sean multiplicadas en el conocimiento de Dios» (2 Pedro 1:2).
    - q: ¿Es la ignorancia de Dios un gran reproche?
      a: Sí. «El buey conoce a su dueño y el asno el pesebre de su amo; pero Israel no conoce» (Isa. 1:3).
    - q: ¿Pueden los hombres conocer a Dios correctamente sin Su Palabra?
      a: No. «Recordad que en ese tiempo estabais sin Dios en el mundo» (Efe. 2:12).
    - q: ¿Puede todo aquello que se conoce de Dios sin la Palabra conocerse mejor en la Palabra y por medio de la Palabra?
      a: Sí. «Por la fe entendemos que el universo fue preparado por la palabra de Dios» (Heb. 11:3).
    - q: Por lo tanto, ¿deberíamos recurrir a las Escrituras para el conocimiento de Dios?
      a: Sí. Si recibimos Sus Palabras, entonces entenderemos el temor del SEÑOR (Pro. 2:1, 5).
  - - q: ¿Es la obediencia a Dios un deber requerido?
      a: Sí. «Así que, hermanos, somos deudores» (Rom. 8:12).
    - q: ¿Es [la obediencia] un deber que se demanda [o se exige] de todos?
      a: Sí. «El mandamiento del Dios eterno, se ha dado a conocer a todas las naciones para guiarlas a la obediencia de la fe» (Rom. 16:26).
    - q: Pero, ¿[se demanda {o se exige} la obediencia] especialmente de los santos?
      a: Sí. «Los que han creído en Dios procuren ocuparse en buenas obras» (Tit. 3:8).
    - q: ¿Y se aprenden mejor los deberes de la obediencia por la Palabra divina?
      a: Sí, porque «la Escritura es útil para instruir en justicia» (2 Tim. 3:16).
  - - q: ¿Nos enseñan las Escrituras a obedecer sin vacilar?
      a: Sí. «No consulté enseguida con carne y sangre» (Gál. 1:16).
    - q: ¿[Nos enseñan las Escrituras a obedecer] sin reservas y sin hacer excepciones?
      a: Sí. «No os desviéis a la derecha ni a la izquierda» (Deu. 5:32).
    - q: ¿[Nos enseñan las Escrituras a obedecer] sin renuencia?
      a: Sí. «Me deleito en hacer tu voluntad, Dios mío» (Sal. 40:8).
    - q: ¿[Nos enseñan las Escrituras a obedecer] sin jactancia?
      a: "Sí. «Cuando hayáis hecho todo lo que se os ha ordenado, decid: “Siervos inútiles somos”» (Luc. 17:10)."
    - q: ¿[Nos enseñan las Escrituras a obedecer] sin desmayar?
      a: Sí. «No nos cansemos de hacer el bien» (Gál. 6:9).
    - q: ¿Y serán ineficaces otros métodos para la instrucción [o enseñanza] donde la Palabra escrita falla?
      a: Sí. «Si no escuchan a Moisés y a los profetas, tampoco se persuadirán si alguno se levanta de entre los muertos» (Luc. 16:31).
