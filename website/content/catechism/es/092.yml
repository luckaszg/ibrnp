# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 92
question: ¿Qué es el arrepentimiento para vida?
answer: El arrepentimiento para vida es una gracia salvadora, por medio de la cual un pecador, por una verdadera percepción de su pecado y la aprehensión de la misericordia de Dios en Cristo, con dolor y odio por su pecado, se aparta de este para volverse a Dios, con pleno propósito y empeño, en pos de una nueva obediencia.
sections:
  - - q: ¿Es el arrepentimiento para vida el verdadero arrepentimiento?
      a: Sí. «También a los gentiles ha concedido Dios el arrepentimiento que conduce a la vida» (Hch. 11:18).
    - q: Entonces, ¿hay un arrepentimiento que no es para vida?
      a: Sí. «[Judas] sintió remordimiento […] se marchó […] y se ahorcó» (Mat. 27:3, 5).
    - q: ¿Es el arrepentimiento verdadero una gracia?
      a: Sí. Cristo ha sido exaltado «para dar arrepentimiento» (Hch. 5:31).
    - q: ¿Es obrado por la Palabra como instrumento?
      a: Sí. «¿No es mi palabra como fuego —declara el SEÑOR—y como martillo que despedaza la roca?» (Jer. 23:29).
    - q: ¿Y [es obrado] por el Espíritu como Agente?
      a: Sí. «Derramaré sobre […] los habitantes de Jerusalén, el Espíritu de gracia […] Y se lamentarán» (Zac. 12:10).
    - q: ¿Es una gracia salvadora?
      a: Sí. Es «un arrepentimiento que conduce a la salvación» (2 Cor. 7:10).
    - q: ¿Y nadie podrá ser salvo sin el arrepentimiento para vida?
      a: No. «Mas por causa de tu terquedad y de tu corazón no arrepentido, estás acumulando ira» (Rom. 2:5).
  - - q: ¿Existe tal cosa como un arrepentimiento legal?
      a: Sí. «¿Ves cómo Acab se ha humillado?» (1 Rey. 21:29).
    - q: ¿Puede ir acompañado de gran terror?
      a: Sí. Es un espíritu esclavizado al temor (Rom. 8:15).
    - q: ¿Y de algunas reformas externas?
      a: Sí. «Herodes temía a Juan […] Y cuando le oía se quedaba muy perplejo» (Mar. 6:20).
    - q: Pero, ¿es el arrepentimiento evangélico de una naturaleza completamente diferente?
      a: Sí. {Es} «tristeza conforme a […] Dios» (2 Cor. 7:11).
  - - q: ¿Implica el arrepentimiento verdadero convicción de pecado?
      a: Sí. «Por todos será convencido» (1 Cor. 14:24).
    - q: ¿Es una convicción profunda?
      a: Sí. «Se compungieron de corazón» (Hch. 2:37 [RVR60]).
    - q: ¿[Es] dolorosa?
      a: Sí. «El espíritu quebrantado, ¿quién lo puede sobrellevar?» (Pro. 18:14).
    - q: ¿[Es] permanente?
      a: Sí. «Porque tus saetas se han clavado en mí» (Sal. 38:2).
    - q: Y, en cierto sentido, ¿mortal?
      a: Sí. «El pecado revivió, y yo morí» (Rom. 7:9).
    - q: ¿Se extiende esta convicción al pecado de nuestra naturaleza?
      a: "Sí. «En pecado me concibió mi madre (Sal. 51:5). ¿[Se extiende] a las corrupciones del corazón? Sí. «Todo el corazón está desfallecido» (Isa. 1:5). ¿[Se extiende] a todos los pecados actuales?[^99] Sí. «Venid, ved a un hombre que me ha dicho todo lo que yo he hecho» (Jua. 4:29). ¿Y [se extiende] tanto a la inmundicia del pecado como a la culpa de este? Sí. «He aquí que yo soy vil» (Job 40:4 [RVR60]). Por tanto, ¿se puede decir que están arrepentidos los que no están convencidos de pecado? No. «“He escuchado y oído, han hablado lo que no es recto; ninguno se arrepiente de su maldad, diciendo: ¿Qué he hecho?”» (Jer. 8:6)."
  - - q: ¿Implica el arrepentimiento dolor por el pecado?
      a: Sí. «Mi dolor está continuamente delante de mí» (Sal. 38:17).
    - q: Pero, ¿puede haber dolor sin arrepentimiento?
      a: Sí. «Pero ahora me regocijo, no de que fuisteis entristecidos, sino de que fuisteis entristecidos para arrepentimiento» (2 Cor. 7:9).
    - q: ¿Es genuino y libre[^100] el verdadero dolor por el pecado?
      a: Sí. «Mis ojos lloran a Dios» (Job 16:20).
    - q: ¿Es recto y sincero?
      a: Sí. «Se lamentarán por él, como quien se lamenta por un hijo único» (Zac. 12:10).
    - q: ¿Es punzante y fuerte?
      a: Sí. «El pueblo lloraba amargamente» (Esd. 10:1).
    - q: ¿Y le encanta ser reservado y retirado?
      a: Sí. «Y se lamentará la tierra, cada familia por su lado […] y sus mujeres por su lado» (Zac. 12:12).
  - - q: ¿Implica el arrepentimiento odio por el pecado?
      a: Sí. «Lo que aborrezco, eso hago» (Rom. 7:15).
    - q: ¿Y {un} odio hacia nosotros mismos por el pecado?
      a: Sí. «Me aborrezco» (Job 42:6 [RVR60]).
    - q: ¿Es universal este odio por el pecado?
      a: Sí. «Aborrezco todo camino de mentira» (Sal. 119:128).
    - q: ¿Y [es] irreconciliable?
      a: Sí. «Nosotros, que hemos muerto al pecado, ¿cómo viviremos aún en él?» (Rom. 6:2).
  - - q: ¿Está acompañado el arrepentimiento verdadero por una visión de la misericordia de Dios?
      a: Sí. «En ti hay perdón» (Sal. 130:4).
    - q: ¿[Está acompañado] de una esperanza en esa misericordia?
      a: Sí. «Hay esperanza para Israel a pesar de esto» (Esd. 10:2).
    - q: ¿Es la esperanza en la misericordia de Dios un paso hacia el arrepentimiento?
      a: Sí. «La bondad de Dios te guía al arrepentimiento» (Rom. 2:4).
    - q: Y, por tanto, ¿puede haber un arrepentimiento verdadero donde no hay esperanza?
      a: "No. «Mas dijiste: “Es en vano. ¡No! Porque amo a los extraños, y tras ellos andaré”» (Jer. 2:25)."
  - - q: ¿Está acompañado el arrepentimiento de una vergüenza santa?
      a: Sí. «Estoy avergonzado y confuso» (Esd. 9:6).
    - q: ¿[Está acompañado] de un temor con solicitud?
      a: Sí. «¡Qué solicitud ha producido en vosotros esto […] qué temor!» (2 Cor. 7:11).
    - q: ¿[Está acompañado] de una absolución {a favor} de Dios?
      a: "[^101] Sí. «Para que seas […] tenido por puro en tu juicio» (Sal. 51:4 [RVR60])."
    - q: ¿[Está acompañado] de una conducta humilde y sumisa hacia los hombres?
      a: Sí. «Que dé la mejilla al que lo hiere» (Lam. 3:30).
    - q: ¿Confesarán sus pecados los pecadores arrepentidos?
      a: Sí. «Te manifesté mi pecado» (Sal. 32:5).
    - q: ¿Y agravan sus pecados?
      a: Sí. «Hemos pecado, hemos cometido iniquidad, hemos hecho lo malo, nos hemos rebelado» (Dan. 9:5, 6).
    - q: ¿Y procuran hacer restitución cuando es posible?
      a: Sí. «Si en algo he defraudado a alguno, se lo restituiré cuadruplicado» (Luc. 19:8).
  - - q: ¿Implica el arrepentimiento apartarse del pecado?
      a: Sí. «Si he obrado mal, no lo volveré a hacer» (Job 34:32).
    - q: ¿Se aparta el verdadero penitente de su pecado predilecto (lit. amado)?
      a: Sí. «Me guardé de mi iniquidad» (Sal. 18:23).
    - q: ¿[Se aparta] de todo pecado?
      a: Sí. «“Arrepentíos y apartaos […] de todas vuestras abominaciones”» (Eze. 14:6).
    - q: ¿Y lo hacen para no volver nunca más al pecado?
      a: Sí. «Efraín dirá, ¿qué más tendré ya con los ídolos?» (Ose. 14:8 [RVR60]).
  - - q: ¿Implica también el verdadero arrepentimiento volverse a Dios?
      a: Sí. «Si has de volver, oh Israel —declara el SEÑOR—vuélvete a mí» (Jer. 4:1).
    - q: ¿[Implica volverse] a Cristo?
      a: Sí. «Habéis vuelto al Pastor y Guardián de vuestras almas» (1 Ped. 2:25).
    - q: ¿[Implica volver] en sí?
      a: Sí. «Volviendo en sí» (Luc. 15:17).
    - q: ¿E [implica volver] al deber?
      a: Sí. «Volví mis pasos a tus testimonios» (Sal. 119:59).
    - q: Pero, ¿podemos volvernos de esta forma por nosotros mismos?
      a: No. «Porque después que [fui vuelto],[^102] me arrepentí» (Jer. 31:19).
  - - q: ¿Cumplen con su deber los verdaderos penitentes partiendo de un principio diferente al que tenían antes?
      a: Sí. «Pues el amor de Cristo nos apremia» (2 Cor. 5:14).
    - q: ¿Y de una manera diferente?
      a: Sí. Sirven «en la novedad del Espíritu y no en el arcaísmo de la letra» (Rom. 7:6).
    - q: Pero, ¿lo hacen de manera perfecta?
      a: No. «Porque todos tropezamos de muchas maneras» (Stg. 3:2).
notes:
  "99": "pecados actuales —La frase original es «actual [actual] sins». No se refiere simplemente a los pecados que los seres humanos cometen en la actualidad (hoy en día), sino a todo pecado humano que no es potencial sino actual o puesto en acto, es decir, cometido, llevado a cabo. Véase la acepción 3 de «actual» en el Diccionario de la lengua castellana, 12. @@a@@ ed., (Madrid, España: Real Academia Española, 1884); «pecado actual» en las entradas correspondientes a «pecado» y «actual» en el Diccionario de la lengua española, 23. @@a@@ ed., versión 23.4 en línea (Madrid, España: Real Academia Española, 2014), disponible en: ˂https://dle.rae.es˃."
  "100": libre —no forzado.
  "101": una absolución {a favor} de Dios —La frase original es «a clearing of God». Denota un reconocimiento de que Dios no es culpable de pecado.
  "102": "[fui vuelto] —Esta es una traducción directa de la versión inglesa KJV usada por el autor, la cual vierte esta frase en voz pasiva. Corchetes añadidos. En esta traducción el verbo ֙יִב ּוׁש está en voz pasiva (fui vuelto o fui traído de regreso); sin embargo, en nuestras traducciones hispanas el verbo es traducido en voz activa (me aparté o me volví)."
