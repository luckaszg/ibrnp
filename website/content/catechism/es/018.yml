# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 18
question: ¿Cuál fue el pecado por el que nuestros primeros padres cayeron del estado en que fueron creados?
answer: El pecado por el que nuestros primeros padres cayeron del estado en que fueron creados fue comer del fruto prohibido.
sections:
  - - q: ¿Pecaron nuestros primeros padres?
      a: Sí. «Tu primer padre pecó» (Isa. 43:27).
    - q: ¿Pecaron al comer del fruto prohibido?
      a: Sí, porque ella «tomó del fruto y comió; y dio también a su marido que estaba con ella, y él comió» (Gén. 3:6).
    - q: ¿Hubo en este pecado la pasión de la carne?
      a: Sí, porque ella «vio que el árbol era bueno para comer» (Gén. 3:6).
    - q: ¿[Hubo en este pecado] la pasión de los ojos?
      a: Sí, porque ella «vio que era agradable a los ojos» (Gén. 3:6).
    - q: ¿Y [hubo en este pecado] la arrogancia de la vida?
      a: Sí, porque ella vio «que el árbol era deseable para alcanzar sabiduría» (Ibíd.).[^33]
    - q: ¿Fue esto un ejemplo de horrible rebelión contra Dios?
      a: Sí. «¿Has comido del árbol del cual te mandé que no comieras?» (Gén. 3:11).
    - q: ¿Y [fue esto un ejemplo] de asombrosa necedad en el hombre?
      a: Sí. «Este es el camino de los insensatos» (Sal. 49:13).
  - - q: ¿Cayeron nuestros primeros padres sin un tentador?
      a: "No, porque «la serpiente dijo a la mujer: ¿Conque Dios os ha dicho?» (Gén. 3:1)."
    - q: ¿Era esta serpiente el Diablo?
      a: Sí. «La serpiente antigua, que es el Diablo y Satanás» (Apo. 20:2).
    - q: Pero, ¿podía él forzar el consentimiento de ellos?
      a: No. «Resistid, pues, al diablo y huirá de vosotros» (Stg. 4:7).
    - q: No obstante, ¿prevaleció él?
      a: Sí. «La serpiente me engañó, y yo comí» (Gén. 3:13).
    - q: ¿Tuvo [Satanás] como objetivo en todo esto la destrucción de ellos?
      a: Sí, porque él es «Abadón», el destructor (Apo. 9:11).
  - - q: ¿Actuó Satanás de manera sutil en la tentación?
      a: Sí. «Pero temo que, así como la serpiente con su astucia engañó a Eva» (2 Cor. 11:3).
    - q: ¿Prometió [Satanás] impunidad?
      a: Sí. «Ciertamente no moriréis» (Gén. 3:4).
    - q: ¿Prometió [Satanás] una mejora?
      a: Sí. «Serán abiertos vuestros ojos» (Gén. 3:5).
    - q: ¿Los alimentó con pensamientos elevados acerca de sí mismos?
      a: Sí. «Seréis como Dios» (Ibíd.).
    - q: ¿Les sugirió pensamientos duros hacia Dios?
      a: "Sí, porque dijo: «Dios sabe esto» (versículo 5)."
    - q: ¿Fue un ejemplo de su estrategia atacar primero a la mujer?
      a: Sí, porque ella es «el vaso más frágil» (1 Pedro 3:7).
    - q: ¿Y [fue un ejemplo de su estrategia] atacarla cuando estaba sola?
      a: Sí, porque «más valen dos que uno solo, porque si uno de ellos cae, el otro levantará a su compañero» (Ecl. 4:9, 10).
notes:
  "33": Nótese la lista de manifestaciones del pecado en estas tres últimas preguntas (la pasión de la carne, la pasión de los ojos y la arrogancia de la vida), y véase 1 Juan 2:16.
