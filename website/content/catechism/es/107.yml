# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 107
question: ¿Qué nos enseña el prefacio de La oración del Señor?
answer: "El prefacio de, que es: «Padre nuestro que estás en los cielos», nos enseña a acercarnos a Dios con toda santa reverencia y confianza, como hijos de un Padre que puede ayudarnos y está dispuesto a hacerlo, y que deberíamos orar con otros y por otros."
sections:
  - - q: ¿Es Dios un Padre?
      a: Sí. «Oh SEÑOR, tú eres nuestro Padre» (Isa. 64:8).
    - q: ¿Es el Padre de todos los santos?
      a: Sí. «[Hay] un solo Dios y Padre de todos» (Efe. 4:6).
    - q: Entonces, ¿deberían abogar [los santos] por esta relación?
      a: "Sí. «¿No acabas de llamarme: “Padre mío”?» (Jer. 3:4)."
    - q: ¿Y [deberían] reconocer continuamente Su bondad y cuidado paternales?
      a: Sí. «A ti fui entregado desde mi nacimiento; desde el vientre de mi madre tú eres mi Dios» (Sal. 22:107.
    - q: ¿Pertenece este título particularmente a la primera Persona de la bendita Trinidad?
      a: Sí. «Yo rogaré al Padre» (Jua. 14:16).
    - q: Pero, ¿se limita {únicamente} a Él?
      a: No, porque Cristo es llamado «Padre Eterno» (Isa. 9:6).
  - - q: ¿Deberíamos aprovechar esto para acercarnos a Dios con reverencia?
      a: Sí. «Si invocáis [al] Padre […] conducíos en temor durante el tiempo de vuestra peregrinación» (1 Ped. 1:17).
    - q: ¿[Deberíamos aprovechar esto para acercarnos a Dios] con deleite?
      a: Sí. «Llegaré al altar de Dios […] mi supremo gozo» (Sal. 43:4).
    - q: ¿[Deberíamos aprovechar esto para acercarnos a Dios] con denuedo?
      a: Sí. «Porque tú eres nuestro Padre, aunque Abraham no nos conoce, ni nos reconoce Israel» (Isa. 63:16).
    - q: ¿[Deberíamos aprovechar esto para acercarnos a Dios] con frecuencia?
      a: Sí. «Tarde, mañana y mediodía oraré» (Sal. 55:17).
    - q: ¿Y es adecuado ese temperamento peculiarmente para la dispensación del evangelio?
      a: "Sí. «Pues no habéis recibido un espíritu de esclavitud para volver otra vez al temor, sino que habéis recibido un espíritu de adopción como hijos, por el cual clamamos: ¡Abba, Padre!» (Rom. 8:15)."
  - - q: ¿Es Dios nuestro Padre que está en los Cielos?
      a: Sí. «Oh SEÑOR, Dios de nuestros padres, ¿no eres tú Dios en los cielos?» (2 Cró. 20:6).
    - q: ¿Expresa esto la grandeza de Dios?
      a: Sí. «¿No está Dios en lo alto de los cielos? Mira también las más lejanas estrellas, ¡cuán altas están!» (Job 22:12).
    - q: ¿[Expresa esto] Su omnisciencia?
      a: Sí. «El trono del SEÑOR está en los cielos; sus ojos contemplan, sus párpados examinan a los hijos de los hombres» (Sal. 11:4).
    - q: ¿[Expresa esto] Su poder?
      a: Sí. «Nuestro Dios está en los cielos; Él hace lo que le place» (Sal. 115:3).
    - q: ¿[Expresa esto] Su santidad?
      a: "Sí. «Así dice [Aquel] cuyo nombre es Santo: Habito en lo alto y santo» (Isa. 57:15)."
    - q: ¿Y Su dominio absoluto?
      a: Sí. «El SEÑOR ha establecido su trono en los cielos» (Sal. 103:19).
    - q: ¿Hace distinción este título entre el gran Dios y los ídolos mudos?
      a: Sí, porque «el Altísimo no habita en casas hechas por manos de hombres» (Hch. 7:48).
    - q: ¿Y [entre el gran Dios y] los hombres frágiles?
      a: Sí, porque habitamos «en casas de barro, cuyos cimientos están en el polvo» (Job 4:19).
  - - q: ¿Es este un motivo para ser humildes en oración?
      a: Sí. «Porque Dios está en el cielo y tú en la tierra; por tanto sean pocas tus palabras» (Ecl. 5:2).
    - q: ¿[Es este un motivo] para tener confianza [en oración]?
      a: Sí. «Escucha tú desde los cielos y obra» (1 Rey. 8:32).
    - q: ¿Y para tener una mente conforme a lo celestial?
      a: Sí. «Alcemos nuestro corazón en nuestras manos hacia Dios en los cielos» (Lam. 3:41).
  - - q: ¿Debemos orar con otros?
      a: Sí. «Muchos estaban reunidos y oraban» (Hch. 12:12).
    - q: ¿[Debemos orar] por otros?
      a: Sí. Debemos «[suplicar] por todos los santos» (Efe. 6:18).
    - q: ¿Y serán aceptadas en los Cielos las oraciones levantadas en la Tierra?
      a: Sí. «Clamaré al Dios Altísimo […] Él enviará desde los cielos y me salvará» (Sal. 57:2, 3).
notes:
  "113": Aunque la referencia que aparece en el original es Ibíd. (es decir, Mat. 6:9), el autor también está citando el versículo 10.
  "114": "Margen —Esta palabra se encuentra en el texto del facsímil original. Indica que el autor ha incluido una lectura marginal provista por la versión King James que estaba usando. El texto de dicha versión inglesa dice: «according to Christ Jesus» (conforme a Cristo Jesús), pero una nota marginal dice: «Or, after the example of» (o conforme al ejemplo de)."
