# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 97
question: ¿Qué es el bautismo?
answer: El bautismo es una ordenanza del Nuevo Testamento que fue instituida por Jesucristo, a fin de que sea para el bautizado una señal de su comunión con Él en Su muerte, sepultura y resurrección, {una señal} de estar injertado en Él, del perdón de pecados, y de darse a sí mismo a Dios por medio de Jesucristo para vivir y andar en novedad de vida.
sections:
  - - q: ¿Habla la Escritura de un bautismo con el Espíritu Santo?
      a: Sí. «Él os bautizará con el Espíritu Santo» (Mat. 3:11).
    - q: ¿Y fue llevado a cabo?
      a: Sí. «Fueron llenos del Espíritu Santo» (Hch. 2:4).
    - q: ¿Habla también de un bautismo con sufrimientos?
      a: Sí. «¿Podéis […] ser bautizados con el bautismo con el que yo soy bautizado?» (Mat. 20:22 [RVR60]).
    - q: ¿Y fue bautizado Cristo con este bautismo eminentemente?
      a: Sí. «He llegado a lo profundo de las aguas, y la corriente me anega» (Sal. 69:2).
    - q: Pero, ¿hay además de estos un bautismo con agua?
      a: Sí. «Yo […] os bautizo con agua» (Mat. 3:11).
  - - q: ¿Bautizaban los judíos antes de Juan?
      a: "No, porque le preguntaron: «¿por qué bautizas, si tú no eres el Cristo, ni Elías, ni el profeta?» (Jua. 1:25)."
    - q: ¿Introdujo el bautismo de Juan {el Bautista} la dispensación del evangelio?
      a: Sí. «Principio del evangelio de Jesucristo […] Bautizaba Juan» (Mar. 1:1, 4 [RVR60]).
    - q: ¿Hacía referencia a un Salvador que vendría pronto?
      a: Sí. «Diciendo al pueblo que creyeran en aquel que vendría después de él, es decir, en Jesús» (Hch. 19:4).
    - q: ¿Envió Dios a Juan {el Bautista} a bautizar?
      a: Sí. «El que me envió a bautizar con agua […] me dijo…» (Jua. 1:33 [RVR60]).
    - q: ¿Recibió el pueblo el bautismo de Juan {el Bautista} como de parte de Dios?
      a: Sí. Ellos «reconocieron la justicia de Dios, siendo bautizados con el bautismo de Juan» (Luc. 7:29).
    - q: ¿Y fue el bautismo de Juan igual en sustancia que el de Cristo?
      a: Sí, porque «Jesús […] bautizaba [y] Juan también bautizaba» (Jua. 3:22, 23).
  - - q: ¿Fue bautizado Cristo mismo?
      a: Sí. «Entonces Jesús llegó […] a donde estaba Juan, para ser bautizado por él» (Mat. 3:13).
    - q: ¿Le concedió de ese modo un honor a esta ordenanza?
      a: "Sí, porque «se oyó una voz de los cielos que decía: Este es mi Hijo amado en quien me he complacido» (Mat. 3:17)."
    - q: ¿Y nos compromete esto poderosamente a someternos a {la ordenanza de} el bautismo?
      a: Sí. «Porque es conveniente que cumplamos así toda justicia» (Mat. 3:15).
  - - q: ¿Es el bautismo en agua una señal de nuestra comunión con Cristo?
      a: Sí. «Porque todos los que fuisteis bautizados en Cristo, de Cristo os habéis revestido» (Gál. 3:27).
    - q: ¿Es una señal de nuestra comunión con Él en Su muerte?
      a: Sí. «Hemos sido bautizados en su muerte» (Rom. 6:3).
    - q: ¿[Es una señal de nuestra comunión con Él] en Su sepultura?
      a: Sí. «Hemos sido sepultados con Él por medio del bautismo» (v. 4).
    - q: ¿Y en Su resurrección?
      a: Sí. «Porque […] hemos sido unidos a Él […] en la semejanza de Su resurrección» (v. 5).
    - q: ¿Es esta comunión por medio de la fe?
      a: Sí. «Habéis resucitado con Él por la fe en la acción del poder de Dios» (Col. 2:12).
  - - q: ¿Es el bautismo una señal de que hemos sido injertados en Cristo?
      a: Sí. «Hemos sido bautizados en Cristo Jesús» (Rom. 6:3).
    - q: ¿[Es una señal] de la crucifixión del viejo hombre?
      a: Sí. «Sabiendo esto, que nuestro viejo hombre fue crucificado con Él» (v. 6).
    - q: ¿[Es una señal] de la destrucción del pecado?
      a: Sí. «Para que nuestro cuerpo de pecado fuera destruido» (Ibíd.).
    - q: ¿Significa la absolución de la culpa por el pecado?
      a: Sí. «Sed bautizados cada uno de vosotros en el nombre de Jesucristo para perdón de vuestros pecados» (Hch. 2:38).
    - q: ¿Y [significa] el lavamiento de las inmundicias del pecado?
      a: Sí. «Bautízate, y lava tus pecados» (Hch. 22:16).
    - q: Pero, ¿es suficiente el bautismo en sí mismo para alguno de estos propósitos?
      a: No, porque es la sangre de Cristo la que nos limpia de todo pecado (1 Jua. 1:7).
  - - q: ¿Es el bautismo un compromiso de darnos a nosotros mismos a Dios?
      a: Sí. «Presentaos vosotros mismos a Dios como vivos de entre los muertos» (Rom. 6:13).
    - q: ¿[Es un compromiso] de vivir en amor fraternal?
      a: Sí. «Pues […] fuimos bautizados en un solo cuerpo» (1 Cor. 12:13).
    - q: ¿[Es un compromiso] de andar en novedad de vida?
      a: Sí. «También nosotros andemos en novedad de vida» (Rom. 6:4).
    - q: ¿Y fue diseñado para que fuera una ordenanza permanente en la iglesia de Cristo?
      a: Sí. «Hasta el fin del mundo» (Mat. 28:20).
