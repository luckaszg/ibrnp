# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 37
question: ¿Qué es la adopción?
answer: La adopción es un acto de la gracia libre y gratuita de Dios, mediante el cual somos recibidos en el número de los hijos de Dios y tenemos derecho a todos sus privilegios.
sections:
  - - q: ¿Algunos son hijos de Dios por creación?
      a: Sí. «Todos los hijos de Dios gritaban de gozo» (Job 38:7).
    - q: ¿Y otros [son hijos de Dios] por una profesión externa?
      a: Sí. «Deja ir a mi hijo para que me sirva» (Éxo. 4:23).
    - q: Pero, ¿los santos son [hijos de Dios] por adopción?
      a: Sí. Recibimos «la adopción de hijos» (Gál. 4:5).
    - q: ¿Es Cristo el Agente mediador de nuestra adopción?
      a: Sí. Hemos sido predestinados «para adopción como hijos [...] mediante Jesucristo» (Efe. 1:5).
    - q: ¿[Es Cristo] el ejemplo [o modelo] de la adopción?
      a: Sí. Dios nos predestinó «para ser hechos conforme a la imagen de su Hijo» (Rom. 8:29).
    - q: ¿[Es Cristo] el fin que persigue la adopción?
      a: Sí. «Para que Él sea el primogénito entre muchos hermanos» (Rom. 8:29).
    - q: ¿Y es la gracia el motivo de la adopción?
      a: Sí, es «conforme al beneplácito de su voluntad, para alabanza de la gloria de su gracia» (Efe. 1:5, 6).
  - - q: ¿Reciben los santos la naturaleza de hijos?
      a: Sí. Ellos «[llegan] a ser partícipes de la naturaleza divina» (2 Pedro 1:4).
    - q: ¿[Reciben los santos] el espíritu de hijos?
      a: Sí. «Y porque sois hijos, Dios ha enviado el Espíritu de su Hijo a nuestros corazones» (Gál. 4:6).
    - q: ¿[Reciben los santos] la provisión de hijos?
      a: Sí. «No carecerán de bien alguno» (Sal. 34:10).
    - q: ¿Y [reciben los santos] la herencia de hijos?
      a: Sí. «Por tanto, ya no eres siervo, sino hijo; y si hijo, también heredero por medio de Dios» (Gál. 4:7).
  - - q: ¿Son los hijos de Dios objeto de Su compasión?
      a: Sí. «Como un padre se compadece de sus hijos, así se compadece el SEÑOR de los que le temen» (Sal. 103:13).
    - q: ¿[Son los hijos de Dios objeto] de Su cuidado?
      a: Sí. «Hijos crié y los hice crecer» (Isa. 1:2).
    - q: ¿Son defendidos fuertemente los hijos de Dios?
      a: Sí. «Sus hijos tendrán refugio» (Pro. 14:26).
    - q: ¿[Son] asistidos con honor [los hijos de Dios]?
      a: Sí. «Pues Él dará órdenes a sus ángeles acerca de ti, para que te guarden en todos tus caminos» (Sal. 91:11). Y, si [los hijos de Dios] reciben disciplina,
    - q: ¿es en amor?
      a: Sí. «PORQUE EL SEÑOR AL QUE AMA,DISCIPLINA, Y AZOTA A TODO EL QUE RECIBE POR HIJO» (Heb. 12:6).
  - - q: Entonces, ¿deberían los hijos de Dios acudir a Él como [se acude a] un Padre?
      a: Sí. «Me levantaré e iré a mi padre» (Luc. 15:18).
    - q: ¿[Deberían los hijos de Dios] reverenciar a Dios como a un Padre?
      a: Sí. «Si yo soy padre, ¿dónde está mi honor?» (Mal. 1:6).
    - q: ¿[Deberían los hijos de Dios] imitar a Dios?
      a: Sí. «Sed vosotros perfectos como vuestro Padre celestial es perfecto» (Mat. 5:48).
    - q: ¿[Deberían los hijos de Dios] obedecer a Dios?
      a: Sí. «Como hijos obedientes» (1 Pedro 1:14).
    - q: ¿Y [deberían los hijos de Dios] someterse a Su disciplina?
      a: Sí. «HIJO MÍO, NO TENGAS EN POCO LA DISCIPLINA DEL SEÑOR» (Heb. 12:5).
  - - q: ¿Tienen todos los santos un mismo Padre?
      a: Sí. «¿No tenemos todos un mismo padre?» (Mal. 2:10).
    - q: Por tanto, ¿deberían amarse como hermanos?
      a: Sí. «Añadid a la piedad, fraternidad» (2 Pedro 1:7).
    - q: ¿Y es el descuido de esto un gran pecado?
      a: Sí. «¿Por qué, pues, nos portamos deslealmente el uno contra el otro?» (Mal. 2:10).
