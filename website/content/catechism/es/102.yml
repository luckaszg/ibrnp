# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 102
question: ¿Qué es la Cena del Señor?
answer: La Cena del Señor es una ordenanza del Nuevo Testamento que fue instituida por Jesucristo, en la cual, cuando se da y se recibe el pan y el vino conforme a Su designio, Su muerte es proclamada; y quienes la reciben dignamente —no de manera corporal y carnal, sino por fe—son hechos partícipes de Su cuerpo y Su sangre, con todos los beneficios de Él, para su alimentación espiritual y crecimiento en la gracia.
sections:
  - - q: ¿Es la Cena del Señor un designio divino?
      a: Sí. Fue recibida de parte del Señor (1 Cor. 11:23).
    - q: ¿Instituyó Cristo {la Cena} poco antes de Su muerte?
      a: Sí. «La noche en que fue entregado» (1 Cor. 11:23).
    - q: ¿Y añade esto fuerza a la orden?
      a: Sí. «Tu padre mandó antes de morir» (Gén. 50:16).
    - q: ¿Están invitados {a participar} todos los verdaderos cristianos?
      a: Sí. «“Venid, porque ya todo está preparado”» (Luc. 14:17).
    - q: ¿Y serán bienvenidos si vienen?
      a: Sí. «Comed, amigos; bebed y embriagaos, oh amados» (Cnt. 5:1).
  - - q: ¿Se debe utilizar pan en esta ordenanza?
      a: Sí, porque «tomó pan» (Mat. 26:26).
    - q: ¿Y vino?
      a: Sí. «Tomó también la copa después de haber cenado» (1 Cor. 11:25).
    - q: ¿Tienen como significado el pan y el vino todas las necesidades de la vida?
      a: Sí. «Come tu pan con gozo, y bebe tu vino con corazón alegre» (Ecl. 9:7).
    - q: ¿Y representan aquí adecuadamente a Cristo?
      a: Sí. «Porque agradó al Padre que en Él habitara toda la plenitud» (Col. 1:19).
  - - q: ¿Deben ser bendecidos los elementos?
      a: Sí. «La copa de bendición que bendecimos» (1 Cor. 10:16).
    - q: Cuando son bendecidos, ¿[deben] ser dados y recibidos?
      a: Sí. Jesús tomó pan y se lo dio a ellos, también tomó la copa y se la dio a ellos (Mar. 14:22, 23).
    - q: ¿Y pueden participar todos {los cristianos} tanto del segundo como del primer {elemento}?
      a: Sí. «Bebed todos de ella» (Mat. 26:27).
  - - q: ¿El pan significa el cuerpo de Cristo?
      a: Sí. «Esto es mi cuerpo» (1 Cor. 11:24).
    - q: ¿El vino significa la sangre de Cristo?
      a: Sí. «Esta copa es el nuevo pacto en mi sangre» (Luc. 22:20).
    - q: Entonces, ¿es la doctrina del Cristo crucificado comida y bebida para un alma creyente?
      a: Sí. «Porque mi carne es verdadera comida, y mi sangre es verdadera bebida» (Jua. 6:55).
    - q: ¿Y debemos alimentarnos de esa doctrina?
      a: Sí. «El que me come, él también vivirá por mí» (Jua. 6:57).
  - - q: ¿Es conmemorativa esta ordenanza?
      a: Sí. «Haced esto en memoria de mí» (1 Cor. 11:24).
    - q: ¿Muestra la muerte de Cristo?
      a: Sí. «Todas las veces que comáis este pan y bebáis esta copa, la muerte del Señor proclamáis (1 Cor. 11:26). ¿Muestra el dolor de Su muerte? Sí. «Esto es mi cuerpo que por vosotros es partido» (1 Cor. 11:24 [RVR60]). ¿Y [muestra] el propósito de Su muerte? Sí. «Esto es mi sangre del nuevo pacto, que es derramada por muchos para el perdón de los pecados» (Mat. 26:28). Por tanto, ¿deberíamos tener cuidado de cómo atendemos a esta? Sí. No sea que de nuevo crucifiquemos para nosotros mismos al Hijo de Dios (Heb. 6:6).
  - - q: ¿Es esta ordenanza un testimonio público de nuestra comunión con Cristo?
      a: Sí. «La copa de bendición que bendecimos, ¿no es la participación en la sangre de Cristo?» (1 Cor. 10:16).
    - q: ¿[Es un testimonio] de nuestro amor por los santos y de la comunión con ellos?
      a: Sí. «Todos participamos de aquel mismo pan» (1 Cor. 10:17).
    - q: ¿Está diseñada para promover el gozo y la gratitud espirituales?
      a: Sí. «Para el placer se prepara la comida» (Ecl. 10:19).
    - q: ¿Y como prueba {o prenda} de mejores provisiones {que vendrán} de lo alto?
      a: Sí. «Desde ahora no beberé más de este fruto de la vid, hasta aquel día cuando lo beba nuevo con vosotros en el reino de mi Padre» (Mat. 26:29).
    - q: Por tanto, ¿debe mantenerse como una ordenanza permanente en la iglesia de Cristo?
      a: Sí. «Hasta que Él venga» (1 Cor. 11:26).
