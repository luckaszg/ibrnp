# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 8
question: ¿Hay más de un solo Dios?
answer: No hay más que uno solo, el Dios vivo y verdadero.
sections:
  - - q: ¿Es Dios el Dios viviente?
      a: Sí. «Él es el Dios viviente» (Dan. 6:26).
    - q: ¿Tiene Él vida en Sí mismo?
      a: Sí. «El Padre tiene vida en sí mismo» (Jua. 5:26).
    - q: ¿Da Él vida a los demás?
      a: Sí. «Él da vida a todas las cosas» (1 Tim. 6:13).
    - q: Por esta razón, ¿deberían los hombres vivos buscar al Dios vivo?
      a: Sí. «¿No debe un pueblo consultar a su Dios? ¿Acaso consultará a los muertos por los vivos?» (Isa. 8:19).
  - - q: ¿Es Dios el verdadero Dios?
      a: Sí. «Este es el verdadero Dios» (1 Jua. 5:20).
    - q: ¿Es Él el único Dios verdadero?
      a: "Sí. «Y esta es la vida eterna: que te conozcan a ti, el único Dios verdadero» (Jua. 17:3)."
    - q: ¿Y son dioses falsos todos los demás dioses?
      a: Sí. «Vanidad son, obra ridícula» (Jer. 10:15).
    - q: ¿Es este Dios al que servimos el único Dios vivo y verdadero?
      a: Sí. «El SEÑOR es el Dios verdadero; Él es el Dios vivo y el Rey eterno» (Jer. 10:10).
    - q: ¿Es Él solo uno?
      a: Sí. «Escucha, Oh Israel, el SEÑOR es nuestro Dios, el SEÑOR uno es» (Deu. 6:4).
    - q: ¿Asume Dios esta prerrogativa para Sí mismo?
      a: Sí. «¿Hay otro dios fuera de mí, o hay otra Roca? No conozco ninguna» (Isa. 44:8).
    - q: ¿Y Su pueblo siempre se lo ha atribuido?
      a: Sí. «Para nosotros hay un solo Dios» (1 Cor. 8:6).
    - q: Pero, ¿no destruyen la unidad de la Divinidad aquellos que afirman la deidad de Cristo?
      a: "No, porque Él dice: «Yo y el Padre somos uno» (Jua. 10:30)."
  - - q: ¿Son muchos a los que se les llama dioses?
      a: Sí. «Hay muchos dioses y muchos señores» (1 Cor. 8:5).
    - q: Pero, ¿son dioses por naturaleza?
      a: No. «Cuando no conocíais a Dios, erais siervos de aquellos que por naturaleza no son dioses» (Gál. 4:8).
    - q: Entonces, ¿se les debe dar esa reputación?
      a: No. «Sabemos que un ídolo no es nada en el mundo» (1 Cor. 8:4).
    - q: ¿Son aquellos que los adoran culpables del mayor grado de absurdidad?
      a: Sí. «Se volverán como ellos, los que los hacen, y todos los que en ellos confían» (Sal. 115:8).
    - q: Por tanto, ¿hacemos bien al no imitarlos?
      a: Sí. «Hijos, guardaos de los ídolos» (1 Jua. 5:21).
