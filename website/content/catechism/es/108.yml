# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 108
question: ¿Qué oramos en la primera petición?
answer: "En la primera petición, que es: «santificado sea tu nombre», oramos que Dios nos capacite —a nosotros y a otros—para que lo glorifiquemos en todo aquello por medio de lo cual Él se da a conocer, y que disponga todas las cosas para Su propia gloria."
sections:
  - - q: ¿Debería ser recordado el nombre de Dios?
      a: Sí. «Por la noche me acuerdo de tu nombre» (Sal. 119:55).
    - q: ¿[Debería] ser amado?
      a: Sí. «Regocíjense en ti los que aman tu nombre» (Sal. 5:11).
    - q: ¿[Debería] ser temido?
      a: Sí. «Unifica mi corazón para que tema tu nombre» (Sal. 86:11).
    - q: ¿[Debería] ser adorado?
      a: Sí. «Bendeciré tu nombre eternamente y para siempre» (Sal. 145:1).
    - q: ¿Y es el nombre de Dios digno de todo esto?
      a: Sí, porque «santo y digno de reverencia es su nombre»[^115] (Sal. 111:9).
  - - q: ¿Deberíamos glorificar a Dios con nuestras palabras?
      a: Sí. «El que habla, que hable conforme a las palabras de Dios […] para que en todo Dios sea glorificado» (1 Ped. 4:11).
    - q: ¿Y en nuestras acciones?
      a: Sí. «Llenos del fruto de justicia que es por medio de Jesucristo, para la gloria [de Dios]» (Flp. 1:11).
    - q: ¿Deberíamos [glorificar a Dios] en las acciones más comunes de la vida?
      a: Sí. «Ya sea que comáis, que bebáis, o que hagáis cualquier otra cosa, hacedlo todo para la gloria de Dios» (1 Cor. 10:31).
    - q: ¿[Deberíamos glorificar a Dios] en todo momento y en todas las circunstancias?
      a: Sí. «Cristo será exaltado en mi cuerpo, ya sea por vida o por muerte» (Flp. 1:20).
    - q: ¿Y debería ser nuestra constante oración y deseo que podamos glorificar a Dios así?
      a: Sí. «Abre mis labios, oh Señor, para que mi boca anuncie tu alabanza» (Sal. 51:15).
  - - q: ¿Deberíamos orar para que otros glorifiquen a Dios?
      a: Sí. «Den gloria al SEÑOR» (Isa. 42:12).
    - q: ¿Y [deberíamos] utilizar nuestros mayores esfuerzos para animarlos a glorificar a Dios?
      a: Sí. «Así brille vuestra luz delante de los hombres, para que vean vuestras buenas acciones y glorifiquen a vuestro Padre que está en los cielos» (Mat. 5:16).
    - q: ¿Deberíamos orar particularmente para que los enemigos de Dios glorifiquen Su nombre?
      a: Sí. «Cubre sus rostros de ignominia, para que busquen tu nombre, oh SEÑOR» (Sal. 83:16).
    - q: ¿Y [deberíamos] entristecernos cuando lo deshonran y lo injurian?
      a: Sí. «Los vituperios de los que te injurian han caído sobre mí» (Sal. 69:9).
  - - q: ¿Deberíamos orar para que Dios se glorifique a Sí mismo?
      a: Sí. «Padre, glorifica tu nombre» (Jua. 12:28).
    - q: ¿Y [para que se glorifique a Sí mismo] por medio de todas las cosas {lit. eventos}?
      a: Sí. «Pues el furor del hombre te alabará» (Sal. 76:10).
    - q: ¿Es seguro que Él se glorificará a Sí mismo?
      a: Sí. «Le he glorificado y de nuevo le glorificaré» (Jua. 12:28).
    - q: ¿Es Su propia gloria el fin que Dios tiene en todo lo que hace?
      a: Sí. «“No es por vosotros, casa de Israel, que voy a actuar, sino por mi santo nombre”» (Eze. 36:22).
    - q: Por tanto, ¿debería ser {la gloria de Dios} nuestro fin en todo lo que pedimos?
      a: Sí. «Ayúdanos oh Dios de nuestra salvación, por la gloria de tu nombre» (Sal. 79:9).
notes:
  "115": Lectura al margen de LBLA.
