# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 31
question: ¿En qué consiste la exaltación de Cristo?
answer: La exaltación de Cristo consiste en haber resucitado de entre los muertos al tercer día, haber ascendido al Cielo, estar sentado a la diestra de Dios el Padre, y venir a juzgar el mundo el Día final.
sections:
  - - q: ¿Fue la resurrección de Cristo el primer paso para Su exaltación?
      a: Sí. «Que fue sepultado y que resucitó» (1 Cor. 15:4).
    - q: ¿Se predijo que Cristo resucitaría?
      a: Sí. «No permitirás a tu Santo ver corrupción» (Sal. 16:10).
    - q: ¿Era necesario que Él resucitara?
      a: Sí. Dios «[puso] fin a la agonía de la muerte, puesto que no era posible que [Él] quedara bajo el dominio de ella» (Hch. 2:24).
    - q: ¿Es seguro que Él resucitó?
      a: Sí. «Se presentó vivo con muchas pruebas convincentes» (Hch. 1:3).
    - q: ¿Tenemos el testimonio de los apóstoles de Cristo acerca de esto?
      a: Sí. «De lo cual nosotros somos testigos» (Hch. 3:15).
    - q: ¿[Tenemos el testimonio] de Sus enemigos [acerca de esto]?
      a: Sí. «Algunos de la guardia [...] informaron a los principales sacerdotes de todo lo que había sucedido» (Mat. 28:11).
    - q: ¿[Tenemos el testimonio] de los ángeles [acerca de esto]?
      a: Sí. «No está aquí, porque ha resucitado» (Mat. 28:6).
    - q: ¿Y [tenemos] Su propio [testimonio acerca de esto]?
      a: Sí. «Yo soy [...] el que vive, y estuve muerto; y he aquí, estoy vivo por los siglos de los siglos» (Apo. 1:18).
    - q: ¿Fue visto Él después de Su resurrección?
      a: Sí. Cristo «se apareció a Cefas y después a los doce, luego se apareció a más de quinientos hermanos a la vez» (1 Cor. 15:5, 6).[^51]
    - q: Entonces, ¿puede ser creída [la resurrección de Cristo] como una cuestión de hecho?
      a: Sí. «[T]ODAPALABRA SEA CONFIRMADA POR BOCA DE DOS O TRES TESTIGOS» (Mat. 18:16).
  - - q: ¿Resucitó Cristo por Su propio poder?
      a: Sí. «Destruid este templo, y en tres días lo levantaré» (Jua. 2:19).
    - q: ¿[Resucitó Cristo] en el momento preciso?
      a: Sí. «Dios le resucitó al tercer día» (Hch. 10:40).
    - q: ¿[Resucitó Cristo] con gran majestad?
      a: Sí. «He aquí un ángel del Señor descendiendo del cielo, y acercándose, removió la piedra y se sentó sobre ella» (Mat. 28:2, 3).
    - q: ¿Resucitó Él con el mismo cuerpo en que fue crucificado?
      a: Sí. «Mirad mis manos y mis pies, que soy yo mismo» (Luc. 24:39).
    - q: ¿Resucitó Él como una persona pública?
      a: Sí, [resucitó] como las «primicias de los que durmieron» (1 Cor. 15:20).
    - q: ¿Y resucitó Él para no morir nunca más?
      a: Sí. «Ya la muerte no tiene dominio sobre Él» (Rom. 6:9).
  - - q: ¿Permaneció Cristo algún tiempo en la Tierra después de Su resurrección?
      a: Sí. Él «[se les apareció] durante cuarenta días» (Hch. 1:3).
    - q: ¿Aprovechó Él este tiempo para instruir a Sus discípulos?
      a: Sí. Él dio «instrucciones a los apóstoles que había escogido» (Hch. 1:2).
    - q: ¿Fue recibido arriba en el Cielo después de esto?
      a: Sí. Él «ascendió mucho más arriba de todos los cielos» (Efe. 4:10).
    - q: ¿Ascendió Él por el bien de la Iglesia?
      a: Sí. «Para poder llenarlo todo» (Ibíd.).
    - q: ¿Y [ascendió] para Su propia gloria?
      a: Sí. «¿No era necesario que el Cristo padeciera todas estas cosas y entrara en Su gloria?» (Luc. 24:26).
  - - q: ¿Ascendió Cristo en público?
      a: Sí. «Fue elevado mientras ellos miraban» (Hch. 1:9).
    - q: ¿[Ascendió Cristo] en una nube?
      a: Sí. «Una nube le recibió y le ocultó de sus ojos» (Hch. 1:9).
    - q: ¿Ascendió [Cristo] con gran esplendor?
      a: Sí. Él fue asistido por «los carros de Dios [que] son miríadas, millares y millares» (Sal. 68:17).
    - q: ¿Partió Él con una bendición en Sus labios?
      a: Sí. «Y aconteció que mientras los bendecía, se separó de ellos» (Luc. 24:51).
    - q: ¿Y fue recibido Él con una bienvenida donde fue?
      a: Sí. Él «se dirigió al Anciano de Días y fue presentado ante Él» (Dan. 7:13).
  - - q: ¿Está Cristo sentado a la diestra de Dios?
      a: Sí. Él «[está sentado] a la diestra del trono de la Majestad en los cielos» (Heb. 8:1).
    - q: ¿Y tiene Él derecho a sentarse allí?
      a: "Sí. Porque el SEÑOR le dijo: «Siéntate a mi diestra» (Sal. 110:1)."
    - q: ¿Denota la finalización de Su obra el hecho de que Cristo esté sentado a la diestra de Dios?
      a: Sí. «Él, habiendo ofrecido un solo sacrificio por los pecados para siempre, SE SENTÓ ALA DIESTRA DE DIOS» (Heb. 10:12).
    - q: ¿Implica esto dignidad y honor?
      a: "Sí. «¿A cuál de los ángeles ha dicho jamás: SIÉNTATE A MIDIESTRA?» (Heb. 1:13)."
    - q: ¿[Implica esto] autoridad y poder?
      a: Sí. Él se sentó «A LA DIESTRA DEL PODER» (Mat. 26:64).
    - q: ¿[Implica esto] seguridad y protección?
      a: Sí. «Tu diestra me salvará» (Sal. 138:7).
    - q: ¿[Implica esto] alegría y satisfacción?
      a: Sí, porque en la diestra de Dios hay deleites para siempre (Sal. 16:11).
    - q: ¿Implica esto también la continuación [o el mantenimiento] de este estado?
      a: Sí, porque Él «reinará sobre la casa de Jacob para siempre» (Luc. 1:33).
    - q: ¿Debería ser esto un motivo para tener nuestro corazón en el Cielo?
      a: Sí. «Buscad las cosas de arriba, donde está Cristo sentado a la diestra de Dios» (Col. 3:1).
  - - q: ¿Vendrá Cristo otra vez?
      a: Sí. «Este mismo Jesús, que ha sido tomado de vosotros al cielo, vendrá de la misma manera» (Hch. 1:11).
    - q: ¿Vendrá pronto?
      a: Sí. «PORQUE DENTRO DE MUY POCOTIEMPO, EL QUE HA DE VENIR VENDRÁ Y NO TARDARÁ» (Heb. 10:37).
    - q: ¿Vendrá de repente?
      a: Sí, porque «el día del Señor vendrá así como un ladrón en la noche» (1 Tes. 5:2).
    - q: ¿Vendrá de manera pública?
      a: Sí. «Todo ojo le verá» (Apo. 1:7).
    - q: ¿Será gloriosa y magnífica Su Venida?
      a: Sí. Es «la manifestación de la gloria de nuestro gran Dios y Salvador Cristo Jesús» (Tit. 2:13).
    - q: Entonces, ¿deberían los santos anhelar y desear Su Venida?
      a: Sí. «Esperando y apresurando la venida del día de Dios» (2 Pedro 3:12).
  - - q: ¿Vendrá Cristo como Juez?
      a: Sí. Él «ha de juzgar a los vivos y a los muertos en su manifestación» (2 Tim. 4:1).
    - q: ¿Es Cristo un Juez capaz e inteligente?
      a: Sí. Él «no juzgará por lo que vean sus ojos» (Isa. 11:3).
    - q: ¿Es Cristo un Juez justo e imparcial?
      a: Sí. Él «[ha amado] la justicia y aborrecido la iniquidad» (Sal. 45:7).
    - q: ¿Será Cristo un Juez terrible para los malvados?
      a: Sí. Él vendrá «en llama de fuego, dando retribución a los que no conocen a Dios» (2 Tes. 1:8).
    - q: ¿Será Cristo un Juez perentorio e inflexible?
      a: Sí. Él «[no cambiará] la palabra [que sale] de [Sus] labios» (Sal. 89:34).
    - q: ¿Se conoce el tiempo del Juicio?
      a: No. «Pero de aquel día o de aquella hora nadie sabe» (Mar. 13:32).
    - q: Pero, ¿ha sido fijado y determinado [el Juicio]?
      a: Sí. «Porque Él ha establecido un día en el cual juzgará al mundo en justicia por medio de un Hombre a quien ha designado» (Hch. 17:31).
    - q: ¿Será ese un día de regocijo para los santos?
      a: Sí, porque Cristo «[será] glorificado en Sus santos y [...] admirado entre todos los que han creído» (2 Tes. 1:10).
notes:
  "51": Aunque la referencia que aparece en el original es 1 Corintios 15:5, el autor también está citando el versículo 6.
