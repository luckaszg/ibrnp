# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 109
question: ¿Qué oramos en la segunda petición?
answer: "En la segunda petición, que es: «Venga tu reino», oramos que el reino de Satanás sea destruido y que el Reino de la Gracia avance, que nosotros y otros seamos introducidos y guardados en este último, y que el Reino de la Gloria venga pronto."
sections:
  - - q: ¿Tiene Dios un Reino peculiar en este mundo?
      a: "Sí. «Porque […] el reino de Dios entre {también: dentro de} vosotros está» (Luc. 17:21)."
    - q: ¿Es este un Reino espiritual?
      a: Sí. «Porque el reino de Dios no es comida ni bebida, sino justicia y paz y gozo en el Espíritu Santo» (Rom. 14:17).
    - q: ¿Y [es] un Reino poderoso?
      a: Sí. «Porque el reino de Dios no consiste en palabras, sino en poder» (1 Cor. 4:20).
    - q: ¿Es Cristo el administrador de este Reino?
      a: Sí. «Porque para esto Cristo murió y resucitó, para ser Señor tanto de los muertos como de los vivos» (Rom. 14:9).
    - q: ¿Son los santos Sus súbditos?
      a: Sí. Han sido trasladados «al reino de su Hijo amado» (Col. 1:13).
    - q: ¿Y es la Palabra escrita Su ley?
      a: Sí. «Porque de Sión saldrá la ley, y de Jerusalén la palabra del SEÑOR» (Isa. 2:3).
  - - q: ¿Ha establecido Satanás un reino en oposición al de Cristo?
      a: Sí. «Él es el príncipe de este mundo» (Jua. 16:11).
    - q: ¿Y gobierna Satanás en este reino?
      a: Sí. «Ahora opera en los hijos de desobediencia» (Efe. 2:2).
    - q: ¿Hace todo lo que puede para obstaculizar el progreso del Reino de Cristo?
      a: Sí. «Ya que queríamos ir a vosotros […] pero Satanás nos lo ha impedido» (1 Tes. 2:18).
    - q: Pero, ¿es limitado su poder?
      a: Sí. «He aquí, él está en tu mano; pero guarda su vida» (Job 2:6).
    - q: ¿Deberíamos orar para que sea cada vez más restringido?
      a: Sí. «El SEÑOR te reprenda, Satanás» (Zac. 3:2).
    - q: ¿Y tenemos motivos para esperar que nuestra oración sea respondida?
      a: Sí. «El Dios de paz aplastará pronto a Satanás debajo de vuestros pies» (Rom. 16:20).
  - - q: ¿Recibe el anticristo su poder de Satanás?
      a: Sí. «Y el dragón dio [a la bestia] su poder, su trono y gran autoridad» (Apo. 13:2).
    - q: ¿Imita {el anticristo a Satanás} en malicia, astucia y crueldad?
      a: Sí. «{La} venida {del anticristo} es conforme a la actividad de Satanás» (2 Tes. 2:9).
    - q: ¿Y se une [el anticristo] a Satanás en su oposición al Reino de Cristo?
      a: Sí. «Se opone y se exalta sobre todo lo que se llama dios» (2 Tes. 2:4).
    - q: Por tanto, ¿deberíamos orar por su abatimiento {lit. caída}?
      a: Sí. «¿Hasta cuándo, oh Señor […] esperarás para juzgar y vengar nuestra sangre de los que moran en la tierra?» (Apo. 6:10).
    - q: ¿Y será respondida nuestra oración?
      a: Sí. «¡Cayó, cayó la gran Babilonia!» (Apo. 18:2).
  - - q: ¿Deberíamos orar por los pecadores?
      a: Sí. «Lejos esté de mí que peque contra el SEÑOR cesando de orar por vosotros» (1 Sam. 12:23).
    - q: ¿Deberíamos orar para que los principios malvados sean destruidos?
      a: Sí. «Envía tu luz y tu verdad» (Sal. 43:3).
    - q: ¿[Deberíamos orar para que] las prácticas malvadas sean restringidas?
      a: Sí. «{Qué se} acabe la maldad de los impíos» (Sal. 7:9).
    - q: ¿[Deberíamos orar para] que los inicuos {lit. los malvados} sean convertidos y cambiados {i. e., transformados}?
      a: Sí. «Quisiera Dios que […] todos los que hoy me oyen […] llegaran a ser tal como yo soy» (Hch. 26:29).
    - q: ¿Y no deberíamos orar solamente por los demás, sino también por nosotros mismos?
      a: Sí. «Hazme volver para que sea restaurado» (Jer. 31:18).
  - - q: ¿Deberíamos orar por la iglesia?
      a: Sí. «Haz bien con tu benevolencia a Sión» (Sal. 51:18).
    - q: ¿Deberíamos orar para que la iglesia sea establecida?
      a: Sí, para que «el monte de la casa del SEÑOR [sea] establecido como cabeza de los montes» (Isa. 2:2).
    - q: ¿[Deberíamos orar para que la iglesia sea] unificada?
      a: Sí. «Haya paz dentro de tus muros» (Sal. 122:7).
    - q: ¿[Deberíamos orar para que la iglesia reciba] crecimiento?
      a: Sí, para que «el reino del mundo [llegue a ser] el reino de nuestro Señor y de su Cristo» (Apo. 11:15).
    - q: ¿[Deberíamos orar para que la iglesia sea] reformada?
      a: Sí. «Porque el juicio volverá a ser justo, y todos los rectos de corazón lo seguirán» (Sal. 94:15).
    - q: ¿Y {para que sea} librada de la furia de todos sus opresores?
      a: Sí. «Pues el cetro de la impiedad no descansará sobre la tierra de los justos» (Sal. 125:3).
  - - q: ¿Deberíamos orar por el avance del llamado a los gentiles?
      a: Sí. «Para que sea conocido en la tierra tu camino, [y] entre todas las naciones tu salvación» (Sal. 67:2).
    - q: ¿Y por la conversión de los judíos?
      a: Sí. «El deseo de mi corazón y mi oración a Dios por [Israel] es para su salvación» (Rom. 10:1).
    - q: ¿Deberíamos orar para que se levanten magistrados a favor del evangelio?
      a: Sí. «Reyes serán tus tutores, y sus princesas, [las nodrizas para el Israel de Dios]» (Isa. 49:23).
    - q: ¿[Deberíamos orar para] que se levanten ministros para predicar el evangelio?
      a: Sí. «Rogad al Señor de la mies que envíe obreros a su mies» (Mat. 9:38).
    - q: ¿Y [para] que el evangelio tenga éxito dondequiera que se predique?
      a: Sí. «Para que la palabra del Señor se extienda rápidamente y sea glorificada» (2 Tes. 3:1).
  - - q: ¿Deberíamos orar para que cristianos específicos sean consolados?
      a: Sí. «Y que nuestro Señor Jesucristo mismo […] consuele vuestros corazones» (2 Tes. 2:16, 17).[^116]
    - q: ¿[Deberíamos orar para que cristianos específicos sean] santificados?
      a: Sí. «Y que el mismo Dios de paz os santifique por completo» (1 Tes. 5:23).
    - q: ¿Y [para que sean] preservados?
      a: Sí. «Y que todo vuestro ser, espíritu, alma y cuerpo, sea preservado irreprensible para la venida de nuestro Señor Jesucristo» (Ibíd.).
  - - q: ¿Se le llama Reino al estado de bendición de lo alto {i. e., del Cielo}?
      a: Sí. «Esto digo […] que la carne y la sangre no pueden heredar el reino de Dios» (1 Cor. 15:50).
    - q: ¿Está aún por venir este Reino?
      a: Sí. Es «la gloria que ha de ser revelada» (1 Ped. 5:1).
    - q: ¿Deberíamos estar completamente convencidos de que vendrá?
      a: Sí. «Aguardando la esperanza bienaventurada y la manifestación de la gloria de nuestro gran Dios y Salvador» (Tit. 2:13).
    - q: ¿Deberíamos orar para que venga?
      a: Sí. «Amén. Ven, Señor Jesús» (Apo. 22:20).
    - q: ¿[Deberíamos orar para] que nosotros y otros estemos preparados para ello?
      a: Sí. «Para que seáis puros e irreprensibles para el día de Cristo» (Flp. 1:10).
    - q: ¿Y [para que] seamos admitidos en él?
      a: Sí. «Anhelando ser vestidos con nuestra habitación celestial» (2 Cor. 5:2).
notes:
  "116": Aunque la referencia que aparece en el original es 2 Tesalonicenses 2:17, el autor también está citando el versículo 16.
