# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 76
question: ¿Qué se exige en el séptimo mandamiento?
answer: El séptimo mandamiento exige la preservación de nuestra propia castidad y la de nuestro prójimo, en el corazón, el habla y la conducta.
sections:
  - - q: ¿Es nuestro deber mantener puro nuestro cuerpo?
      a: Sí. Debemos poseer nuestros vasos «en santificación y honor, no en pasión de concupiscencia» (1 Tes. 4:4).
    - q: ¿Deberían ser castos nuestros pensamientos?
      a: Sí. «No codicies su hermosura en tu corazón» (Pro. 6:25).
    - q: ¿[Deberían ser castas] nuestras palabras?
      a: Sí. «No salga de vuestra boca ninguna palabra [corrompida]» (Efe. 4:29).
    - q: ¿Y nuestro comportamiento?
      a: Sí. Debemos mantener una conducta «casta y respetuosa» (1 Ped. 3:2).
    - q: ¿Deberíamos cuidar nuestra propia castidad?
      a: Sí. Debemos limpiarnos de toda inmundicia tanto de la carne como del espíritu (2 Cor. 7:1).
    - q: ¿Y [deberíamos cuidar] la [castidad] de los demás?
      a: Sí. «Y ella insistía a José día tras día, pero él no accedió a acostarse con ella» (Gén. 39:10).
  - - q: ¿Deberíamos vigilar estrictamente nuestros sentidos para {cumplir con} este propósito?
      a: Sí. «Hice un pacto con mis ojos» (Job 31:1).
    - q: ¿[Deberíamos] estudiar las reglas de la sobriedad y la templanza?
      a: Sí. «Golpeo mi cuerpo y lo hago mi esclavo» (1 Cor. 9:27).
    - q: ¿[Deberíamos] habituarnos a alguna vocación lícita?
      a: Sí. «Sucedió un día que [José] entró en casa para hacer su trabajo» (Gén. 39:11).
    - q: ¿[Deberíamos] evitar la compañía de los ociosos y lascivos?
      a: Sí. «No te acerques a la puerta de su casa» (Pro. 5:8).
    - q: Y, si otros medios resultan ineficaces, ¿deberíamos casarnos?
      a: Sí. «Si carecen de dominio propio, cásense» (1 Cor. 7:9).
    - q: Por tanto, ¿cometen pecado los papistas al prohibir el matrimonio para el clero?
      a: Sí. «Prohibiendo casarse» (1 Tim. 4:3).
