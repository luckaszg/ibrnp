# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 67
question: ¿Cuáles son las razones anexas al cuarto mandamiento?
answer: "Las razones anexas al cuarto mandamiento son: que Dios nos ha concedido seis días de la semana para nuestras propias ocupaciones lícitas, Su reclamación de un derecho de propiedad especial sobre un séptimo {día}, Su propio ejemplo y Su bendición del día de reposo."
sections:
  - - q: ¿Nos ha concedido Dios seis días para trabajar?
      a: Sí. «Durante seis días se trabajará» (Éxo. 31:15).
    - q: ¿Y debemos trabajar en esos seis días?
      a: Sí. «Hay seis días en los cuales se debe trabajar» (Luc. 13:14).
    - q: Entonces, ¿es muy razonable que dediquemos un séptimo {día} a Dios?
      a: Sí, porque «sus mandamientos no son gravosos» (1 Jua. 5:3).
  - - q: ¿Reclama Dios un {derecho de} propiedad especial sobre el día de reposo?
      a: Sí. «Es día de reposo para el SEÑOR tu Dios» (Deu. 5:14).
    - q: ¿Y es esta una razón por la que deberíamos dedicarlo a Él?
      a: Sí. «[Dad] a Dios lo que es de Dios» (Mat. 22:21).
    - q: ¿Observó Dios mismo el día de reposo?
      a: Sí, porque «en el séptimo día [Dios] cesó de trabajar y reposó» (Éxo. 31:17).
    - q: ¿Y debemos imitarlo?
      a: Sí. «Sed […] imitadores de Dios como hijos amados» (Efe. 5:1).
    - q: ¿Observó Cristo el día de reposo?
      a: Sí. «Jesús estaba enseñando en una de las sinagogas un día de reposo» (Luc. 13:10).
    - q: ¿Y deberíamos seguir Su ejemplo?
      a: Sí. «Haya, pues, en vosotros esta actitud que hubo también en Cristo Jesús» (Flp. 2:5).
  - - q: ¿La debida observancia del día de reposo está acompañada de muchas bendiciones?
      a: Sí. «Entonces te deleitarás en el SEÑOR, y yo te haré cabalgar sobre las alturas de la tierra» (Isa. 58:14).
    - q: ¿Trae bendiciones a determinadas personas y familias?
      a: Sí. «A los eunucos que guardan mis días de reposo […] les daré en mi casa […] un lugar, y un nombre mejor que el de hijos e hijas» (Isa. 56:4, 5).
    - q: ¿[Trae bendiciones] sobre el Estado?
      a: Sí. «Si […] santificáis el día de reposo, sin hacer en él trabajo alguno […] esta ciudad será habitada para siempre» (Jer. 17:24, 25).
    - q: ¿Y [trae bendiciones] sobre la Iglesia?
      a: Sí. «“Vendrán de las ciudades de Judá y […] de la región montañosa […] trayendo holocaustos […] ofrendas y […] sacrificios de acción de gracias a la casa del SEÑOR”» (v. 26).
    - q: ¿La profanación del día de reposo expondrá a la más severa ira de Dios?
      a: Sí. «Mis días de reposo profanaron en gran manera. Entonces decidí derramar mi furor sobre ellos» (Eze. 20:13).
    - q: ¿Es, en efecto, una violación de toda la ley?
      a: Sí. «Se rebelaron contra mí, no anduvieron en mis estatutos […] profanaron mis días de reposo» (v. 21).
    - q: ¿Y pueden esperar perder los días de reposo aquellos que los violan?
      a: Sí. «Haré cesar […] sus días de reposo» (Ose. 2:11).
