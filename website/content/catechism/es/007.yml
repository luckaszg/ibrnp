# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 7
question: ¿Qué es Dios?
answer: Dios es un Espíritu infinito, eterno e inmutable en Su Ser, sabiduría, poder, santidad, justicia, bondad y verdad.
sections:
  - - q: ¿Es Dios un Espíritu?
      a: Sí. «Dios es espíritu» (Jua. 4:24).
    - q: ¿Es Él incorpóreo e invisible?
      a: Sí. «No habéis oído jamás su voz ni habéis visto su apariencia» (Jua. 5:37).
    - q: ¿Es Él un Espíritu perfecto?
      a: Sí. «Dios es luz, y en El no hay tiniebla alguna» (1 Jua. 1:5).
    - q: ¿Es Él un Espíritu activo?
      a: Sí. «Hasta ahora mi Padre trabaja» (Jua. 5:17).
    - q: ¿Es Él un Espíritu autosuficiente e independiente?
      a: Sí. Su nombre es «YO SOY EL QUE SOY» (Éxo. 3:14).
    - q: ¿Es Él un Espíritu inmortal?
      a: Sí. «El único que tiene inmortalidad» (1 Tim. 6:16).
    - q: ¿Está Él por encima de todos los demás espíritus?
      a: Sí. Él es «el padre de [los] espíritus» (Heb. 12:9).
  - - q: Entonces, ¿podemos formar una concepción adecuada del Ser divino?
      a: No. «¿Con qué semejanza le compararéis?» (Isa. 40:18).
    - q: ¿Se atribuyen a Él los órganos de los sentidos impropiamente?
      a: Sí. «¿Acaso tienes tú ojos de carne, o ves como el hombre ve?» (Job 10:4).
    - q: ¿Puede Él ser agradado con cosas carnales?
      a: No. «No tomaré novillo de tu casa, ni machos cabríos de tus apriscos» (Sal. 50:9).
    - q: ¿Debería Él ser adorado de una manera espiritual?
      a: Sí. «A quien sirvo en mi espíritu» (Rom. 1:9).
    - q: ¿Podemos esperar bendiciones espirituales de parte de Él?
      a: Sí. «[Quien] nos ha bendecido con toda bendición espiritual» (Efe. 1:3).
    - q: ¿Y es Él la única porción adecuada para nuestro espíritu?
      a: Sí. «El SEÑOR es mi porción —dice mi alma» (Lam. 3:24).
  - - q: ¿Es Dios infinito y omnipresente?
      a: Sí. «¿Adónde huiré de tu presencia?» (Sal. 139:7).
    - q: ¿Está Él en el Cielo?
      a: Sí. «Si subo a los cielos, he aquí, allí estás tú» (Sal. 139:8).
    - q: Pero, ¿está Él confinado al Cielo?
      a: No. «Los cielos de los cielos no pueden contenerle» (2 Cró. 2:6).
    - q: ¿Está difundida Su esencia por todo el universo de las cosas?
      a: Sí. Él «está sobre todos, por todos y en todos» (Efe. 4:6).
    - q: Entonces, ¿está Él cerca de cada uno de nosotros?
      a: Sí. «No está lejos de ninguno de nosotros» (Hch. 17:27).
    - q: ¿Debería esto servir de apoyo para los santos que están cargados?
      a: Sí. «Esforzaos porque yo estoy con vosotros —declara el SEÑOR de los ejércitos» (Hag. 2:4).
    - q: ¿Y [debería esto servir de] estímulo para las acciones santas?
      a: Sí. «Anda delante de mí, y sé perfecto» (Gén. 17:1).
  - - q: ¿Es Dios eterno?
      a: Sí. «El eterno Dios es tu refugio» (Deu. 33:27).
    - q: ¿Era [i. e., existía] Él desde la eternidad?
      a: Sí. «¿No eres tú desde la eternidad, Oh SEÑOR, Dios mío...?» (Hab. 1:12).
    - q: ¿Será [i. e., existirá] Él para siempre?
      a: Sí. «Desde la eternidad y hasta la eternidad, tú eres Dios» (Sal. 90:2).
    - q: ¿Es Él el único eterno?
      a: Sí. «Yo soy el primero y yo soy el último, y fuera de mí no hay Dios» (Isa. 44:6).
    - q: Por lo tanto, ¿Dios debería ser temido?
      a: Sí. «Él es el Dios vivo y el Rey eterno, ante su enojo tiembla la tierra» (Jer. 10:10).
    - q: ¿Deberíamos confiar en Él?
      a: Sí. «Confiad en el SEÑOR para siempre, porque en Dios el SEÑOR, tenemos una Roca eterna» (Isa. 26:4).
    - q: ¿Debería humillar al hombre esta perfección de Dios?
      a: Sí. «¿Dónde estabas tú cuando yo echaba los cimientos de la tierra?» (Job 38:4).
    - q: ¿Y [debería] glorificar a Dios [esta perfección de Dios]?
      a: Sí. «Al Rey eterno, inmortal, invisible, único Dios, a Él sea honor y gloria por los siglos de los siglos» (1 Tim. 1:17).
  - - q: ¿Es Dios inmutable?
      a: Sí. «Tú eres el mismo» (Sal. 102:27).
    - q: ¿Es Él absolutamente inmutable?
      a: Sí. «Con el cual no hay cambio ni sombra de variación» (Stg. 1:17).
    - q: ¿Es Él inmutable en Su propia naturaleza y perfecciones?
      a: Sí. «Yo, el SEÑOR, no cambio» (Mal. 3:6).
    - q: ¿[Es Él inmutable] en Su voluntad?
      a: Sí. «Mi propósito será establecido» (Isa. 46:10).
    - q: ¿[Es Él inmutable] en Su amor?
      a: Sí. «Con amor eterno te he amado» (Jer. 31:3).
    - q: ¿[Es Él inmutable] en Sus favores especiales?
      a: Sí. «Los dones y el llamamiento de Dios son irrevocables» (Rom. 11:29).
    - q: ¿No puede cambiar Dios por causa de algún accidente imprevisto?
      a: No. «DICE EL SEÑOR, QUE HACE SABERTODO ESTO DESDE TIEMPOS ANTIGUOS» (Hch. 15:18).
    - q: ¿O [acaso no puede cambiar Dios] por falta de poder para llevar a cabo lo que Él ha determinado?
      a: No, porque Él es «el Dios Todopoderoso» (Gén. 17:1).
    - q: ¿Es bueno para nosotros que Dios sea inmutable?
      a: Sí. «Por eso vosotros, Oh hijos de Jacob, no habéis sido consumidos» (Mal. 3:6).
  - - q: ¿Es Dios sabio?
      a: Sí. «Mío es el consejo y la prudencia» (Pro. 8:14).
    - q: ¿Se manifiesta Su sabiduría en la creación y la providencia?
      a: Sí. Él «ha hecho maravilloso su consejo y grande su sabiduría» (Isa. 28:29).
    - q: ¿[Se manifiesta Su sabiduría] en la redención?
      a: Sí. Él «ha hecho abundar [las riquezas de su gracia] para con nosotros. En toda sabiduría y discernimiento» (Efe. 1:8).
    - q: ¿Es Él infinitamente sabio?
      a: Sí. «Su entendimiento es infinito» (Sal. 147:5).
    - q: ¿Es Él sabio desde el principio?
      a: Sí. «¿A quién pidió consejo y quién le dio entendimiento?» (Isa. 40:14).
    - q: ¿Es Él sabio de forma perfecta?
      a: Sí. «La necedad de Dios es más sabia que los hombres» (1 Cor. 1:25).
    - q: ¿Es Él sabio de forma incomprensible?
      a: Sí. «¡Oh, profundidad de las riquezas y de la sabiduría y del conocimiento de Dios!» (Rom. 11:33).
    - q: ¿Hay algo que pueda oponerse a Su sabiduría?
      a: No. «No vale sabiduría, ni entendimiento, ni consejo, frente al SEÑOR» (Pro. 21:30).
    - q: ¿Proviene de Él toda sabiduría?
      a: Sí. Él «da sabiduría a los sabios» (Dan. 2:21).
    - q: Por lo tanto, ¿deberíamos buscar la sabiduría en Su mano?
      a: Sí. «Si alguno de vosotros se ve falto de sabiduría, que la pida a Dios» (Stg. 1:5).
  - - q: ¿Es Dios poderoso?
      a: Sí. «Que de Dios es el poder» (Sal. 62:11).
    - q: ¿Puede Él hacer todas las cosas?
      a: Sí. «¿Habrá algo imposible para mí?» (Jer. 32:27).
    - q: ¿Puede Él hacer todas las cosas con la mayor facilidad?
      a: Sí. «Él levanta las islas como al polvo fino» (Isa. 40:15).
    - q: ¿Puede Él hacer todas las cosas de la manera más perfecta?
      a: Sí. «Él es una roca, Su obra es perfecta» (Deu. 32:4).
    - q: ¿Es necesario el poder de Dios para sancionar Sus leyes?
      a: Sí. «Hay un dador de la ley y juez, que es poderoso para salvar y para destruir» (Stg. 4:12).
    - q: ¿Es [Su poder] irresistible?
      a: Sí. «Nadie puede detener Su mano» (Dan. 4:35).
    - q: ¿Está [Su poder] sujeto a decaimiento?
      a: No. «No se ha acortado la mano del Señor para salvar» (Isa. 59:1).
    - q: ¿Se extiende [Su poder] a espíritus malignos y a hombres malvados?
      a: Sí. «Suyos son el engañado y el engañador» (Job 12:16).
    - q: Por tanto, ¿es una gran necedad pecar contra un Dios así?
      a: Sí. «¿O provocaremos a celos al Señor? ¿Somos, acaso, más fuertes que Él?» (1 Cor. 10:22).
  - - q: ¿Es Dios santo?
      a: Sí. «Él es el santo de Israel» (Isa. 41:20).
    - q: ¿Es Él supremamente santo?
      a: Sí. «No hay santo como el Señor» (1 Sam. 2:2).
    - q: ¿Se hace evidente la santidad de Dios de una manera particular en la obra de la redención?
      a: Sí. «Sión será redimida con juicio, y sus arrepentidos con justicia» (Isa. 1:27).
    - q: ¿Han reconocido los paganos la santidad de Dios por la luz de la naturaleza?
      a: Sí. «Ya que sé que en ti está el espíritu de los dioses santos» (Dan. 4:9).
    - q: ¿Elogian a Dios los espíritus de arriba?
      a: "Sí. «Continuamente dicen: Santo, santo, santo, Señor Dios Todopoderoso» (Apo. 4:8)."
    - q: ¿Y deberíamos imitarlos en esto?
      a: Sí. «Bendice su santo nombre» (Sal. 103:1).
  - - q: ¿Es Dios justo?
      a: Sí. «El Señor es justo» (Sal. 129:4).
    - q: ¿Es Él absoluta y perfectamente justo?
      a: Sí. «¿Qué hay injusticia en Dios? ¡De ningún modo!» (Rom. 9:14).
    - q: ¿Es [Dios] justo al infligir juicios temporales?
      a: Sí. «Tuya es la justicia, oh Señor, y nuestra la vergüenza en el rostro» (Dan. 9:7).
    - q: ¿[Es Dios justo al tomar] venganza eterna?
      a: Sí. «¿Acaso es injusto el Dios que expresa su ira?» (Rom. 3:5).
    - q: ¿Se manifiesta la justicia de Dios de manera eminente en la obra y los sufrimientos de Cristo?
      a: Sí. «A quien Dios exhibió públicamente como propiciación por su sangre a través de la fe, como demostración de su justicia» (Rom. 3:25).
    - q: Entonces, ¿debemos reconocer la justicia de Dios?
      a: Sí. «Mas Tú, eres justo» (Neh. 9:33).
    - q: ¿Y [debemos] tratar de evitar los efectos nefastos de esta?
      a: Sí. «Huye por tu vida [...] no sea que perezcas» (Génesis 19:17).
  - - q: ¿Es Dios bueno?
      a: Sí. «Pues tú, Señor, eres bueno» (Sal. 86:5).
    - q: ¿Puede Su bondad suscitar nuestro asombro?
      a: Sí. «¡Cuánta es su bondad!» (Zac. 9:17).
    - q: ¿Debería [Su bondad] suscitar nuestra gratitud?
      a: Sí. «Dad gracias al SEÑOR, porque es bueno» (Sal. 106:1).
    - q: ¿Es Dios bueno en un sentido universal?
      a: Sí. «Es bueno para con todos» (Sal. 145:9).
    - q: ¿Es bueno para con los pecadores?
      a: Sí. «Él hace [...] llover sobre justos e injustos» (Mat. 5:45).
    - q: ¿Es Él bueno de una manera especial para con Su propio pueblo?
      a: Sí. «Para que yo vea la prosperidad de tus escogidos» (Sal. 106:5).
    - q: ¿Se toma Dios el desprecio de Su bondad como algo atroz?
      a: Sí. «¿O tienes en poco las riquezas de su bondad?» (Rom. 2:4).
  - - q: ¿Es Dios veraz?
      a: Sí. «Estas cosas dice el que es verdadero» (Apo. 3:7).
    - q: ¿Es fiel a Sus promesas?
      a: Sí. «Otorgarás a Jacob la verdad» (Miq. 7:20).
    - q: ¿[Es fiel] a Sus amenazas?
      a: Sí. «Pero mis palabras, ¿no alcanzaron a vuestros padres?» (Zac. 1:6).
    - q: ¿Y [es fiel] a Cristo?
      a: Sí. «Una vez he jurado por mi santidad; no mentiré a David» (Sal. 89:35).
    - q: ¿Es Dios inmutable en Su verdad?
      a: Sí. «La fidelidad [o verdad] del SEÑOR es eterna» (Sal. 117:2).
    - q: Por lo tanto, ¿deberíamos creerle a Dios?
      a: Sí. Deberíamos considerar fiel [o veraz] al que ha prometido (Heb. 11:11).
    - q: ¿Y [deberíamos considerar fiel {o veraz} a Dios] más que al hombre?
      a: Sí. «Sea hallado Dios veraz, aunque todo hombre sea hallado mentiroso» (Rom. 3:4).
    - q: Pero, aunque no le creamos, ¿sigue Dios siendo fiel?
      a: Sí. «Porque si algunos fueron infieles, ¿acaso su infidelidad anulará la fidelidad de Dios?» (Rom. 3:3).
