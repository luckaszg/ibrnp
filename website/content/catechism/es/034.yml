# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 34
question: ¿Qué es el llamamiento eficaz?
answer: El llamamiento eficaz es la obra del Espíritu de Dios mediante la cual, al convencernos de nuestro pecado y miseria, iluminar nuestra mente en el conocimiento de Cristo y renovar nuestra voluntad, nos persuade y nos capacita para abrazar a Jesucristo ofrecido libre y gratuitamente a nosotros en el evangelio.
sections:
  - - q: ¿Hay un llamado externo que se extiende a todos los hombres?
      a: Sí. «Oh hombres, a vosotros clamo» (Pro. 8:4).
    - q: ¿Llama Dios por medio de Sus obras de creación?
      a: Sí, porque «no hay mensaje, no hay palabras; no se oye su voz» (Sal. 19:3).
    - q: ¿[Llama Dios] por medio de Sus obras de providencia?
      a: Sí. «La voz del SEÑOR clamará a la ciudad» (Miq. 6:9).
    - q: ¿[Llama Dios] por medio de Su Palabra?
      a: Sí. Él «envió a sus siervos a llamar a los que habían sido invitados» (Mat. 22:3).
    - q: ¿Y [llama Dios] por medio de las operaciones comunes de Su Espíritu?
      a: Sí. «No contenderá mi Espíritu para siempre con el hombre» (Gén. 6:3).
    - q: Pero, ¿siempre es eficaz este llamado?
      a: No. «Pero no quisieron venir» (Mat. 22:3).
  - - q: ¿Son los llamados especiales del Espíritu fruto del amor electivo?
      a: Sí. «A los que predestinó, a [esos] también llamó» (Rom. 8:30).
    - q: ¿Vienen [los llamados especiales del Espíritu] acompañados del gran poder de Dios?
      a: Sí. «Nuestro evangelio no vino a vosotros solamente en palabras, sino también en poder» (1 Tes. 1:5).
    - q: Sin embargo, ¿[son] adecuados [los llamados especiales del Espíritu] para la naturaleza del hombre?
      a: Sí. «Con cuerdas humanas los conduje» (Ose. 11:4).
    - q: ¿Y siempre son eficaces [los llamados especiales del Espíritu]?
      a: Sí. «Vendrá [a Mí]» (Jua. 6:37).
  - - q: ¿Están convencidos de pecado todos los que son llamados eficazmente?
      a: Sí. «Pero al venir el mandamiento, el pecado revivió» (Rom. 7:9).
    - q: ¿Están convencidos de pecado en su corazón [todos los que son llamados eficazmente]?
      a: Sí. «Conociendo cada cual la plaga en su corazón» (1 Reyes 8:38 [RVR60]).
    - q: ¿[Están convencidos] de pecado en su vida [todos los que son llamados eficazmente]?
      a: Sí. «Me haces responsable de las iniquidades de mi juventud» (Job 13:26).
    - q: ¿Están convencidos especialmente de los pecados groseros y de mayor gravedad?
      a: Sí. «Habiendo sido yo antes perseguidor» (1 Tim. 1:13).
    - q: ¿Ven el pecado en el espejo de la ley?
      a: Sí. «Pues por medio de la ley viene el conocimiento del pecado» (Rom. 3:20).
    - q: ¿[Ven el pecado] en el espejo de las perfecciones divinas?
      a: Sí. «Pero ahora mis ojos te ven[,] por eso me retracto» (Job 42:5, 6).[^52]
    - q: ¿[Ven el pecado] en el espejo de los sufrimientos de Cristo?
      a: Sí. «Me mirarán a mí, a quien han traspasado[,] y se lamentarán» (Zac. 12:10).
    - q: ¿Ven el pecado como algo sumamente pecaminoso?
      a: Sí. «Reconoce, pues, y ve que es malo» (Jer. 2:19).
    - q: ¿[Ven el pecado como algo] extremadamente odioso?
      a: Sí. «Aborrezco todo camino de mentira» (Sal. 119:104).
    - q: ¿[Ven el pecado como algo] extremadamente hiriente?
      a: Sí. «Y hallé más amarga que la muerte a la mujer cuyo corazón es lazos y redes» (Ecl. 7:26).
    - q: ¿Y es esta convicción el fruto del Espíritu?
      a: Sí. «Y cuando El venga, convencerá al mundo de pecado» (Jua. 16:8).
  - - q: ¿Están convencidos de su miseria todos los que son llamados eficazmente?
      a: Sí. «¡Ay de mí! Porque perdido estoy» (Isa. 6:5).
    - q: ¿[Están convencidos] de la equidad de los juicios de Dios?
      a: Sí. «Tuya es la justicia, Oh Señor» (Dan. 9:7).
    - q: ¿[Están convencidos] de su impotencia en sí mismos?
      a: Sí. «Porque nadie puede estar delante de ti a causa de esto» (Esd. 9:15).
    - q: ¿Producirá horror esta convicción?
      a: Sí. El carcelero vino temblando (Hch. 16:29).
    - q: ¿[Producirá] vergüenza [esta convicción]?
      a: Sí. «Acostémonos en nuestra vergüenza» (Jer. 3:25).
    - q: ¿[Producirá] silencio humilde [esta convicción]?
      a: Sí. «Que ponga su boca en el polvo» (Lam. 3:29).
    - q: ¿Y [producirá] sincera indagación [esta convicción]?
      a: Sí. «Señor, ¿qué quieres que yo haga?» (Hch. 9:6 [RVR60]).[^53]
  - - q: ¿Es necesaria esta convicción?
      a: Sí. «Los que están sanos no tienen necesidad de médico» (Mat. 9:12).
    - q: Pero, ¿es esta convicción todo lo que se necesita?
      a: No. «Pues Él nos ha desgarrado, y nos sanará» (Ose. 6:1).
    - q: Entonces, ¿el mismo Espíritu que ha comenzado la obra, la continuará?
      a: Sí. «El SEÑOR cumplirá su propósito en mí» (Sal. 138:8).
    - q: ¿Ilumina el Espíritu nuestra mente?
      a: Sí. Él «resplandece en nuestros corazones» (2 Cor. 4:6).
    - q: ¿Ilumina [el Espíritu] a todos los que son llamados eficazmente en el conocimiento de Cristo en particular?
      a: Sí. Él da la «iluminación del conocimiento de la gloria de Dios en la faz de Cristo» (Ibíd.).
    - q: ¿Y [los ilumina el Espíritu en el conocimiento] de las cosas de Cristo?
      a: Sí. «Él toma de lo mío y os lo hará saber» (Jua. 16:15).
  - - q: ¿Es interno y experimental [o experiencial] este conocimiento que el Espíritu proporciona?
      a: Sí. «Porque la sabiduría entrará en tu corazón» (Pro. 2:10).
    - q: ¿Está acompañado [este conocimiento] de la mayor certeza?
      a: Sí. «Nosotros hemos creído y conocido que Tú eres el Santo de Dios» (Jua. 6:69).
    - q: ¿Es un conocimiento operativo y eficaz?
      a: Sí. «Está dando fruto» (Col. 1:6).
    - q: ¿Es un conocimiento permanente?
      a: Sí. «La unción que recibisteis de Él permanece en vosotros» (1 Jua. 2:27).
    - q: Por tanto, ¿debería ser anhelado y buscado con vehemencia [este conocimiento]?
      a: Sí. «Estimo como pérdida todas las cosas en vista del incomparable valor de conocer a Cristo Jesús, mi Señor» (Flp. 3:8).
  - - q: ¿Está esta iluminación del entendimiento acompañada de una determinación de la voluntad?
      a: Sí. Él «[está preparando] para el Señor un pueblo bien dispuesto» (Luc. 1:17).
    - q: ¿Es docilitada la voluntad perversa?
      a: Sí. «Quitaré de su carne el corazón de piedra y les daré un corazón de carne» (Eze. 11:19).
    - q: ¿Es hecha obediente la voluntad rebelde?
      a: Sí. «Poniendo todo pensamiento en cautiverio a la obediencia de Cristo» (2 Cor. 10:5).
    - q: ¿Y es esto también la obra de Dios?
      a: Sí. «Porque Dios es quien obra en vosotros el hacer» (Flp. 2:13).
  - - q: ¿Se aventura a Cristo el alma así despierta e iluminada?
      a: Sí. «Todo el que ha oído y aprendido del Padre, viene a mí» (Jua. 6:45).
    - q: ¿[Se aventura a Cristo] de inmediato [el alma así despierta e iluminada]?
      a: "Sí. «Cristo le dijo: ¡Sígueme! Y levantándose, le siguió» (Mat. 9:9)."
    - q: ¿[Se aventura a Cristo] decididamente?
      a: Sí. «Aunque Él me mate, en Él esperaré» (Job 13:15).
    - q: ¿Es Cristo ofrecido en la Palabra como un Salvador poderoso [para salvar]?
      a: Sí. «Él [...] es poderoso para salvar para siempre a los que por medio de Él se acercan a Dios» (Heb. 7:25).
    - q: ¿[Es Cristo ofrecido en la Palabra] como un Salvador dispuesto?
      a: Sí. «Este recibe a los pecadores» (Luc. 15:2).
    - q: ¿Y las acciones de la fe en el alma responden a los misterios de Cristo revelados en la Palabra?
      a: Sí. «Así predicamos y así creísteis» (1 Cor. 15:11).
  - - q: ¿Está representada por medio de un llamamiento toda la obra de gracia en la conversión?
      a: Sí. «Llamados a ser santos» (1 Cor. 1:2).
    - q: ¿Es un llamamiento secreto?
      a: Sí. «El reino de Dios no viene con señales visibles» (Luc. 17:20).
    - q: ¿Es un llamamiento misterioso?
      a: Sí. «Como no sabes cuál es el camino del viento [...] tampoco conoces la obra de Dios que hace todas las cosas»[^54] (Ecl. 11:5).
    - q: ¿Es un llamamiento personal?
      a: Sí. «Te he llamado por tu nombre» (Isa. 43:1).
    - q: ¿Es un llamamiento libre y de gracia?
      a: Sí. «En el ejercicio de Su voluntad, Él nos hizo nacer» (Stg. 1:18).
    - q: Por tanto, ¿debería Dios recibir la gloria por ello?
      a: Sí. «No a nosotros, SEÑOR, no a nosotros, sino a tu nombre da gloria» (Sal. 115:1).
notes:
  "52": Aunque la referencia que aparece en el original es Job 42:5, el autor también está citando el versículo 6.
  "53": "El texto al que el autor hace referencia (Hch. 9:6) tiene una variante textual. Por esa razón, LBLA no contiene esta frase, sino que comienza el versículo desde la palabra «levántate». A pesar de que este texto está sujeto a debate, la verdad bíblica a la que el autor hace referencia puede ser encontrada con facilidad en la Palabra de Dios. En Hechos 22, otro de los pasajes en el que el apóstol hace referencia a su conversión, encontramos la misma frase a la que Beddome hace referencia: «¿Qué debo hacer, Señor?» (Hch. 22:10). Véase Hechos 2:37, 16:28, etc."
  "54": En el original, el autor solo utiliza la primera parte del versículo («Como no sabes cuál es el camino del viento»); sin embargo, con el propósito de enfatizar su argumento al citar este texto, hemos añadido también la parte final del versículo a nuestra traducción en español («tampoco conoces la obra de Dios que hace todas las cosas»). La palabra ַחּור /rúakj/ puede ser traducida como espíritu o viento. En la versión King James, la palabra es traducida como «spirit» (espíritu) y el autor hace alusión al Espíritu de Dios; por eso cita solo la primera parte del versículo. En las versiones hispanas, la palabra es traducida como «viento»; y, aunque espíritu también es una traducción correcta, el autor de Eclesiastés está haciendo una comparación entre «el camino del viento» y «la obra de Dios»; así como no conocemos lo primero, tampoco podemos conocer lo segundo. Al citar este texto, Beddome está argumentando su punto con un texto completamente consecuente con la doctrina que está tratando de mostrar. El énfasis en que la obra del Espíritu (lo cual incluye el llamamiento eficaz) es misteriosa —pues no podemos comprenderla, ni verla ni controlarla— se refleja en la parte final del texto; por eso decidimos añadirla.
