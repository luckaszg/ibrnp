# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 77
question: ¿Qué se prohíbe en el séptimo mandamiento?
answer: El séptimo mandamiento prohíbe todos los pensamientos, palabras y acciones que sean contrarios a la castidad.
sections:
  - - q: ¿Es el adulterio un pecado muy grave?
      a: Sí. «Se le llama abominación» (Eze. 22:11).
    - q: ¿Es malgastar el cuerpo?
      a: Sí. «Y al final te lamentes, cuando tu carne y tu cuerpo se hayan consumido» (Pro. 5:117.
    - q: ¿[Es] un agravio al alma?
      a: Sí. «Que os abstengáis de las pasiones carnales que combaten contra el alma» (1 Ped. 2:11).
    - q: ¿[Es] manchar el carácter?
      a: Sí. «Heridas y vergüenza hallará» (Pro. 6:33).
    - q: ¿Es un pecado embriagante?
      a: Sí. Te quita el juicio (Ose. 4:11).
    - q: ¿[Es] un pecado empobrecedor?
      a: Sí. «Por causa de una ramera [un hombre] es reducido a un pedazo de pan» (Pro. 6:26).
    - q: ¿Es una especie de sacrilegio?
      a: Sí. «¿Tomaré, acaso, los miembros de Cristo y los haré miembros de una ramera?» (1 Cor. 6:15).
    - q: ¿Descalifica {lit. incapacita} para la comunión con los santos?
      a: Sí. «Os escribí que no anduvierais en compañía de ninguno que, llamándose hermano, es una persona inmoral» (1 Cor. 5:11).
    - q: ¿Y será severamente castigado tanto en este mundo como en el venidero?
      a: Sí. «A los inmorales y a los adúlteros los juzgará Dios» (Heb. 13:4).
  - - q: ¿Es pecado la fornicación al igual que el adulterio?
      a: Sí. «Considerad los miembros de vuestro cuerpo terrenal como muertos a la fornicación» (Col. 3:5).
    - q: ¿[Es pecado] el incesto [al igual que el adulterio]?
      a: Sí. «“Ninguno de vosotros se acercará a una parienta cercana suya”» (Lev. 18:6).
    - q: ¿[Es pecado] la poligamia [al igual que el adulterio]?
      a: Sí. «¿No hizo Él uno, aunque tenía el remanente del Espíritu?»[^82] (Mal. 2:15).
    - q: ¿Y toda clase de impureza?
      a: Sí. «Pero que la inmoralidad, y toda impureza o avaricia, ni siquiera se mencionen entre vosotros» (Efe. 5:3).
  - - q: ¿Son pecaminosos los deseos inmundos?
      a: Sí. Debemos mortificar «las pasiones [y] los malos deseos» (Col. 3:5).
    - q: ¿[Son pecaminosas] las reflexiones[^83] inmundas?
      a: Sí. «Ella multiplicó sus prostituciones, recordando los días de su juventud» (Eze. 23:19).
    - q: ¿[Son pecaminosas] las miradas lujuriosas?
      a: Sí. «Tienen los ojos llenos de adulterio» (2 Ped. 2:14).
    - q: ¿[Es pecaminoso] el atavío sin modestia?
      a: Sí. «Y he aquí, una mujer le sale al encuentro, vestida como ramera» (Pro. 7:10).
    - q: ¿[Son pecaminosas] las palabras obscenas?
      a: Sí. «Ni obscenidades, ni necedades» (Efe. 5:4).
    - q: ¿[Son pecaminosas] las acciones lascivas?
      a: "Sí, tales como: «promiscuidad sexual y lujurias» (Rom. 13:13)."
    - q: ¿Y la intemperancia y holgazanería que conducen a ello?
      a: "Sí. «Esta fue la iniquidad de […] Sodoma: arrogancia, abundancia de pan y completa ociosidad […] y cometieron abominaciones delante de mí» (Eze. 16:49, 50)."
notes:
  "82": Esta es una traducción directa de la versión inglesa (KJV) usada por el autor.
  "83": reflexiones —La palabra original en inglés es «reflections», y se refiere a la reflexión o la meditación que uno hace en los recuerdos. En este contexto tiene que ver con reflexiones sobre cosas impuras.
