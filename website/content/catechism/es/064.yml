# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 64
question: ¿Cuál de los siete días ha establecido Dios como el día de reposo semanal?
answer: Antes de la resurrección de Cristo, Dios había establecido el séptimo día de la semana como el día de reposo semanal; y, desde entonces, {estableció} el primer día de la semana para que continúe {siendo el día de reposo semanal} hasta el fin del mundo, siendo este el día de reposo cristiano.
sections:
  - - q: ¿Había sido establecido el día de reposo desde el principio del mundo?
      a: Sí. «Bendijo Dios el séptimo día y lo santificó» (Gén. 2:3).
    - q: ¿Fue guardado antes de la promulgación de la ley?
      a: Sí. «“Mañana es día de reposo, día de reposo consagrado”» (Éxo. 16:23).
    - q: ¿Fue impuesto particularmente a los israelitas?
      a: Sí. «Les di mis días de reposo» (Eze. 20:12).
    - q: ¿Y fue impuesto a los israelitas en conmemoración de su liberación de Egipto?
      a: Sí. «Acuérdate que fuiste esclavo en la tierra de Egipto, y que el SEÑOR tu Dios te sacó de allí […] por lo tanto […] te ha ordenado que guardes el día de reposo» (Deu. 5:15).
    - q: Pero, ¿es obligatorio para los cristianos?
      a: Sí. «Orad para que vuestra huida no suceda […] en día de reposo» (Mat. 24:20).
  - - q: ¿Se guardaba el día de reposo judío en el séptimo día de la semana?
      a: Sí. «Porque así ha dicho en cierto lugar acerca del séptimo día» (Heb. 4:4).
    - q: Pero, ¿tenía Cristo la potestad de cambiarlo?
      a: Sí. «Porque el Hijo del Hombre es Señor del día de reposo» (Mat. 12:8).
    - q: ¿Se insinúa tal cambio en el Antiguo Testamento?
      a: Sí. «“Sucederá que del octavo día en adelante, los sacerdotes ofrecerán sobre el altar vuestros holocaustos […] y yo me complaceré en vosotros” —declara el Señor DIOS» (Eze. 43:27).[^75]
    - q: ¿Tuvo lugar [este cambio] realmente después de la resurrección de Cristo?
      a: Sí, porque el primer día de la semana los discípulos se reunieron para partir el pan (Hch. 20:7).
    - q: ¿Y su ejemplo tiene la fuerza de un mandato?
      a: "Sí. «Por tanto, os exhorto: sed imitadores míos» (1 Cor. 4:16)."
  - - q: ¿Resucitó Cristo el primer día {de la semana}?
      a: Sí. Él resucitó «muy temprano el primer día de la semana» (Mar. 16:9).
    - q: ¿Y reposó entonces de Sus obras?
      a: Sí. «Él mismo ha reposado de sus obras, como Dios reposó de las suyas» (Heb. 4:10).
    - q: ¿Honró Cristo este día con Su presencia?
      a: Sí. «Al atardecer de aquel día, el primero de la semana […] Jesús vino y se puso en medio de ellos» (Jua. 20:19).
    - q: ¿Y renovó Su visita el primer día {de la semana} siguiente?
      a: Sí. «Ocho días después, sus discípulos estaban otra vez dentro, y Tomás con ellos […] Jesús vino»[^76] (v. 26).
    - q: ¿Fue esto una señal de Su aprobación?
      a: Sí, porque Él sale al encuentro de los que se acuerdan de Él en Sus caminos (Isa. 64:5).
  - - q: ¿Fue dignificado este día con un nuevo título?
      a: Sí. Fue llamado «el día del Señor» (Apo. 1:10).
    - q: ¿Ofreció el Espíritu Sus dones extraordinarios en este día?
      a: Sí, porque fue en el día de Pentecostés, que era el día siguiente al séptimo día (Hch. 2:1 comp. con Lev. 23:16).
    - q: ¿Confiere Él en este día Su gracia especial?
      a: Sí. «Estaba yo en el Espíritu en el día del Señor» (Apo. 1:10).
  - - q: ¿Se reunían los primeros cristianos en este día?
      a: Sí. «El primer día de la semana, cada uno de vosotros aparte y guarde según haya prosperado» (1 Cor. 16:1, 2).
    - q: ¿Era una colecta pública, no privada?
      a: Sí. «Para que cuando yo vaya no se recojan entonces ofrendas»[^77] (Ibíd.).
    - q: Por tanto, ¿es su práctica una regla?
      a: Sí. «Vinisteis a ser imitadores de las iglesias de Dios en Cristo» (1 Tes. 2:14).
  - - q: ¿Conmemoramos en este día una creación más gloriosa que la primera?
      a: Sí. «He aquí, yo creo cielos nuevos y una tierra nueva, y no serán recordadas las cosas primeras ni vendrán a la memoria» (Isa. 65:17).
    - q: ¿Y celebramos una liberación más eminente que la de los hijos de Israel de Egipto?
      a: "Sí. «Vienen días […] cuando no dirán más: “Vive el SEÑOR, que hizo subir a los hijos de Israel de la tierra de Egipto”» (Jer. 23:7)."
    - q: Por tanto, ¿deberíamos unirnos a nuestros compañeros cristianos para celebrar este día?
      a: Sí. «Pero si alguno parece ser contencioso, nosotros no tenemos tal costumbre, ni la tienen las iglesias de Dios» (1 Cor. 11:16).
    - q: No obstante, ¿no es esto una violación directa {o expresa} del cuarto mandamiento?
      a: "No, porque este solo dice: «Seis días trabajarás […] mas el séptimo día [es decir, el día siguiente al sexto] es día de reposo» (Éxo. 20:9, 10).[^78] Si el asunto fuera más discutible de lo que es,"
    - q: ¿no debería tener algún peso la superioridad de guardar el primer día en el estado actual {lit. en las circunstancias actuales} de las cosas?
      a: Sí, porque «el día de reposo se hizo para el hombre, y no el hombre para el día de reposo» (Mar. 2:27).
notes:
  "75": La mayoría de los expositores, si no todos, están de acuerdo en que estos capítulos al final de Ezequiel se refieren a la forma, el orden y el culto de la iglesia del evangelio (aunque puede haber alguna dificultad en hacer esta asignación). Entonces, parece más natural entender que el octavo día del que se habla aquí se refiere al primer día de la semana, o el día de reposo cristiano, en la repetición declarada de dicho día. Véase {el comentario de} el Dr. Gill sobre esta porción.
  "76": Excepto los ingleses, casi todas las naciones del mundo cuentan sus días de manera inclusiva, y así lo hicieron los antiguos hebreos. Se observa que no leemos acerca de ninguna otra reunión de los discípulos entre los días mencionados en Juan 20:19 y 26; lo cual es algo sorprendente, si suponemos que el séptimo día era guardado por ellos como el día de reposo. Seguramente se habrían reunido entonces en ese día, y Cristo lo habría dignificado con Su presencia.
  "77": Tales contribuciones caritativas estaban bien adaptadas a los momentos de culto público. Véase {el comentario de} el Dr. Gill sobre esta porción, así como Isaías 58:7-8.
