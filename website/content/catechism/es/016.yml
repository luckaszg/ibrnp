# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 16
question: ¿Permanecieron nuestros primeros padres en el estado en que fueron creados?
answer: Nuestros primeros padres, al haber sido dejados a la libertad de su propia voluntad, cayeron del estado en que fueron creados, por pecar contra Dios.
sections:
  - - q: ¿Cayó el hombre de aquel estado en el que fue creado?
      a: Sí. «Ellos se buscaron muchas artimañas» (Ecl. 7:29).
    - q: ¿Cayó el hombre de un estado de conocimiento?
      a: Sí. Su «entendimiento [está] entenebrecido» (Efe. 4:18).
    - q: ¿Cayó el hombre de un estado de santidad?
      a: Sí. Está «excluido de la vida de Dios» (Ibíd.).
    - q: ¿Cayó [el hombre] de un estado de libertad?
      a: Sí. «El que comete pecado es esclavo del pecado» (Jua. 8:34).
    - q: ¿Cayó [el hombre] de un estado de reposo?
      a: Sí. «No hay paz —dice mi Dios—para los impíos» (Isa. 57:21).
    - q: ¿Cayó [el hombre] de un estado de comunión con Dios?
      a: Sí, porque Adán y Eva «se escondieron de la presencia del SEÑOR Dios» (Gén. 3:8).
    - q: ¿Cayó [el hombre] de un estado de felicidad?
      a: Sí. «Expulsó, pues, al hombre» (Gén. 3:24).
    - q: ¿Imita toda la humanidad el pecado de sus primeros padres?
      a: Sí. «Pero ellos, como Adán, han transgredido el pacto» (Ose. 6:7).
  - - q: ¿Previó Dios el pecado de Adán?
      a: Sí. «Yo sabía que obrarías con mucha perfidia» (Isa. 48:8).
    - q: Pero, ¿fue Dios el autor del pecado?
      a: No, porque Él es «Dios de fidelidad y sin injusticia, justo y recto es Él» (Deu. 32:4).
    - q: Entonces, ¿proviene la ruina del hombre de sí mismo?
      a: Sí. «Tu destrucción vendrá, Oh Israel» (Ose. 13:9).
  - - q: ¿Debería enseñarnos la Caída de Adán a tener cuidado de nosotros mismos?
      a: Sí. «El que cree que está firme, tenga cuidado, no sea que caiga» (1 Cor. 10:12).
    - q: ¿Y [debería enseñarnos la Caída de Adán] a renunciar a toda confianza en la criatura?
      a: Sí. «Los hombres de baja condición sólo son vanidad, y los de alto rango son mentira» (Sal. 62:9).
