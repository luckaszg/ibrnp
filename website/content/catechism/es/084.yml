# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 84
question: ¿Cuál es el décimo mandamiento?
answer: "El décimo mandamiento es: «No codiciarás la casa de tu prójimo; no codiciarás la mujer de tu prójimo, ni su siervo, ni su sierva, ni su buey, ni su asno, ni nada que sea de tu prójimo»."
sections:
  - - q: ¿Necesita el corazón una restricción?
      a: Sí, porque es «perverso» (Jer. 17:9 [RVR60]).
    - q: ¿Sirve la ley de Dios para restringir el corazón?
      a: Sí. «Porque […] la ley es espiritual» (Rom. 7:14).
    - q: ¿Y es la restricción de los pecados del corazón la forma más eficaz de ser preservados de todos los demás pecados?
      a: Sí. «Limpia primero lo de adentro del vaso y del plato, para que lo de afuera también quede limpio» (Mat. 23:26).
  - - q: ¿Se nos ha prohibido codiciar la casa de otro hombre?
      a: Sí. Como aquellos que «codician […] casas, y las toman» (Miq. 2:2).
    - q: ¿[Se nos ha prohibido codiciar] la esposa de otro hombre?
      a: Sí. Como hizo David, quien, al ver a Betsabé (la esposa de Urías), mandó a preguntar acerca de ella» (2 Sam. 11:3).
    - q: ¿O los bienes de otro hombre?
      a: Sí. «Ni la plata, ni el oro, ni la ropa de nadie he codiciado» (Hch. 20:33).
