# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 33
question: ¿Cómo el Espíritu nos aplica la redención obtenida por Cristo?
answer: El Espíritu nos aplica la redención obtenida por Cristo obrando fe en nosotros, uniéndonos por medio de dicha fe a Cristo en nuestro llamamiento eficaz.
sections:
  - - q: ¿Está limitada la aplicación de la redención por el propósito de Dios?
      a: Sí. «Es para quienes ha sido preparado por mi Padre» (Mat. 20:23).
    - q: ¿[Está limitada la aplicación de la redención] por la compra [que hizo] Cristo?
      a: Sí. «Vosotros no creéis porque no sois de mis ovejas» (Jua. 10:26).
    - q: ¿Y [está limitada la aplicación de la redención] por las operaciones del Espíritu?
      a: Sí, porque fuimos salvos «por medio del lavamiento de la regeneración y la renovación por el Espíritu Santo» (Tit. 3:5).
  - - q: ¿Es necesaria la fe para poder participar de las bendiciones de la redención?
      a: Sí. «El que no cree, ya ha sido condenado» (Jua. 3:18).
    - q: ¿Es [la fe] lo más necesario?
      a: Sí. «Cree solamente [...] todas las cosas son posibles para el que cree» (Mar. 5:36 y 9:23).
    - q: Por tanto, ¿es concedida [la fe] a todos los redimidos de Dios?
      a: Sí. Todos ellos han recibido una fe preciosa (2 Pedro 1:1).
    - q: ¿Se concede la misma medida de fe a todos?
      a: No. «Pero a cada uno de nosotros se nos ha concedido la gracia conforme a la medida del don de Cristo» (Efe. 4:7).
    - q: Pero, ¿tanto la fe débil como la fuerte aprovechan los privilegios del evangelio?
      a: Sí, porque «la justicia de Dios por medio de la fe en Jesucristo [es] para todos los que creen; porque no hay distinción» (Rom. 3:22).
  - - q: ¿Están unidos a Cristo todos los verdaderos creyentes?
      a: Sí. «Yo en ellos, y tú en mí, para que sean perfeccionados en unidad» (Jua. 17:23).
    - q: ¿Están unidas a Cristo las almas de los creyentes?
      a: Sí. «Pero el que se une al Señor, es un espíritu con Él» (1 Cor. 6:17).
    - q: ¿Y [están unidos a Cristo] los cuerpos de los creyentes?
      a: Sí. «¿No sabéis que vuestros cuerpos son miembros de Cristo?» (1 Cor. 6:15).
    - q: ¿Es vital esta unión?
      a: Sí. «Porque yo vivo, vosotros también viviréis» (Jua. 14:19).
    - q: ¿Es duradera e indisoluble [esta unión]?
      a: Sí. «Te desposaré conmigo para siempre» (Ose. 2:19).
    - q: Pero, ¿es inexplicable y misteriosa [esta unión]?
      a: Sí. «Grande es este misterio» (Efe. 5:32).
  - - q: ¿Estamos unidos vitalmente a Cristo por el Espíritu?
      a: Sí. Somos una «morada de Dios en el Espíritu» (Efe. 2:22).
    - q: ¿Y somos [unidos vitalmente a Cristo por el Espíritu] en nuestro llamamiento eficaz?
      a: Sí. «[Fuimos] llamados a la comunión con Su Hijo Jesucristo» (1 Cor. 1:9).
    - q: Pero, ¿existe una unión antes de nuestro llamamiento eficaz?
      a: Sí, porque leemos sobre «la gracia que nos fue dada en Cristo Jesús desde la eternidad» (2 Tim. 1:9).
  - - q: ¿Son llamados eficazmente todos los santos?
      a: Sí. Son «llamados [...] y guardados» (Jud. 1).
    - q: ¿Es Dios el Autor de este llamamiento?
      a: Sí. Él «nos llamó de las tinieblas a Su luz admirable» (1 Pedro 2:9).
    - q: ¿Es la gracia el motivo de este llamamiento?
      a: Sí. «Agradó a Dios (...) [llamarme] por su gracia» (Gál. 1:15 [RVR60]).
    - q: ¿Es el evangelio el medio de este llamamiento?
      a: Sí. «Y fue para esto que Él os llamó mediante nuestro evangelio» (2 Tes. 2:14).
    - q: ¿Es la gloria el fin de este llamamiento?
      a: Sí. «Que os ha llamado a su reino y a su gloria» (1 Tes. 2:12).
    - q: Entonces, ¿deberíamos examinar nuestro derecho a participar de este privilegio?
      a: Sí, «para hacer firme vuestro llamado y elección» (2 Pedro 1:10).
    - q: ¿Y [deberíamos] esforzarnos por perfeccionarlo?
      a: Sí. «Andad como es digno de la vocación con que fuisteis llamados» (Efe. 4:1).
