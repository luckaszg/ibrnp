# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 24
question: ¿Quién es el Redentor de los elegidos de Dios?
answer: El único Redentor de los elegidos de Dios es el Señor Jesucristo, quien —siendo el Hijo eterno de Dios—se hizo Hombre, y así fue —y sigue siendo—Dios y Hombre, en dos naturalezas distintas y una sola Persona, para siempre.
sections:
  - - q: ¿Es Cristo un Redentor?
      a: Sí. «Yo sé que mi Redentor vive» (Job 19:25).
    - q: ¿Cristo redime del pecado?
      a: Sí. Él «se dio a Sí mismo por nosotros, para REDIMIRNOS DE TODA INIQUIDAD» (Tit. 2:14).
    - q: ¿[Cristo redime] de la maldición?
      a: Sí. «Cristo nos redimió de la maldición de la ley» (Gál. 3:13).
    - q: ¿[Cristo redime] de la miseria eterna?
      a: Sí. «Seremos salvos de la ira de Dios por medio de Él» (Rom. 5:9).
    - q: ¿Cristo redime por precio?
      a: Sí. «Quien se dio a Sí mismo en rescate» (1 Tim. 2:6).
    - q: ¿Y [Cristo redime] con poder?
      a: Sí. «LLEVÓCAUTIVA UNA HUESTE DE CAUTIVOS» (Efe. 4:8).
  - - q: ¿Es Cristo el Redentor de los elegidos de Dios de una manera especial?
      a: Sí. Él «[reúne] en uno a los hijos de Dios que están esparcidos» (Jua. 11:52).
    - q: Entonces, ¿necesitaban los elegidos un Redentor?
      a: Sí. «Porque nosotros también en otro tiempo éramos necios y desobedientes» (Tit. 3:3).
    - q: ¿Es Cristo el único Redentor de los elegidos de Dios?
      a: Sí. «Y en ningún otro hay salvación» (Hch. 4:12).
    - q: ¿Es Cristo el único que podría ser el Redentor de los elegidos de Dios?
      a: Sí. «Nadie puede en manera alguna redimir a su hermano, ni dar a Dios rescate por él» (Sal. 49:7).
    - q: ¿No necesitan [los elegidos de Dios] otro [Redentor]?
      a: No, porque Él es «poderoso para salvar» (Isa. 63:1).
  - - q: ¿Es Cristo el Hijo de Dios?
      a: Sí. «Tú eres el Cristo, el Hijo del Dios viviente» (Mat. 16:16).
    - q: ¿Es Cristo Su Hijo unigénito?
      a: Sí. Él es «el unigénito del Padre» (Jua. 1:14).
    - q: ¿[Es Cristo] Su Hijo amado?
      a: Sí. «Enviaré a mi hijo amado; quizá a él lo respetarán» (Luc. 20:13).
    - q: ¿Es el Hijo de la misma naturaleza que el Padre?
      a: Sí. Él es «la expresión exacta de Su naturaleza» (Heb. 1:3).
    - q: ¿Es [el Hijo] igual al Padre?
      a: Sí. Él es «el hombre compañero mío» (Zac. 13:7).
    - q: ¿Es este un misterio que no podemos comprender?
      a: Sí. «¿Cuál es su nombre o el nombre de su hijo? Ciertamente tú lo sabes» (Pro. 30:4).
  - - q: ¿Asumió Cristo, el Hijo de Dios, nuestra naturaleza?
      a: Sí. «El Verbo se hizo carne» (Jua. 1:14).
    - q: ¿Están la Deidad y la humanidad unidas en la Persona de Cristo?
      a: Sí. Él es «Emanuel, Dios con nosotros» (Mat. 1:23).
    - q: ¿Son distintas las dos naturalezas [de Cristo] aunque [están] unidas?
      a: Sí. «De quienes, según la carne, procede el Cristo, el cual es Dios» (Rom. 9:5).
    - q: Entonces, ¿no es la naturaleza humana absorbida por la divina?
      a: No. Él es «Cristo Jesús hombre» (1 Tim. 2:5).
    - q: ¿Y continuará esta unión entre las dos naturalezas?
      a: Sí. «Él conserva Su sacerdocio inmutable puesto que permanece para siempre» (Heb. 7:24).
  - - q: ¿Forman las dos naturalezas en Cristo más de una Persona?
      a: No. Porque los santos «reinarán en vida por medio de uno, Jesucristo» (Rom. 5:17).
    - q: ¿Es gloriosa la Persona de Cristo?
      a: Sí. «Vimos Su gloria» (Jua. 1:14).
    - q: ¿Es la doctrina de la encarnación de Cristo un artículo importante de la religión cristiana?
      a: Sí. «E indiscutiblemente, grande es el misterio de la piedad, Él fue manifestado en carne» (1 Tim. 3:16).
    - q: Por tanto, ¿deberíamos recibir {o aceptar} [la doctrina de la encarnación de Cristo]?
      a: Sí, porque «todo espíritu que no confiesa que Jesucristo ha venido en carne, no es de Dios» (1 Jua. 4:3 [RVR60]).
    - q: ¿Y [deberíamos] regocijarnos en ello?
      a: Sí. Nuestras almas deberían engrandecer al Señor, y nuestros espíritus deberían regocijarse en Dios nuestro Salvador (Luc. 1:46, 47).[^44]
