# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 95
question: ¿Cómo debe ser leída y escuchada la Palabra para que llegue a ser eficaz para salvación?
answer: Para que la Palabra llegue a ser eficaz para salvación, debemos atenderla con diligencia, preparación y oración, recibirla con fe y amor, atesorarla en nuestro corazón y practicarla en nuestra vida.
sections:
  - - q: Para que la Palabra de Dios sea aprovechada, ¿deberíamos atenderla con diligencia?
      a: Sí. «Todo el pueblo estaba pendiente de Él, escuchándole» (Luc. 19:48).
    - q: ¿[Deberíamos] ser inquisitivos con respecto a su significado?
      a: Sí. «¿De quién dice esto el profeta? ¿De sí mismo, o de algún otro?» (Hch. 8:34).
    - q: ¿Y [deberíamos] comparar la Escritura con la Escritura?
      a: Sí. «Combinando pensamientos espirituales con palabras espirituales» (1 Cor. 2:13).
  - - q: ¿También es necesaria la preparación para aprovechar la Palabra?
      a: Sí. «Esdras había dedicado su corazón a estudiar la ley del SEÑOR» (Esd. 7:10).
    - q: ¿Deberíamos dejar de lado las preocupaciones de este mundo con este propósito?
      a: Sí, porque los espinos ahogan la semilla (Mat. 13:7).
    - q: ¿[Deberíamos dejar de lado] las pasiones carnales?
      a: Sí. «Desechando toda malicia y todo engaño, e hipocresías, envidias y toda difamación» (1 Ped. 2:1).
    - q: ¿Y todos los prejuicios preconcebidos?
      a: "Sí. No como aquellos que decían: «¿Qué quiere decir este palabrero?» (Hch. 17:18)."
    - q: ¿Deberíamos orar por nuestros ministros?
      a: Sí. «Para que me sea dada palabra al abrir mi boca» (Efe. 6:19).
    - q: ¿[Deberíamos orar] por nosotros mismos?
      a: Sí. «Enséñame tus ordenanzas» (Sal. 119:108).
    - q: ¿También deberíamos venir {a la Palabra} con deseo?
      a: Sí. «Desead como niños recién nacidos, la leche pura de la palabra» (1 Ped. 2:2).
    - q: ¿[Deberíamos venir {a la Palabra}] con expectativa?
      a: Sí. «Alma mía, espera en silencio solamente en Dios, pues de Él viene mi esperanza» (Sal. 62:5).
    - q: ¿Y será en gran medida para nuestra ventaja tal preparación del corazón?
      a: Sí. «Tú dispones su corazón, y haces atento tu oído» (Sal. 10:17 [RVR60]).
    - q: Pero, ¿es la falta de preparación una excusa para el descuido del deber?
      a: No. «Pues una gran multitud del pueblo […] no se habían purificado; no obstante, comieron la Pascua» (2 Cró. 30:18).
  - - q: ¿Debería ser recibida la Palabra con fe?
      a: Sí. Así leemos sobre «el oír con fe» (Gál. 3:2).
    - q: ¿[Debería ser recibida] con amor?
      a: Sí. «Mira cuánto amo tus preceptos» (Sal. 119:159).
    - q: ¿Y será la ausencia de esto un obstáculo para aprovechar {la Palabra}?
      a: Sí. «No recibieron el amor de la verdad para ser salvos» (2 Tes. 2:10).
  - - q: ¿Deberíamos escuchar la Palabra con reverencia?
      a: Sí. «Cuando [Esdras] abrió [el libro], todo el pueblo se puso en pie» (Neh. 8:5).
    - q: ¿[Deberíamos escuchar la Palabra] con discernimiento {lit. juicio}?
      a: Sí. «Porque el oído distingue las palabras, como el paladar prueba la comida» (Job 34:3).
    - q: ¿Y con cuidado?
      a: Sí. «Tened cuidado de cómo oís» (Luc. 8:18).
    - q: ¿Debemos evitar los pensamientos errantes al escuchar {la Palabra}?
      a: Sí. «Sus corazones andan tras sus ganancias» (Eze. 33:31).
    - q: ¿[Debemos evitar] las miradas {lit. los ojos} errantes?
      a: Sí. «Los ojos de todos […] estaban fijos en Él» (Luc. 4:20).
    - q: ¿Y el sueño y la somnolencia?
      a: Sí. «¿Conque no pudisteis velar una hora conmigo?» (Mat. 26:40).
  - - q: ¿Deberíamos atesorar lo que escuchamos {de la Palabra}?
      a: Sí. «Acuérdate, pues, de lo que has recibido y oído, y guárdalo» (Apo. 3:3).
    - q: Por tanto, ¿deberíamos meditar en ello?
      a: Sí. «Pero [ella] atesoraba todas estas cosas, reflexionando sobre ellas en su corazón» (Luc. 2:19).
    - q: ¿[Deberíamos] hablar de ello?
      a: Sí. «Y hablarás de ellas cuando te sientes en tu casa y cuando andes por el camino» (Deu. 6:7).
    - q: ¿Y es esto necesario para que podamos sacar provecho de la Palabra?
      a: Sí. «Por el cual también sois salvos, si retenéis la palabra que os prediqué» (1 Cor. 15:2).
  - - q: ¿También es indispensable que practiquemos lo que escuchamos?
      a: Sí. «Tal como has dicho es nuestro deber hacer» (Esd. 10:12).
    - q: ¿Es esta la forma de obtener la bendición?
      a: Sí. «Este será bienaventurado en lo que hace» (Stg. 1:25).
    - q: ¿Y [es esta la forma] de evitar la maldición?
      a: "Sí, porque algunos dirán: «“enseñaste en nuestras calles”; y El dirá: “Os digo que no sé de dónde sois”» (Luc. 13:26, 27).[^106]"
notes:
  "106": Aunque la referencia que aparece en el original es Lucas 13:26, el autor también está citando el versículo 27.
