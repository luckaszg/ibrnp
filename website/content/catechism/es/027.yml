# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 27
question: ¿Cómo ejerce Cristo el oficio de Profeta?
answer: Cristo ejerce el oficio de Profeta al revelarnos, por Su Palabra y Su Espíritu, la voluntad de Dios para nuestra salvación.
sections:
  - - q: ¿Fue predicho en el Antiguo Testamento el oficio profético de Cristo?
      a: Sí. «Un profeta de en medio de ti, de tus hermanos, como yo, te levantará el SEÑOR tu Dios» (Deu. 18:15).
    - q: Entonces, ¿fue Moisés un gran profeta?
      a: Sí. «Desde entonces no ha vuelto a surgir en Israel un profeta como Moisés» (Deu. 34:10).
    - q: ¿Fue Cristo levantado de entre Sus hermanos al igual que Moisés?
      a: Sí, porque Él fue «tomado de entre los hombres» (Heb. 5:1).
    - q: ¿Fue Él como Moisés en cuanto a mansedumbre?
      a: Sí. «Aprended de mí, que soy manso» (Mat. 11:29).
    - q: ¿Y [fue Él como Moisés] en cuanto a fidelidad?
      a: Sí. «Os he dado a conocer todo lo que he oído de mi Padre» (Jua. 15:15).
    - q: ¿Confirmó Él Su doctrina con milagros al igual que Moisés?
      a: Sí. «Las obras que yo hago, dan testimonio de mí» (Jua. 5:36).
    - q: Pero, ¿fue Él más grande que Moisés?
      a: Sí, porque «Moisés fue fiel en toda la casa de Dios como siervo, pero Cristo como Hijo» (Heb. 3:5, 6).[^48]
  - - q: ¿Predijo Cristo eventos futuros como Profeta?
      a: Sí. «El testimonio de Jesús es el espíritu de la profecía» (Apo. 19:10).
    - q: ¿Abrió Él el camino de la salvación por medio de Sí mismo?
      a: Sí. «La gracia y la verdad fueron hechas realidad por medio de Jesucristo» (Jua. 1:17).
    - q: ¿Hizo Él una revelación más completa de lo que se había hecho antes sobre el estado futuro?
      a: Sí. «Sacó a la luz la vida y la inmortalidad por medio del evangelio» (2 Tim. 1:10).
    - q: ¿Reveló Él toda la voluntad de Dios?
      a: Sí. «Yo les he dado las palabras que me diste» (Jua. 17:8).
  - - q: ¿Fue Cristo un Maestro divino?
      a: Sí. «Sabemos que has venido de Dios como maestro» (Jua. 3:2).
    - q: ¿Fue Él un Maestro [que enseñó con] claridad?
      a: Sí. «Ahora hablas claramente» (Jua. 16:29).
    - q: ¿Fue Él un Maestro prudente?
      a: Sí. «Les hablaba la palabra, según podían oírla» (Mar. 4:33).
    - q: ¿Fue Él un Maestro afectuoso?
      a: Sí. «Se maravillaban de las palabras llenas de gracia que salían de Su boca» (Luc. 4:22).
    - q: ¿Fue Él un Maestro poderoso?
      a: Sí. «Les enseñaba como uno que tiene autoridad» (Mat. 7:29).
    - q: ¿Fue Él un maestro elocuente?
      a: Sí. Él tenía «lengua de sabios» (Isa. 50:4 [RVR60]).
    - q: Pero, ¿fue el resultado de Su enseñanza igual a Su capacidad para enseñar?
      a: No. «TODO EL DÍA HE EXTENDIDO MIS MANOS A UN PUEBLODESOBEDIENTE Y REBELDE» (Rom. 10:21).
  - - q: ¿Ejerció Cristo el oficio de Profeta antes de Su encarnación?
      a: Sí, porque Él «fue y predicó a los espíritus encarcelados» (1 Pedro 3:19).
    - q: ¿Ejerció Él este oficio mientras estuvo en la Tierra?
      a: Sí. «Jesús iba [...] enseñando en sus sinagogas» (Mat. 4:23).
    - q: ¿Y ejerce [Él este oficio] en el Cielo?
      a: Sí. «Nos amonesta desde el cielo» (Heb. 12:25).
    - q: ¿Revela Cristo la voluntad de Dios de manera objetiva a través de Su Palabra?
      a: Sí. «[Estas] se han escrito para que creáis» (Jua. 20:31).
    - q: ¿[Revela Cristo la voluntad de Dios] de manera subjetiva por medio de Su Espíritu?
      a: Sí. «Cuando Él, el Espíritu de verdad, venga, os guiará a toda la verdad» (Jua. 16:13).
    - q: ¿Y es lo último tan necesario como lo primero para nuestra salvación?
      a: Sí, porque «si alguno no tiene el Espíritu de Cristo, el tal no es de Él» (Rom. 8:9).
  - - q: ¿Deberíamos aprender de este Maestro?
      a: Sí. «A Él oíd» (Mat. 17:5).
    - q: ¿Y corremos riesgo si no aprendemos de Él?
      a: Sí. «El que no preste atención a aquel Profeta, será totalmente destruido de entre el pueblo» (Hch. 3:23).
notes:
  "48": Aunque la referencia que aparece en el original es Hebreos 3:5, el autor también está citando el versículo 6.
