# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 26
question: ¿Qué oficios ejerce Cristo como nuestro Redentor?
answer: Cristo, como Redentor nuestro, ejerce los oficios de Profeta, Sacerdote y Rey, tanto en Su estado de humillación como en Su estado de exaltación.
sections:
  - - q: ¿Es el Salvador de los elegidos el Ungido de Dios?
      a: Sí. «Dios, tu Dios, te ha ungido con óleo de alegría más que a tus compañeros» (Sal. 45:7).
    - q: ¿Es por eso que Él es llamado Cristo?
      a: Sí. «Hemos hallado al Mesías [que traducido quiere decir, Cristo]» (Jua. 1:41).
    - q: ¿Fue designado Cristo para Su obra?
      a: Sí. «Él estaba preparado desde antes de la fundación del mundo» (1 Pedro 1:20).
    - q: ¿Se le dotó de autoridad suficiente para cumplir Su obra?
      a: Sí. Él fue marcado con el sello de Dios el Padre (Jua. 6:27).
    - q: ¿Estaba Él adecuadamente cualificado para el cumplimiento de Su obra?
      a: Sí. Dios le dio el Espíritu sin medida (Jua. 3:34).
    - q: ¿Fue Él aceptado y aprobado en Su obra?
      a: Sí. «Este es mi Hijo amado en quien me he complacido» (Mat. 3:17).
    - q: ¿Y concluyó Él Su obra?
      a: Sí. «He acabado la obra que me diste que hiciese» (Jua. 17:4 [RVR60]).
  - - q: ¿Fue nuestra salvación el fin principal de lo que Cristo hizo y por el que sufrió?
      a: Sí. «Él sufrió, el justo por los injustos, para llevarnos a Dios» (1 Pedro 3:18).
    - q: Por tanto, ¿es Él para Su pueblo todo lo que ellos necesitan?
      a: Sí. «Cristo es todo» (Col. 3:11).
    - q: ¿Es Cristo Profeta?
      a: Sí. Él sería llamado «profeta del Altísimo» (Luc. 1:76).
    - q: ¿Es Cristo Sacerdote?
      a: Sí. Él es el «Sumo Sacerdote de nuestra fe» (Heb. 3:1).
    - q: ¿Es Cristo Rey?
      a: Sí. «He consagrado a mi Rey sobre Sion, mi santo monte» (Sal. 2:6).
  - - q: ¿Ejerce Cristo estos oficios sabiamente?
      a: Sí. «Mi siervo prosperará» (Isa. 52:13).
    - q: ¿[Ejerce Cristo estos oficios] con fidelidad?
      a: Sí. Él «fue fiel al que le designó» (Heb. 3:2).
    - q: ¿[Ejerce Cristo estos oficios] con diligencia?
      a: Sí. «¿Acaso no sabíais que me era necesario estar en los negocios de mi Padre?» (Luc. 2:49).
    - q: ¿[Ejerce Cristo estos oficios] con éxito?
      a: Sí. «No se desanimará ni desfallecerá» (Isa. 42:4).
  - - q: ¿Ejerció Cristo estos oficios en Su estado de humillación?
      a: Sí. «Yo te glorifiqué en la tierra» (Jua. 17:4).
    - q: ¿Y ejerce [Cristo estos oficios] en Su estado de exaltación?
      a: Sí. Él «[se presenta] ahora en la presencia de Dios por nosotros» (Heb. 9:24). Cuando Cristo ejerce efectivamente un oficio,
    - q: ¿ejerce todos?
      a: Sí, porque Él es tanto «Príncipe» como «Salvador» (Hch. 5:31).
    - q: ¿Y debe Él ser recibido en todos [Sus oficios]?
      a: Sí. «¿Está dividido Cristo?» (1 Cor. 1:13).
