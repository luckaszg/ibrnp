# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 57
question: ¿Cuáles son las razones anexas al segundo mandamiento?
answer: "Las razones anexas al segundo mandamiento son: la soberanía de Dios sobre nosotros, Su derecho de propiedad sobre nosotros y el celo que Él tiene por Su propia adoración."
sections:
  - - q: ¿Es Dios el Señor?
      a: Sí. «Yo soy el SEÑOR» (Lev. 19:4).
    - q: ¿Es esta una razón por la que debemos adorarlo?
      a: Sí. «Doblemos la rodilla ante el SEÑOR nuestro Hacedor» (Sal. 95:6).
    - q: Por tanto, ¿es la idolatría un acto de rebelión contra Él?
      a: Sí. «Nos hemos rebelado y nos hemos apartado de [Ti]» (Dan. 9:5).
    - q: ¿Es Él nuestro Dios?
      a: Sí. «Yo soy el SEÑOR vuestro Dios» (Lev. 26:13).
    - q: ¿Es esta otra razón por la que debemos adorarlo?
      a: Sí. «Serviremos al SEÑOR, porque Él es nuestro Dios» (Jos. 24:18).
    - q: ¿Y [por la que debemos] aferrarnos a Él?
      a: Sí, porque «¿ha cambiado alguna nación sus dioses?» (Jer. 2:11).
    - q: ¿Y es una violación del pacto si no [lo adoramos y nos aferramos a Él]?
      a: Sí. «Se volverán a otros dioses y los servirán […] y quebrantarán mi pacto» (Deu. 31:20).
  - - q: ¿Es Dios un Dios celoso?
      a: Sí. «El SEÑOR tu Dios, que está en medio de ti, es Dios celoso» (Deu. 6:15).
    - q: ¿Implican [Sus] celos el colmo de la ira y la indignación?
      a: Sí. «Dios [es] celoso […] el SEÑOR se venga […] y guarda rencor a sus enemigos» (Nah. 1:2).
    - q: ¿Y no hay nada que despierte más los celos de Dios que la idolatría?
      a: No. «Ellos me han provocado a celo con lo que no es Dios; me han irritado con sus ídolos» (Deu. 32:21).
  - - q: ¿Visitará Dios la iniquidad de los idólatras?
      a: Sí. «¿No he de castigar a este pueblo {por estas cosas}?» (Jer. 5:9).
    - q: ¿Y [la visitará] en los hijos de ellos?
      a: Sí. «Que castigas la iniquidad de los padres en [el seno de] sus hijos» (Jer. 32:18).
    - q: ¿Y en los hijos de sus hijos?
      a: Sí. «Hasta la tercera y cuarta generación» (Éxo. 34:7).
    - q: No obstante, ¿caerán sus juicios con más fuerza sobre los que hacen suyos los pecados de sus padres?
      a: Sí. «He aquí, vosotros os habéis levantado en lugar de vuestros padres, prole de hombres pecadores, para añadir aún más a la ardiente ira del SEÑOR» (Núm. 32:14).
  - - q: En medio de la apostasía más generalizada, ¿hay algunos que aman a Dios y guardan Sus mandamientos?
      a: Sí. «Dejaré siete mil en Israel, todas las rodillas que no se han doblado ante Baal» (1 Rey. 19:18).
    - q: ¿Pueden esperar los tales estar exentos de los juicios desoladores cuando vengan?
      a: Sí. «Pon una señal en la frente de los hombres que gimen y se lamentan» (Eze. 9:4).
    - q: ¿Y [pueden] encontrar muestras peculiares de la consideración divina?
      a: Sí, porque «la misericordia del SEÑOR es desde la eternidad hasta la eternidad, para los que le temen» (Sal. 103:17).
