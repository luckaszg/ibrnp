# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 112
question: ¿Qué oramos en la quinta petición?
answer: "En la quinta petición, que es: «Y perdónanos nuestras deudas, como también nosotros hemos perdonado a nuestros deudores», oramos que Dios, por causa de Cristo, perdone gratuitamente todos nuestros pecados, lo cual se nos anima a pedir aún más porque, por Su gracia, se nos capacita para perdonar de corazón a otros."
sections:
  - - q: ¿Es el pecado una deuda?
      a: Sí. «Cierto prestamista tenía dos deudores» (Luc. 7:41).
    - q: ¿Es una gran deuda?
      a: Sí. «Son diez mil talentos» (Mat. 18:24).
    - q: ¿Es una deuda que va en aumento?
      a: Sí, porque añadimos «pecado sobre pecado» (Isa. 30:1).
    - q: ¿Lleva Dios una cuenta exacta de esta deuda?
      a: Sí. «Sellada está en un saco mi transgresión, y tienes cubierta mi iniquidad» (Job 14:17).
    - q: ¿Y pedirá cuentas por ello?
      a: Sí. «Cualquiera que no oiga […] yo mismo le pediré cuenta» (Deu. 18:19).
  - - q: ¿Tendemos a pensar que podemos pagar esta deuda?
      a: Sí. «“Ten paciencia conmigo y te pagaré”» (Mat. 18:29).
    - q: Pero, ¿realmente podemos hacerlo?
      a: No. «No teniendo ellos con qué pagar» (Luc. 7:42).
    - q: ¿Tenemos algún amigo en la tierra que pueda pagarla por nosotros?
      a: No. «Llama ahora, ¿habrá quién te responda?; ¿Y a cuál de los santos te volverás?» (Job 5:1).
    - q: Sin embargo, ¿hay en el Cielo un amigo que puede hacerlo?
      a: Sí. Jesucristo, quien «es la propiciación por nuestros pecados» (1 Jua. 2:2).
  - - q: ¿Perdona Dios las deudas?
      a: Sí. «En Ti hay perdón» (Sal. 130:4).
    - q: ¿Las perdona gratuitamente?
      a: Sí. «El perdón de nuestros pecados es según las riquezas de Su gracia» (Efe. 1:7).
    - q: ¿[Las perdona] de una manera total?
      a: Sí. «Habiéndonos perdonado todos los delitos» (Col. 2:13).
    - q: ¿Y de manera definitiva?
      a: Sí. «No recordaré más su pecado» (Jer. 31:34).
  - - q: ¿Deberíamos orar entonces por el perdón de nuestras deudas?
      a: Sí. «No entres en juicio con tu siervo» (Sal. 143:2).
    - q: ¿Deberíamos orar para que Dios perdone {lit. remita} el castigo presente por el pecado?
      a: Sí. «Perdona, te ruego, la iniquidad de este pueblo […] así como has perdonado a este pueblo desde Egipto hasta aquí» (Núm. 14:19).
    - q: ¿[Deberíamos orar] para que Él nos libre de Su eterna ira por causa del pecado?
      a: "Sí. «Le diré a Dios: “No me condenes”» (Job 10:2)."
    - q: ¿Y para que Él nos restituya el consuelo divino, perdido por causa del pecado?
      a: Sí. «Restitúyeme el gozo de tu salvación, y sostenme con un espíritu de poder» (Sal. 51:12).
  - - q: ¿Deberíamos orar por el perdón del pecado de una manera sentida?
      a: "Sí. Como el publicano que se golpeaba el pecho, diciendo: «“Dios, ten piedad de mí, pecador”» (Luc. 18:13)."
    - q: ¿[Deberíamos orar] con sinceridad?
      a: Sí. «Presta oído a mi oración, que no es de labios engañosos» (Sal. 17:1).
    - q: ¿[Deberíamos orar] de una manera importuna?
      a: Sí. «¡Oh Señor, escucha! ¡Señor, perdona!» (Dan. 9:19).
    - q: ¿[Deberíamos orar] de una manera argumentativa?
      a: Sí. «¿Por qué no perdonas mi transgresión y quitas mi iniquidad?» (Job 7:21).
    - q: ¿Podemos alegar aquí la bondad de la naturaleza de Dios?
      a: Sí. «Pues tú, Señor, eres bueno y perdonador» (Sal. 86:5).
    - q: ¿[Podemos alegar aquí] lo grande de nuestras transgresiones?
      a: Sí. «Perdona mi iniquidad, porque es grande» (Sal. 25:11).
    - q: ¿Y la gloria de Su nombre?
      a: Sí. «Perdona nuestros pecados por amor de tu nombre» (Sal. 79:9).
    - q: Pero, sobre todo, ¿deberíamos alegar el mérito y la expiación de Cristo?
      a: Sí. «Mira, oh Dios, escudo nuestro, y contempla el rostro de tu ungido» (Sal. 84:9).
  - - q: ¿Deberíamos perdonar a los que nos han ofendido?
      a: Sí. «Soportándoos unos a otros y perdonándoos unos a otros» (Col. 3:13).
    - q: ¿Deberíamos hacerlo con liberalidad?
      a: Sí. «“¿No deberías tú también haberte compadecido de tu consiervo, así como yo me compadecí de ti?”» (Mat. 18:33).
    - q: ¿[Deberíamos hacerlo] de todo corazón?
      a: Sí. Cada uno de nosotros debe perdonar de corazón la ofensa de nuestros hermanos (v. 35).
    - q: ¿[Deberíamos hacerlo] de una manera total?
      a: Sí. «Ningún agravio me habéis hecho» (Gál. 4:12).
    - q: ¿[Deberíamos hacerlo] de forma inmediata?
      a: Sí. «Ve, reconcíliate […] con tu hermano» (Mat. 5:24).
    - q: ¿[Deberíamos hacerlo] una y otra vez?
      a: Sí. «No te digo hasta siete veces, sino hasta setenta veces siete» (Mat. 18:22).
    - q: ¿Y debemos no solo perdonar, sino también olvidar?
      a: » Sí. «Hermanos, no os quejéis unos contra otros» (Stg. 5:9).
  - - q: ¿Es esto prudente?
      a: Sí. «La discreción del hombre le hace lento para la ira» (Pro. 19:11).
    - q: ¿[Es] honorable?
      a: Sí. «Y su gloria es pasar por alto una ofensa» (Ibíd.).
    - q: ¿[Es] beneficioso?
      a: Sí. «Porque si perdonáis a los hombres sus transgresiones, también vuestro Padre celestial os perdonará a vosotros» (Mat. 6:14).
    - q: ¿Y podemos esperar ser perdonados sin perdonar?
      a: No. «Pero si no perdonáis a los hombres, tampoco vuestro Padre perdonará vuestras transgresiones» (v. 15).
