# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 11
question: ¿Cómo ejecuta Dios Sus decretos?
answer: Dios ejecuta Sus decretos en las obras de la creación y la providencia.
sections:
  - - q: ¿Ejecuta Dios Sus propios decretos?
      a: Sí. «Mi propósito será establecido, y todo lo que quiero realizaré» (Isa. 46:10).
    - q: ¿Ejecuta Dios Sus decretos en las obras de la creación?
      a: Sí. «Por tu voluntad existen y fueron creadas» (Apo. 4:11).
    - q: ¿Fue la creación la primera obra externa en la que Dios comenzó a ejecutar Sus decretos?
      a: Sí. «En el principio creó Dios los cielos y la tierra» (Gén. 1:1).
    - q: ¿Ejecutó Dios Sus decretos en las obras de la providencia también?
      a: Sí. «Él actúa conforme a su voluntad en el ejército del cielo y entre los habitantes de la tierra» (Dan. 4:35).
  - - q: ¿Hace Dios uso de los ángeles buenos para la ejecución de Sus decretos?
      a: Sí. Ellos «[ejecutan] su mandato» (Sal. 103:20).
    - q: ¿[Hace Dios uso] de los ángeles malvados [para la ejecución de Sus decretos]?
      a: "Sí. «Seré espíritu de mentira en boca de todos sus profetas. Entonces Él dijo: Ve y hazlo así» (1 Reyes 22:22)."
    - q: ¿[Hace Dios uso] de los hombres [para la ejecución de Sus decretos]?
      a: "Sí. «Él que dice de Ciro: él es mi pastor, y él cumplirá todos mis deseos» (Isa. 44:28)."
    - q: ¿[Hace Dios uso] de criaturas inferiores [para la ejecución de Sus decretos]?
      a: Sí. «El SEÑOR silbará a la mosca que está en lo más remoto de los ríos de Egipto» (Isa. 7:18).
    - q: Pero, ¿obra Dios a veces sin instrumentos?
      a: Sí. «Mi propio brazo trajo salvación»[^29] (Isa. 63:5).
  - - q: ¿Son inextricables[^30] las obras de Dios?
      a: Sí. «El hombre no descubre la obra que Dios ha hecho desde el principio y hasta el fin» (Ecl. 3:11).
    - q: ¿Pueden ser enmendadas [las obras de Dios]?
      a: No. «Todo lo que Dios hace [...] no hay nada que añadirle y no hay nada que quitarle» (Ecl. 3:14).
    - q: ¿Deben ser estudiadas [las obras de Dios]?
      a: Sí. Son «buscadas por todos los que se deleitan en ellas» (Sal. 111:2).
    - q: ¿Y deberíamos aprender de Dios, primero a determinar [algo], y luego a hacerlo?
      a: Sí. «Decidirás una cosa, y se te cumplirá» (Job 22:28).
