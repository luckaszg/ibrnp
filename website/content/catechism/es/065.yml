# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 65
question: ¿Cómo debe ser santificado el día de reposo?
answer: El día de reposo debe ser santificado mediante un santo descanso todo ese día, {descansando} incluso de aquellas ocupaciones y recreaciones de este mundo que son lícitas en otros días, y pasando todo el tiempo en los ejercicios públicos y privados de la adoración a Dios, excepto aquella porción de tiempo que deba ser ocupada en obras de necesidad y misericordia.
sections:
  - - q: ¿Debemos santificar el día de reposo?
      a: Sí. «“Guardarás el día de reposo para santificarlo”» (Deu. 5:12).
    - q: ¿Debe ser santificado el día de reposo en su totalidad?
      a: Sí. «Cuando iba oscureciendo a las puertas de Jerusalén, antes del día de reposo, ordené que se cerraran las puertas y que no las abrieran hasta después del día de reposo» (Neh. 13:19).
  - - q: ¿Debemos guardar el día de reposo como un día de descanso?
      a: Sí. Es un «día de completo reposo» (Lev. 23:3).
    - q: ¿Y no [debemos] hacer ningún trabajo ese día?
      a: No. «No haréis trabajo alguno» (Ibíd.).
    - q: ¿Debemos evitar las labores que se permiten en otros días?
      a: Sí. «“Guardaos […] de llevar carga en día de reposo”» (Jer. 17:21).
    - q: ¿[Debemos evitar las labores] que se requieren en otros días?
      a: Sí. «Seis días recogeréis [el maná], pero el séptimo día, día de reposo, no habrá nada» (Éxo. 16:26).
    - q: ¿Y se extiende esto a las temporadas de mayor ocupación del año?
      a: Sí. «Aun en el tiempo de arar y de segar, descansarás» (Éxo. 34:21).
    - q: Por tanto, ¿es ilícito comprar y vender en el día de reposo?
      a: Sí. «Y les amonesté por el día en que vendían los víveres» (Neh. 13:15).
  - - q: ¿Se debería perseverar en {lit. mantener} el culto público en el día de reposo?
      a: Sí. Es una «santa convocación» (Lev. 23:3).
    - q: ¿Debemos hacer conciencia de asistir al culto público?
      a: Sí. «No dejando de congregarnos» (Heb. 10:25).
    - q: ¿[Debemos] asistir temprano?
      a: Sí. «Te buscaré con afán {o temprano}» (Sal. 63:1).
    - q: ¿Y [debemos] asistir {más} tarde?
      a: Sí. «Bendecid al SEÑOR todos los siervos del SEÑOR, los que servís por la noche en la casa del SEÑOR» (Sal. 134:1).
    - q: Sin embargo, ¿debemos limitar nuestros servicios religiosos a la casa de Dios?
      a: No. «Es día de reposo al SEÑOR dondequiera que habitéis» (Lev. 23:3).
  - - q: ¿Es la oración una parte del servicio {o culto} del día de reposo?
      a: Sí. «Un día de reposo salimos fuera de la puerta, junto al río, donde solía hacerse la oración» (Hch. 16:13 [RVR60]).
    - q: ¿Es el canto de salmos [una parte del servicio {o culto} del día de reposo]?
      a: Sí. Tenemos un salmo o cántico para el día de reposo (Sal. 92).
    - q: ¿Es la lectura de la Palabra [una parte del servicio {o culto} del día de reposo]?
      a: Sí. «Los profetas […] se leen todos los días de reposo» (Hch. 13:27).
    - q: ¿Es el oír [la Palabra una parte del servicio {o culto} del día de reposo]?
      a: Sí. «El siguiente día de reposo casi toda la ciudad se reunió para oír la palabra del Señor» (Hch. 13:44).
    - q: ¿Y la comunión {lit. conversación} cristiana?
      a: Sí. «Conversaban entre sí acerca de todas estas cosas que habían acontecido» (Luc. 24:14).
  - - q: ¿Deberíamos guardar el día de reposo con reverencia?
      a: Sí. «Guarda tus pasos cuando vas a la casa de Dios» (Ecl. 5:1).
    - q: ¿[Deberíamos guardarlo] con diligencia?
      a: Sí. Debemos aferrarnos a guardar «el día de reposo sin profanarlo» (Isa. 56:2).
    - q: ¿Y debemos honrar a Dios en todos los deberes del día de reposo?
      a: Sí. Debemos llamar al día de reposo «honorable», y honrarlo (Isa. 58:13).
    - q: ¿Son los hombres propensos a observar cómo guardamos el día de reposo?
      a: Sí. «Cuando Jesús entró en casa de uno de los principales de los fariseos un día de reposo […] ellos le estaban observando cuidadosamente» (Luc. 14:1).
    - q: ¿Y esto debería hacernos circunspectos?
      a: "Sí. «Guíame por senda llana por causa de mis enemigos [lectura al margen: los que me asechan]» (Sal. 27:11)."
  - - q: ¿Se deben hacer obras de caridad y misericordia en el día de reposo?
      a: Sí. «¿No debía ser libertada de esta ligadura en día de reposo?» (Luc. 13:16).
    - q: ¿Y obras de necesidad?
      a: Sí. «Jesús pasó por entre los sembrados en el día de reposo; sus discípulos tuvieron hambre, y empezaron a arrancar espigas y a comer» (Mat. 12:1).
    - q: ¿Están obligados los cristianos a guardar el día de reposo con el mismo rigor que los judíos?
      a: No. «A libertad fuisteis llamados» (Gál. 5:13).
    - q: No obstante, ¿deberían tener cuidado de no abusar de su libertad?
      a: Sí. «No uséis la libertad como pretexto para la carne» (Ibíd.).
    - q: ¿Y es la conciencia, según es dirigida por la Palabra, el único juez en este caso?
      a: Sí. «Dichoso el que no se condena a sí mismo en lo que aprueba» (Rom. 14:22).
notes:
  "78": Aunque la referencia que aparece en el original es Éxodo 20:10, el autor también está citando el versículo 9.
