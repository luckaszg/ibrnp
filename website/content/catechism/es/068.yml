# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 68
question: ¿Cuál es el quinto mandamiento?
answer: "El quinto mandamiento es: «Honra a tu padre y a tu madre, para que tus días sean prolongados en la tierra que el SEÑOR tu Dios te da»."
sections:
  - - q: ¿Es la piedad hacia Dios una rama necesaria de la verdadera religión?
      a: Sí. «A la perseverancia, [añadid] piedad» (2 Ped. 1:6).
    - q: ¿Y es la justicia para con los hombres una rama de la verdadera religión?
      a: Sí. «Procurad siempre lo bueno los unos para con los otros, y para con todos» (1 Tes. 5:15).
    - q: ¿Exige la ley de Dios ambas cosas?
      a: Sí. «Practicar la justicia, amar la misericordia, y andar humildemente con tu Dios» (Miq. 6:8).
    - q: ¿Enseña la gracia del evangelio ambas cosas?
      a: Sí. «Vivamos en este mundo sobria, justa y piadosamente» (Tit. 2:12).
    - q: ¿Han practicado los hombres buenos ambas cosas?
      a: Sí. «Por esto, yo también me esfuerzo por conservar siempre una conciencia irreprensible delante de Dios y delante de los hombres» (Hch. 24:16).
    - q: Por lo tanto, ¿jamás deben ser separadas estas dos cosas?
      a: No. «Por tanto, lo que Dios ha unido, ningún hombre lo separe» (Mat. 19:6).
  - - q: ¿Están incluidos los reyes y gobernadores supremos bajo el título general de padres?
      a: Sí. «Bendito el reino de nuestro padre David» (Mar. 11:10).
    - q: ¿[Están incluidos] los pastores de las iglesias [bajo el título general de padres]?
      a: Sí. «No tenéis muchos padres; pues en Cristo Jesús yo os engendré por medio del evangelio» (1 Cor. 4:15).
    - q: ¿[Están incluidos] los cabezas {lit. amos} de familia [bajo el título general de padres]?
      a: Sí. Los siervos de Naamán lo llamaron «Padre mío» (2 Rey. 5:13).
    - q: ¿Y todos los superiores, ya sea en edad o en oficio, en dones o en dotes?
      a: Sí. «Oíd, hijos, la instrucción de un padre» (Pro. 4:1).
    - q: ¿Se debe dar el debido respeto a todos ellos de acuerdo con sus diferentes puestos y relaciones?
      a: Sí. «Al que [deban] honor, [pagad] honor» (Rom. 13:7).
