# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 101
question: ¿Cuál es el deber de aquellos que son bautizados correctamente?
answer: El deber de aquellos que son bautizados correctamente es darse a sí mismos a alguna iglesia local y ordenada de Jesucristo, para que anden intachablemente en todos los mandamientos y ordenanzas del Señor.
sections:
  - - q: ¿Hay una iglesia invisible de Cristo?
      a: Sí. «A la asamblea general e iglesia de los primogénitos» (Heb. 12:23).
    - q: ¿Se compone de todos los elegidos?
      a: Sí. «Que están inscritos en los cielos» (Ibíd.).
    - q: ¿Hay una iglesia visible de Cristo en la Tierra?
      a: Sí, porque leemos que Saulo «hacía estragos en la iglesia» (Hch. 8:3).
    - q: ¿Se compone de creyentes profesantes?
      a: Sí. «Entonces los que habían recibido su palabra fueron bautizados; y se añadieron {a la iglesia}» (Hch. 2:41).
    - q: ¿Se divide esta Iglesia en asambleas independientes {lit. separadas} que también se llaman iglesias?
      a: Sí. «Entretanto la iglesia gozaba de paz» (Hch. 9:31).
    - q: ¿Eran nacionales o provinciales estas iglesias?
      a: No, porque leemos sobre las iglesias en Galacia (Gál. 1:2).
  - - q: ¿Se compone una iglesia local evangélica {lit. del evangelio} de tantos {cristianos} como puedan reunirse cómodamente en un solo lugar?
      a: Sí. «Cuando llegaron y reunieron a la iglesia, informaron de todas las cosas que Dios había hecho con ellos» (Hch. 14:27).
    - q: ¿Es una sociedad voluntaria?
      a: Sí. «Primeramente se dieron a sí mismos al Señor, y luego a nosotros por la voluntad de Dios» (2 Cor. 8:5).
    - q: ¿[Es] una {sociedad} autoritativa?
      a: Sí. «Cuando vosotros estéis reunidos […] con el poder de nuestro Señor Jesús, entregad a ese tal a Satanás» (1 Cor. 5:4, 5).[^110]
    - q: ¿Debería ser una {sociedad} ordenada?
      a: Sí. «Regocijándome al ver vuestra buena disciplina {lit. buen orden}» (Col. 2:5).
    - q: ¿Y reconoce Cristo tales iglesias como Suyas?
      a: Sí. «Escribe en un libro lo que ves, y envíalo a las siete iglesias que están en Asia» (Apo. 1:11 [RVR60]).
  - - q: ¿Es deber de los creyentes bautizados apartarse del mundo?
      a: Sí. «SALID DE EN MEDIO DE ELLOS Y APARTAOS» (2 Cor. 6:17).
    - q: ¿[Es deber de los creyentes bautizados] unirse a alguna iglesia local de Cristo?
      a: Sí. «[Pablo] trataba de juntarse con los discípulos» (Hch. 9:26).
    - q: ¿Y deberían hacer esto poco después de su bautismo?
      a: Sí. «Fueron bautizados; y se añadieron aquel día como tres mil almas» (Hch. 2:41).
  - - q: ¿Es necesaria la comunión cristiana para la gloria de Dios?
      a: Sí. «Para que unánimes, a una voz, glorifiquéis [a] Dios» (Rom. 15:6).
    - q: ¿[Es necesaria la comunión cristiana] para la celebración de las ordenanzas del evangelio?
      a: Sí. La iglesia de Corinto se reunía en un mismo lugar para comer la Cena del Señor, (1 Cor. 11:20).
    - q: ¿Y para la edificación mutua?
      a: Sí. «¡Ay del que cae cuando no hay otro que lo levante!» (Ecl. 4:10).
    - q: Por tanto, ¿deberían esforzarse los que tienen comunión eclesial por responder al propósito {lit. al fin} de dicha comunión?
      a: Sí. «Consideremos cómo estimularnos unos a otros al amor y a las buenas obras» (Heb. 10:24).
notes:
  "109": εἰς Ἰορδάνην.
  "110": Aunque la referencia que aparece en el original es 1 Corintios 5:5, el autor también está citando el versículo 4.
