# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 19
question: ¿Cayó toda la humanidad en la primera transgresión de Adán?
answer: Habiéndose hecho el pacto con Adán, no solo para él sino también para su posteridad, toda la humanidad que desciende de él por generación ordinaria pecó en él y cayó con él en su primera transgresión.
sections:
  - - q: ¿Desciende toda la humanidad de Adán y Eva?
      a: Sí, porque «Adán le puso por nombre Eva a su mujer, porque ella era la madre de todos los vivientes» (Gén. 3:20).
    - q: ¿Hemos sido afectados todos por la desobediencia de nuestros primeros padres?
      a: Sí. «El pecado entró en el mundo por un hombre» (Rom. 5:12).
    - q: ¿Está contaminada nuestra naturaleza con la inmundicia de ese pecado?
      a: Sí. «¿Qué es el hombre para que sea puro, o el nacido de mujer para que sea justo?» (Job 15:14).
    - q: ¿Se nos imputa la culpa?
      a: Sí. «Por una transgresión resultó la condenación de todos los hombres» (Rom. 5:18).
    - q: ¿Estamos expuestos a las terribles consecuencias de ese pecado?
      a: Sí. «Por tanto, la muerte se extendió a todos los hombres, porque todos pecaron» (Rom. 5:12).
    - q: ¿Y acaso no tenemos poder en nosotros mismos para evitar todo esto?
      a: No, porque «mientras aún éramos débiles Cristo murió por nosotros» (Rom. 5:6).
  - - q: ¿Fue este el caso de los descendientes inmediatos de Adán?
      a: Sí, porque «engendró un hijo a su semejanza» (Gén. 5:3).
    - q: ¿Es este el caso de todos aquellos que descienden de él en las épocas posteriores?
      a: Sí, porque «todos hemos traído la imagen del terrenal» (1 Cor. 15:49).
    - q: Pero ¿fue este el caso de Cristo?
      a: No. Él era «el santo» (Luc. 1:35).
    - q: Entonces, ¿descendió Él de Adán en forma de generación ordinaria?
      a: No, porque «se halló que su madre había concebido por obra del Espíritu Santo» (Mat. 1:18).
    - q: ¿Deberíamos ser humillados por el pecado original?
      a: Sí. «He aquí, yo nací en iniquidad» (Sal. 51:5).
