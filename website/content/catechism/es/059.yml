# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 59
question: ¿Qué se exige en el tercer mandamiento?
answer: El tercer mandamiento exige el uso santo y reverente de los nombres, los títulos, los atributos, las ordenanzas, la Palabra y las obras de Dios.
sections:
  - - q: ¿Deberíamos profesar el nombre de Dios?
      a: Sí. «Oh SEÑOR, y por tu nombre somos llamados» (Jer. 14:9).
    - q: ¿[Deberíamos] ser sinceros al profesarlo?
      a: Sí. «Preguntarán por el camino de Sión, hacia donde volverán sus rostros» (Jer. 50:5).
    - q: ¿Y [deberíamos] tener cuidado para darle crédito y sostenerlo?
      a: Sí. «Has guardado mi palabra y no has negado mi nombre» (Apo. 3:8).
  - - q: ¿Deberíamos usar el nombre de Dios en oración?
      a: Sí. «Invocaré el nombre del SEÑOR» (Sal. 116:17).
    - q: ¿[Deberíamos usarlo] en alabanza?
      a: Sí. «Alaben tu nombre grande» (Sal. 99:3).
    - q: ¿[Deberíamos usarlo] en la comunión {lit. conversación} cristiana?
      a: Sí. «Hablaré de tu nombre a mis hermanos» (Sal. 22:22).
    - q: Pero, ¿deberíamos usarlo con la más profunda humildad?
      a: Sí. «He aquí, ahora me he atrevido a hablar al Señor, yo que soy polvo y ceniza» (Gén. 18:27).
    - q: ¿Y [deberíamos usarlo] con gran seriedad y deliberación?
      a: Sí. «No te des prisa en hablar» (Ecl. 5:2).
  - - q: ¿Deberíamos dar gloria a Dios en Su Palabra?
      a: Sí. «Porque has engrandecido tu palabra conforme a todo tu nombre» (Sal. 138:2).
    - q: ¿[Deberíamos dar gloria a Dios] en Sus obras?
      a: Sí. «Pregonen sus obras con cantos de júbilo» (Sal. 107:22).
    - q: ¿Y en Su culto {o adoración}?
      a: Sí, porque [el Señor] es «Dios muy temido en el consejo de los santos, e imponente sobre todos los que están en su derredor» (Sal. 89:7).
  - - q: ¿Es lícito jurar?
      a: Sí. «Un juramento dado como confirmación es el fin de toda discusión» (Heb. 6:16).
    - q: Sin embargo, ¿deberíamos tener cuidado {al momento} de jurar?
      a: Sí. Deberíamos tener temor de jurar (Ecl. 9:2).
    - q: ¿Y [deberíamos] jurar con consciencia?
      a: Sí. «Jurarás […] en verdad, en juicio y en justicia» (Jer. 4:2).
    - q: ¿El juramento liga el alma?
      a: Sí. Al jurar, un hombre liga su alma con una obligación (Núm. 30:2 [RVR60]).
    - q: Por tanto, ¿deberíamos considerarnos ligados a {nuestros juramentos}?
      a: Sí. «Perdonó [David] a Mefiboset, hijo de Jonatán, hijo de Saúl, a causa del pacto del SEÑOR» (2 Sam. 21:7).
    - q: ¿Y esto es así aunque sea en detrimento nuestro?
      a: Sí. El hombre bueno es «el que aun jurando en perjuicio propio, no cambia» (Sal. 15:4).
