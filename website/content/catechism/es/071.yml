# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 71
question: ¿Cuál es la razón anexa al quinto mandamiento?
answer: La razón anexa al quinto mandamiento es una promesa de larga vida y prosperidad (en la medida en que sirva a la gloria de Dios y el bien propio) a todos aquellos que guarden este mandamiento.
sections:
  - - q: ¿Han sido cortados en la mitad de sus días algunos hombres buenos?
      a: Sí. «Él debilitó mis fuerzas en el camino; acortó mis días» (Sal. 102:23).
    - q: Pero, ¿es esto siempre en misericordia?
      a: Sí. «Ante el mal es arrebatado el justo» (Isa. 57:1).
    - q: ¿Han vivido algunos hombres malvados hasta una edad avanzada?
      a: Sí. Los impíos siguen viviendo y envejecen (Job 21:7).
    - q: ¿Y es esto siempre en juicio?
      a: Sí. «Porque […] el pecador de cien años será maldito» (Isa. 65:20 [RVR60]).
    - q: Pero, ¿es más probable que las personas buenas disfruten de las comodidades de este mundo?
      a: Sí. «Nada les falta a aquellos que le temen» (Sal. 34:9).
    - q: ¿Y [es más probable que las personas buenas disfruten de] el vivir mucho tiempo en este mundo?
      a: Sí. «¿Quién es el hombre que desea vida…? […] Apártate del mal y haz el bien» (Sal. 34:12, 14).
    - q: ¿Se les concederá esta bendición [a todos aquellos que guarden este mandamiento] en la medida en que sea para la gloria de Dios y el bien propio?
      a: Sí. «No faltó ni una palabra de las buenas promesas que el SEÑOR había hecho […] todas se cumplieron» (Jos. 21:45). Y, si se les niega [esta bendición] en este mundo,
    - q: ¿se les otorgará en el próximo?
      a: "Sí. «Y esta es la promesa que Él mismo nos hizo: la vida eterna» (1 Jua. 2:25)."
  - - q: ¿Son la larga vida y la felicidad una bendición concedida de forma especial a los hijos que tienen sentido del deber y son obedientes?
      a: Sí. «Hijo mío (…) [guarda] mis mandamientos, porque largura de días y años de vida y paz te añadirán» (Pro. 3:1, 2).
    - q: ¿Y se les niega [esta bendición] a los rebeldes y desobedientes?
      a: Sí. «No habrá anciano en tu casa» (1 Sam. 2:31).
