# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 21
question: ¿En qué consiste la pecaminosidad del estado en que cayó el hombre?
answer: La pecaminosidad de ese estado en que cayó el hombre consiste en la culpabilidad del primer pecado de Adán, la falta de justicia original y la corrupción de toda su naturaleza, lo cual es comúnmente llamado pecado original, junto con todas las transgresiones actuales[^34] que proceden de este.
sections:
  - - q: ¿Ha introducido el pecado de Adán a toda la humanidad en un estado de culpabilidad?
      a: Sí. «Porque [...] por la desobediencia de un hombre los muchos fueron constituidos pecadores» (Rom. 5:19).
    - q: ¿Se manifiesta esto en el caso de aquellos que nunca cometieron un pecado actual?
      a: "[^35] Sí, porque «la muerte reinó desde Adán hasta Moisés, aun sobre los que no habían pecado con una transgresión semejante a la de Adán» (Rom. 5:14)."
    - q: ¿Es habitual que Dios impute así los pecados de los padres sobre los hijos?
      a: Sí. Él «castiga la iniquidad de los padres sobre los hijos» (Éxo. 20:5).
    - q: ¿Y es Él justo al hacerlo?
      a: Sí. «No hay injusticia en Él» (Jua. 7:18).[^36]
  - - q: ¿Nos ha privado el pecado de nuestra justicia original?
      a: Sí. Estamos «lejos de la justicia» (Isa. 46:12).
    - q: ¿No quedan [en nosotros] remanentes de la justicia original?
      a: No. «En mí, es decir, en mi carne, no habita nada bueno» (Rom. 7:18).
    - q: ¿Estamos incapacitados por causa de esto para [cumplir] el deber?
      a: Sí. «Porque el querer está presente en mí, pero el hacer el bien, no» (Rom. 7:18).
    - q: ¿Y [estamos] alejados del deber [por esta causa]?
      a: Sí. «Se han apartado de mí todos ellos» (Eze. 14:5 [RVR60]).
  - - q: ¿Está corrompida[^37] la naturaleza del hombre por la Caída?
      a: Sí. «Todos nosotros somos como el inmundo» (Isa. 64:6).
    - q: ¿Se extiende esta contaminación tanto al hombre interior como al exterior?
      a: Sí. Es una «inmundicia de la carne y del espíritu» (2 Cor. 7:1).
    - q: ¿Se extiende [esta contaminación] a todas las facultades del hombre interior?
      a: Sí. «Su mente como su conciencia están corrompidas» (Tit. 1:15).
    - q: ¿[Se extiende esta contaminación] a todos los miembros del hombre exterior?
      a: Sí, porque «[presentamos nuestros] miembros como esclavos a la impureza y a la iniquidad» (Rom. 6:19).
    - q: ¿Ahora cometemos pecado de forma natural?
      a: Sí. «[Bebemos] como agua la iniquidad» (Job 15:16).
    - q: ¿Nos deleitamos en el pecado?
      a: Sí. «[Es] dulce en [nuestra] boca» (Job 20:12).
    - q: ¿Es este el caso de los niños pequeños?
      a: Sí, porque «la necedad está ligada al corazón del niño» (Pro. 22:15).
    - q: ¿Y [es este el caso] de toda la humanidad?
      a: Sí, porque «todo el mundo yace bajo el poder del maligno» (1 Jua. 5:19).
  - - q: ¿Es la naturaleza corrupta contraria al ser y las perfecciones de Dios?
      a: Sí, porque «la mente puesta en la carne es enemiga de Dios» (Rom. 8:7).
    - q: ¿[Es la naturaleza corrupta contraria] a la ley de Dios?
      a: Sí. «Porque no se sujeta a la ley de Dios, pues ni siquiera puede hacerlo» (Rom. 8:7).
    - q: ¿[Es la naturaleza corrupta contraria] a la gracia de Dios?
      a: Sí. «Porque el deseo de la carne es contra el Espíritu, y el del Espíritu es contra la carne, pues éstos se oponen el uno al otro» (Gál. 5:17).
    - q: ¿Y son las acciones de los peores hombres una copia del corazón de los mejores?
      a: Sí, porque «como el agua refleja el rostro, así el corazón del hombre refleja al hombre» (Pro. 27:19).
notes:
  "34": "todas las transgresiones actuales —La frase original es «all actual transgressions [actual transgressions]». No se refiere simplemente a las transgresiones que los seres humanos cometen en la actualidad (hoy en día), sino a toda transgresión humana que no es potencial sino actual o puesta en acto, es decir, cometida, llevada a cabo. Véase la acepción 3 de «actual» en el Diccionario de la lengua castellana, 12. @@a@@ ed., (Madrid, España: Real Academia Española, 1884); «pecado actual» en las entradas correspondientes a «pecado» y «actual» en el Diccionario de la lengua española, 23. @@a@@ ed., versión 23.4 en línea (Madrid, España: Real Academia Española, 2014), disponible en: ˂https://dle.rae.es˃; véase además la acepción 3 de «actualidad» en Ibíd., 22. @@a@@ ed. (2001), y la acepción 3 del verbo «actualizar» en Ibíd., 23. @@a@@ ed. (2014)."
  "35": El autor se refiere a aquellos que aún no han nacido o infantes muy pequeños que todavía no han cometido pecado por ellos mismos. Es decir, no han comenzado a manifestar su naturaleza pecaminosa pecando ellos mismos.
  "36": En el original hay un error en la referencia; dice Juan 7:13, pero el autor está citando las palabras de Juan 7:18.
  "37": La palabra que utiliza el autor es «defiled», que puede ser traducida como profanada, manchada, deshonrada, ultrajada.
