# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 104
question: ¿Qué se exige para recibir dignamente la Cena del Señor?
answer: Se exige de los que participen de la Cena del Señor que se examinen a sí mismos, {que examinen} su conocimiento para discernir el cuerpo del Señor, su fe para alimentarse de Él, su arrepentimiento, {su} amor y {su} nueva obediencia, no sea que viniendo indignamente, coman y beban juicio para sí mismos.
sections:
  - - q: ¿Es necesaria una examinación previa para participar correctamente de esta ordenanza?
      a: Sí. «Examínese cada uno a sí mismo, y entonces coma» (1 Cor. 11:28).
    - q: ¿Deberíamos examinar nuestro corazón?
      a: Sí. «En mi corazón meditaré» (Sal. 77:6).
    - q: ¿[Deberíamos examinar] nuestros caminos?
      a: Sí. «Consideré mis caminos» (Sal. 119:59).
    - q: ¿Deberíamos hacer esto de manera imparcial?
      a: "Sí. «Así dice el SEÑOR: “No os engañéis”» (Jer. 37:9)."
    - q: ¿[Deberíamos hacer esto] con diligencia?
      a: Sí. «Mi espíritu inquiere» (Sal. 77:6).
    - q: ¿[Deberíamos hacer esto] con serenidad?
      a: Sí. «Se reunieron […] para investigar el asunto» (Esd. 10:16).
    - q: Y cuando surgen dudas,[^111] ¿deberíamos desear la ayuda de Dios?
      a: Sí. «Examíname, oh SEÑOR, y pruébame» (Sal. 26:2).
  - - q: ¿Deberíamos examinar nuestro conocimiento?
      a: Sí. «¿Sabéis lo que os he hecho?» (Jua. 13:12).
    - q: ¿Y sin esto participamos de manera indigna?
      a: Sí. «Sin discernir correctamente el cuerpo del Señor» (1 Cor. 11:29).
    - q: ¿Deberíamos inquirir también en nuestra fe en Jesucristo?
      a: Sí. «Poneos a prueba para ver si estáis en la fe» (2 Cor. 13:5).
    - q: ¿[Deberíamos inquirir en] nuestro amor por Dios y por los demás?
      a: Sí, porque sin amor, nada somos (1 Cor. 13:2).
    - q: ¿[Deberíamos inquirir en] nuestro arrepentimiento?
      a: Sí, porque «los sacrificios de Dios son el espíritu contrito» (Sal. 51:17).
    - q: ¿Y [en] nuestra nueva obediencia?
      a: Sí. «Celebremos la fiesta (…) [no] con la levadura de malicia y maldad» (1 Cor. 5:8).
  - - q: ¿Debe recibirse este sacramento con gran reverencia?
      a: Sí. «[Me postraré] hacia tu santo templo con tu temor» (Sal. 5:7 [RVR60]).
    - q: ¿[Debe recibirse] con calurosos afectos?
      a: Sí. «Exaltaremos tu amor más que el vino» (Cnt. 1:4).
    - q: ¿[Debe recibirse] con una tristeza piadosa?
      a: Sí. La pascua debía comerse con hierbas amargas (Éxo. 12:8).
    - q: ¿[Debe recibirse] con una santa indiferencia hacia el mundo?
      a: "Sí. «Lo comeréis: ceñidos vuestros lomos, las sandalias en vuestros pies y el cayado en vuestra mano» (Éxo. 12:11)."
    - q: ¿Y con gozo y alegría espiritual?
      a: Sí. «Comían juntos con alegría […] alabando a Dios» (Hch. 2:46, 47).
    - q: ¿Deberíamos renovar nuestros compromisos con Dios en ese momento?
      a: Sí. «Están sobre mí, oh Dios, los votos que te hice» (Sal. 56:12).
    - q: ¿Y deberíamos recordarlos y cumplirlos después?
      a: Sí. «El voto que haces, cúmplelo» (Ecl. 5:4).
  - - q: ¿Reciben los carnales y los no regenerados esta ordenanza indignamente?
      a: Sí. «¿Qué derecho tienes tú […] de tomar mi pacto en tus labios? Pues tú aborreces la disciplina» (Sal. 50:16, 17).
    - q: ¿{La reciben indignamente} los iracundos y faltos de caridad?
      a: Sí. «Oigo que cuando os reunís como iglesia hay divisiones entre vosotros […] esto ya no es comer la cena del Señor» (1 Cor. 11:18, 20).
    - q: ¿{La reciben indignamente} aquellos que participan de esta como {si la Cena fuera} una comida común?
      a: Sí. «¿No tenéis casas para comer y beber?» (1 Cor. 11:22).
    - q: ¿Y quienes la usan como calificación para {poder ejercer} cargos civiles?
      a: Sí. Porque dicen que «“la mesa del SEÑOR es despreciable”» (Mal. 1:7).
    - q: ¿Causan {lit. ofrecen} los tales una gran afrenta a Cristo?
      a: Sí. Son culpables «del cuerpo y la sangre del Señor» (1 Cor. 11:27).
    - q: ¿Se perjudican ellos mismos?
      a: Sí. «Por esta razón hay muchos débiles y enfermos entre vosotros, y muchos duermen» (1 Cor. 11:30).
    - q: ¿Y hacen todas estas cosas que el autoexamen sea más necesario?
      a: Sí. «Pero si nos juzgáramos a nosotros mismos, no seríamos juzgados» (1 Cor. 11:31).
notes:
  "111": "surgen dudas —La palabra usada en el original es el verbo «scruple [scruple]», que literalmente se traduce como escrupulizar («Formar escrúpulo [duda]») y está estrechamente relacionado con el concepto de escrúpulo («Duda o recelo inquietantes para la conciencia sobre si algo es bueno o se debe hacer desde un punto de vista moral»). Véase el Diccionario de la lengua española, 23. @@a@@ ed., versión 23.4 en línea (Madrid, España: Real Academia Española, 2014), disponible en: ˂https://dle.rae.es˃."
