# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 85
question: ¿Qué se exige en el décimo mandamiento?
answer: El décimo mandamiento exige un contentamiento pleno con nuestra propia condición, con una actitud espiritual que sea correcta y caritativa para con nuestro prójimo y todo lo que le pertenezca.
sections:
  - - q: ¿Tienen los malvados un derecho de propiedad civil sobre sus bienes?
      a: Sí. «¿No te pertenecía?» (Hch. 5:4).
    - q: Por tanto, ¿deberían ser tolerados en silencio para disfrutarlos?
      a: Sí. «La conciencia de David le remordía, porque había cortado la orilla del manto de Saúl» (1 Sam. 24:5).
  - - q: ¿Establece Dios la condición del hombre bueno?
      a: Sí. «Él hace lo que está determinado para mí» (Job 23:14).
    - q: ¿Es esta [condición] lo mejor para él?
      a: Sí. «Porque a la persona que le agrada, [Dios] le ha dado» (Ecl. 2:26).
    - q: ¿Y es esta [condición] infinitamente mejor de lo que se merece?
      a: Sí. «Por la misericordia [del SEÑOR] no hemos sido consumidos» (Lam. 3:22 [RVR60]).
    - q: Por tanto, ¿debería contentarse con ello?
      a: Sí. «He aprendido a contentarme, cualquiera que sea mi situación» (Flp. 4:11).
    - q: ¿Es el contentamiento un poderoso antídoto contra la codicia?
      a: Sí. «Sea vuestro carácter[^88] sin avaricia, contentos con lo que tenéis» (Heb. 13:5).
  - - q: ¿Acaso no deberíamos buscar grandes cosas para nosotros?
      a: No. «“¿Buscas para ti grandes cosas? No las busques”» (Jer. 45:5).
    - q: ¿Tampoco deberíamos entristecernos por las circunstancias más prósperas de los demás?
      a: No. «No te irrites a causa del que prospera en su camino» (Sal. 37:7).
    - q: ¿Más bien [deberíamos] regocijarnos en su prosperidad y esforzarnos por promoverla?
      a: Sí. Así fue como Mardoqueo «buscó el bien de su pueblo y procuró el bienestar de toda su gente» (Est. 10:3).
  - - q: Para obtener este temperamento feliz, ¿deberíamos resignar nuestra voluntad a la voluntad de Dios?
      a: Sí. «Él nos escoge nuestra heredad» (Sal. 47:4).
    - q: ¿[Deberíamos] esforzarnos por contemplar la vanidad de la criatura?
      a: Sí. «¿Volarán tus ojos sobre ella y no existe?»[^89] (Pro. 23:5).
    - q: ¿[Deberíamos] hacer una estimación correcta de las bendiciones que poseemos?
      a: Sí, porque «mejor es lo que ven los ojos que lo que el alma desea» (Ecl. 6:9).
    - q: ¿[Deberíamos] trasladar nuestros pensamientos al otro mundo con frecuencia?
      a: Sí. No poniendo nuestra vista en las cosas que se ven, porque son temporales, sino en las que no se ven, porque son eternas (2 Cor. 4:18). Y, si al fin y al cabo encontramos algunos levantamientos de descontento,
    - q: ¿deberíamos frenarlos en sus primeras apariciones?
      a: Sí. «Alma mía, ¿por qué te turbas dentro de mí?» (Sal. 42:5).
notes:
  "88": La RVR60 traduce la palabra griega τρόπος como «costumbres», mientras que LBLA la traduce como «carácter». Ambas traducciones son apropiadas, pues este sustantivo griego es definido como «la manera en la que una persona se comporta o vive» (BDAG). Por eso puede verterse como costumbres, formas, estilo de vida, o carácter.
  "89": Lectura alternativa proporcionada por LBLA.
