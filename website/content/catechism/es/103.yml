# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 103
question: ¿Quiénes son los sujetos adecuados de esta ordenanza?
answer: Quienes hayan sido bautizados por una profesión personal de su fe en Jesucristo y arrepentimiento de obras muertas.
sections:
  - - q: ¿Pueden venir todos a la Cena del Señor?
      a: No. «No está bien tomar el pan de los hijos, y echárselo a los perrillos» (Mat. 15:26).
    - q: ¿Pueden venir los que estén preparados?
      a: Sí. «Consagraos y venid conmigo al sacrificio» (1 Sam. 16:5).
    - q: Sin embargo, ¿habrá algunos intrusos aun con todo nuestro cuidado?
      a: Sí. «“Amigo, ¿cómo entraste aquí?”» (Mat. 22:12).
  - - q: ¿Son los creyentes bautizados sujetos apropiados para esta ordenanza?
      a: Sí. «Los que […] fueron bautizados […] se dedicaban continuamente a las enseñanzas de los apóstoles, a la comunión, al partimiento del pan» (Hch. 2:41, 42).
    - q: ¿Deberían profesar su fe?
      a: Sí. «Porque con el corazón se cree para justicia, y con la boca se confiesa para salvación» (Rom. 10:10).
    - q: ¿[Debería] estar acompañada de arrepentimiento esta fe de ellos?
      a: Sí, porque leemos acerca de «el fundamento del arrepentimiento de obras muertas y de la fe hacia Dios» (Heb. 6:1).
    - q: ¿Y [debería] demostrarse en una buena conducta?
      a: Sí. «Os escribí que no anduvierais en compañía de ninguno que, llamándose hermano, es […] borracho, o estafador; con ese, ni siquiera comáis» (1 Cor. 5:11).
  - - q: ¿Pueden ser admitidos los creyentes débiles {a la Cena}?
      a: Sí. «Aceptad al que es débil en la fe» (Rom. 14:1).
    - q: ¿[Pueden ser admitidos] los transgresores arrepentidos?
      a: Sí. «Restauradlo en un espíritu de mansedumbre» (Gál. 6:1).
    - q: ¿Y en todos los casos difíciles deberíamos más bien pecar de caritativos?
      a: Sí, porque el amor «todo lo cree, todo lo espera» (1 Cor. 13:7).
