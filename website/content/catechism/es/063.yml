# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 63
question: ¿Qué se exige en el cuarto mandamiento?
answer: El cuarto mandamiento exige guardar santo para Dios un día entero de cada siete como día de reposo para Él.
sections:
  - - q: ¿Es la voluntad de Dios que prestemos especial atención al día de reposo?
      a: Sí. «Acuérdate del día de reposo» (Éxo. 20:8).
    - q: ¿Deberíamos acordarnos de él antes que llegue?
      a: Sí, porque leemos sobre la preparación para el día de reposo (Mar. 15:42).
    - q: ¿[Deberíamos acordarnos de él] cuando llega?
      a: Sí. «Comedlo hoy, porque hoy es día de reposo para el Señor» (Éxo. 16:25).
    - q: ¿Y [deberíamos acordarnos de él] cuando se acaba?
      a: Sí. «Cómo iba yo […] con la muchedumbre en fiesta» (Sal. 42:4).
  - - q: ¿Debemos guardar santo el día de reposo?
      a: Sí. «Santificad mis días de reposo» (Eze. 20:20).
    - q: ¿Debemos guardarlo por medio de un reposo sagrado?
      a: Sí. «Durante seis días se trabajará, pero el séptimo día será día de completo reposo» (Éxo. 31:15).
    - q: ¿[Debemos guardarlo] por medio de servicios sagrados?
      a: Sí. «El pueblo de la tierra también adorará a la entrada de esa puerta […] los días de reposo» (Eze. 46:3).
    - q: ¿Y [debemos guardarlo] con afectos santos?
      a: Sí. «Este es el día que el SEÑOR ha hecho; regocijémonos y alegrémonos en él (Sal. 118:24).
  - - q: ¿Debe ser el día de reposo que guardamos un día común de 24 horas?
      a: Sí, porque la tarde y la mañana fueron el primer día (Gén. 1:5).
    - q: Entonces, ¿no debería comenzar y terminar el día de reposo al atardecer?
      a: No, porque leemos que el día de reposo terminaba al amanecer del primer día de la semana (Mat. 28:1).
notes:
  "74": σαββατισμός /sabbatismós/
