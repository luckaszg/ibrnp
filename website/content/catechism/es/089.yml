# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 89
question: ¿Qué es lo que todo pecado merece?
answer: Todo pecado merece la ira y la maldición de Dios, tanto en esta vida como en la venidera.
sections:
  - - q: ¿Va el pecado en contra del cuerpo del hombre?
      a: Sí. «En mis huesos no hay salud a causa de mi pecado» (Sal. 38:3).
    - q: ¿Va en contra del alma del hombre?
      a: Sí. «Mas el que peca contra mí, defrauda su alma» (Pro. 8:36 [RVR60]).
    - q: ¿Va en contra de su bienestar temporal?
      a: Sí. «“Si con estas cosas no os enmendáis ante mí [...] entonces yo procederé con hostilidad contra vosotros […] Y traeré sobre vosotros una espada”» (Lev. 26:23, 24, 25).[^97]
    - q: ¿[Va] en contra de su bienestar eterno?
      a: Sí. «“APARTAOS DE MÍ, LOS QUE PRACTICÁIS LAINIQUIDAD”» (Mat. 7:23). Y, aunque todos los pecados no sean igualmente atroces,
    - q: ¿son igualmente destructivos?
      a: "Sí. «Pues el que dijo: NO COMETAS ADULTERIO, también dijo: NO MATES» (Stg. 2:11)."
  - - q: ¿Está sujeto el pecado a la ira de Dios?
      a: Sí. «He aquí, te enojaste porque pecamos» (Isa. 64:5).
    - q: ¿Es terrible la ira de un hombre común?
      a: Sí. «Maldita su ira porque es feroz» (Gén. 49:7).
    - q: Pero, ¿podrá ser apaciguada esta ira?
      a: Sí. «La suave respuesta aparta el furor» (Pro. 15:1).
    - q: ¿Es {aun} más terrible la ira de un rey?
      a: Sí. «Como rugido de león es la ira del rey» (Pro. 19:12).
    - q: Pero, ¿podrá ser aplacada esta ira?
      a: Sí. «Y se aplacó el furor del rey» (Est. 7:10).
    - q: ¿Es la ira de los demonios más terrible que cualquiera de las anteriores?
      a: Sí. «¡Ay de la tierra y del mar!, porque el diablo ha descendido a vosotros con gran furor» (Apo. 12:12).
    - q: Pero, ¿podrá ser restringida esta ira?
      a: Sí. «Ató [a Satanás] por mil años» (Apo. 20:2).
    - q: Entonces, ¿es la ira de Dios infinitamente más terrible que todas {las demás}?
      a: Sí. «¿Quién conoce el poder de tu ira?» (Sal. 90:11).
  - - q: ¿El pecado expone a los hombres a la maldición?
      a: Sí. «Con maldición estáis malditos» (Mal. 3:9).
    - q: ¿Sin duda vendrá esta maldición sobre los pecadores impenitentes?
      a: Sí. «Vendrán sobre ti todas estas maldiciones y te alcanzarán» (Deu. 28:15).
    - q: ¿Son maldecidos mientras viven?
      a: Sí. «Maldita es su porción sobre la tierra» (Job 24:18).
    - q: ¿Son maldecidos en la muerte?
      a: Sí. «Y dejaréis vuestro nombre como maldición a mis escogidos; el Señor DIOS te matará» (Isa. 65:15).
    - q: ¿Y [serán] maldecidos para siempre?
      a: Sí. «Está próxima a ser maldecida, y termina por ser quemada» (Heb. 6:8).
  - - q: ¿Son la ira y la maldición de Dios lo que justamente merece el pecado?
      a: Sí. «La condenación de los tales es justa» (Rom. 3:8).
    - q: ¿Y {es lo que justamente merece} todo pecado?
      a: Sí. «MALDITO TODO ELQUE NO PERMANECE EN TODAS LAS COSAS ESCRITAS EN EL LIBRO DELA LEY PARA HACERLAS» (Gál. 3:10).
    - q: Pero, ¿no es posible librarse de esto?
      a: Sí, porque Dios ha designado «medios para que el desterrado no sea alejado de él» (2 Sam. 14:14).
notes:
  "97": Aunque la referencia que aparece en el original es Levíticos 26:24-25, el autor también está citando el versículo 23.
