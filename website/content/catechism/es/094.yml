# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 94
question: 94¿Cómo la Palabra es hecha eficaz para salvación?
answer: El Espíritu de Dios hace que la lectura de la Palabra, pero especialmente la predicación de esta, sea un medio eficaz para convencer y convertir a los pecadores, y para edificarlos en la santidad y el consuelo, a través de la fe, para salvación.
sections:
  - - q: ¿Es útil la Palabra de Dios para {traer} convicción {de pecado}?
      a: Sí. «Es viva y eficaz […] penetra hasta la división del alma y del espíritu» (Heb. 4:12).
    - q: ¿Y para {traer} conversión?
      a: "Sí. «La ley del SEÑOR es perfecta, que convierte el alma (Sal. 19:7 [RVR60]). Pero, ¿es así de provechosa para todos los que la escuchan? No, porque «cuando oyeron [estas cosas] algunos se burlaban, pero otros dijeron: Te escucharemos otra vez acerca de esto» (Hch. 17:32)."
  - - q: ¿Puede la Palabra engendrar fe?
      a: Sí. «La fe viene del oír» (Rom. 10:17).
    - q: ¿[Puede engendrar] santidad?
      a: Sí. «Para que ellos también sean santificados en la verdad» (Jua. 17:19).
    - q: ¿Y consuelo?
      a: Sí. «Tus palabras eran para mí el gozo y la alegría de mi corazón» (Jer. 15:16).
    - q: ¿Es un medio {que sirve} para iluminar {o alumbrar} nuestro entendimiento?
      a: Sí. «El mandamiento del SEÑOR es puro, que alumbra los ojos» (Sal. 19:8).
    - q: ¿[Es un medio {que sirve}] para refrenar nuestras corrupciones?
      a: Sí. «Por la palabra de tus labios yo me he guardado de las sendas de los violentos» (Sal. 17:4).
    - q: ¿[Es un medio {que sirve}] para perfeccionar las virtudes {lit. las gracias} que hay en nosotros?
      a: Sí. «Es poderosa para [edificarnos]» (Hch. 20:32).
    - q: ¿Y para prepararnos para el Cielo?
      a: Sí. «Es poderosa […] para [darnos] la herencia entre todos los santificados» (Ibíd.).
    - q: Pero, ¿es así por alguna virtud inherente o eficacia en sí misma?
      a: No. «Pues es el poder de Dios para la salvación» (Rom. 1:16).
  - - q: ¿Debería ser leída la Palabra de Dios para estos propósitos?
      a: Sí. «Leyeron en el libro de la ley de Dios» (Neh. 8:8).
    - q: ¿[Debería] ser predicada?
      a: Sí. «Entonces enseñaré a los transgresores tus caminos» (Sal. 51:13).
    - q: ¿[Debería] ser predicada de manera pura?
      a: Sí. «Enseña lo que está de acuerdo con la sana doctrina» (Tit. 2:1).
    - q: ¿[Debería ser predicada] de manera clara?
      a: Sí. No «con palabras persuasivas de sabiduría» (1 Cor. 2:4).
    - q: ¿[Debería ser predicada] con prudencia?
      a: Sí. «Que maneja con precisión la palabra de verdad» (2 Tim. 2:15).
    - q: ¿[Debería ser predicada] con afecto?
      a: Sí. «No cesé de amonestar a cada uno con lágrimas» (Hch. 20:31).
    - q: ¿[Debería ser predicada] con denuedo?
      a: Sí. «Esto manda y enseña» (1 Tim. 4:11).
    - q: ¿[Debería ser predicada] con diligencia?
      a: Sí. «Redarguye, reprende, exhorta con mucha paciencia e instrucción» (2 Tim. 4:2).
    - q: ¿Y podemos esperar que la Palabra así predicada sea coronada de éxito?
      a: Sí. «La verdadera instrucción estaba en su boca […] apartaba a muchos de la iniquidad» (Mal. 2:6).
