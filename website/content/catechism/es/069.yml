# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 69
question: ¿Qué se exige en el quinto mandamiento?
answer: El quinto mandamiento exige la preservación del honor y el cumplimiento de los deberes que corresponden a cada cual en sus distintos puestos y relaciones, como superiores, inferiores o iguales.
sections:
  - - q: ¿Deberían reverenciar los hijos a sus padres?
      a: Sí. «Cada uno de vosotros ha de reverenciar [o temer] a su madre y a su padre» (Lev. 19:3).
    - q: ¿[Deberían] obedecer sus instrucciones?
      a: Sí. «Hijos, obedeced a vuestros padres en el Señor» (Efe. 6:1).
    - q: ¿[Deberían] someterse a sus correcciones?
      a: Sí. «Tuvimos padres terrenales [o de nuestra carne] para disciplinarnos, y los respetábamos» (Heb. 12:9).
    - q: ¿Y [deberían] buscar su consentimiento para disponer de sí mismos?
      a: Sí. Jacob obedeció a su padre y a su madre, y se fue a Padán-aram en busca de una esposa (Gén. 28:7).
    - q: ¿Es su deber reconocer con agradecimiento los favores que han recibido de parte de sus padres?
      a: Sí. «También yo fui hijo para mi padre, tierno y único a los ojos de mi madre» (Pro. 4:3).
    - q: Y, si es posible, ¿es su deber recompensarlos?
      a: Sí. «Que aprendan a mostrar piedad para con su propia familia y a recompensar a sus padres» (1 Tim. 5:4).
    - q: ¿Se extienden estos deberes a nuestros suegros?
      a: Sí. «Moisés escuchó a su suegro, e hizo todo lo que él había dicho» (Éxo. 18:24).
  - - q: ¿Deberían proveer los padres para sus hijos?
      a: Sí. «¿O qué hombre hay entre vosotros que si su hijo le pide pan, le dará una piedra?» (Mat. 7:9).
    - q: ¿[Deberían] enseñarlos?
      a: Sí. «Enseña al niño el camino en que debe andar» (Pro. 22:6).
    - q: ¿Y [deberían] corregirlos cuando sea necesario?
      a: Sí. «La vara y la reprensión dan sabiduría» (Pro. 29:15).
    - q: Pero, ¿deberían abstenerse {de corregirlos} con severidad y por pasión?
      a: Sí. «Padres, no exasperéis a vuestros hijos» (Col. 3:21).
    - q: ¿Es deber de los padres orar por sus hijos?
      a: Sí. «Da a mi hijo Salomón un corazón perfecto» (1 Cró. 29:19).
    - q: ¿[Es deber de los padres] orar con sus hijos?
      a: Sí. «Pero al regresar David para bendecir su casa» (2 Sam. 6:20).
    - q: ¿[Es deber de los padres] dar un buen ejemplo a sus hijos?
      a: Sí. «En la integridad de mi corazón andaré dentro de mi casa» (Sal. 101:2).
    - q: ¿[Es deber de los padres] mantenerse vigilantes sobre la vida de sus hijos?
      a: Sí. «Quizá mis hijos hayan pecado y maldecido a Dios en sus corazones» (Job 1:5).
    - q: ¿Y se convertirá esto finalmente en algo para el propio beneficio de los padres?
      a: Sí, porque «el que engendra un sabio se alegrará en él» (Pro. 23:24).
  - - q: ¿Deberían honrar los siervos a sus amos?
      a: Sí. Deben considerarlos «como dignos de todo honor» (1 Tim. 6:1).
    - q: ¿[Deberían] obedecerles?
      a: Sí. «Siervos, obedeced en todo a vuestros amos» (Col. 3:22).
    - q: ¿[Deberían] ser justos con sus amos y fieles a ellos?
      a: Sí. «Mostrando toda buena fe» (Tit. 2:10).
    - q: ¿Y [deberían] soportar pacientemente sus reproches y correcciones?
      a: Sí. «No contradiciendo» (Tit. 2:9).
    - q: ¿Se debe esta sujeción incluso a los amos más perversos?
      a: Sí. «También a los que son insoportables [o perversos]» (1 Ped. 2:18).
    - q: ¿Y es esto igualmente cierto para con los {amos} creyentes?
      a: Sí. «Y los que tienen amos que son creyentes, no les falten el respeto […] sino sírvanles aún mejor» (1 Tim. 6:2).
  - - q: ¿Deberían ser justos los amos con sus siervos?
      a: Sí. «Amos, tratad con justicia y equidad a vuestros siervos» (Col. 4:1).
    - q: ¿Y [deberían ser] gentiles [con sus siervos]?
      a: Sí. «Dejad las amenazas» (Efe. 6:9).
    - q: Sin embargo, ¿deberían tener cuidado para mantener su autoridad?
      a: Sí, porque «tiembla la tierra […] por [un] esclavo cuando llega a ser rey» (Pro. 30:21, 22).[^79]
  - - q: ¿Es deber de los maridos amar a sus esposas?
      a: Sí. «Maridos, amad a vuestras mujeres» (Efe. 5:25).
    - q: ¿Y es deber de las esposas someterse a sus maridos?
      a: Sí. «Las mujeres estén sometidas a sus propios maridos» (Efe. 5:22).
    - q: ¿Es deber de los esposos y esposas agradarse mutuamente?
      a: Sí. «El casado se preocupa […] de cómo agradar a su mujer […] y la casada […] de cómo agradar a su marido» (1 Cor. 7:33, 34).
    - q: ¿Y [es deber de los esposos y esposas] ayudarse mutuamente en sus preocupaciones religiosas?
      a: Sí. «Pues ¿cómo sabes tú, mujer, si salvarás a tu marido? ¿O cómo sabes tú, marido, si salvarás a tu mujer?» (1 Cor. 7:16).
  - - q: ¿Tienen los súbditos un deber para con sus magistrados?
      a: Sí. «Honrad al rey» (1 Ped. 2:17).
    - q: ¿Y los magistrados para con sus súbditos?
      a: Sí. «“El que con justicia gobierna sobre los hombres”» (2 Sam. 23:3).
    - q: ¿Existe algún deber por parte del pueblo para con sus ministros?
      a: Sí. «Obedeced a vuestros pastores y sujetaos a ellos» (Heb. 13:17).
    - q: ¿Y [existe algún deber por parte] de los ministros para con su pueblo?
      a: Sí. «Pastoread el rebaño de Dios entre vosotros» (1 Ped. 5:2).
  - - q: ¿Es deber de los inferiores honrar a sus superiores?
      a: Sí. «“Delante de las canas te pondrás en pie; honrarás al anciano”» (Lev. 19:32).
    - q: ¿Y esforzarse por ser mejores por medio de sus superiores?
      a: Sí. «Me esperaban como a la lluvia» (Job 29:23).
    - q: ¿Es deber de los superiores relacionarse respetuosamente con sus inferiores?
      a: Sí. «Condescendiendo con los humildes» (Rom. 12:16).
    - q: ¿Y buscar la edificación de sus inferiores?
      a: Sí. «El fruto del justo es árbol de vida» (Pro. 11:30).
  - - q: ¿Los prójimos deberían mostrarse prójimos?
      a: Sí. «Cada uno de nosotros agrade a su prójimo en lo que es bueno» (Rom. 15:2).
    - q: ¿Y los amigos [deberían] comportarse como amigos?
      a: Sí. «El hombre que tiene amigos ha de mostrarse amigo» (Pro. 18:24 [RVR60]).
    - q: ¿Los hermanos [deberían] conducirse unos con otros como hermanos?
      a: Sí. «Mirad cuán bueno y cuán agradable es que los hermanos habiten juntos en armonía» (Sal. 133:1).
    - q: ¿Y puede un fracaso de una parte justificar un fracaso de la otra parte?
      a: No. «Mirad que ninguno devuelva a otro mal por mal» (1 Tes. 5:15).
notes:
  "79": Aunque la referencia que aparece en el original es Proverbios 30:22, el autor también está citando el versículo 21.
