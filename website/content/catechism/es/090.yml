# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 90
question: ¿Qué exige Dios de nosotros para que podamos escapar de Su ira y maldición que nos corresponde por el pecado?
answer: Para que escapemos de la ira y la maldición de Dios que nos corresponde por el pecado, Dios exige de nosotros fe en Jesucristo y arrepentimiento para vida, con el uso diligente de todos los medios externos por los cuales Cristo nos comunica {, nos imparte} los beneficios de la redención.
sections:
  - - q: ¿Es la salvación de la ira una gran salvación?
      a: Sí. Es llamada «una salvación tan grande» (Heb. 2:3).
    - q: ¿Y es una salvación necesaria?
      a: Sí. «¡Señor, sálvanos, que perecemos!» (Mat. 8:25).
    - q: Por tanto, ¿se debería preguntar {o es deber interesarse} [por la salvación]?
      a: Sí. «Si queréis preguntar, preguntad» (Isa. 21:12).
  - - q: ¿Es la fe en nuestro Señor Jesucristo un requisito para la salvación?
      a: Sí. «Cree en el Señor Jesús, y serás salvo» (Hch. 16:31).
    - q: ¿Nadie más será salvado sino {solamente} aquellos que creen?
      a: No. «El que no cree, ya ha sido condenado» (Jua. 3:18).
    - q: ¿Y serán salvos todos los que creen?
      a: Sí. «Todo el que vive y cree en mí, no morirá jamás» (Jua. 11:26).
    - q: ¿Es el arrepentimiento también necesario para la salvación?
      a: Sí. «Dios declara ahora a todos los hombres, en todas partes, que se arrepientan» (Hch. 17:30).
    - q: ¿Y perecerán todos los que no se arrepienten y no creen?
      a: Sí. «Si no os arrepentís, todos pereceréis igualmente» (Luc. 13:3).
  - - q: ¿Predicó Cristo sobre la necesidad de la fe y el arrepentimiento?
      a: Sí. «Arrepentíos y creed en el evangelio» (Mar. 1:15).
    - q: ¿Hicieron los apóstoles lo mismo?
      a: Sí. «Testificando solemnemente, tanto a judíos como a griegos, del arrepentimiento para con Dios y de la fe en nuestro Señor Jesucristo» (Hch. 20:21).
    - q: Pero, ¿está en nuestro propio poder hacer estas dos cosas?
      a: No, porque «separados de [Cristo] nada [podemos] hacer» (Jua. 15:5).
  - - q: ¿Nos exige Dios el uso de medios?
      a: Sí. «Ocupaos en vuestra salvación con temor y temblor» (Flp. 2:12).
    - q: ¿Y deberíamos ser diligentes en el uso de los medios?
      a: Sí. «El reino de los cielos sufre violencia»[^98] (Mat. 11:12).
    - q: Entonces, ¿está Dios obligado a respaldar nuestros esfuerzos?
      a: No, porque «no depende del que quiere ni del que corre» (Rom. 9:16).
    - q: Pero, si la gracia los estimula, ¿los coronará de éxito?
      a: Sí. «Los que me buscan con diligencia me hallarán» (Pro. 8:17).
