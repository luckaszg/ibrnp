# Benjamin Beddome, A Scriptural Exposition of the Baptist Catechism (1752), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/beddome_cathecism.pdf
# Scripture quotations are from the LBLA unless another version is noted.
number: 106
question: ¿Qué regla ha dado Dios para que tengamos dirección en la oración?
answer: Toda la Palabra de Dios es útil para dirigirnos en la oración, pero la regla especial de dirección es aquella oración que Cristo enseñó a Sus discípulos, comúnmente llamada.
sections:
  - - q: ¿Necesitamos dirección en la oración?
      a: Sí, porque «no podemos ordenar nuestro argumento a causa de las tinieblas» (Job 37:19).
    - q: Por tanto, ¿deberíamos buscar la dirección de Dios?
      a: Sí. «Señor, enséñanos a orar» (Luc. 11:1).
    - q: ¿Hay instrucciones específicas con respecto a la oración en la Palabra de Dios?
      a: Sí. «Tomad con vosotros palabras, y volveos al SEÑOR. Decidle…» (Ose. 14:2).
    - q: ¿[Hay] ejemplos concretos de oración?
      a: Sí. «Jabes invocó al Dios de Israel, diciendo…» (1 Cró. 4:10).
    - q: Por tanto, ¿es la Escritura la mejor regla para que tengamos dirección en la oración?
      a: Sí. «Las palabras del SEÑOR son palabras puras, plata probada en un crisol en la tierra, siete veces refinada» (Sal. 12:6).
    - q: ¿Y es por causa de nuestro descuido de la Escritura que somos culpables de tantos errores en la oración?
      a: Sí. «No sabéis lo que pedís» (Mat. 20:22).
  - - q: ¿Tiene La oración del Señor un uso singular como directriz para la oración?
      a: Sí. «Vosotros, pues, orad de esta manera» (Mat. 6:9).
    - q: ¿Está compuesta esta oración por un prefacio?
      a: Sí. «“Padre nuestro que estás en los cielos”» (Ibíd.).
    - q: ¿[Está compuesta] por peticiones?
      a: Sí. «“Santificado sea tu nombre. Venga tu reino”» (Mat. 6:9, 10).[^113]
    - q: ¿Y de una doxología o conclusión?
      a: Sí. «Porque tuyo es el reino y el poder y la gloria» (v. 13).
    - q: ¿Deberíamos imitar esta oración en su brevedad y amplitud?
      a: Sí. «Y al orar, no uséis repeticiones sin sentido» (Mat. 6:7).
    - q: ¿[Deberíamos imitar esta oración] en el sentido de hacer de la gloria de Dios la cumbre y lo primero de nuestros deseos?
      a: Sí. «¿Y qué harás tú por tu gran nombre?» (Jos. 7:9).
    - q: ¿Y [deberíamos imitar esta oración] en el sentido de preferir el bien espiritual al temporal?
      a: Sí. «Buscad primero su reino y su justicia» (Mat. 6:33).
    - q: ¿Deberían los que son maestros, como Cristo, enseñar a orar a otros?
      a: Sí. Deberíamos «tener el mismo sentir […] conforme a [el ejemplo de] Cristo Jesús» (Rom. 15:5 [Margen]).[^114]
