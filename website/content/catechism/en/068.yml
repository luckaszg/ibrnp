# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 68
question: Which is the fifth Commandment?
answer: The fifth Commandment is, "Honour thy Father and thy Mother; that thy Days may be long upon the Land which the LORD thy God give it thee"[^1].
notes:
  "1": Exod. 20:12
