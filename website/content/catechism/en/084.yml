# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 84
question: Which is the tenth Commandment?
answer: The tenth Commandment is, "Thou shalt not covet thy Neighbor's House, that shalt not covet thy Neighbor's Wife, nor his Man-servant, nor his Maid-servant, nor his Ox, nor his Ass, nor any thing that is thy Neighbor's"[^1].
notes:
  "1": Exod. 20:17
