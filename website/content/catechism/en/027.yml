# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 27
question: How doth Christ execute the Office of a Prophet?
answer: Christ executeth the Office of a Prophet, in revealing to us, by his Word and Spirit, the Will of God for our Salvation[^1].
notes:
  "1": John 1:18; 1 Pet. 1:10–12; John 15:15; John 20:31
