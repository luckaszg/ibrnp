# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 88
question: Are all Transgressions of the Law equally heinous?
answer: Some Sins in themselves, and by reason of several Aggravations, are more heinous in the sight of God than others[^1].
notes:
  "1": Ezek. 8:6, 13, 15; 1 John 5:16; Ps. 78:17, 32, 56
