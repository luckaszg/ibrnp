# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 91
question: What is Faith in Jesus Christ?
answer: Faith in Jesus Christ is a saving Grace[^1], whereby we receive, and rest upon him alone for Salvation, as he is offered to us in the Gospel[^2].
notes:
  "1": Heb. 10:39
  "2": John 1:12; Isa. 26:3–4; Phil. 3:9; Gal. 2:16
