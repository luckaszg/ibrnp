# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 97
question: What is Baptism?
answer: Baptism is an Ordinance of the New Testament instituted by Jesus Christ[^1], to be unto the Party baptised, a Sign of his Fellowship with him, in his Death, Burial, and Resurrection; of his being ingrafted into him[^2]; of Remission of Sins[^3]; and of his giving up himself unto God through Jesus Christ, to live and walk in newness of Life[^4].
notes:
  "1": Matt. 28:19
  "2": Rom. 6:3–5; Col. 2:12; Gal. 3:27
  "3": Mark 1:4; Acts 2:38; Acts 22:16
  "4": Rom. 6:3–4
