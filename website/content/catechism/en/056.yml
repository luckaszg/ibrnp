# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 56
question: What is forbidden in the second Commandment?
answer: The second Commandment forbiddeth the worshipping of God by Images[^1], or any other Way not appointed in his Word[^2].
notes:
  "1": Deut. 4:15–19; Exod. 32:5, 8
  "2": Deut. 12:31–32
