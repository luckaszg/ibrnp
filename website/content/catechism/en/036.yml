# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 36
question: What is Justification?
answer: Justification is an Act of God's free Grace, wherein he pardoneth all our Sins[^1], and accepteth us as Righteous in his sight[^2], only for the Righteousness of Christ imputed us[^3], and received by Faith alone[^4].
notes:
  "1": Rom. 3:24–25; Rom. 4:6–8
  "2": 2 Cor. 5:19, 21
  "3": Rom. 5:17–19
  "4": Gal. 2:16; Phil. 3:9
