# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 73
question: What is required in the sixth Commandment?
answer: The sixth Commandment requireth all lawful Endeavors to preserve our own Life[^1], and the Life of others[^2].
notes:
  "1": Eph. 5:28–29
  "2": 1 Kgs. 18:4
