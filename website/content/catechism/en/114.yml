# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 114
question: What doth the Conclusion of the Lord's Prayer teach?
answer: "The Conclusion of the Lord's Prayer, which is, \"For thine is the Kingdom, and the Power, and the Glory, for ever, Amen[^1],\" teacheth us to take our Encouragement in Prayer from God only[^2], and in our Prayers to praise him, ascribing Kingdom, Power and Glory to him[^3]: And in testimony of our Desire, and Assurance to be heard, we say, Amen[^4]."
notes:
  "1": Matt. 6:13
  "2": Dan. 9:4, 7–9, 16–19
  "3": 1 Chron. 29:10–13
  "4": 1 Cor. 14:16; Rev. 22:20–21
