# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 37
question: What is Adoption?
answer: Adoption is an Act of God's free Grace[^1], whereby we are received into the Number, and have a Right to all the Privileges of the Sons of God[^2].
notes:
  "1": 1 John 3:1
  "2": Rom. 8:14
