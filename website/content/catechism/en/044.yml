# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 44
question: What is the Duty which God requireth of Man?
answer: The Duty which God requireth of Man, is Obedience to his Revealed Will[^1].
notes:
  "1": Mic. 6:8; 1 Sam. 15:22
