# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 76
question: What is required in the seventh Commandment?
answer: The seventh Commandment requireth the Preservation of our own, and out Neighbor's Chastity, in Heart, Speech, and Behavior[^1].
notes:
  "1": 1 Cor. 7:2–3, 5, 34, 36; Col. 4:6; 1 Pet. 3:2
