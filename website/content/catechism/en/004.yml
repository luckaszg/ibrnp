# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 4
question: What is the Word of God?
answer: The Holy Scriptures of the Old and New Testaments are the Word of God, and the only certain Rule of Faith and Obedience.[^1]
notes:
  "1": 2 Tim. 3:16; Eph. 2:20
