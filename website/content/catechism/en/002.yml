# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 2
question: Ought every One to believe there is a God?
answer: Every One ought to believe there is a God;[^1] and it is their great Sin and Folly who do not.[^2]
notes:
  "1": Heb. 11:6
  "2": Ps. 14:1
