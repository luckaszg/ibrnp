# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 109
question: What do we pray for in the Second Petition?
answer: In the second Petition, which is, "Thy Kingdom come[^1]," we pray that Satan's Kingdom may be destroyed[^2], and that the Kingdom of Grace may be advanced[^3], our selves and others brought into it and kept in it[^4], and that the Kingdom of Glory may be hastened[^5].
notes:
  "1": Matt. 6:10
  "2": Ps. 68:1, 18
  "3": Rev. 12:10–11
  "4": 2 Thess. 3:1; Rom. 10:1; John 17:19–20
  "5": Rev. 22:20
