# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 59
question: What is required in the third Commandment?
answer: The third Commandment requireth, the Holy and Reverent Use of God's Names[^1], Titles[^2], Attributes[^3], Ordinances[^4], Word[^5], and Works[^6].
notes:
  "1": Matt. 6:9; Deut. 28:58
  "2": Ps. 68:4
  "3": Rev. 15:3–4
  "4": Mal. 1:11, 14
  "5": Ps. 138:1–2
  "6": Job 36:24
