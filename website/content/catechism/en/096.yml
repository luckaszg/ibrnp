# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 96
question: How do Baptism and the Lord's Supper, become effectual Means of Salvation?
answer: Baptism and the Lord's Supper become effectual Means of Salvation, not for any Virtue in them, or in him that doth administer them, but only by the Blessing of Christ[^1], and the working of the Spirit in those that by Faith received them[^2].
notes:
  "1": 1 Pet. 3:21; Matt. 3:11; 1 Cor. 3:6–7
  "2": 1 Cor. 12:13
