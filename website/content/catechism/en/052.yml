# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 52
question: What is forbidden in the first Commandment?
answer: The first Commandment forbiddeth the denying[^1], or not worshipping and glorifying the true God, as God[^2], and our God[^3]; and the giving that Worship and Glory to any other, which is due unto him alone[^4].
notes:
  "1": Ps. 14:1
  "2": Rom. 1:21
  "3": Ps. 81:10–11
  "4": Rom. 1:25–26
