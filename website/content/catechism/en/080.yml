# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 80
question: What is forbidden in the eighth Commandment?
answer: The eighth Commandment forbiddeth whatsoever doth, or may, unjustly hinder our own, or our Neighbour's Wealth, or outward Estate[^1].
notes:
  "1": Prov. 21:17; Prov. 23:20–21; Prov. 28:19; Eph. 4:28
