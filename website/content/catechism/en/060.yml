# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 60
question: What is forbidden in the third Commandment?
answer: The third Commandment forbiddeth all profaning and abusing of any thing, whereby God makes himself known[^1].
notes:
  "1": Mal. 1:6–7, 12; Mal. 2:2; Mal. 3:14
