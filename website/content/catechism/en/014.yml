# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 14
question: What are God's Works of Providence?
answer: God's Works of Providence, are his most Holy[^1], Wise[^2], and Powerful preserving[^3], and governing all his Creatures, and all their Actions[^4].
notes:
  "1": Ps. 145:17
  "2": Ps. 104:24; Isa. 28:29
  "3": Heb. 1:3
  "4": Ps. 103:19; Matt. 10:29–31
