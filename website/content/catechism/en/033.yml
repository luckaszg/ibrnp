# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 33
question: How doth the Spirit apply to us the Redemption purchased by Christ?
answer: The Spirit applieth to us the Redemption purchased by Chrift, by working Faith in us[^1], and thereby uniting us to Christ, in our effectual Calling[^2].
notes:
  "1": Eph. 1:13–14; John 6:37, 39; Eph. 2:8
  "2": Eph. 3:17; 1 Cor. 1:9
