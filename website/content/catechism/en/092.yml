# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 92
question: What is Repentance unto Life?
answer: Repentance unto Life is a saving Grace[^1], whereby a Sinner, out of a true Sense of his Sin[^2], and Apprehension of the Mercy of God in Christ[^3], doth, with grief and hatred of his Sin, turn from it unto God[^4], with full Purpose of, and Endeavor after, new Obedience[^5].
notes:
  "1": Acts 11:28
  "2": Acts 2:37–38
  "3": Joel 2:12; Jer. 3:22
  "4": Jer. 31:18–19; Ezek. 36:31
  "5": 2 Cor. 7:11; Isa. 1:16–17
