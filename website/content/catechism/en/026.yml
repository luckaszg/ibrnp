# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 26
question: What Offices doth Christ execute as our Redeemer?
answer: Christ as our Redeemer executeth the Offices of a Prophet, of a Priest, and of a King, both in his Estate of Humiliation and Exaltation[^1].
notes:
  "1": Acts 3:22; Heb. 12:25; 2 Cor. 13:3; Heb. 5:5–7; Heb. 7:25; Ps. 2:6; Isa. 9:6–7; Matt. 21:5; Ps. 2:8–11
