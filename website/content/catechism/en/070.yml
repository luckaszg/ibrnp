# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 70
question: What is forbidden in the fifth Commandment?
answer: The fifth Commandment forbiddeth the neglecting of, or doing any thing against the Honor and Duty which belongeth to every one in their several Places and Relations[^1].
notes:
  "1": Matt. 15:4–6; Ezek. 34:2–4; Rom. 13:8
