# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 82
question: What is required in the ninth Commandment?
answer: The ninth Commandment requireth the maintaining and promoting of Truth between Man and Man[^1], and of our own and our Neighbor's good Name[^2], especially in Witness-bearing[^3].
notes:
  "1": Zech. 8:16
  "2": 3 John 1:12
  "3": Prov. 14:5, 25
