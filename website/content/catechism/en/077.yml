# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 77
question: What is forbidden in the seventh Commandment?
answer: The seventh Commandment forbiddeth all unchast Thoughts, Words and Actions[^1].
notes:
  "1": Matt. 15:19; Matt. 5:28; Eph. 5:3–4
