# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 13
question: How did God create Man?
answer: God created Man, Male and Female, after his own Image, in Knowledge, Righteousness and Holiness, with Dominion over the Creatures[^1].
notes:
  "1": Gen. 1:26–28; Col. 3:10; Eph. 4:24
