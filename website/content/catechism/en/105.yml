# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 105
question: What is Prayer?
answer: Prayer is an offering up our Desires to God[^1], by the Assistance of the Holy Spirit[^2], for things agreeable to his Will[^3], in the Name of Christ[^4] believing[^5], with Confession of our Sins[^6], and thankful Acknowledgment of his Mercies[^7].
notes:
  "1": Ps. 62:8
  "2": Rom. 8:26
  "3": 1 John 5:14
  "4": John 16:23
  "5": Matt. 21:22; Jas. 1:6
  "6": Ps. 32:5–6; Dan. 9:4
  "7": Phil. 4:6
