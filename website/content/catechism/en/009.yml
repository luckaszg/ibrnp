# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 9
question: How many Persons are there in the Godhead?
answer: There are Three Persons in the Godhead, the Father, the Son, and the Holy Spirit; and these Three are One God, the same in Essence, equal in Power and Glory[^1].
notes:
  "1": 1 John 5:7; Matt. 28:19
