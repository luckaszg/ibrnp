# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 54
question: Which is the second Commandment?
answer: 'The second Commandment is, "Thou shalt not make unto thee any graven Image, or any Likeness of any thing that is in Heaven above, or that is in the Earth beneath, or that is in the Water under the Earth; thou shalt not bow down thy self to them, nor serve them: For I the LORD thy God am a jealous God, visiting the Iniquity of the Fathers upon the Children, unto the Third and Fourth Generation of them that hate me; and shewing Mercy unto Thousands of them that love me and keep my Commandments[^1].'
notes:
  "1": Exod. 20:4–6
