# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 40
question: What Benefits do Believers receive from Christ at their Death?
answer: "The Souls of Believers are at their Death made, perfect in Holiness[^1], and do immediately pass into Glory[^2]: And their Bodies being still united to Christ[^3], do rest in their Graves[^4] till the Resurrection[^5]."
notes:
  "1": Heb. 12:23
  "2": 2 Cor. 5:1, 6, 8; Phil. 1:23; Luke 23:43
  "3": 1 Thess. 4:14
  "4": Isa. 57:2
  "5": Job 19:26–27
