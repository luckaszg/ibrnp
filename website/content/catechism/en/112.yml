# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 112
question: What do we pray for in the fifth Petition?
answer: In the fifth Petition, which is, "And forgive us our Debts as we forgive our Debtors[^1]," we pray, that God for Christ's sake would freely pardon all our Sins[^2]; which we are the rather encouraged to ask, because by his Grace we are enabled from the Heart to forgive others[^3].
notes:
  "1": Matt. 6:12
  "2": Ps. 51:1–2, 7, 9; Dan. 9:17–19
  "3": Luke 11:4; Matt. 18:35
