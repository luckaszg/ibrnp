# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 10
question: What are the Decrees of God?
answer: The Decrees of God are, his Eternal Purpose according to the Counsel of his Will, whereby, for his own Glory, he hath foreordained whatsoever comes to pass[^1].
notes:
  "1": Eph. 1:4, 11; Rom. 9:22–23
