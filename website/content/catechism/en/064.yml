# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 64
question: Which Day of the Seven hath God appointed to be the Weekly Sabbath?
answer: Before the Refurrection of Christ, God appointed the Seventh Day of the Week to be the Weekly Sabbath[^1], and the First Day of the Week ever since, to continue to the End of the World, which is the Christian Sabbath[^2].
notes:
  "1": Exod. 20:8–11; Deut. 5:12–14
  "2": Ps. 118:24; Matt. 28:1; Mark 2:27–28; Mark 16:2; Luke 24:1, 30–36; John 20:1, 19–21, 26; Acts 1:3; Acts 2:1–2; Acts 20:7; 1 Cor. 16:1–2; Rev. 1:10
