# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 5
question: May all Men make use of the Holy Scriptures?
answer: All Men are not only permitted, but commanded and exhorted, to read, hear, and understand the Holy Scriptures.[^1]
notes:
  "1": John 5:39; Deut. 17:18–19; Rev. 1:3; Acts 8:30
