# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 74
question: What is forbidden in the sixth Commandment?
answer: The sixth Commandment absolutely forbiddeth the taking away of our own Life; or the Life of our Neighbor unjustly, or whatsoever tendeth thereunto[^1].
notes:
  "1": Acts 16:28; Gen. 9:6
