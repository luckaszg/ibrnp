# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 47
question: What is the Sum of the Ten Commandments?
answer: The Sum of the Ten Commandments is, to love the Lord our God, with all our Heart, with all our Soul, with all our Strength, and with all our Mind; and our Neighbour as our Selves[^1].
notes:
  "1": Matt. 22:37–40
