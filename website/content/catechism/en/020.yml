# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 20
question: Into what Estate did the Fall bring Mankind?
answer: The Fall brought Mankind into an Estate of Sin and Misery[^1].
notes:
  "1": Rom. 5:12
