# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 90
question: What doth God require of us, that we may escape his Wrath and Curse, due to us for Sin?
answer: To escape the Wrath and Curse of God due to us for Sin, God requireth of us Faith in Jesus Christ, Repentance unto Life[^1], with the diligent use all the outward Means, whereby Christ communicateth to us the Benefits of Redemption[^2].
notes:
  "1": Acts 20:21
  "2": Prov. 2:1–6; Prov. 8:33–36; Isa. 55:2–3
