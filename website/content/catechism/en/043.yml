# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 43
question: What shall be done to the Wicked at the Day of Judgment?
answer: At the Day of Judgment the Bodies of the Wicked being raised out of their Graves, shall be sentenced together with their Souls, to unspeakable Torments, with the Devil and his Angels for ever[^1].
notes:
  "1": John 5:28–29; Matt. 25:41, 46; 2 Thess. 1:8–9
