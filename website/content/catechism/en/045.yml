# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 45
question: What did God at first reveal to Man for the Rule of his Obedience?
answer: The Rule which God at first revealed to Man for his Obedience, was the Moral Law[^1].
notes:
  "1": Rom. 2:14–15; Rom. 10:5
