# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 85
question: What is required in the tenth Commandment?
answer: The tenth Commandment requireth the full Contentment with our own Condition[^1], with a right and charitable frame of Spirit toward our Neighbor, and all that is his[^2].
notes:
  "1": Heb. 13:5; 1 Tim. 6:6
  "2": Job 31:29; Rom. 12:15; 1 Tim. 1:5; 1 Cor. 13:4–7
