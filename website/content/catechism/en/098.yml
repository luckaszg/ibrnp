# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 98
question: To whom is Baptism to be administered?
answer: Baptism is to be administered to all those, who actually profess Repentance toward God, Faith in, and Obedience to our Lord Jesus Christ, and to none other[^1].
notes:
  "1": Matt. 3:6; Matt. 28:19; Mark 16:16; Acts 2:37–38; Acts 8:36–38
