# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 32
question: How are we made Partakers of the Redemption purchased by Christ?
answer: We are made Partakers of the Redemption purchased by Christ, by the effectual Application of it to us[^1] by his Holy Spirit[^2].
notes:
  "1": John 1:11–12
  "2": Titus 3:5–6
