# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 63
question: What is required in the fourth Commandment?
answer: The fourth Commandment requireth, the keeping Holy to God one whole Day in Seven, to be a Sabbath to himself[^1].
notes:
  "1": Exod. 20:8–11; Deut. 5:12–14
