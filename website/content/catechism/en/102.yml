# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 102
question: What is the Lord's Supper?
answer: The Lord's Supper is an Ordinance of the New Testament instituted by Jesus Christ; wherein by giving and receiving Bread and Wine, according to his Appointment, his Death is shewed forth; and the worthy Receivers are, not after a Corporal and Carnal manner, but by Faith, made Partakers of his Body and Blood, with all his Benefits, to their spiritual Nourishment, and growth in Grace[^1].
notes:
  "1": Matt. 26:26–28; 1 Cor. 11:23–26; 1 Cor. 10:16
