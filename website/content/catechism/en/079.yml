# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 79
question: What is required in the eighth Commandment?
answer: The eighth Commandment requireth the lawful procuring, and furthering the Wealth and outward Estate of our selves, and others[^1].
notes:
  "1": Gen. 30:30; 1 Tim. 5:8; Lev. 25:35; Deut. 22:1–5; Exod. 23:4–5; Gen. 47:14, 20
