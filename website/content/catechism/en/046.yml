# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 46
question: Where is the Moral Law summarily comprehended?
answer: The Moral Law is summarily comprehended in the Ten Commandments[^1].
notes:
  "1": Deut. 10:4; Matt. 19:17
