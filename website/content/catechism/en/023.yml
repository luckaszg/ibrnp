# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 23
question: Did God leave all Mankind to perish in the Estate of Sin and Misery?
answer: God, having out of his meer good pleasure, from all Eternity, elected some to Everlasting Life[^1], did enter into a Covenant of Grace, to deliver them out of the Estate of Sin and Misery, and to bring them into an Estate of Salvation by a Redeemer[^2].
notes:
  "1": Eph. 1:4–5
  "2": Rom. 3:20–22; Gal. 3:21–22
