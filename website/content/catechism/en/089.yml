# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 89
question: What doth every Sin deserve?
answer: Every Sin deserveth God's Wrath and Curse, both in this Life, and that which is to come[^1].
notes:
  "1": Eph. 5:6; Gal. 3:10; Lam. 3:39; Matt. 25:41; Rom. 6:23
