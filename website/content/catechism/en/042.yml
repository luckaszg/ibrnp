# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 42
question: But what shall be done to the Wicked at their Death?
answer: The Souls of the Wicked shall at their death be cast into the Torments of Hell, and their Bodies lie in their Graves, till the Refurrection and Judgment of the Great Day[^1].
notes:
  "1": Luke 16:23–24; Acts 1:25; Jude 1:7; 1 Pet. 3:19; Ps. 49:14
