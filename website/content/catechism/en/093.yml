# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 93
question: What are the outward Means, whereby Christ communicateth to us the Benefits of Redemption?
answer: The outward in ordinary Means, whereby Christ communicateth to us the Benefits of Redemption, are his Ordinances, especially the Word, Baptism, the Lord's Supper, and Prayer; all which Means are made effectual to the Elect for Salvation[^1].
notes:
  "1": Matt. 28:19–20; Acts 2:42, 46–47
