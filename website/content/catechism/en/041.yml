# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 41
question: What Benefits do Believers receive from Christ at the Resurrection?
answer: At the Resurrection Believers being raised up in Glory[^1], shall be openly acknowledged, and acquitted in the Day of Judgement[^2], and made perfectly blessed, both in Soul and Body, in the full enjoyment of God[^3], to all Eternity[^4].
notes:
  "1": 1 Cor. 15:43
  "2": Matt. 25:23; Matt. 10:32
  "3": 1 John 3:2; 1 Cor. 13:12
  "4": 1 Thess. 4:17–18
