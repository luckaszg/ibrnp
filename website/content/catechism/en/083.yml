# The Baptist Catechism (1695), public domain. Beddome's sub-questions are not yet available in English.
# [^n] markers point to the proof texts in "notes".
number: 83
question: What is forbidden in the ninth Commandment?
answer: The ninth Commandment forbiddeth whatsoever is prejudicial to Truth, or injurious to our own or our Neighbor's good name[^1].
notes:
  "1": 1 Sam. 17:28; Lev. 19:16; Ps. 15:3
