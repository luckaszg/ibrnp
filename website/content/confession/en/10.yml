# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 10
title: Of Effectual Calling
paragraphs:
  - n: 1
    text: Those whom God hath predestinated unto Life, he is pleased in his appointed, and accepted time, effectually to call[^1] by his word, and Spirit, out of that state of sin, and death, in which they are by nature, to grace and Salvation by Jesus Christ;[^2] inlightning their minds, spiritually, and savingly to understand the things of God;[^3] taking away their heart of stone, and giving unto them an heart of flesh;[^4] renewing their wills, and by his Almighty power determining them to that which is good, and effectually drawing them to Jesus Christ;[^5] yet so as they come most freely, being made willing by his Grace.[^6]
  - n: 2
    text: This Effectual Call is of God's free, and special grace alone, not from any thing at all foreseen in man, nor from any power, or agency in the Creature,[^7] coworking with his special Grace, the Creature being wholly passive therein, being dead in sins and trespasses, until being quickned & renewed by the holy Spirit,[^8] he is thereby enabled to answer this call, and to embrace the Grace offered and conveyed in it; and that by no less power, then that which raised up Christ from the dead.[^9]
  - n: 3
    text: Elect Infants dying in infancy, are regenerated and saved by Christ through the Spirit;[^10] who worketh when, and where, and how he pleaseth:[^11] so also are all other elect persons, who are uncapable of being outwardly called by the Ministry of the Word.
  - n: 4
    text: Others not elected, although they may be called by the Ministry of the word, and may have some common operations of the Spirit,[^12] yet not being effectually drawn by the Father, they neither will, nor can truly come to Christ; and therefore cannot be saved:[^13] much less can men that receive not the Christian Religion be saved; be they never so diligent to frame their lives according to the light of nature, and the Law of that Religion they do profess.[^14]
notes:
  "1": Rom. 8:30; Rom. 11:7; Eph. 1:10–11; 2 Thess. 3:13–14
  "2": Eph. 2:1–6
  "3": Acts 26:18; Eph. 1:17–18
  "4": Ezek. 36:26
  "5": Deut. 30:6; Ezek. 36:27; Eph. 1:19
  "6": Ps. 110:3; Song 1:4
  "7": 2 Tim. 1:9; Eph. 2:8
  "8": 1 Cor. 2:14; Eph. 2:5; John 5:25
  "9": Eph. 1:19–20
  "10": John 3:3, 5–6
  "11": John 3:8
  "12": Matt. 22:14; Matt. 13:20–21; Heb. 6:4–5
  "13": John 6:44–45, 65; 1 John 2:24–25
  "14": Acts 4:12; John 4:22; John 17:3
