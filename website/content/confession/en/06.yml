# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 6
title: Of the Fall of Man, of Sin, and of the Punishment thereof
paragraphs:
  - n: 1
    text: Although God created Man upright, and perfect, and gave him a righteous law, which had been unto life had he kept it, and threatned death upon the breach thereof;[^1] yet he did not long abide in this honour; Satan using the subtilty of the serpent to seduce Eve, then by her seducing Adam, who without any compulsion, did wilfully transgress the Law of their Creation, and the command given unto them, in eating the forbidden fruit;[^2] which God was pleased according to his wise and holy Councel to permit, having purposed to order it, to his own glory.
  - n: 2
    text: Our first Parents by this Sin, fell from their original righteousness and communion with God, and we in them, whereby death came upon all;[^3] all becoming dead in Sin,[^4] and wholly defiled, in all the faculties, and parts, of soul, and body.[^5]
  - n: 3
    text: They being the root, and by Gods appointment, standing in the room, and stead of all mankind; the guilt of the Sin was imputed, and corrupted nature conveyed, to all their posterity descending from them by ordinary generation,[^6] being now conceived in Sin,[^7] and by nature children of wrath,[^8] the servants of Sin, the subjects of death[^9] and all other miseries, spiritual, temporal and eternal, unless the Lord Jesus set them free.[^10]
  - n: 4
    text: From this original corruption, whereby we are utterly indisposed, disabled, and made opposite to all good, and wholly inclined to all evil,[^11] do proceed all actual transgressions.[^12]
  - n: 5
    text: The corruption of nature, during this Life, doth remain in those that are regenerated:[^13] and although it be through Christ pardoned, and mortified, yet both it self, and the first motions thereof, are truely and properly Sin.[^14]
notes:
  "1": Gen. 2:16–17
  "2": Gen. 3:12–13; 2 Cor. 11:3
  "3": Rom. 3:23
  "4": Rom. 5:12
  "5": Titus 1:15; Gen. 6:5; Jer. 17:9; Rom. 3:10–19
  "6": Rom. 5:12–19; 1 Cor. 15:21–22, 45, 49
  "7": Ps. 51:5; Job 14:4
  "8": Eph. 2:3
  "9": Rom. 6:20; Rom. 5:12
  "10": Heb. 2:14; 1 Thess. 1:10
  "11": Rom. 8:7; Col. 1:21
  "12": Jas. 1:14–15; Matt. 15:19
  "13": Rom. 7:18, 23; Eccl. 7:20; 1 John 1:8
  "14": Rom. 7:24–25; Gal. 5:17
