# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 4
title: Of Creation
paragraphs:
  - n: 1
    text: In the beginning it pleased God the Father, Son, and Holy Spirit,[^1] for the manifestation of the glory of his eternal power,[^2] wisdom, and goodness, to Create or make the world, and all things therein, whether visible or invisible, in the space of six days, and all very good.[^3]
  - n: 2
    text: After God had made all other Creatures, he Created man, male and female,[^4] with reasonable and immortal souls,[^5] rendring them fit unto that life to God; for which they were Created; being made after the image of God, in knowledge, righteousness, and true holyness;[^6] having the Law of God written in their hearts,[^7] and power to fulfill it; and yet under a possibility of transgressing, being left to the liberty of their own will, which was subject to change.[^8]
  - n: 3
    text: Besides the Law written in their hearts, they received a command not to eat of the tree of knowledge of good and evil;[^9] which whilst they kept, they were happy in their Communion with God, and had dominion over the Creatures.[^10]
notes:
  "1": John 1:2–3; Heb. 1:2; Job 26:13
  "2": Rom. 1:20
  "3": Col. 1:16; Gen. 2:1–2
  "4": Gen. 1:27
  "5": Gen. 2:7
  "6": Eccl. 7:29; Gen. 1:26
  "7": Rom. 2:14–15
  "8": Gen. 3:6
  "9": Gen. 2:17; Gen. 3:8–10
  "10": Gen. 1:26, 28
