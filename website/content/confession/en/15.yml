# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 15
title: Of Repentance unto Life and Salvation
paragraphs:
  - n: 1
    text: Such of the Elect as are converted at riper years, having sometimes lived in the state of nature, and therein served divers lusts and pleasures, God in their Effectual Calling giveth them Repentance unto Life.[^1]
  - n: 2
    text: Whereas there is none that doth good, and sinneth not;[^2] and the best of men may through the power, and deceitfulness of their corruption dwelling in them, with the prevalency of temptation, fall into great sins, and provocations; God hath in the Covenant of Grace, mercifully provided that Beleivers so sinning, and falling, be renewed through Repentance unto Salvation.[^3]
  - n: 3
    text: This saving Repentance is an evangelical Grace,[^4] whereby a person being by the Holy Spirit made sensible of the manifold evils of his sin, doth, by Faith in Christ, humble himself for it, with godly sorrow, detestation of it, and self abhorrency;[^5] praying for pardon, and strength of grace, with a purpose and endeavour by supplies of the Spirit, to walk before God unto all well pleasing in all things.[^6]
  - n: 4
    text: As Repentance is to be continued through the whole course of our lives, upon the account of the body of death, and the motions thereof; so it is every mans duty, to repent of his particular known sins, particularly.[^7]
  - n: 5
    text: Such is the provision which God hath made through Christ in the Covenant of Grace, for the preservation of Believers unto Salvation, that although there is no sin so small, but it deserves damnation;[^8] yet there is no sin so great, that it shall bring damnation on them that repent;[^9] which makes the constant preaching of Repentance necessary.
notes:
  "1": Titus 3:2–5
  "2": Eccl. 7:20
  "3": Luke 22:31–32
  "4": Zech. 12:10; Acts 11:18
  "5": Ezek. 36:31; 2 Cor. 7:11
  "6": Ps. 119:6, 128
  "7": Luke 19:8; 1 Tim. 1:13, 15
  "8": Rom. 6:23
  "9": Isa. 1:16, 18; Isa. 55:7
