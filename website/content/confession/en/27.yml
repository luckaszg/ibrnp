# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 27
title: Of the Communion of the Saints
paragraphs:
  - n: 1
    text: All Saints that are united to Jesus Christ their Head, by his Spirit, and Faith; although they are not made thereby one person with him, have fellowship in his Graces, sufferings, death, resurrection, and glory;[^1] and being united to one another in love, they have communion in each others gifts, and graces;[^2] and are obliged to the performance of such duties, publick and private, in an orderly way, as do conduce to their mutual good, both in the inward and outward man.[^3]
  - n: 2
    text: Saints by profession are bound to maintain an holy fellowship and communion in the worship of God, and in performing such other spiritual services, as tend to their mutual edification;[^4] as also in relieving each other in outward things according to their several abilities, and necessities;[^5] which communion according to the rule of the Gospel, though especially to be exercised by them, in the relations wherein they stand, whether in families,[^6] or Churches;[^7] yet as God offereth opportunity is to be extended to all the houshold of faith, even all those who in every place call upon the name of the Lord Jesus; nevertheless their communion one with another as Saints, doth not take away or infringe, the title or propriety, which each man hath in his goods and possessions.[^8]
notes:
  "1": 1 John 1:3; John 1:16; Phil. 3:10; Rom. 6:5–6
  "2": Eph. 4:15–16; 1 Cor. 12:7; 1 Cor. 3:21–23
  "3": 1 Thess. 5:11, 14; Rom. 1:12; 1 John 3:17–18; Gal. 6:10
  "4": Heb. 10:24–25; Heb. 3:12–13
  "5": Acts 11:29–30
  "6": Eph. 6:4
  "7": 1 Cor. 12:14–27
  "8": Acts 5:4; Eph. 4:28
