# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 18
title: Of the Assurance of Grace and Salvation
paragraphs:
  - n: 1
    text: Although temporary Believers, and other unregenerate men, may vainly deceive themselves with false hopes, and carnal presumptions, of being in the favour of God, and state of salvation, which hope of theirs shall perish;[^1] yet such as truely believe in the Lord Jesus, and love him in sincerity, endeavouring to walk in all good Conscience before him, may in this life be certainly assured that they are in the state of Grace; and may rejoyce in the hope of the glory of God[^2] which hope shall never make them ashamed.[^3]
  - n: 2
    text: This certainty is not a bare conjectural, and probable perswasion, grounded upon a fallible hope; but an infallible assurance of faith[^4] founded on the Blood and Righteousness of Christ revealed in the Gospel;[^5] and also upon the inward evidence of those graces of the Spirit unto which promises are made,[^6] and on the testimony of the Spirit of adoption, witnessing with our Spirits that we are the children of God;[^7] and as a fruit thereof keeping the heart both humble and holy.[^8]
  - n: 3
    text: This infallible assurance doth not so belong to the essence of faith, but that a true Believer, may wait long and conflict with many difficulties before he be partaker of it;[^9] yet being enabled by the Spirit to know the things which are freely given him of God, he may without extraordinary revelation in the right use of means attain thereunto:[^10] and therefore it is the duty of every one, to give all diligence to make their Calling and Election sure, that thereby his heart may be enlarged in peace and joy in the holy Spirit, in love and thankfulness to God, and in strength and chearfulness in the duties of obedience, the proper fruits of this Assurance;[^11] so far is it from inclining men to looseness.[^12]
  - n: 4
    text: True Believers may have the assurance of their Salvation divers ways shaken, diminished, and intermitted; as by negligence in preserving of it,[^13] by falling into som special Sin, which woundeth the Conscience, and grieveth the Spirit,[^14] by some sudden or vehement temptation,[^15] by Gods withdrawing the light of his countenance and suffering even such as fear him to walk in darkness and to have no light;[^16] yet are they never destitute of the seed of God,[^17] and Life of Faith,[^18] that Love of Christ, and the brethren, that sincerity of Heart, and Conscience of duty, out of which by the operation of the Spirit, this Assurance may in due time be revived:[^19] and by the which in the mean time they are preserved from utter despair.[^20]
notes:
