# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 25
title: Of the Civil Magistrate
paragraphs:
  - n: 1
    text: Marriage is to be between one Man and one Woman; neither is it lawful for any man to have more then one Wife, nor for any Woman to have more then one Husband at the same time.[^1]
  - n: 2
    text: Marriage was ordained for the mutual help of Husband and Wife,[^2] for the increase of Man-kind, with a legitimate issue,[^3] and for preventing of uncleanness.[^4]
  - n: 3
    text: It is lawful for all sorts of people to Marry, who are able with judgment to give their consent;[^5] yet it is the duty of Christians to marry in the Lord,[^6] and therefore such as profess the true Religion, should not Marry with Infidels, or Idolaters; neither should such as are godly be unequally yoked, by marrying with such as are wicked, in their life, or maintain damnable Heresie.[^7]
  - n: 4
    text: Marriage ought not to be within the degrees of consanguinity, or Affinity forbidden in the word;[^8] nor can such incestuous Marriage ever be made lawful, by any law of Man or consent of parties, so as those persons may live together as Man and Wife.[^9]
notes:
  "1": Gen. 2:24; Mal. 2:15; Matt. 19:5–6
  "2": Gen. 2:18
  "3": Gen. 1:28
  "4": 1 Cor. 7:2, 9
  "5": Heb. 13:4; 1 Tim. 4:3
  "6": 1 Cor. 7:39
  "7": Neh. 13:25–27
  "8": Lev. 18
  "9": Mark 6:18; 1 Cor. 5:1
