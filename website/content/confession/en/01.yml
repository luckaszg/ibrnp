# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 1
title: Of the Holy Scriptures
paragraphs:
  - n: 1
    text: The Holy Scripture is the only sufficient, certain, and infallible rule of all saving Knowledge, Faith and Obedience;[^1] Although the light of Nature, and the works of Creation and Providence do so far manifest the goodness, wisdom and power of God, as to leave men unexcusable; yet are they not sufficient to give that knowledge of God and His will, which is necessary unto Salvation.[^2] Therefore it pleased the Lord at sundry times, and in divers manners, to reveal himself, and to declare that His will unto his Church;[^3] and afterward for the better preserving, and propagating of the Truth, and for the more sure Establishment, and Comfort of the Church against the corruption of the flesh, and the malice of Satan, and of the World, to commit the same wholly unto writing; which maketh the Holy Scriptures to be most necessary, those former ways of Gods revealing his will unto his people being now ceased.[^4]
  - n: 2
    text: "Under the Name of Holy Scripture or the Word of God written; are now contained all the Books of the Old and New Testament which are these: Of the Old Testament: Genesis, Exodus, Leviticus, Numbers, Deuteronomy, Joshua, Judges, Ruth, 1 Samuel, 2 Samuel, 1 Kings, 2 Kings, 1 Chronicles, 2 Chronicles, Ezra, Nehemiah, Esther, Job, Psalms, Proverbs, Ecclesiastes, The Song of Songs, Isaiah, Jeremiah, Lamentations, Ezekiel, Daniel, Hosea, Joel, Amos, Obadiah, Jonah, Micah, Nahum, Habakkuk, Zephaniah, Haggai, Zechariah, Malachi. Of the New Testament: Matthew, Mark, Luke, John, The Acts of the Apostles, Pauls Epistle to the Romans, 1 Corinthians, 2 Corinthians, Galatians, Ephesians, Phillippians, Colossians, 1 Thessalonians, 2 Thessalonians, 1 Timothy, 2 Timothy, to Titus, to Philemon, the Epistle to the Hebrews, the Epistle of James, the First and Second Epistles of Peter, the First, Second and Third Epistles of John, the Epistle of Jude, the Revelation. All which are given by the inspiration of God, to be the rule of Faith and Life.[^5]"
  - n: 3
    text: The Books commonly called Apocrypha not being of Divine inspiration, are no part of the Canon (or rule) of the Scripture, and therefore are of no authority to the Church of God, nor to be any otherwise approved or made use of, then other humane writings.[^6]
  - n: 4
    text: The Authority of the Holy Scripture for which it ought to be believed dependeth not upon the testimony of any man, or Church; but wholly upon God (who is truth it self) the Author thereof; therefore it is to be received, because it is the Word of God.[^7]
  - n: 5
    text: We may be moved and induced by the testimony of the Church of God, to an high and reverent esteem of the Holy Scriptures; and the heavenliness of the matter, the efficacy of the Doctrine, and the Majesty of the stile, the consent of all the parts, the scope of the whole (which is to give all glory to God) the full discovery it makes of the only way of mans salvation, and many other incomparable Excellencies, and intire perfections thereof, are arguments whereby it doth abundantly evidence it self to be the Word of God; yet notwithstanding; our full perswasion, and assurance of the infallible truth, and divine authority thereof, is from the inward work of the Holy Spirit, bearing witness by and with the Word in our Hearts.[^8]
  - n: 6
    text: The whole Councel of God concerning all things necessary for his own Glory, Mans Salvation, Faith and Life, is either expressely set down or necessarily contained in the Holy Scripture; unto which nothing at any time is to be added, whether by new Revelation of the Spirit, or traditions of men.[^9]Nevertheless we acknowledge the inward illumination of the Spirit of God, to be necessary for the saving understanding of such things as are revealed in the Word,[^10] and that there are some circumstances concerning the worship of God, and government of the Church common to humane actions and societies; which are to be ordered by the light of nature, and Christian prudence according to the general rules of the Word, which are always to be observed.[^11]
  - n: 7
    text: All things in Scripture are not alike plain in themselves, nor alike clear unto all;[^12] yet those things which are necessary to be known, believed, and observed for Salvation, are so clearly propounded, and opened in some place of Scripture or other, that not only the learned, but the unlearned, in a due use of ordinary means, may attain to a sufficient understanding of them.[^13]
  - n: 8
    text: The Old Testament in Hebrew, (which was the Native language of the people of God of old)[^14] and the New Testament in Greek (which at the time of the writing of it was most generally known to the Nations being immediately inspired by God, and by his singular care and Providence kept pure in all Ages, are therefore authentical; so as in all controversies of Religion the Church is finally to appeal unto them[^15] But because these original tongues are not known to all the people of God, who have a right unto, and interest in the Scriptures, and are commanded in the fear of God to read[^16] and search them,[^17] therefore they are to be translated into the vulgar language of every Nation, unto which they come,[^18] that the Word of God dwelling plentifully in all, they may worship him in an acceptable manner, and through patience and comfort of the Scriptures may have hope.[^19]
  - n: 9
    text: "The infallible rule of interpretation of Scripture is the Scripture it self: And therefore when there is a question about the true and full sense of any Scripture (which is not manifold but one) it must be searched by other places that speak more clearly.[^20]"
  - n: 10
    text: The supream judge by which all controversies of Religion are to be determined, and all Decrees of Councels, opinions of antient Writers, Doctrines of men, and private Spirits, are to be examined, and in whose sentence we are to rest, can be no other but the Holy Scripture delivered by the Spirit, into which Scripture so delivered, our faith is finally resolved.[^21]
