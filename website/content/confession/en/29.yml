# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 29
title: Of Baptism
paragraphs:
  - n: 1
    text: Baptism is an Ordinance of the New Testament, ordained by Jesus Christ, to be unto the party Baptized, a sign of his fellowship with him, in his death, and resurrection; of his being engrafted into him;[^1] of remission of sins;[^2] and of his giving up unto God through Jesus Christ to live and walk in newness of Life.[^3]
  - n: 2
    text: Those who do actually professe repentance towards God, faith in, and obedience, to our Lord Jesus, are the only proper subjects of this ordinance.[^4]
  - n: 3
    text: The outward element to be used in this ordinance is water, wherein the party is to be baptized, in the name of the Father, and of the Son, and of the Holy Spirit.[^5]
  - n: 4
    text: Immersion, or dipping of the person in water, is necessary to the due administration of this ordinance.[^6]
notes:
  "1": Rom. 6:3–5; Col. 2:12; Gal. 3:27
  "2": Mark 1:4; Acts 26:16
  "3": Rom. 6:2, 4
  "4": Mark 16:16; Acts 8:36–37
  "5": Matt. 28:19–20; Acts 8:38
  "6": Matt. 3:16; John 3:23
