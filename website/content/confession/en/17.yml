# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 17
title: Of The Perseverance of the Saints
paragraphs:
  - n: 1
    text: "Those whom God hath accepted in the beloved, effectually called and Sanctified by his Spirit, and given the precious faith of his Elect unto, can neither totally nor finally fall from the state of grace; but shall certainly persevere therein to the end and be eternally saved, seeing the gifts and callings of God are without Repentance, (whence he still begets and nourisheth in them Faith, Repentance, Love, Joy, Hope, and all the graces of the Spirit unto immortality)[^1] and though many storms and floods arise and beat against them, yet they shall never be able to take them off that foundation and rock which by faith they are fastned upon: notwithstanding through unbelief and the temptations of Satan the sensible sight of the light and love of God, may for a time be clouded, and obscured from them,[^2] yet he is still the same and they shall be sure to be kept by the power of God unto Salvation, where they shall enjoy their purchased possession, they being engraven upon the palm of his hands, and their names having been written in the book of life from all Eternity.[^3]"
  - n: 2
    text: This perseverance of the Saints depends not upon their own free will; but upon the immutability of the decree of Election[^4] flowing from the free and unchangeable love of God the Father; upon the efficacy of the merit and intercession of Jesus Christ and Union with him,[^5] the oath of God,[^6] the abiding of his Spirit & the seed of God within them,[^7] and the nature of the Covenant of Grace[^8] from all which ariseth also the certainty and infallibility thereof.
  - n: 3
    text: And though they may through the temptation of Satan and of the world, the prevalency of corruption remaining in them, and the neglect of means of their preservation fall into grievous sins, and for a time continue therein;[^9] whereby they incur Gods displeasure, and grieve his holy Spirit,[^10] come to have their graces and comforts impaired[^11] have their hearts hardened, and their Consciences wounded,[^12] hurt, and scandalize others, and bring temporal judgements upon themselves:[^13] yet they shall renew their repentance and be preserved through faith in Christ Jesus to the end.[^14]
notes:
  "1": John 10:28–29; Phil. 1:6; 2 Tim. 2:19; 1 John 2:19
  "2": Ps. 89:31–32; 1 Cor. 11:32
  "3": Mal. 3:6
  "4": Rom. 8:30; Rom. 9:11, 16
  "5": Rom. 5:9–10; John 14:19
  "6": Heb. 6:17–18
  "7": 1 John 3:9
  "8": Jer. 32:40
  "9": Matt. 26:70, 72, 74
  "10": Isa. 64:5, 9; Eph. 4:30
  "11": Ps. 51:10, 12
  "12": Ps. 32:3–4
  "13": 2 Sam. 12:14
  "14": Luke 22:32; Luke 22:61–62
