# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 32
title: Of the Last Judgment
paragraphs:
  - n: 1
    text: God hath appointed a Day wherein he will judge the world in Righteousness, by Jesus Christ;[^1] to whom all power and judgement is given of the Father; in which Day not only the Apostate Angels shall be judged;[^2] but likewise all persons that have lived upon the Earth, shall appear before the Tribunal of Christ; to give an account of their Thoughts, Words, and Deeds, and to receive according to what they have done in the body, whether good or evil.[^3]
  - n: 2
    text: "The end of Gods appointing this Day, is for the manifestation of the glory of his Mercy, in the Eternal Salvation of the Elect; and of his Justice in the Eternal damnation of the Reprobate, who are wicked and disobedient;[^4] for then shall the Righteous go into Everlasting Life, and receive that fulness of Joy, and Glory, with everlasting reward, in the presence of the Lord: but the wicked who know not God, and obey not the Gospel of Jesus Christ, shall be cast into Eternal torments,[^5] and punished with everlasting destruction, from the presence of the Lord, and from the glory of his power.[^6]"
  - n: 3
    text: As Christ would have us to be certainly perswaded that there shall be a Day of judgement, both to deter all men from sin,[^7] and for the greater consolation of the godly, in their adversity;[^8] so will he have that day unknown to Men, that they may shake off all carnal security, and be always watchful, because they know not at what hour, the Lord will come;[^9] and may ever be prepared to say, Come Lord Jesus, Come quickly,[^10] Amen.
notes:
  "1": Acts 17:31; John 5:22, 27
  "2": 1 Cor. 6:3; Jude 1:6
  "3": 2 Cor. 5:10; Eccl. 12:14; Matt. 12:36; Rom. 14:10, 12; Matt. 25:32
  "4": Rom. 9:22–23
  "5": Matt. 25:21, 34; 2 Tim. 4:8
  "6": Matt. 25:46; Mark 9:48; 2 Thess. 1:7–10
  "7": 2 Cor. 5:10–11
  "8": 2 Thess. 1:5–7
  "9": Mark 13:35–37; Luke 13:35–36
  "10": Rev. 22:20
