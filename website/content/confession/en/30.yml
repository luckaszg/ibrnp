# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 30
title: Of the Lord's Supper
paragraphs:
  - n: 1
    text: The Supper of the Lord Jesus, was instituted by him, the same night wherein he was betrayed, to be observed in his Churches unto the end of the world, for the perpetual remembrance, and shewing forth the sacrifice of himself in his death[^1] confirmation of the faith of believers in all the benefits thereof, their spiritual nourishment, and growth in him, their further ingagement in, and to, all duties which they owe unto him; and to be a bond and pledge of their communion with him, and with each other.[^2]
  - n: 2
    text: In this ordinance Christ is not offered up to his Father, nor any real sacrifice made at all, for remission of sin of the quick or dead; but only a memorial of that one offering up of himself, by himself, upon the crosse, once for all;[^3] and a spiritual oblation of all possible praise unto God for the same;[^4] so that the Popish sacrifice of the Mass (as they call it) is most abominable, injurious to Christs own only sacrifice, the alone propitiation for all the sins of the Elect.
  - n: 3
    text: The Lord Jesus hath in this Ordinance, appointed his Ministers to Pray, and bless the Elements of Bread and Wine, and thereby to set them apart from a common to an holy use, and to take and break the Bread; to take the Cup, and (they communicating also themselves) to give both to the Communicants.[^5]
  - n: 4
    text: The denyal of the Cup to the people, worshiping the Elements, the lifting them up, or carrying them about for adoration, and reserving them for any pretended religious use, are all contrary to the nature of this Ordinance, and to the institution of Christ.[^6]
  - n: 5
    text: The outward Elements in this Ordinance, duely set apart to the uses ordained by Christ, have such relation to him crucified, as that truely, although in terms used figuratively, they are sometimes called by the name of the things they represent, to wit the body and Blood of Christ;[^7] albeit in substance, and nature, they still remain truly, and only Bread, and Wine, as they were before.[^8]
  - n: 6
    text: That doctrine which maintains a change of the substance of Bread and Wine, into the substance of Christs body and blood (commonly called Transubstantiation) by consecration of a Priest, or by any other way, is repugnant not to Scripture alone,[^9] but even to common sense and reason; overthroweth the nature of the ordinance, and hath been and is the cause of manifold superstitions, yea, of gross Idolatries.[^10]
  - n: 7
    text: "Worthy receivers, outwardly partaking of the visible Elements in this Ordinance, do then also inwardly by faith, really and indeed, yet not carnally, and corporally, but spiritually receive, and feed upon Christ crucified & all the benefits of his death: the Body and Blood of Christ, being then not corporally, or carnally, but spiritually present to the faith of Believers, in that Ordinance, as the Elements themselves are to their outward senses.[^11]"
  - n: 8
    text: All ignorant and ungodly persons, as they are unfit to enjoy communion with Christ; so are they unworthy of the Lords Table; and cannot without great sin against him, while they remain such, partake of these holy mysteries, or be admitted thereunto:[^12] yea whosoever shall receive unworthily are guilty of the Body and Blood of the Lord, eating and drinking judgement to themselves.[^13]
notes:
  "1": 1 Cor. 11:23–26
  "2": 1 Cor. 10:16–17, 21
  "3": Heb. 9:25–26, 28
  "4": 1 Cor. 11:24; Matt. 26:26–27
  "5": 1 Cor. 11:23–26
  "6": Matt. 26:26–28; Matt. 15:9; Exod. 20:4–5
  "7": 1 Cor. 11:27
  "8": 1 Cor. 11:26; 1 Cor. 11:28
  "9": Acts 3:21; Luke 24:6; Luke 24:39
  "10": 1 Cor. 11:24–25
  "11": 1 Cor. 10:16; 1 Cor. 11:23–26
  "12": 2 Cor. 6:14–15
  "13": 1 Cor. 11:29; Matt. 7:6
