# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 8
title: Of Christ the Mediator
paragraphs:
  - n: 1
    text: "It pleased God in his eternal purpose, to chuse and ordain the Lord Jesus his only begotten Son, according to the Covenant made between them both, to be the Mediator between God and Man;[^1] the Prophet,[^2] Priest[^3] and King;[^4] Head and Saviour of his Church, the heir of all things, and judge of the world: Unto whom he did from all Eternity give a people to be his seed, and to be by him in time redeemed, called, justified, sanctified, and glorified.[^5]"
  - n: 2
    text: "The Son of God, the second Person in the Holy Trinity, being very and eternal God, the brightness of the Fathers glory, of one substance and equal with him: who made the World, who upholdeth and governeth all things he hath made: did when the fullness of time was come take unto him mans nature, with all the Essential properties, and common infirmities thereof,[^6] yet without sin:[^7] being conceived by the Holy Spirit in the Womb of the Virgin Mary, the Holy Spirit coming down upon her, and the power of the most High overshadowing her, and so was made of a Woman, of the Tribe of Judah, of the Seed of Abraham, and David according to the Scriptures:[^8] So that two whole, perfect, and distinct natures, were inseparably joined together in one Person: without conversion, composition, or confusion: which Person is very God, and very Man; yet one Christ, the only Mediator between God and Man.[^9]"
  - n: 3
    text: The Lord Jesus in his humane nature thus united to the divine, in the Person of the Son, was sanctified, and anointed with the Holy Spirit, above measure;[^10] having in him all the treasures of wisdom and knowledge;[^11] in whom it pleased the Father that all fullness should dwell:[^12] To the end that being holy, harmless, undefiled,[^13] and full of Grace, and Truth,[^14] he might be throughly furnished to execute the office of a Mediator, and Surety;[^15] which office he took not upon himself, but was thereunto called by his Father;[^16] who also put all power and judgement in his hand, and gave him Commandement to execute the same.[^17]
  - n: 4
    text: This office the Lord Jesus did most willingly undertake,[^18] which that he might discharge he was made under the Law,[^19] and did perfectly fulfill it, and underwent the punishment due to us, which we should have born and suffered,[^20] being made Sin and a Curse for us:[^21] enduring most grievous sorrows in his Soul; and most painful sufferings in his body;[^22] was crucified, and died, and remained in the state of the dead; yet saw no corruption:[^23] on the third day he arose from the dead,[^24] with the same body in which he suffered;[^25] with which he also ascended into heaven:[^26] and there sitteth at the right hand of his Father, making intercession;[^27] and shall return to judge Men and Angels, at the end of the World.[^28]
  - n: 5
    text: The Lord Jesus by his perfect obedience and sacrifice of himself, which he through the Eternal Spirit once offered up unto God, hath fully satisfied the Justice of God,[^29] procured reconciliation, and purchased an Everlasting inheritance in the Kingdom of Heaven, for all those whom the Father hath given unto him.[^30]
  - n: 6
    text: Although the price of Redemption was not actually paid by Christ, till after his Incarnation, yet the vertue, efficacy, and benefit thereof were communicated to the Elect in all ages successively, from the beginning of the World, in and by those Promises, Types, and Sacrifices, wherein he was revealed, and signified to be the Seed of the Woman, which should bruise the Serpents head;[^31] and the Lamb slain from the foundation of the World:[^32] Being the same yesterday, and to day, and for ever.[^33]
  - n: 7
    text: Christ in the work of Mediation acteth according to both natures, by each nature doing that which is proper to it self; yet by reason of the Unity of the Person, that which is proper to one nature, is sometimes in Scripture attributed to the Person denominated by the other nature.[^34]
  - n: 8
    text: To all those for whom Christ hath obtained eternal redemption, he doth certainly, and effectually apply, and communicate the same; making intercession for them,[^35] uniting them to himself by his spirit, revealing unto them, in and by the word, the mystery of salvation; perswading them to believe, and obey;[^36] governing their hearts by his word and spirit,[^37] and overcoming all their enemies by his Almighty power, and wisdom;[^38] in such manner, and wayes as are most consonant to his wonderful, and unsearchable dispensation; and all of free, and absolute Grace, without any condition foreseen in them, to procure it.[^39]
  - n: 9
    text: This office of Mediator between God and Man, is proper onely to Christ, who is the Prophet, Priest, and King of the Church of God; and may not be either in whole, or any part thereof transfer'd from him to any other.[^40]
  - n: 10
    text: This number and order of Offices is necessary; for in respect of our ignorance, we stand in need of his prophetical Office;[^41] and in respect of our alienation from God, and imperfection of the best of our services, we need his Priestly office, to reconcile us, and present us acceptable unto God:[^42] and in respect our averseness, and utter inability to return to God, and for our rescue, and security from our spiritual adversaries, we need his Kingly office, to convince, subdue, draw, uphold, deliver, and preserve us to his Heavenly Kingdome.[^43]
