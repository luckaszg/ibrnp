# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 26
title: Of the Church
paragraphs:
  - n: 1
    text: The Catholick or universal Church, which (with respect to the internal work of the Spirit, and truth of grace) may be called invisible, consists of the whole number of the Elect, that have been, are, or shall be gathered into one, under Christ the head thereof; and is the spouse, the body, the fulness of him that filleth all in all.[^1]
  - n: 2
    text: All persons throughout the world, professing the faith of the Gospel, and obedience unto God by Christ, according unto it; not destroying their own profession by any Errors everting the foundation, or unholyness of conversation, are and may be called visible Saints;[^2] and of such ought all particular Congregations to be constituted.[^3]
  - n: 3
    text: The purest Churches under heaven are subject to mixture, and error;[^4] and som have so degenerated as to become no Churches of Christ, but Synagogues of Satan;[^5] nevertheless Christ always hath had, and ever shall have a Kingdome in this world, to the end thereof, of such as believe in him, and make profession of his Name.[^6]
  - n: 4
    text: The Lord Jesus Christ is the Head of the Church, in whom by the appointment of the Father, all power for the calling, institution, order, or Government of the Church, is invested in a supream & soveraigne manner,[^7] neither can the Pope of Rome in any sense be head thereof, but is that Antichrist, that Man of sin, and Son of perdition, that exalteth himself in the Church against Christ, and all that is called God; whom the Lord shall destroy with the brightness of his coming.[^8]
  - n: 5
    text: In the execution of this power wherewith he is so intrusted, the Lord Jesus calleth out of the World unto himself, through the Ministry of his word, by his Spirit, those that are given unto him by his Father;[^9] that they may walk before him in all the ways of obedience, which he prescribeth to them in his Word.[^10] Those thus called he commandeth to walk together in particular societies, or Churches, for their mutual edification; and the due performance of that publick worship, which he requireth of them in the World.[^11]
  - n: 6
    text: The Members of these Churches are Saints by calling, visibly manifesting and evidencing (in and by their profession and walking) their obedience unto that call of Christ;[^12] and do willingly consent to walk together according to the appointment of Christ, giving up themselves, to the Lord & one to another by the will of God, in professed subjection to the Ordinances of the Gospel.[^13]
  - n: 7
    text: To each of these Churches thus gathered, according to his mind, declared in his word, he hath given all that power and authority, which is any way needfull, for their carrying on that order in worship, and discipline, which he hath instituted for them to observe; with commands, and rules, for the due and right exerting, and executing of that power.[^14]
  - n: 8
    text: A particular Church gathered, and compleatly Organized, according to the mind of Christ, consists of Officers, and Members; And the Officers appointed by Christ to be chosen and set apart by the Church (so called and gathered) for the peculiar Administration of Ordinances, and Execution of Power, or Duty, which he intrusts them with, or calls them to, to be continued to the end of the World are Bishops or Elders and Deacons.[^15]
  - n: 9
    text: The way appointed by Christ for the Calling of any person, fitted, and gifted by the Holy Spirit, unto the Office of Bishop, or Elder, in a Church, is, that he be chosen thereunto by the common suffrage of the Church it self;[^16] and Solemnly set apart by Fasting and Prayer, with imposition of hands of the Eldership of the Church, if there be any before Constituted therein;[^17] And of a Deacon that he be chosen by the like suffrage, and set apart by Prayer, and the like Imposition of hands.[^18]
  - n: 10
    text: The work of Pastors being constantly to attend the Service of Christ, in his Churches, in the Ministry of the Word, and Prayer, with watching for their Souls, as they that must give an account to him;[^19] it is incumbent on the Churches to whom they Minister, not only to give them all due respect, but also to communicate to them of all their good things according to their ability,[^20] so as they may have a comfortable supply, without being themselves entangled in Secular Affairs;[^21] and may also be capable of exercising Hospitality toward others;[^22] and this is required by the Law of Nature, and by the Express order of our Lord Jesus, who hath ordained that they that preach the Gospel, should live of the Gospel.[^23]
  - n: 11
    text: Although it be incumbent on the Bishops or Pastors of the Churches to be instant in Preaching the Word, by way of Office; yet the work of Preaching the Word, is not so peculiarly confined to them; but that others also gifted, and fitted by the Holy Spirit for it, and approved, and called by the Church, may and ought to perform it.[^24]
  - n: 12
    text: As all Believers are bound to joyn themselves to particular Churches, when and where they have opportunity so to do; So all that are admitted unto the priviledges of a Church, are also under the Censures and Government thereof, according to the Rule of Christ.[^25]
  - n: 13
    text: No Church-members upon any offence taken by them, having performed their Duty required of them towards the person they are offended at, ought to disturb any Church order, or absent themselves from the Assemblies of the Church, or Administration of any Ordinances, upon the account of such offence at any of their fellow-members; but to wait upon Christ, in the further proceeding of the Church.[^26]
  - n: 14
    text: As each Church, and all the Members of it are bound to pray continually, for the good and prosperity of all the Churches of Christ,[^27] in all places; and upon all occasions to further it (every one within the bounds of their places, and callings, in the Exercise of their Gifts and Graces) so the Churches (when planted by the providence of God so as they may injoy opportunity and advantage for it) ought to hold communion amongst themselves for their peace, increase of love, and mutual edification.[^28]
  - n: 15
    text: "In cases of difficulties or differences, either in point of Doctrine, or Administration; wherein either the Churches in general are concerned, or any one Church in their peace, union, and edification; or any member, or members, of any Church are injured, in or by any proceedings in censures not agreeable to truth, and order: it is according to the mind of Christ, that many Churches holding communion together, do by their messengers meet to consider, and give their advice, in or about that matter in difference, to be reported to all the Churches concerned;[^29] howbeit these messengers assembled are not entrusted with any Church-power properly so called; or with any jurisdiction over the Churches themselves, to exercise any censures either over any Churches, or Persons: or to impose their determination on the Churches, or Officers.[^30]"
