# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 14
title: Of Saving Faith
paragraphs:
  - n: 1
    text: The Grace of Faith, whereby the Elect are enabled to beleive to the saving of their souls, is the work of the Spirit of Christ in their hearts;[^1] and is ordinarily wrought by the Ministry of the Word;[^2] by which also, and by the administration of Baptisme, and the Lords Supper, Prayer and other Means appointed of God, it is increased, and strengthned.[^3]
  - n: 2
    text: By this Faith, a Christian believeth to be true, whatsoever is revealed in the Word, for the Authority of God himself;[^4] and also apprehendeth an excellency therein, above all other Writings; and all things in the world:[^5] as it bears forth the Glory of God in his Attributes, the excellency of Christ in his Nature and Offices; and the Power and Fullness of the Holy Spirit in his Workings, and Operations; and so is enabled to cast his Soul upon the truth thus beleived;[^6] and also acteth differently, upon that which each particular, passage thereof containeth; yeilding obedience to the commands,[^7] trembling at the threatnings,[^8] and embracing the promises of God, for this life, and that which is to come:[^9] But the principal acts of Saving Faith, have immediate relation to Christ, accepting, receiving, and resting upon him alone, for Justification, Sanctification, and Eternal Life, by vertue of the Covenant of Grace.[^10]
  - n: 3
    text: This Faith although it be different in degrees, and may be weak, or strong;[^11] yet it is in the least degree of it, different in the kind, or nature of it (as is all other saving Grace) from the Faith, and common grace of temporary beleivers;[^12] and therefore though it may be many times assailed, and weakned; yet it gets the victory;[^13] growing up in many, to the attainment of a full assurance through Christ,[^14] who is both the Author and finisher of our Faith.[^15]
notes:
  "1": 2 Cor. 4:13; Eph. 2:8
  "2": Rom. 10:14, 17
  "3": Luke 17:5; 1 Pet. 2:2; Acts 20:32
  "4": Acts 24:14
  "5": Ps. 19:7–10; Ps. 119:72
  "6": 2 Tim. 1:12
  "7": John 15:14
  "8": Isa. 66:2
  "9": Heb. 11:13
  "10": John 1:12; Acts 16:31; Gal. 2:20; Acts 15:11
  "11": Heb. 5:13–14; Matt. 6:30; Rom. 4:19–20
  "12": 2 Pet. 1:1
  "13": Eph. 6:16; 1 John 5:4–5
  "14": Heb. 6:11–12; Col. 2:2
  "15": Heb. 12:2
