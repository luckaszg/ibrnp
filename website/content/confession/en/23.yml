# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 23
title: Of Lawful Oaths and Vows
paragraphs:
  - n: 1
    text: A lawful Oath is a part of religious worship, wherein the person swearing in Truth, Righteousness, and Judgement, solemnly calleth God to witness what he sweareth;[^1] and to judge him according to the Truth or falseness thereof.[^2]
  - n: 2
    text: The Name of God only is that by which men ought to swear; and therein it is to be used, with all Holy Fear and reverence, therefore to swear vainly or rashly by that glorious, and dreadful name; or to swear at all by any other thing, is sinful and to be abhorred;[^3] yet as in matter of weight and moment for confirmation of truth, and ending all strife, an Oath is warranted by the Word of God;[^4] so a lawful Oath being imposed, by lawful Authority, in such matters, ought to be taken.[^5]
  - n: 3
    text: Whosoever taketh an Oath warranted by the Word of God, ought duely to consider the weightiness of so solemn an act; and therein to avouch nothing, but what he knoweth to be the truth; for that by rash, false, and vain Oaths the Lord is provoked, and for them this Land mournes.[^6]
  - n: 4
    text: An Oath is to be taken in the plain, and common sense of the words; without equivocation, or mental reservation.[^7]
  - n: 5
    text: A Vow which is not to be made to any Creature, but to God alone, is to be made and performed with all Religious care, and faithfulness:[^8] But Popish Monastical Vows, of perpetual single life,[^9] professed poverty,[^10] and regular obedience, are so far from being degrees of higher perfection, that they are superstitious, and sinful snares, in which no Christian may intangle himself.[^11]
notes:
  "1": Exod. 20:7; Deut. 10:20; Jer. 4:2
  "2": 2 Chron. 6:22–23
  "3": Matt. 5:34, 37; Jas. 5:12
  "4": Heb. 6:16; 2 Cor. 1:23
  "5": Neh. 13:25
  "6": Lev. 19:12; Jer. 23:10
  "7": Ps. 24:4
  "8": Ps. 76:11; Gen. 28:20–22
  "9": 1 Cor. 7:2, 9
  "10": Eph. 4:28
  "11": Matt. 19:11
