# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 28
title: Of Baptism and the Lord's Supper
paragraphs:
  - n: 1
    text: Baptism and the Lords Supper are ordinances of positive, and soveraign institution; appointed by the Lord Jesus the only Law-giver, to be continued in his Church to the end of the world.[^1]
  - n: 2
    text: These holy appointments are to be administred by those only, who are qualified and thereunto called according to the commission of Christ.[^2]
notes:
  "1": Matt. 28:19–20; 1 Cor. 11:26
  "2": Matt. 28:19; 1 Cor. 4:1
