# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 13
title: Of Sanctification
paragraphs:
  - n: 1
    text: They who are united to Christ, Effectually called, and regenerated, having a new heart, and a new Spirit created in them, through the vertue of Christ's death, and Resurrection; are also farther sanctified, really, and personally,[^1] through the same vertue, by his word and Spirit dwelling in them;[^2] the dominion of the whole body of sin is destroyed,[^3] and the several lusts thereof, are more and more weakned, and mortified;[^4] and they more and more quickened, and strengthned in all saving graces,[^5] to the practice of all true holyness, without which no man shall see the Lord.[^6]
  - n: 2
    text: This Sanctification is throughout, in the whole man,[^7] yet imperfect in this life; there abideth still some remnants of corruption in every part,[^8] whence ariseth a continual, and irreconcilable war; the Flesh lusting against the Spirit, and the Spirit against the Flesh.[^9]
  - n: 3
    text: In which war, although the remaining corruption for a time may much prevail;[^10] yet through the continual supply of strength from the sanctifying Spirit of Christ the regenerate part doth overcome;[^11] and so the Saints grow in Grace, perfecting holiness in the fear of God, pressing after an heavenly life, in Evangelical Obedience to all the commands which Christ as Head and King, in his Word hath prescribed to them.[^12]
notes:
  "1": Acts 20:32; Rom. 6:5–6
  "2": John 17:17; Eph. 3:16–19; 1 Thess. 5:21–23
  "3": Rom. 6:14
  "4": Gal. 5:24
  "5": Col. 1:11
  "6": 2 Cor. 7:1; Heb. 12:14
  "7": 1 Thess. 5:23
  "8": Rom. 7:18, 23
  "9": Gal. 5:17; 1 Pet. 2:11
  "10": Rom. 7:23
  "11": Rom. 6:14
  "12": Eph. 4:15–16; 2 Cor. 3:18; 2 Cor. 7:1
