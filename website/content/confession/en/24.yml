# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 24
title: Of the Civil Magistrate
paragraphs:
  - n: 1
    text: God the supream Lord, and King of all the World, hath ordained Civil Magistrates to be under him, over the people for his own glory, and the publick good; and to this end hath armed them with the power of the Sword, for defence and encouragement of them that do good, and for the punishment of evil doers.[^1]
  - n: 2
    text: "It is lawful for Christians to Accept, and Execute the Office of a Magistrate when called thereunto; in the management whereof, as they ought especially to maintain Justice, and Peace,[^2] according to the wholsome Laws of each Kingdome, and Commonwealth: so for that end they may lawfully now under the New Testament wage war upon just and necessary occasions.[^3]"
  - n: 3
    text: Civil Magistrates being set up by God, for the ends aforesaid; subjection in all lawful things commanded by them, ought to be yeilded by us, in the Lord; not only for wrath but for Conscience sake;[^4] and we ought to make supplications and prayers for Kings, and all that are in Authority, that under them we may live a quiet and peaceable life, in all godliness and honesty.[^5]
notes:
  "1": Rom. 13:1–4
  "2": 2 Sam. 23:3; Ps. 82:3–4
  "3": Luke 3:14
  "4": Rom. 13:5–7; 1 Pet. 2:17
  "5": 1 Tim. 2:1–2
