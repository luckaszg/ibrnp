# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 16
title: Of Good Works
paragraphs:
  - n: 1
    text: Good Works are only such as God hath commanded in his Holy word;[^1] and not such as without the warrant thereof, are devised by men, out of blind zeal, or upon any pretence of good intentions.[^2]
  - n: 2
    text: These good works, done in obedience to Gods commandments, are the fruits, and evidences of a true, and lively faith;[^3] and by them Believers manifest their thankfullness,[^4] strengthen their assurance,[^5] edifie their brethren, adorn the profession of the Gospel,[^6] stop the mouths of the adversaries and glorifie God[^7] whose workmanship they are, created in Christ Jesus thereunto,[^8] that having their fruit unto holiness, they may have the end eternal life.[^9]
  - n: 3
    text: Their ability to do good works, is not at all of themselves; but wholly from the Spirit of Christ;[^10] and that they may be enabled thereunto, besides the graces they have already received, there is necessary an actual influence of the same Holy Spirit, to work in them to will, and to do, of his good pleasure;[^11] yet are they not hereupon to grow negligent, as if they were not bound to perform any duty, unless upon a special motion of the Spirit; but they ought to be diligent in stirring up the Grace of God that is in them.[^12]
  - n: 4
    text: They who in their obedience attain to the greatest height which is possible in this life, are so far from being able to superrogate, and to do more then God requires, as that they fall short of much which in duty they are bound to do.[^13]
  - n: 5
    text: We cannot by our best works merit pardon of Sin or Eternal Life at the hand of God, by reason of the great disproportion that is between them and the glory to come; and the infinite distance that is between us and God, whom by them we can neither profit, nor satisfie for the debt of our former sins;[^14] but when we have done all we can, we have done but our duty, and are unprofitable servants; and because as they are good they proceed from his Spirit,[^15] and as they are wrought by us they are defiled and mixed with so much weakness and imperfection that they cannot endure the severity of Gods judgement.[^16]
  - n: 6
    text: Yet notwithstanding the persons of Believers being accepted through Christ their good works also are accepted in him;[^17] not as though they were in this life wholly unblameable and unreprovable in Gods sight; but that he looking upon them in his Son is pleased to accept and reward that which is sincere although accompanied with many weaknesses and imperfections.[^18]
  - n: 7
    text: Works done by unregenerate men although for the matter of them they may be things which God commands, and of good use, both to themselves and others;[^19] yet because they proceed not from a heart purified by faith,[^20] nor are done in a right manner according to the word,[^21] nor to a right end the glory of God;[^22] they are therefore sinful and cannot please God; nor make a man meet to receive grace from God;[^23] and yet their neglect of them is more sinful and displeasing to God.[^24]
