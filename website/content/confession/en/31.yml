# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 31
title: Of the State of Man after Death and of the Resurrection of the Dead
paragraphs:
  - n: 1
    text: The Bodies of Men after Death return to dust, and see corruption;[^1] but their Souls (which neither die nor sleep) having an immortal subsistence, immediately return to God who gave them:[^2] the Souls of the Righteous being then made perfect in holyness, are received into paradise where they are with Christ, and behold the face of God, in light and glory; waiting for the full Redemption of their Bodies;[^3] and the souls of the wicked, are cast into hell; where they remain in torment and utter darkness, reserved to the judgement of the great day;[^4] besides these two places for Souls separated from their bodies, the Scripture acknowledgeth none.
  - n: 2
    text: At the last day such of the Saints as are found alive shall not sleep but be changed;[^5] and all the dead shall be raised up with the self same bodies, and none other;[^6] although with different qualities, which shall be united again to their Souls for ever.[^7]
  - n: 3
    text: The bodies of the unjust shall by the power of Christ, be raised to dishonour; the bodies of the just by his spirit unto honour, and be made conformable to his own glorious Body.[^8]
notes:
  "1": Gen. 3:19; Acts 13:36
  "2": Eccl. 12:7
  "3": Luke 23:43; 2 Cor. 5:1, 6, 8; Phil. 1:23; Heb. 12:23
  "4": Jude 1:6–7; 1 Pet. 3:19; Luke 16:23–24
  "5": 1 Cor. 15:51–52; 1 Thess. 4:17
  "6": Job 19:26–27
  "7": 1 Cor. 15:42–43
  "8": Acts 24:15; John 5:28–29; Phil. 3:21
