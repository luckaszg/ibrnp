# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 7
title: Of God's Covenant
paragraphs:
  - n: 1
    text: The distance between God and the Creature is so great, that although reasonable Creatures do owe obedience unto him as their Creator, yet they could never have attained the reward of Life, but by some voluntary condescension on Gods part, which he hath been pleased to express, by way of Covenant.[^1]
  - n: 2
    text: Moreover Man having brought himself under the curse of the Law by his fall, it pleased the Lord to make a Covenant of Grace[^2] wherein he freely offereth unto Sinners, Life and Salvation by Jesus Christ, requiring of them Faith in him, that they may be saved;[^3] and promising to give unto all those that are ordained unto eternal Life, his holy Spirit, to make them willing, and able to believe.[^4]
  - n: 3
    text: This Covenant is revealed in the Gospel; first of all to Adam in the promise of Salvation by the seed of the woman,[^5] and afterwards by farther steps, untill the full discovery thereof was compleated in the new Testament;[^6] and it is founded in that Eternal Covenant transaction, that was between the Father and the Son, about the Redemption of the Elect;[^7] and it is alone by the Grace of this Covenant, that all of the posterity of fallen Adam, that ever were saved, did obtain life and a blessed immortality; Man being now utterly uncapable of acceptance with God upon those terms, on which Adam stood in his state of innocency.[^8]
notes:
  "1": Luke 17:10; Job 35:7–8
  "2": Gen. 2:17; Gal. 3:10; Rom. 3:20–21
  "3": Rom. 8:3; Mark 16:15–16; John 3:16
  "4": Ezek. 36:26–27; John 6:44–45; Ps. 110:3
  "5": Gen. 3:15
  "6": Heb. 1:1
  "7": 2 Tim. 1:9; Titus 1:2
  "8": Heb. 11:6, 13; Rom. 4:1–2; Acts 4:12; John 8:56
