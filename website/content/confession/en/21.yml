# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 21
title: Of Christian Liberty and Liberty of Consciencey
paragraphs:
  - n: 1
    text: The Liberty which Christ hath purchased for Believers under the Gospel, consists in their freedom from the guilt of Sin, the condemning wrath of God, the Rigour and Curse of the Law;[^1] and in their being delivered from this present evil World,[^2] Bondage to Satan,[^3] and Dominion of Sin;[^4] from the Evil of Afflictions;[^5] the Fear, and Sting of Death, the Victory of the Grave,[^6] and Everlasting Damnation;[^7] as also in their free access to God; and their yielding Obedience unto him not out of a slavish fear,[^8] but a Child-like love, and willing mind.[^9] All which were common also to Believers under the Law for the substance of them;[^10] but under the new Testament the Liberty of Christians is further enlarged in their freedom from the yoke of the Ceremonial Law, to which the Jewish Church was subjected; and in greater boldness of access to the Throne of Grace; and in fuller communications of the Free Spirit of God, then Believers under the Law did ordinarily partake of.[^11]
  - n: 2
    text: God alone is Lord of the Conscience,[^12] and hath left it free from the Doctrines and Commandments of men, which are in any thing contrary to his Word, or not contained in it.[^13] So that to Believe such Doctrines, or obey such Commands out of Conscience, is to betray true liberty of Conscience;[^14] and the requiring of an implicit Faith, and absolute and blind Obedience, is to destroy Liberty of Conscience, and Reason also.[^15]
  - n: 3
    text: They who upon pretence of Christian Liberty do practice any sin, or cherish any sinfull lust; as they do thereby pervert the main design of the Grace of the Gospel, to their own Destruction;[^16] so they wholy destroy the end of Christian Liberty, which is, that being delivered out of the hands of all our Enemies we might serve the Lord without fear in Holiness, and Righteousness before him, all the days of our Life.[^17]
