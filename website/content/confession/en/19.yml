# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 19
title: Of the Law of God
paragraphs:
  - n: 1
    text: God gave to Adam a Law of universal obedience, written in his Heart, and a particular precept of not eating the Fruit of the tree of knowledge of good and evil;[^1] by which he bound him, and all his posterity to personal entire exact and perpetual obedience;[^2] promised life upon the fulfilling, and threatned death upon the breach of it; and indued him with power and ability to keep it.[^3]
  - n: 2
    text: The same Law that was first written in the heart of man, continued to be a perfect rule of Righteousness after the fall;[^4] & was delivered by God upon Mount Sinai, in Ten Commandments and written in two Tables; the four first containing our duty towards God, and the other six our duty to man.[^5]
  - n: 3
    text: Besides this Law commonly called moral, God was pleased to give to the people of Israel Ceremonial Laws, containing several typical ordinances, partly of worship, prefiguring Christ, his graces, actions, sufferings, and benefits;[^6] and partly holding forth divers instructions of moral duties,[^7] all which Ceremonial Laws being appointed only to the time of reformation, are by Jesus Christ the true Messiah and only Law-giver who was furnished with power from the Father, for that end, abrogated and taken away.[^8]
  - n: 4
    text: To them also he gave sundry judicial Laws, which expired together with the state of that people, not obliging any now by vertue of that institution; their general equity onely, being of moral use.[^9]
  - n: 5
    text: The moral Law doth for ever bind all, as well justified persons as others, to the obedience thereof,[^10] and that not only in regard of the matter contained in it, but also in respect of the authority of God the Creator; who gave it:[^11] Neither doth Christ in the Gospel any way dissolve, but much strengthen this obligation.[^12]
  - n: 6
    text: "Although true Believers be not under the Law, as a Covenant of Works, to be thereby Justified or condemned;[^13] yet it is of great use to them as well as to others: in that, as a Rule of Life, informing them of the Will of God, and their Duty, it directs and binds them, to walk accordingly; discovering also the sinfull pollutions of their Natures, Hearts and Lives; so as Examining themselves thereby, they may come to further Conviction of, Humiliation for, and Hatred against Sin;[^14] together with a clearer sight of the need they have of Christ and the perfection of his Obedience: It is likewise of use to the Regenerate to restrain their Corruptions, in that it forbids Sin; and the Threatnings of it serve to shew what even their Sins deserve; and what afflictions in this Life they may expect for them, although free'd from the Curse and unallayed Rigor thereof. The Promises of it likewise shew them Gods approbation of Obedience, and what blessings they may expect upon the performance thereof, though not as due to them by the Law as a Covenant of Works; so as mans doing Good and refraining from Evil, because the Law incourageth to the one and deterreth from the other, is no Evidence of his being under the Law and not under Grace.[^15]"
  - n: 7
    text: Neither are the forementioned uses of the Law contrary to the Grace of the Gospel; but do sweetly comply with it;[^16] the Spirit of Christ subduing and inabling the Will of man, to do that freely and chearfully, which the will of God revealed in the Law, requireth to be done.[^17]
notes:
