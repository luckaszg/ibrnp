# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 22
title: Of Religious Worship and the Sabbath Day
paragraphs:
  - n: 1
    text: The light of Nature shews that there is a God, who hath Lordship, and Soveraigntye over all; is just, good, and doth good unto all; and is therefore to be feared, loved, praised, called upon, trusted in, and served, with all the Heart, and all the Soul, and with all the Might.[^1] But the acceptable way of Worshipping the true God, is instituted by himself;[^2] and so limited by his own revealed will, that he may not be Worshipped according to the imaginations, and devices of Men, or the suggestions of Satan, under any visible representations, or any other way, not prescribed in the Holy Scriptures.[^3]
  - n: 2
    text: Religious Worship is to be given to God the Father, Son, and Holy Spirit, and to him alone;[^4] not to Angels, Saints, or any other Creatures;[^5] and since the fall, not without a Mediator,[^6] nor in the Mediation of any other but Christ alone.[^7]
  - n: 3
    text: Prayer with thanksgiving, being one special part of natural worship, is by God required of all men.[^8] But that it may be accepted, it is to be made in the Name of the Son,[^9] by the help of the Spirit,[^10] according to his Will;[^11] with understanding, reverence, humility, fervency, faith, love, and perseverance; and when with others, in a known tongue.[^12]
  - n: 4
    text: Prayer is to be made for things lawful, and for all sorts of men living, or that shall live hereafter;[^13] but not for the dead,[^14] nor for those of whom it may be known that they have sinned the sin unto death.[^15]
  - n: 5
    text: The reading of the Scriptures,[^16] Preaching, and hearing the word of God,[^17] teaching and admonishing one another in Psalms, Hymns and Spiritual songs, singing with grace in our Hearts to the Lord;[^18] as also the Administration of Baptism,[^19] and the Lords Supper[^20] are all parts of Religious worship of God, to be performed in obedience to him, with understanding, faith, reverence, and godly fear; moreover solemn humiliation with fastings;[^21] and thanksgiving upon special occasions, ought to be used in an holy and religious manner.[^22]
  - n: 6
    text: Neither Prayer, nor any other part of Religious worship, is now under the Gospel tied unto, or made more acceptable by, any place in which it is performed, or towards which it is directed; but God is to be worshipped every where in Spirit, and in truth;[^23] as in private families[^24] daily,[^25] and in secret each one by himself,[^26] so more solemnly in the publick Assemblies, which are not carelessely, nor wilfuly, to be neglected, or forsaken, when God by his word, or providence calleth thereunto.[^27]
  - n: 7
    text: As it is of the Law of nature, that in general a proportion of time by Gods appointment, be set a part for the Worship of God; so by his Word in a positive-moral, and perpetual Commandement, binding all men, in all Ages, he hath particularly appointed one day in seven for a Sabbath to be kept holy unto him,[^28] which from the beginning of the World to the Resurrection of Christ, was the last day of the week; and from the resurrection of Christ, was changed into the first day of the week which is called the Lords day;[^29] and is to be continued to the end of the World, as the Christian Sabbath; the observation of the last day of the week being abolished.
  - n: 8
    text: The Sabbath is then kept holy unto the Lord, when men after a due preparing of their hearts, and ordering their common affairs aforehand, do not only observe an holy rest all the day, from their own works, words, and thoughts, about their worldly employment, and recreations,[^30] but also are taken up the whole time in the publick and private exercises of his worship, and in the duties of necessity and mercy.[^31]
