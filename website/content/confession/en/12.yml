# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 12
title: Of Adoption
paragraphs:
  - n: 1
    text: All those that are justified, God vouchsafed, in, and for the sake of his only Son Jesus Christ, to make partakers of the Grace of Adoption;[^1] by which they are taken into the number, and enjoy the Liberties, and Priveledges of Children of God;[^2] have his name put upon them,[^3] receive the Spirit of Adoption,[^4] have access to the throne of Grace with boldness, are enabled to cry Abba, Father,[^5] are pitied,[^6] protected,[^7] provided for,[^8] and chastned by him, as by a Father;[^9] yet never cast off;[^10] but sealed to the day of Redemption,[^11] and inherit the promises, as heirs, of everlasting Salvation.[^12]
notes:
  "1": Eph. 1:5; Gal. 4:4–5
  "2": John 1:12; Rom. 8:17
  "3": 2 Cor. 6:18; Rev. 3:12
  "4": Rom. 8:15
  "5": Gal. 4:6; Eph. 2:18
  "6": Ps. 103:13
  "7": Prov. 14:26
  "8": 1 Pet. 5:7
  "9": Heb. 12:6
  "10": Isa. 54:8–9; Lam. 3:31
  "11": Eph. 4:30
  "12": Heb. 1:14; Heb. 6:12
