# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 20
title: Of Christian Liberty and Liberty of Conscience
paragraphs:
  - n: 1
    text: The Covenant of Works being broken by Sin, and made unprofitable unto Life; God was pleased to give forth the promise of Christ, the Seed of the Woman, as the means of calling the Elect, and begetting in them Faith and Repentance;[^1] in this Promise, the Gospel, as to the substance of it, was revealed, and therein Effectual, for the Conversion and Salvation of Sinners.[^2]
  - n: 2
    text: This Promise of Christ, and Salvation by him, is revealed only by the Word of God;[^3] neither do the Works of Creation, or Providence, with the light of Nature, make discovery of Christ, or of Grace by him; so much as in a general, or obscure way;[^4] much less that men destitute of the Revelation of him by the Promise, or Gospel; should be enabled thereby, to attain saving Faith, or Repentance.[^5]
  - n: 3
    text: The Revelation of the Gospel unto Sinners, made in divers times, and by sundry parts; with the addition of Promises, and Precepts for the Obedience required therein, as to the Nations, and Persons, to whom it is granted, is meerly of the Soveraign Will and good Pleasure of God;[^6] not being annexed by vertue of any Promise, to the due improvement of mens natural abilities, by vertue of Common light received, without it; which none ever did make, or can so do:[^7] And therefore in all Ages the preaching of the Gospel hath been granted unto persons and Nations, as to the extent, or streightning of it, in great variety, according to the Councell of the Will of God.
  - n: 4
    text: Although the Gospel be the only outward means, of revealing Christ, and saving Grace; and is, as such, abundantly sufficient thereunto; yet that men who are dead in Trespasses, may be born again, Quickned or Regenerated; there is moreover necessary, an effectual, insuperable work of the Holy Spirit, upon the whole Soul, for the producing in them a new spiritual Life;[^8] without which no other means will effect their Conversion unto God.[^9]
notes:
  "1": Gen. 3:15
  "2": Rev. 13:8
  "3": Rom. 1:17
  "4": Rom. 10:14–15, 17
  "5": Prov. 29:18; Isa. 25:7; Isa. 60:2–3
  "6": Ps. 147:20; Acts 16:7
  "7": Rom. 1:18
  "8": Ps. 110:3; 1 Cor. 2:14; Eph. 1:19–20
  "9": John 6:44; 2 Cor. 4:4, 6
