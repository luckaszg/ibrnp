# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 2
title: Of God and of the Holy Trinity
paragraphs:
  - n: 1
    text: The Lord our God is but one only living, and true God;[^1] whose subsistence is in and of himself,[^2] infinite in being, and perfection, whose Essence cannot be comprehended by any but himself;[^3] a most pure spirit,[^4] invisible, without body, parts, or passions, who only hath immortality, dwelling in the light, which no man can approach unto,[^5] who is immutable,[^6] immense,[^7] eternal,[^8] incomprehensible, Almighty,[^9] every way infinit, most holy,[^10] most wise, most free, most absolute, working all things according to the councel of his own immutable, and most righteous will,[^11] for his own glory,[^12] most loving, gracious, merciful, long suffering, abundant in goodness and truth, forgiving iniquity, transgression and sin, the rewarder of them that diligently seek him,[^13] and withall most just, and terrible in his judgements,[^14] hating all sin,[^15] and who will by no means clear the guilty.[^16]
  - n: 2
    text: "God having all life,[^17] glory,[^18] goodness,[^19] blessedness, in and of himself: is alone in, and unto himself all-sufficient, not standing in need of any Creature which he hath made, nor deriving any glory from them,[^20] but onely manifesting his own glory in, by, unto, and upon them, he is the alone fountain of all Being, of whom, through whom, and to whom are all things,[^21] and he hath most soveraign dominion over all creatures, to do by them, for them, or upon them, whatsoever himself pleaseth;[^22] in his sight all things are open and manifest,[^23] his knowledge is infinite, infallible, and independant upon the Creature, so as nothing is to him contingent, or uncertain;[^24] he is most holy in all his Councels, in all his Works,[^25] and in all his Commands; to him is due from Angels and men, whatsoever worship,[^26] service, or obedience as Creatures they owe unto the Creator, and whatever he is further pleased to require of them."
  - n: 3
    text: In this divine and infinite Being there are three subsistences, the Father the Word (or Son) and Holy Spirit,[^27] of one substance, power, and Eternity, each having the whole Divine Essence, yet the Essence undivided,[^28] the Father is of none neither begotten nor proceeding, the Son is Eternally begotten of the Father,[^29] the holy Spirit proceeding from the Father and the Son,[^30] all infinite, without beginning, therefore but one God, who is not to be divided in nature and Being; but distinguished by several peculiar, relative properties, and personal relations; which doctrine of the Trinity is the foundation of all our Communion with God, and comfortable dependance on him.
