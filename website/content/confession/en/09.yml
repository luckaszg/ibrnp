# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 9
title: Of Free Will
paragraphs:
  - n: 1
    text: God hath indued the Will of Man, with that natural liberty, and power of acting upon choice; that it is neither forced, nor by any necessity of nature determined to do good or evil.[^1]
  - n: 2
    text: Man in his state of innocency, had freedom, and power, to will, and to do that which was good, and well-pleasing to God;[^2] but yet was mutable, so that he might fall from it.[^3]
  - n: 3
    text: Man by his fall into a state of sin hath wholly lost all ability of Will, to any spiritual good accompanying salvation;[^4] so as a natural man, being altogether averse from that good, and dead in Sin,[^5] is not able, by his own strength, to convert himself; or to prepare himself thereunto.[^6]
  - n: 4
    text: When God converts a sinner, and translates him into the state of Grace he freeth him from his natural bondage under sin,[^7] and by his grace alone, enables him freely to will, and to do that which is spiritually good;[^8] yet so as that by reason of his remaining corruptions he doth not perfectly nor only will that which is good; but doth also will that which is evil.[^9]
  - n: 5
    text: The Will of Man is made perfectly, and immutably free to good alone, in the state of Glory only.[^10]
notes:
  "1": Matt. 17:12; Jas. 1:14; Deut. 30:19
  "2": Eccl. 7:29
  "3": Gen. 3:6
  "4": Rom. 5:6; Rom. 8:7
  "5": Eph. 2:1, 5
  "6": Titus 3:3–5; John 6:44
  "7": Col. 1:13; John 8:36
  "8": Phil. 2:13
  "9": Rom. 7:15, 18–19, 21, 23
  "10": Eph. 4:13
