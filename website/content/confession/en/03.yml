# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 3
title: Of God's Decree
paragraphs:
  - n: 1
    text: God hath Decreed in himself from all Eternity, by the most wise and holy Councel of his own will, freely and unchangeably, all things whatsoever comes to passe;[^1] yet so as thereby is God neither the author of sin, nor hath fellowship with any therein,[^2] nor is violence offered to the will of the Creature, nor yet is the liberty, or contingency of second causes taken away, but rather established,[^3] in which appears his wisdom in disposing all things, and power, and faithfulness in accomplishing his Decree.[^4]
  - n: 2
    text: Although God knoweth whatsoever may, or can come to passe upon all supposed conditions;[^5] yet hath he not Decreed anything, because he foresaw it as future, or as that which would come to pass upon such conditions.[^6]
  - n: 3
    text: By the decree of God for the manifestation of his glory some men and Angels, are predestinated, or fore-ordained to Eternal Life, through Jesus Christ[^7] to the praise of his glorious grace;[^8] others being left to act in their sin to their just condemnation, to the praise of his glorious justice.[^9]
  - n: 4
    text: These Angels and Men thus predestinated, and fore-ordained, are particularly, and unchangeably designed; and their number so certain, and definite, that it cannot be either increased, or diminished.[^10]
  - n: 5
    text: Those of mankind that are predestinated to life, God before the foundation of the world was laid, according to his eternal and immutable purpose, and the secret Councel and good pleasure of his will, hath chosen in Christ unto everlasting glory, out of his meer free grace and love;[^11] without any other thing in the creature as a condition or cause moving him thereunto.[^12]
  - n: 6
    text: As God hath appointed the Elect unto glory, so he hath by the eternal and most free purpose of his will, fore-ordained all the means thereunto,[^13] wherefore they who are elected, being faln in Adam, are redeemed by Christ,[^14] are effectually called unto faith in Christ, by his spirit working in due season, are justifyed, adopted, sanctified,[^15] and kept by his power through faith unto salvation;[^16] neither are any other redeemed by Christ, or effectually called, justified, adopted, sanctified, and saved, but the Elect only.[^17]
  - n: 7
    text: The Doctrine of this high mystery of predestination, is to be handled with special prudence, and care; that men attending the will of God revealed in his word, and yeilding obedience thereunto, may from the certainty of their effectual vocation, be assured of their eternal election;[^18] so shall this doctrine afford matter of praise,[^19] reverence, and admiration of God, and of humility,[^20] diligence, and abundant consolation, to all that sincerely obey the Gospel.[^21]
notes:
  "1": Isa. 46:10; Eph. 1:11; Heb. 6:17; Rom. 9:15, 18
  "2": Jas. 1:15, 17; 1 John 1:5
