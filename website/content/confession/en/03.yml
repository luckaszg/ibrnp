  "11": Eph. 1:4, 9, 11; Rom. 8:30; 2 Tim. 1:9; 1 Thess. 5:9
  "12": Rom. 9:13, 16; Eph. 1:6, 12
  "13": 1 Pet. 1:2; 2 Thess. 2:13
