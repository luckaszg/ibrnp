# Second London Baptist Confession of Faith (1677/1689) — original text, public domain.
# [^n] markers point to the proof texts in "notes" (same numbering as the Spanish edition).
chapter: 11
title: Of Justification
paragraphs:
  - n: 1
    text: Those whom God Effectually calleth, he also freely justifieth,[^1] not by infusing Righteousness into them, but by pardoning their sins, and by accounting, and accepting their Persons as Righteous;[^2] not for any thing wrought in them, or done by them, but for Christ's sake alone,[^3] not by imputing faith it self, the act of beleiving, or any other evangelical obedience to them, as their Righteousness; but by imputing Christs active obedience unto the whole Law, and passive obedience in his death, for their whole and sole Righteousnnss, they receiving, and resting on him, and his Righteousness, by Faith;[^4] which faith they have not of themselves, it is the gift of God.[^5]
  - n: 2
    text: Faith thus receiving and resting on Christ, and his Righteousness, is the alone instrument of Justification:[^6] yet it is not alone in the person justified, but is ever accompanied with all other saving Graces, and is no dead faith, but worketh by love.[^7]
  - n: 3
    text: "Christ by his obedience, and death, did fully discharge the debt of all those that are justified; and did by the sacrifice of himself, in the blood of his cross, undergoing in their stead, the penalty due unto them: make a proper, real and full satisfaction to Gods justice in their behalf:[^8] yet in asmuch as he was given by the Father for them, and his Obedience and Satisfaction accepted in their stead, and both freely, not for any thing in them;[^9] their Justification is only of Free Grace, that both the exact justice and rich Grace of God, might be glorified in the Justification of sinners.[^10]"
  - n: 4
    text: God did from all eternity decreeto justifie all the Elect,[^11] and Christ did in the fulness of time die for their sins, and rise again for their Justification;[^12] Nevertheless they are not justified personally, untill the Holy Spirit, doth in due time actually apply Christ unto them.[^13]
  - n: 5
    text: God doth continue to Forgive the sins of those that are justified,[^14] and although they can never fall from the state of justication;[^15] yet they may by their sins fall under Gods Fatherly displeasure;[^16] and in that condition, they have not usually the light of his Countenance restored unto them, untill they humble themselves, confess their sins, beg pardon, and renew their faith, and repentance.[^17]
  - n: 6
    text: The Justification of Believers under the Old Testament was in all these respects, one and the same with the justification of Believers under the New Tement.[^18]
notes:
  "1": Rom. 3:24; Rom. 8:30
  "2": Rom. 4:5–8; Eph. 1:7
  "3": 1 Cor. 1:30–31; Rom. 5:17–19
  "4": Phil. 3:8–9; Eph. 2:8–10
  "5": John 1:12; Rom. 5:17
  "6": Rom. 3:28
  "7": Gal. 5:6; Jas. 2:17, 22, 26
  "8": Heb. 10:14; 1 Pet. 1:18–19; Isa. 53:5–6
  "9": Rom. 8:32; 2 Cor. 5:21
  "10": Rom. 3:26; Eph. 1:6–7; Eph. 2:7
  "11": Gal. 3:8; 1 Pet. 1:2; 1 Tim. 2:6
  "12": Rom. 4:25
  "13": Col. 1:21–22; Titus 3:4–7
  "14": Matt. 6:12; 1 John 1:7, 9
  "15": John 10:28
  "16": Ps. 89:31–33
  "17": Ps. 32:5; Ps. 51; Matt. 26:75
  "18": Gal. 3:9; Rom. 4:22–24
