# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 6
title: De la Caída del hombre, del pecado y su castigo
paragraphs:
  - n: 1
    text: Aunque Dios creó al hombre recto y perfecto, y le dio una ley justa, la cual habría sido para vida si el hombre la hubiera guardado, y amenazó su transgresión con la muerte,[^1] aun así, el hombre no permaneció mucho tiempo en esta posición de honor, usando Satanás la sutileza de la serpiente para seducir a Eva, y luego por medio de ella seduciendo a Adán, quien sin ninguna compulsión, al comer del fruto prohibido, transgredió voluntariamente la ley de su creación y el mandato que les había sido dado;[^2] lo cual agradó a Dios permitir, conforme a Su sabio y santo consejo, habiéndose propuesto ordenarlo para Su propia gloria.
  - n: 2
    text: Nuestros primeros padres, por este pecado, cayeron de su justicia original y de su comunión con Dios, y nosotros en ellos, por lo cual la muerte sobrevino a todos;[^3] viniendo a estar todos muertos en pecado[^4] y enteramente corrompidos en todas las facultades y partes del alma y del cuerpo.[^5]
  - n: 3
    text: Siendo ellos la raíz de todo el género humano, y estando por designio de Dios en lugar y en representación de toda la humanidad, la culpa del pecado fue imputada y la naturaleza corrompida *fue* transmitida a toda su posteridad, que desciende de ellos por generación ordinaria,[^6] siendo ahora concebidos en pecado,[^7] y *siendo* por naturaleza hijos de ira,[^8] esclavos del pecado, *estando* sujetos a la muerte[^9] y a todas las demás miserias—espirituales, temporales y eternas—, a no ser que el Señor Jesús los libre.[^10]
  - n: 4
    text: De esta corrupción original, por la cual estamos totalmente indispuestos, incapacitados y opuestos a todo bien, y enteramente inclinados a todo mal,[^11] proceden todas las transgresiones actuales.[^12]
  - n: 5
    text: Esta corrupción de la naturaleza permanece durante esta vida en los que son regenerados;[^13] y, aunque *dicha corr upción* sea perdonada y mortificada por medio de Cristo, aun así, tanto esta corrupción de la naturaleza como sus primeras pasiones son verdadera y propiamente pecado.[^14]
notes:
  "1": Gén. 2:16, 17.
  "2": Gén. 3:12, 13. 2 Cor. 11:3.
  "3": Rom. 3:23.
  "4": Rom 5:12, etc.
  "5": Tit. 1:15. Gén. 6:5. Jer. 17:9. Rom. 3:10-19.
  "6": Rom. 5:12-19. 1 Cor. 15:21, 22, 45, 49.
  "7": Sal. 51:5. Job 14:4.
  "8": Efe. 2:3.
  "9": Rom. 6:20; y 5:12.
  "10": Heb. 2:14. 1 Tes. 1:10.
  "11": Rom. 8:7. Col. 1:21.
  "12": Stg. 1:14, 15. Mat. 15:19.
  "13": Rom. 7:18, 23. Ecl. 7:20. 1 Jua. 1:8.
  "14": Rom. 7:24, 25. Gál. 5:17.
