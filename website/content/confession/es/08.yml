# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 8
title: De Cristo el Mediador
paragraphs:
  - n: 1
    text: Agradó a Dios, en Su propósito eterno, escoger y ordenar al Señor Jesús, Su Hijo unigénito, conforme al pacto hecho entre ambos, para que fuera el Mediador entre Dios y el hombre;[^1] el Profeta,[^2] Sacerdote[^3] y Rey;[^4] la Cabeza y el Salvador de Su Iglesia, el Heredero de todas las cosas y Juez del mundo. A quien dio, desde toda la eternidad, un pueblo para que fuera Su simiente, y para que fuera redimido, llamado, justificado, santificado y glorificado por medio de Él en el tiempo.[^5]
  - n: 2
    text: "El Hijo de Dios, la segunda Persona en la Santa Trinidad, siendo Dios verdadero y eterno, el resplandor de la gloria del Padre, consustancial con Él e igual a Él, que hizo el mundo, *y* quien sostiene y gobierna todas las cosas que ha hecho, cuando vino la plenitud del tiempo, tomó la naturaleza del hombre, con todas sus propiedades esenciales y sus debilidades comunes a la misma,[^6] pero sin pecado;[^7] siendo concebido por el Espíritu Santo en el seno de la virgen María, al venir el Espíritu Santo sobre ella y cubrirla el poder del Altísimo con Su sombra, así nació de mujer, de la tribu de Judá, de la simiente de Abraham y de la de David, conforme a las Escrituras.[^8] De modo que dos naturalezas enteras, perfectas y distintas se unieron inseparablemente en una sola Persona, sin conversión, composición ni confusión: esta Persona es verdaderamente Dios y verdaderamente hombre; pero *es* un solo Cristo, el único Mediador entre Dios y el hombre.[^9]"
  - n: 3
    text: El Señor Jesús, en Su naturaleza humana así unida a la divina, en la Persona del Hijo, fue santificado y ungido con el Espíritu Santo sin medida;[^10] teniendo en Él todos los tesoros de la sabiduría y del conocimiento;[^11] en quien agradó al Padre que habitara toda la plenitud.[^12] A fin de que siendo santo, inocente, inmaculado[^13] y lleno de gracia y de verdad,[^14] estuviera enteramente equipado para ejercer el oficio de Mediador y Fiador;[^15] oficio que no tomó por Sí mismo, sino que fue llamado a este por Su Padre;[^16] quien también puso todo poder y juicio en Su mano, y le dio mandamiento para ejercerlo.[^17]
  - n: 4
    text: Este oficio fue asumido por el Señor Jesús con la mayor disposición,[^18] y para poder desempeñarlo, nació bajo la ley y la cumplió perfectamente,[^19] y sufrió el castigo que correspondía a nosotros—el cual debíamos haber llevado y sufrido—[^20] siendo hecho pecado y maldición por nosotros,[^21] soportando gravísimas penas en Su alma y dolorosísimos sufrimientos en Su cuerpo;[^22] fue crucificado y murió, y permaneció en el estado de los muertos; pero no vio corrupción;[^23] al tercer día resucitó de entre los muertos[^24] con el mismo cuerpo en que sufrió;[^25] con el que también ascendió al Cielo;[^26] allí está sentado a la diestra de Su Padre, intercediendo;[^27] y regresará para juzgar a los hombres y a los ángeles en el fin del mundo.[^28]
  - n: 5
    text: El Señor Jesús, por Su perfecta obediencia y el sacrificio de Sí mismo que ofreció a Dios una sola vez por medio del Espíritu eterno, ha satisfecho plenamente la justicia de Dios,[^29] ha logrado la reconciliación y ha adquirido una herencia eterna en el Reino de los Cielos para todos aquellos que el Padre le ha dado.[^30]
  - n: 6
    text: Aunque el precio de la redención no fue pagado por Cristo actualmente hasta después de Su encarnación, aun así, la virtud, la eficacia y el beneficio de esta fueron comunicados a los elegidos en todas las épocas sucesivamente, desde el principio del mundo, en y mediante aquellas promesas, tipos y sacrificios en los cuales Él fue revelado y señalado como la simiente de la mujer que heriría la cabeza de la serpiente,[^31] y *como* el Cordero inmolado desde la fundación del mundo;[^32] siendo el mismo ayer y hoy y por los siglos.[^33]
  - n: 7
    text: Cristo, en la obra de mediación, actúa conforme a ambas naturalezas, haciendo por medio de cada naturaleza aquello que es propio de cada una de estas; sin embargo, por causa de la unidad de la Persona, a veces aquello que es propio de una naturaleza se atribuye en la Escritura a la Persona denominada por la otra naturaleza.[^34]
  - n: 8
    text: A todos aquellos para quienes Cristo ha obtenido redención eterna, Él cierta y eficazmente les aplica e imparte la misma, haciendo intercesión por ellos,[^35] uniéndolos a Sí mismo por Su Espíritu, revelándoles—en la Palabra y por medio de la Palabra—el misterio de la salvación, persuadiéndolos a creer y obedecer,[^36] gobernando sus corazones por Su Palabra y Espíritu,[^37] y venciendo a todos sus enemigos por Su poder omnipotente y sabiduría;[^38] de la manera y en las formas que estén en la mayor consonancia con Su maravillosa e inescrutable dispensación; y todo esto por gracia libre, gratuita y absoluta, sin prever ninguna condición en ellos para procurarla.[^39]
  - n: 9
    text: Este oficio de mediador entre Dios y el hombre es propio únicamente de Cristo, quien es el Profeta, Sacerdote y Rey de la Iglesia de Dios; no puede ser transferido de Él a ningún otro, ni en su totalidad ni en parte alguna.[^40]
  - n: 10
    text: Este número y orden de oficios son necesarios; pues, por nuestra ignorancia, tenemos necesidad de Su oficio profético;[^41] por nuestra separación de Dios y la imperfección del mejor de nuestros servicios, necesitamos Su oficio sacerdotal, para reconciliarnos con Dios y presentarnos aceptables a Él;[^42] y, por nuestra renuencia y total incapacidad para volvernos a Dios, y rescatarnos a nosotros mismos y protegernos de nuestros adversarios espirituales, necesitamos Su oficio regio, para convencernos, someternos, atraernos, subyugarnos, librarnos y preservarnos para Su Reino celestial.[^43]
