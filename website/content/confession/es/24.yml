# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 24
title: De las autoridades civiles
paragraphs:
  - n: 1
    text: Dios, el supremo Señor y Rey de todo el mundo, ha constituido autoridades civiles para que estén subordinadas a Él, y estén sobre el pueblo para Su propia gloria y el bien público; con este fin los ha armado con el poder de la espada, para la defensa y estímulo de los que hacen el bien y para castigo de los que hacen el mal.[^1]
  - n: 2
    text: Es lícito que los cristianos acepten y ejerzan el cargo de autoridad civil cuando sean llamados a ello; en cuya administración, deben preservar especialmente la justicia y la paz,[^2] conforme a las leyes *que sean* sanas de cada reino y Estado, entonces, con este fin, ahora bajo el Nuevo Testamento, pueden hacer la guerra lícitamente en ocasiones justas y necesarias.[^3]
  - n: 3
    text: Como las autoridades civiles son establecidas por Dios con los fines mencionados anteriormente, debemos sujetarnos en el Señor a todas las cosas lícitas que manden; no solo por razón del castigo, sino también por causa de la conciencia;[^4] y debemos hacer rogativas y oraciones por los reyes y por todos los que están en autoridad, para que bajo su gobierno podamos vivir una vida tranquila y sosegada con toda piedad y dignidad.[^5]
notes:
  "1": Rom. 13:1-4.
  "2": 2 Sam. 23:3. Sal. 82:3, 4.
  "3": Luc. 3:14.
  "4": Rom. 13:5, 6, 7. 1 Ped. 2:17.
  "5": 1 Tim. 2:1, 2.
