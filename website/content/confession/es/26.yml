# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 26
title: De la Iglesia
paragraphs:
  - n: 1
    text: La Iglesia católica o universal, que (con respecto a la obra interna del Espíritu y la verdad de la gracia) puede llamarse invisible, se compone del número completo de los elegidos que han sido, son o serán reunidos en uno bajo Cristo, su Cabeza; *la Iglesia* es la esposa, el cuerpo, la plenitud de Aquel que lo llena todo en todo.[^1]
  - n: 2
    text: Todos los que, en todo el mundo, profesan la fe del evangelio y obediencia a Dios por medio de Cristo, conforme al evangelio, que no destruyen su propia profesión mediante algún error que everta el fundamento o conductas contrarias a la santidad, son y pueden ser llamados santos visibles;[^2] de los tales deben estar constituidas todas las congregaciones locales.[^3]
  - n: 3
    text: Las iglesias más puras bajo el cielo están sujetas a la impureza y al error,[^4] y algunas se han degenerado tanto que han llegado a ser no iglesias de Cristo sino sinagogas de Satanás;[^5] sin embargo, Cristo siempre ha tenido y siempre tendrá un Reino en este mundo, hasta el fin *del mundo*, compuesto de aquellos que creen en Él y profesan Su nombre.[^6]
  - n: 4
    text: La Cabeza de la iglesia es el Señor Jesucristo, quien—por el designio del Padre—está investido de una manera suprema y soberana con toda autoridad para el llamamiento, establecimiento, orden o gobierno de la iglesia.[^7] No puede el Papa de Roma ser cabeza de esta en ningún sentido, sino que él es aquel anticristo, aquel hombre de pecado e hijo de perdición, que se exalta en la iglesia contra Cristo y contra todo lo que se llama Dios, a quien el Señor destruirá con el resplandor de Su Venida.[^8]
  - n: 5
    text: En el ejercicio de esta autoridad que le ha sido confiada, el Señor Jesús, a través del ministerio de Su Palabra y por Su Espíritu, llama a Sí mismo del mundo a aquellos que le han sido dados por Su Padre,[^9] para que anden delante de Él en todos los caminos de la obediencia que Él les prescribe en Su Palabra.[^10] A los así llamados, les ordena andar juntos en sociedades locales, o iglesias, para su edificación mutua y la debida observancia de la adoración pública que Él demanda de ellos en el mundo.[^11]
  - n: 6
    text: Los miembros de estas iglesias son santos por *su* llamamiento, y en una forma visible manifiestan y evidencian (en y mediante su profesión de fe y su conducta) su obediencia a ese llamamiento de Cristo;[^12] y voluntariamente acuerdan andar juntos, conforme al designio de Cristo, dándose a sí mismos al Señor y mutuamente, por la voluntad de Dios, en profesada sujeción a las ordenanzas del evangelio.[^13]
  - n: 7
    text: A cada una de estas iglesias así reunidas, conforme a Su voluntad declarada en Su Palabra, *el Señor Jesús* ha dado todo el poder y autoridad en cualquier sentido necesario para llevar adelante ese orden en la adoración y la disciplina que Él ha instituido para que lo guarden, con mandatos y reglas, para el debido y correcto ejercicio y ejecución de ese poder.[^14]
  - n: 8
    text: Una iglesia local, reunida y completamente organizada conforme a la voluntad de Cristo, está compuesta por oficiales y miembros; los oficiales designados por Cristo que deben ser escogidos y apartados por la iglesia (así llamada y reunida), para que la particular administración de las ordenanzas y la ejecución del poder o el deber—que Él les confía o a los cuales los llama—continúen hasta el fin del mundo, son los obispos o ancianos, y los diáconos.[^15]
  - n: 9
    text: La manera designada por Cristo para el llamamiento de cualquier persona que ha sido cualificada y dotada por el Espíritu Santo para el oficio de obispo o anciano en una iglesia es que sea escogido para ello mediante la votación ordinaria de la iglesia misma,[^16] y *que sea* solemnemente apartado mediante ayuno y oración con la imposición de manos de los ancianos de la iglesia, si es que hay algún *otro* anciano constituido anteriormente en esta;[^17] y para el *oficio* de diácono, que sea escogido mediante el mismo tipo de votación y *sea* apartado mediante oración y el mismo tipo de imposición de manos.[^18]
  - n: 10
    text: Siendo la labor de los pastores atender constantemente al servicio de Cristo, en Sus iglesias, en el ministerio de la Palabra y la oración, velando por sus almas como aquellos que han de dar cuenta a Él,[^19] es la responsabilidad de las iglesias a las que ellos ministran darles no solamente todo el respeto debido, sino también compartir con ellos todas sus cosas buenas, según sus posibilidades,[^20] para que así *los pastores* puedan tener una provisión confortable sin *tener que* enredarse en negocios seculares,[^21] y también puedan practicar la hospitalidad para con los demás.[^22] Además, esto lo demandan la ley de la naturaleza y el mandato expreso de nuestro Señor Jesús, quien ha ordenado que los que predican el evangelio, vivan del evangelio.[^23]
  - n: 11
    text: Aunque sea la responsabilidad de los obispos o pastores de las iglesias, según *su* oficio, estar constantemente dedicados a la predicación de la Palabra, aun así, la labor de predicar la Palabra no está tan particularmente limitada a ellos, sino que otros también dotados y cualificados por el Espíritu Santo para ello, y aprobados y llamados por la iglesia, pueden y deben desempeñar esta labor.[^24]
  - n: 12
    text: Así como todos los creyentes están obligados a unirse a iglesias locales cuando y donde tengan la oportunidad de hacerlo, todos aquellos que son admitidos a los privilegios de una iglesia también están sujetos a la disciplina y al gobierno de la misma, conforme a la ley de Cristo.[^25]
  - n: 13
    text: Ningún miembro de iglesia, por causa de alguna ofensa recibida, habiendo cumplido el deber requerido de él hacia la persona con la que está ofendido, debe perturbar el orden de la iglesia en ningún sentido, ni ausentarse de las reuniones de la iglesia, ni de la administración de ninguna de las ordenanzas, por cuenta de tal ofensa de cualquier otro miembro, sino que debe esperar en Cristo, en lo que avanzan los procedimientos de la iglesia.[^26]
  - n: 14
    text: Como cada iglesia y todos sus miembros están obligados a orar continuamente por el bien y la prosperidad de todas las iglesias de Cristo en todos los lugares,[^27] y *ya que* en todas las ocasiones *están obligados* a promoverlo (cada cual dentro de los límites de sus puestos y vocaciones, en el ejercicio de sus dones y virtudes), entonces, las iglesias (cuando sean plantadas por la providencia de Dios, de modo que puedan gozar de la oportunidad para, y el beneficio de, ello) deben tener comunión entre sí, para su paz, crecimiento en amor y edificación mutua.[^28]
  - n: 15
    text: En casos de dificultades o diferencias, ya sea en cuanto a la doctrina o el gobierno de la iglesia, en que las iglesias en general o cualquier iglesia en particular estén preocupadas por su paz, unión y edificación, o *en que* uno o varios miembros de cualquier iglesia sean dañados en o por cualquier procedimiento disciplinario que no esté en consonancia con la verdad y el orden, es conforme a la voluntad de Cristo que muchas iglesias que estén teniendo comunión entre sí se reúnan por medio de sus mensajeros para considerar y dar su consejo sobre el asunto en disputa, para informar a todas las iglesias involucradas.[^29] Sin embargo, a estos mensajeros reunidos en asamblea no se les confía ningún poder eclesiástico propiamente dicho ni jurisdicción alguna sobre las iglesias mismas para ejercer disciplina sobre alguna de estas o sus miembros, ni para imponer su determinación sobre estas o sus oficiales.[^30]
