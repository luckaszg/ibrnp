# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 2
title: De Dios y de la Santa Trinidad
paragraphs:
  - n: 1
    text: El Señor nuestro Dios es el único Dios vivo y verdadero;[^1] cuya subsistencia está en Él mismo y es de Él mismo,[^2] infinito en ser y perfección, cuya esencia no puede ser comprendida por nadie sino *solo* por Él mismo;[^3] *es* espíritu purísimo,[^4] invisible, sin cuerpo, partes ni pasiones, *es* el único que tiene inmortalidad y habita en luz inaccesible,[^5] que es inmutable,[^6] inmenso,[^7] eterno,[^8] inescrutable, todopoderoso,[^9] infinito en todos los sentidos, santísimo,[^10] sapientísimo, libérrimo, absolutísimo, que obra todas las cosas conforme al consejo de Su inmutable y justísima voluntad,[^11] para Su propia gloria;[^12] *es* amantísimo, clementísimo, misericordiosísimo, longanísimo, abundantísimo en bondad y verdad, que perdona la iniquidad, la transgresión y el pecado, remunerador de los que le buscan con diligencia,[^13] pero también justísimo y terribilísimo en Sus juicios,[^14] que odia todo pecado,[^15] y que de ninguna manera dará por inocente al culpable.[^16]
  - n: 2
    text: Dios, teniendo en Sí mismo y de Sí mismo toda vida,[^17] gloria,[^18] bondad y bienaventuranza,[^19] es el único todosuficiente, en Sí mismo y para Sí mismo, no teniendo necesidad de ninguna de las criaturas que ha hecho, ni derivando ninguna gloria de ellas,[^20] sino manifestando solamente Su propia gloria en ellas, por medio de ellas, hacia ellas y sobre ellas; Él es la única fuente de todo ser, de quien, por medio de quien y para quien son todas las cosas,[^21] teniendo sobre todas las criaturas el más soberano dominio para hacer, por medio de ellas, para ellas o sobre ellas todo lo que le agrade;[^22] todas las cosas están al descubierto y desnudas ante Sus ojos,[^23] Su conocimiento es infinito, infalible e independiente de la criatura, de modo que para Él no hay ninguna cosa contingente o incierta;[^24] es santísimo en todos Sus consejos, en todas Sus obras y en todos Sus mandatos;[^25] a Él se le debe, por parte de los ángeles y los hombres, toda adoración,[^26] *todo* servicio u obediencia que como criaturas deben al Creador, y cualquier cosa adicional que a Él le plazca demandar de ellos.
  - n: 3
    text: En este Ser divino e infinito hay tres subsistencias, el Padre, el Verbo o Hijo y el Espíritu Santo,[^27] de una misma sustancia, un mismo poder y una misma eternidad, teniendo cada uno toda la esencia divina, pero la esencia indivisa;[^28] el Padre no es de nadie ni *es* engendrado ni procede *de nadie*, el Hijo es eternamente engendrado del Padre,[^29] *y* el Espíritu Santo procede del Padre y del Hijo,[^30] todos infinitos, sin principio, por lo tanto, *son* un solo Dios, que no ha de ser dividido en naturaleza y Ser, sino distinguido por varias propiedades relativas peculiares y relaciones personales; dicha doctrina de la Trinidad es el fundamento de toda nuestra comunión con Dios y nuestra consoladora dependencia de Él.
