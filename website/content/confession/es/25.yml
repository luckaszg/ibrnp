# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 25
title: Del matrimonio
paragraphs:
  - n: 1
    text: El matrimonio debe ser entre un solo hombre y una sola mujer; no es lícito que hombre alguno tenga más de una esposa ni que mujer alguna tenga más de un esposo a la vez.[^1]
  - n: 2
    text: El matrimonio fue instituido para la ayuda mutua entre el esposo y la esposa,[^2] para la multiplicación del género humano con una descendencia legítima,[^3] y para la prevención de la impureza.[^4]
  - n: 3
    text: Es lícito que se casen toda clase de personas que, en su sano juicio, puedan dar su consentimiento;[^5] sin embargo, es el deber de los cristianos casarse en el Señor,[^6] y, por lo tanto, los que profesan la religión verdadera no deberían casarse con incrédulos ni con idólatras; ni deberían estar en yugo desigual los que son piadosos casándose con los que son malvados en sus vidas o sostienen herejías destructoras.[^7]
  - n: 4
    text: El matrimonio no debe contraerse dentro de los grados de consanguinidad o afinidad prohibidos en la Palabra;[^8] ni puede ser legalizado jamás tal matrimonio incestuoso por ninguna ley humana ni por el consentimiento de las partes para que esas personas vivan juntas como marido y mujer.[^9]
notes:
  "1": Gén. 2:24. Mal. 2:15. Mat. 19:5, 6.
  "2": Gén. 2:18.
  "3": Gén. 1:28.
  "4": 1 Cor. 7:2, 9.
  "5": Heb. 13:4. 1 Tim. 4:3.
  "6": 1 Cor. 7:39.
  "7": Neh. 13:25-27.
  "8": Lev. 18.
  "9": Mar. 6:18. 1 Cor. 5:1.
