# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 7
title: Del pacto de Dios
paragraphs:
  - n: 1
    text: La distancia entre Dios y la criatura es tan grande que, aunque las criaturas racionales le deben obediencia como su Creador, aun así, estas nunca habrían podido alcanzar la recompensa de la vida a no ser por alguna condescendencia voluntaria por parte de Dios, que a Él le ha agradado expresar en forma de pacto.[^1]
  - n: 2
    text: Además, al haberse colocado el hombre bajo la maldición de la ley por su Caída, agradó al Señor hacer un Pacto de Gracia,[^2] en el cual libre y gratuitamente ofrece vida y salvación por medio de Jesucristo a los pecadores, demandándoles fe en Él para ser salvos,[^3] y prometiendo dar Su Espíritu Santo a todos aquellos que están ordenados a vida eterna, con el fin de darles la disposición y capacidad para creer.[^4]
  - n: 3
    text: Este pacto es revelado en el evangelio; en primer lugar, a Adán en la promesa de salvación por medio de la simiente de la mujer,[^5] y después, mediante pasos adicionales hasta completarse su plena revelación en el Nuevo Testamento;[^6] y tiene su fundamento en aquella transacción del Pacto Eterno que hubo entre el Padre y el Hijo acerca de la redención de los elegidos;[^7] y solo por la gracia de este pacto es que todos los que en cualquier tiempo han sido salvos de entre la posteridad del Adán caído han obtenido vida y una bendita inmortalidad, siendo el hombre ahora totalmente incapaz de hacerse aceptable para Dios bajo aquellas condiciones en las que estuvo Adán en su estado de inocencia.[^8]
notes:
  "1": Luc. 17:10. Job 35:7, 8.
  "2": Gén. 2:17. Gál. 3:10. Rom. 3:20, 21.
  "3": Rom. 8:3. Mar. 16:15, 16. Jua. 3:16.
  "4": Eze. 36:26, 27. Jua. 6:44, 45. Sal. 110:3.
  "5": Gén. 3:15.
  "6": Heb. 1:1.
  "7": 2 Tim. 1:9. Tit. 1:2.
  "8": Heb. 11:6, 13. Rom. 4:1, 2, etc. Hch. 4:12. Jua. 8:56.
