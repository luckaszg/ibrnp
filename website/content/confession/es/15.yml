# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 15
title: Del arrepentimiento para vida y salvación
paragraphs:
  - n: 1
    text: A los elegidos que se convierten en edades más maduras, habiendo vivido en otro tiempo en el estado natural,[^1] y habiendo servido en este a deleites y placeres diversos, Dios—en Su llamamiento eficaz—les da arrepentimiento para vida.
  - n: 2
    text: Aunque no hay nadie que haga el bien y nunca peque,[^2] y *aun* los mejores hombres, mediante el poder y el engaño de la corrupción que habita en ellos, con la prevalencia de la tentación, pueden caer en grandes pecados y provocaciones, Dios, en el Pacto de Gracia, ha dispuesto misericordiosamente que los creyentes que pequen y caigan de esta manera sean renovados mediante el arrepentimiento para salvación.[^3]
  - n: 3
    text: Este arrepentimiento salvador es una gracia evangélica,[^4] por la cual una persona, al ser sensibilizada por el Espíritu Santo a las multiformes maldades de su pecado, se humilla por *causa de* este, por medio de la fe en Cristo, con tristeza piadosa, aversión de *su pecado* y aborrecimiento a sí mismo,[^5] orando por el perdón y las fuerzas *que provienen* de la gracia, con el propósito y empeño—mediante las provisiones del Espíritu—de andar delante de Dios para agradarle en todas las cosas.[^6]
  - n: 4
    text: Puesto que el arrepentimiento debe continuar a lo largo de toda nuestra vida, a causa del cuerpo de muerte y sus pasiones, por tanto, es el deber de todo hombre arrepentirse individualmente de sus propios pecados que conozca.[^7]
  - n: 5
    text: Es tal la provisión que Dios ha hecho por medio de Cristo en el Pacto de Gracia para la preservación de los creyentes para salvación que, aunque no hay ningún pecado tan pequeño que no merezca la condenación,[^8] aun así, tampoco hay ningún pecado tan grande que traiga la condenación sobre los que se arrepienten;[^9] lo cual hace necesaria la constante predicación del arrepentimiento.
notes:
  "1": Tit. 3:2-5.
  "2": Ecl. 7:20.
  "3": Luc. 22:31, 32.
  "4": Zac. 12:10. Hch. 11:18.
  "5": Eze. 36:31. 2 Cor. 7:11.
  "6": Sal. 119:6, 128.
  "7": Luc. 19:8. 1 Tim. 1:13, 15.
  "8": Rom. 6:23.
  "9": Isa. 1:16, 18. Isa. 55:7.
