# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 1
title: De las Santas Escrituras
paragraphs:
  - n: 1
    text: La Santa Escritura es la única regla suficiente, segura e infalible[^1] de todo conocimiento, fe y obediencia salvadores; aunque la luz de la naturaleza[^2] y las obras de la creación y de la providencia manifiestan la bondad, sabiduría y poder de Dios, de tal manera que dejan a los hombres sin excusa, aun así, no son suficientes para dar ese conocimiento de Dios y de Su voluntad que es necesario para la salvación.[^3] Por lo tanto, agradó al Señor, en muchas ocasiones y de muchas maneras, revelarse a Sí mismo y declarar Su voluntad a Su Iglesia; y después, para preservar y propagar mejor la verdad, y para el establecimiento y consuelo más seguros de la Iglesia contra la corrupción de la carne y la malicia de Satanás y del mundo, *le agradó* poner por escrito *esa revelación* en su totalidad;[^4] lo cual hace que las Santas Escrituras sean sumamente necesarias, habiendo cesado ya aquellas maneras anteriores por las cuales Dios reveló Su voluntad a Su pueblo.
  - n: 2
    text: "Con el nombre de Santa Escritura o la Palabra de Dios escrita, ya se incluye todos los Libros del Antiguo y el Nuevo Testamento, que son los siguientes: DEL ANTIGUO TESTAMENTO Génesis, Éxodo, Levítico, Números, Deuteronomio, Josué, Jueces, Rut, 1 Samuel, 2 Samuel, 1 Reyes, 2 Reyes, 1 Crónicas, 2 Crónicas, Esdras, Nehemías, Ester, Job, Salmos, Proverbios, Eclesiastés, Cantar de los Cantares, Isaías, Jeremías, Lamentaciones, Ezequiel, Daniel, Oseas, Joel, Amós, Abdías, Jonás, Miqueas, Nahum, Habacuc, Sofonías, Hageo, Zacarías, Malaquías. DEL NUEVO TESTAMENTO Mateo, Marcos, Lucas, Juan, Hechos de los Apóstoles, La Epístola de Pablo a los Romanos, 1 Corintios, 2 Corintios, Gálatas, Efesios, Filipenses, Colosenses, 1 Tesalonicenses, 2 Tesalonicenses, 1 Timoteo, 2 Timoteo, Tito, Filemón, la Epístola a los Hebreos, la Epístola de Santiago, La primera y segunda Epístola de Pedro, La primera, segunda y tercera Epístola de Juan, la Epístola de Judas, Apocalipsis. Todos estos fueron dados por inspiración de Dios,[^5] para que sean la regla de fe y vida."
  - n: 3
    text: Los libros comúnmente llamados apócrifos, como no son de inspiración divina,[^6] no forman parte del canon (o regla) de la Escritura y, por lo tanto, no tienen autoridad para la Iglesia de Dios, ni debe ninguno de estos ser aprobado o usado de una manera distinta a como se hace con otros escritos humanos.
  - n: 4
    text: La autoridad de la Santa Escritura, por la cual esta debe ser creída, no depende del testimonio de ningún hombre o iglesia, sino enteramente de Dios (quien es la verdad misma) el Autor de la Santa Escritura;[^7] por lo tanto, esta debe ser recibida porque es la Palabra de Dios.
  - n: 5
    text: El testimonio de la Iglesia de Dios puede movernos e inducirnos a *tener* una alta y reverente estima por las Santas Escrituras; y el carácter celestial de su contenido, la eficacia de su doctrina, la majestad de su estilo, la armonía de todas sus partes, el escopo de esta en su conjunto (que es dar toda la gloria a Dios), la plena revelación que hace del único camino de salvación para el hombre, y muchas otras excelencias incomparables y la totalidad de las perfecciones de la misma son argumentos por medio de los cuales da evidencia abundantemente de ser la Palabra de Dios; no obstante, nuestra persuasión y certeza plenas de su verdad infalible y autoridad divina provienen de la obra interna del Espíritu Santo, dando testimonio en nuestros corazones por medio de la Palabra y con la Palabra.[^8]
  - n: 6
    text: Todo el consejo de Dios concerniente a todas las cosas que son necesarias para Su propia gloria, la salvación del hombre, la fe y la vida está expresamente escrito o necesariamente contenido en la Santa Escritura, a la cual no debe añadirse nada en ningún momento, ni por nueva revelación del Espíritu ni por las tradiciones de los hombres.[^9] No obstante, reconocemos que la iluminación interna del Espíritu de Dios es necesaria para el entendimiento salvador de las cosas que están reveladas en la Palabra,[^10] y *reconocemos* que hay algunas circunstancias concernientes a la adoración a Dios y el gobierno de la Iglesia *que son* comunes a las acciones y sociedades humanas, las cuales deben ser ordenadas a la luz de la naturaleza y la prudencia cristiana, conforme a las reglas generales de la Palabra, las cuales siempre deben ser obedecidas.[^11]
  - n: 7
    text: No todas las cosas en la Escritura son igualmente claras en sí mismas, ni son igualmente claras para todos;[^12] sin embargo, aquellas cosas que es necesario saber, creer y obedecer para salvación se proponen y exponen tan claramente en uno u otro lugar de la Escritura que no solo los eruditos, sino también los que no lo son, pueden adquirir un entendimiento suficiente de tales cosas mediante el debido uso de los medios ordinarios.[^13]
  - n: 8
    text: El Antiguo Testamento en hebreo (que era el idioma nativo del pueblo de Dios en la antigüedad) y el Nuevo Testamento en griego (que, en el tiempo en que fue escrito, era por lo general el idioma más conocido entre las naciones),[^14] siendo inspirados inmediatamente por Dios y guardados puros en todas las edades por Su singular cuidado y providencia, son—por lo tanto—auténticos;[^15] así que, en todas las controversias religiosas, la Iglesia debe apelar a estos como autoridad final.[^16] Pero, debido a que estas lenguas originales no son conocidas por todo el pueblo de Dios, el cual tiene derecho a las Escrituras e interés en estas, y *debido a que* se le manda leerlas y escudriñarlas en el temor de Dios,[^17] por lo tanto, deben ser traducidas a la lengua común de toda nación a la que sean llevadas,[^18] para que, habitando en abundancia la Palabra de Dios en todos, puedan adorarle de manera aceptable, y *para que*, por medio de la paciencia y el consuelo de las Escrituras, tengan esperanza.[^19]
  - n: 9
    text: La regla infalible de interpretación de la Escritura es la propia Escritura;[^20] por lo tanto, cuando surge alguna duda acerca del verdadero y pleno significado de cualquier pasaje bíblico (*significado* que no es múltiple, sino uno solo), debe buscarse en otros pasajes que hablen más claramente.
  - n: 10
    text: El juez supremo por el que deben decidirse todas las controversias religiosas, y por el que deben examinarse todos los decretos de concilios, las opiniones de escritores antiguos, las doctrinas de hombres y espíritus privados, y en cuya sentencia debemos descansar, no puede ser otro que la Santa Escritura entregada por el Espíritu; en dicha Escritura así entregada, nuestra fe se resuelve finalmente.[^21]
