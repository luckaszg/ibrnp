# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 3
title: Del decreto de Dios
paragraphs:
  - n: 1
    text: Dios, desde toda la eternidad, por el sapientísimo y santísimo consejo de Su voluntad, ha decretado en Sí mismo,[^1] libre e inalterablemente, todas las cosas, todo lo que llega a suceder; pero, de tal manera que por ello Dios ni es autor del pecado, ni tiene comunión con nadie en el mismo,[^2] ni se hace violencia a la voluntad de la criatura, ni se quita la libertad o contingencia de *las* causas secundarias, antes bien son establecidas,[^3] en lo cual se manifiesta Su sabiduría en disponer todas las cosas, y *se manifiesta* Su poder y fidelidad en el cumplimiento de Su decreto.[^4]
  - n: 2
    text: Aunque Dios sabe todo lo que podría o puede llegar a suceder en todas las condiciones que se puedan suponer,[^5] aun así, nada ha decretado porque lo previera como futuro o como aquello que llegaría a suceder en tales condiciones.[^6]
  - n: 3
    text: Por el decreto de Dios, para la manifestación de Su gloria, algunos hombres y ángeles son predestinados o preordinados para vida eterna, por medio de Jesucristo,[^7] para alabanza de la gloria de Su gracia;[^8] a otros se les deja actuar en su pecado para su justa condenación, para alabanza de la gloria de Su justicia.[^9]
  - n: 4
    text: Estos ángeles y hombres así predestinados y preordinados están designados particular e inalterablemente, y su número es tan cierto y definido que no puede ser aumentado ni disminuido.[^10]
  - n: 5
    text: A aquellos de entre la humanidad que están predestinados para vida, Dios (antes de la fundación del mundo, conforme a Su propósito eterno e inmutable, y *conforme* al consejo secreto y beneplácito de Su voluntad) los ha escogido en Cristo para gloria eterna, solo por Su libre y gratuita gracia y amor,[^11] sin que ninguna otra cosa en la criatura, como condición o causa, lo moviera a ello.[^12]
  - n: 6
    text: Así como Dios ha designado a los elegidos para gloria, de la misma manera ha preordinado, por el propósito eterno y libérrimo de Su voluntad, todos los medios para ello;[^13] por lo tanto, los que son elegidos, habiendo caído en Adán, son redimidos por Cristo,[^14] son llamados eficazmente a la fe en Cristo por Su Espíritu obrando a su debido tiempo, son justificados, adoptados, santificados[^15] y guardados por Su poder, mediante la fe para salvación;[^16] nadie más es redimido por Cristo, ni llamado eficazmente, *ni* justificado, *ni* adoptado, *ni* santificado, ni salvado, sino solo los elegidos.[^17]
  - n: 7
    text: La doctrina de este profundo misterio de la predestinación debe ser tratada con especial prudencia y cuidado, para que los hombres *que estén* prestando atención a la voluntad de Dios revelada en Su Palabra y *estén* rindiendo obediencia a esta, puedan, por la certeza de su llamamiento eficaz, estar seguros de su elección eterna;[^18] así, esta doctrina proporcionará motivo de alabanza,[^19] reverencia y admiración a Dios, y de humildad,[^20] diligencia y abundante consuelo para todos los que sinceramente obedecen el evangelio.[^21]
notes:
  "1": Isa. 46:10. Efe. 1:11. Heb. 6:17. Rom. 9:15, 18.
  "2": Stg. 1:15, 17. 1 Jua. 1:5.
  "3": Hch 4:27, 28. Jua. 19:11.
  "4": Núm. 23:19. Efe. 1:3-5.
  "5": Hch. 15:18.
  "6": Rom. 9:11, 13, 16, 18.
  "7": 1 Tim. 5:21. Mat. 25:41.
  "8": Efe. 1:5, 6.
  "9": Rom. 9:22, 23. Jud. 4.
  "10": 2 Tim. 2:19. Jua. 13:18.
  "11": Efe. 1:4, 9, 11. Rom. 8:30. 2 Tim. 1:9. 1 Tes. 5:9.
  "12": Rom. 9:13, 16. Efe. 1:6, 12.
  "13": 1 Ped. 1:2. 2 Tes. 2:13.
  "14": 1 Tes. 5:9, 10.
  "15": Rom. 8:30. 2 Tes. 2:13.
  "16": 1 Ped. 1:5.
  "17": Jua. 10:26. Jua. 17:9. Jua. 6:64.
  "18": 1 Tes. 1:4, 5. 2 Ped. 1:10.
  "19": Efe. 1:6. Rom. 11:33.
  "20": Rom. 11:5, 6.
  "21": Luc. 10:20.
