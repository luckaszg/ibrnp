# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 29
title: Del bautismo
paragraphs:
  - n: 1
    text: El bautismo es una ordenanza del Nuevo Testamento, instituida por Jesucristo, a fin de que sea para el bautizado una señal de su comunión con Él en Su muerte y resurrección,[^1] *una señal* de estar injertado en Él, del perdón de pecados,[^2] y de darse a sí mismo a Dios por medio de Jesucristo para vivir y andar en novedad de vida.[^3]
  - n: 2
    text: Aquellos que realmente profesan arrepentimiento para con Dios, fe en nuestro Señor Jesús y obediencia a Él son los únicos sujetos adecuados de esta ordenanza.[^4]
  - n: 3
    text: El elemento externo que debe ser usado en esta ordenanza es el agua, en la cual debe ser bautizada la persona en el nombre del Padre, del Hijo y del Espíritu Santo.[^5]
  - n: 4
    text: La inmersión o sumersión de la persona en el agua es necesaria para la correcta administración de esta ordenanza.[^6]
notes:
  "1": Rom. 6:3-5. Col. 2:12. Gál. 3:27.
  "2": Mar. 1:4. Hch. 26:16.
  "3": Rom. 6:2, 4.
  "4": Mar. 16:16. Hch. 8:36, 37.
  "5": Mat. 28:19, 20 con Hch. 8:38.
  "6": Mat. 3:16. Jua. 3:23.
