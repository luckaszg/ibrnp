# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 32
title: Del Juicio final
paragraphs:
  - n: 1
    text: Dios ha establecido un Día en el cual juzgará al mundo en justicia, por medio de Jesucristo,[^1] a quien el Padre ha dado todo poder y juicio; Día en el cual no solo serán juzgados los ángeles apóstatas, sino que también todas las personas que han vivido sobre la Tierra comparecerán ante el tribunal de Cristo,[^2] para dar cuenta de sus pensamientos, palabras y obras, y para ser recompensados de acuerdo con lo que hayan hecho estando en el cuerpo, sea bueno o sea malo.[^3]
  - n: 2
    text: El fin para el cual Dios estableció este Día es la manifestación de la gloria de Su misericordia en la salvación eterna de los elegidos, y *la manifestación* de Su justicia en la condenación eterna de los réprobos, quienes son malvados y desobedientes;[^4] porque entonces irán los justos a la vida eterna, y recibirán esa plenitud de gozo y gloria con recompensa eterna en la presencia del Señor;[^5] pero los malvados, quienes no conocen a Dios ni obedecen el evangelio de Jesucristo, serán arrojados a los tormentos eternos y sufrirán el castigo de eterna destrucción, excluidos de la presencia del Señor y de la gloria de Su poder.[^6]
  - n: 3
    text: Así como Cristo quiere que estemos ciertamente persuadidos de que habrá un Día de juicio, tanto para disuadir a todos los hombres de pecar,[^7] como para la mayor consolación de los piadosos en su adversidad,[^8] también quiere que los hombres no sepan cuándo será ese Día, para que se desprendan de toda seguridad carnal y estén siempre velando, porque no saben a qué hora llegará el Señor,[^9] y estén siempre preparados para decir:—Ven Señor Jesús, ven pronto. Amén.[^10]
notes:
  "1": Hch. 17:31. Jua. 5:22, 27.
  "2": 1 Cor. 6:3. Jud. 6.
  "3": 2 Cor. 5:10. Ecl. 12:14. Mat. 12:36. Rom. 14:10, 12. Mat. 25:32, etc.
  "4": Rom. 9:22, 23.
  "5": Mat. 25:21, 34. 2 Tim. 4:8.
  "6": Mat. 25:46. Mar. 9:48. 2 Tes. 1:7-10.
  "7": 2 Cor. 5:10, 11.
  "8": 2 Tes. 1:5-7.
  "9": Mar. 13:35-37. Luc. 13:35, 36.
  "10": Apo. 22:20.
