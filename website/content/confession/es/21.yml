# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 21
title: De la libertad cristiana y la libertad de conciencia
paragraphs:
  - n: 1
    text: La libertad que Cristo ha comprado para los creyentes bajo el evangelio consiste en su liberación de la culpa del pecado, de la ira condenatoria de Dios, del rigor y de la maldición de la ley;[^1] y en ser librados de este presente siglo malo,[^2] de la esclavitud a Satanás[^3] y del dominio del pecado;[^4] del mal de las aflicciones; del temor a la muerte y del aguijón de la muerte,[^5] de la victoria del sepulcro[^6] y de la condenación eterna;[^7] también consiste en su libre acceso a Dios, y en rendir su obediencia a Él, no por un temor servil,[^8] sino por un amor filial y una mente dispuesta.[^9] Todo lo cual era, en su substancia, común también a los creyentes bajo la ley;[^10] pero bajo el Nuevo Testamento, la libertad de los cristianos se ensancha aún más en su liberación del yugo de la ley ceremonial, a la cual la iglesia judía estaba sujeta; y en mayor confianza para acceder al trono de gracia, y en comunicaciones más plenas del libre Espíritu de Dios que aquellas de las que participaban ordinariamente los creyentes bajo la ley.[^11]
  - n: 2
    text: Solo Dios es *el* Señor de la conciencia,[^12] y la ha dejado libre de las doctrinas y mandamientos de los hombres que sean en cualquier cosa contrarios a Su Palabra o que no estén contenidos en esta.[^13] Así que creer tales doctrinas u obedecer tales mandamientos por conciencia es traicionar la verdadera libertad de conciencia;[^14] y exigir una fe implícita y una obediencia absoluta y ciega es destruir la libertad de conciencia y también la razón.[^15]
  - n: 3
    text: Los que bajo el pretexto de la libertad cristiana practican cualquier pecado o abrigan cualquier deseo pecaminoso, como pervierten por ello el propósito principal de la gracia del evangelio, para su propia destrucción,[^16] por tanto, destruyen completamente el propósito de la libertad cristiana, que es, que siendo librados de las manos de todos nuestros enemigos, sirvamos al Señor sin temor, en santidad y justicia delante de Él, todos nuestros días.[^17]
notes:
  "1": Gál. 3:13.
  "2": Gál. 1:4.
  "3": Hch. 26:18.
  "4": Rom. 8:3.
  "5": Rom. 8:28.
  "6": 1 Cor. 15:54-57.
  "7": 2 Tes. 1:10.
  "8": Rom. 8:15.
  "9": Luc. 1:74, 75. 1 Jua. 4:18.
  "10": Gál. 3:9, 14.
  "11": Jua. 7:38, 39. Heb. 10:19, 20, 21.
  "12": Stg. 4:12, Rom. 14:4.
  "13": Hch. 4:19 y 5:29. 1 Cor. 7:23. Mat. 15:9.
  "14": Col. 2:20, 22, 23.
  "15": 1 Cor. 3:5. 2 Cor. 1:24.
  "16": Rom. 6:1, 2.
  "17": Gál. 5:13. 2 Ped. 2:18-21.
