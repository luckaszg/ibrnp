# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 28
title: Del bautismo y la Cena del Señor
paragraphs:
  - n: 1
    text: El bautismo y la Cena del Señor son ordenanzas *que han sid o* instituidas positiva y soberanamente; establecidas por el Señor Jesús, el único Legislador, para que continuaran siendo observadas en Su Iglesia hasta el fin del mundo.[^1]
  - n: 2
    text: Estas santas instituciones deben ser administradas solo por aquellos que estén cualificados para ello y sean llamados a administrarlas, conforme a la comisión de Cristo.[^2]
notes:
  "1": Mat. 28:19, 20. 1 Cor. 11:26.
  "2": Mat. 28:19. 1 Cor. 4:1.
