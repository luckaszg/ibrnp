# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 30
title: De la Cena del Señor
paragraphs:
  - n: 1
    text: La Cena del Señor Jesús fue instituida por Él la misma noche en que fue entregado, para que sea observada en Sus iglesias hasta el fin del mundo, para *que se haga* memoria perpetua y se proclame el sacrificio de Sí mismo en Su muerte,[^1] *para* confirmación de la fe de los creyentes en todos los beneficios de esta, *para* su alimentación espiritual y crecimiento en Él, *para* un mayor compromiso de ellos en—y con—todos los deberes que deben a Él; y para que sea un vínculo y una prenda de la comunión de ellos con Él y entre ellos mutuamente.[^2]
  - n: 2
    text: En esta ordenanza, Cristo no es ofrecido a Su Padre ni se hace en absoluto ningún sacrificio real para el perdón de pecados ni de los vivos ni de los muertos, sino que es solo un memorial de aquel único ofrecimiento de Sí mismo, que Él mismo hizo en la cruz, una vez para siempre;[^3] y *es* una ofrenda espiritual de toda alabanza posible a Dios por ello;[^4] de modo que el sacrificio papista de la misa—como lo llaman—es de lo más abominable e injurioso para el propio y único sacrificio de Cristo, la única propiciación por todos los pecados de los elegidos.
  - n: 3
    text: En esta ordenanza, el Señor Jesús ha instituido que sus ministros oren y bendigan los elementos—el pan y el vino—y los aparten así del uso común para un uso santo, y que tomen y partan el pan, tomen la copa, y (comulgando ellos mismos también) den ambos *elementos* a los comulgantes.[^5]
  - n: 4
    text: Negar la copa al pueblo *de Dios*, adorar los elementos, levantarlos, o llevarlos de un lugar a otro para que sean adorados, y reservarlos para cualquier uso supuestamente religioso son todos *usos* contrarios a la naturaleza de esta ordenanza y la institución de Cristo.[^6]
  - n: 5
    text: "Los elementos externos de esta ordenanza, debidamente apartados para los usos instituidos por Cristo, están tan relacionados con Él crucificado que a veces son llamados verdaderamente—aunque con términos usados figuradamente—por el nombre de las cosas que estos representan, a saber: el cuerpo y la sangre de Cristo;[^7] no obstante, en cuanto a *su* sustancia y naturaleza, *los elementos* siguen siendo verdadera y solamente pan y vino, como lo eran antes.[^8]"
  - n: 6
    text: La doctrina que sostiene un cambio de sustancia del pan y del vino en la sustancia del cuerpo y la sangre de Cristo (llamada comúnmente transubstanciación) por la consagración de un sacerdote, o de cualquier otra forma, es repugnante no solo para la Escritura,[^9] sino incluso para el sentido común y la razón; trastorna la naturaleza de la ordenanza; y ha sido—y es—la causa de múltiples supersticiones, y hasta de idolatrías groseras.[^10]
  - n: 7
    text: Los que reciben dignamente esta ordenanza, participando externamente de los elementos visibles en esta, también reciben y se alimentan entonces—internamente, por la fe, de una manera real y verdadera, aunque no carnal ni corporal, sino espiritualmente—de Cristo crucificado y de todos los beneficios de Su muerte; el cuerpo y la sangre de Cristo estando entonces—no corporal ni carnal, sino espiritualmente—presentes en esa ordenanza, para la fe de los creyentes, así como los elementos mismos lo están para sus sentidos externos.[^11]
  - n: 8
    text: Todos los ignorantes e impíos, como no son aptos para gozar de la comunión con Cristo, son—por tanto—indignos de la Mesa del Señor, y—mientras permanezcan como tales—no pueden participar de estos santos misterios ni pueden ser admitidos en estos sin *que esto sea un* gran pecado contra Él;[^12] es más, todo aquel que reciba estos misterios indignamente es culpable del cuerpo y de la sangre del Señor, pues come y bebe juicio para sí.[^13]
notes:
  "1": 1 Cor. 11:23-26.
  "2": 1 Cor. 10:16, 17, 21.
  "3": Heb. 9:25, 26, 28.
  "4": 1 Cor. 11:24. Mat. 26:26, 27.
  "5": 1 Cor. 11:23-26, etc.
  "6": Mat 26:26-28. Mat. 15:9. Éxo. 20:4, 5.
  "7": 1 Cor. 11:27.
  "8": 1 Cor. 11:26 y el v. 28.
  "9": Hch. 3:21. Luc. 24:6 y el v. 39.
  "10": 1 Cor. 11:24, 25.
  "11": 1 Cor. 10:16; 11:23-26.
  "12": 2 Cor. 6:14, 15.
  "13": 1 Cor. 11:29. Mat. 7:6.
