# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 23
title: De los juramentos y votos lícitos
paragraphs:
  - n: 1
    text: Un juramento lícito es una parte de la adoración religiosa, en el cual la persona que jura en verdad, en juicio y en justicia invoca a Dios solemnemente para que sea testigo de aquello por lo que jura,[^1] y para que lo juzgue conforme a la verdad o la falsedad del juramento.[^2]
  - n: 2
    text: Solo por el nombre de Dios es que los hombres deben jurar; *este nombre* debe usarse en ello con todo santo temor y reverencia, por lo tanto, jurar vana o precipitadamente por ese nombre glorioso y temible, o si quiera jurar por cualquier otra cosa, es pecaminoso y debe ser aborrecido;[^3] sin embargo, en asuntos de peso e importancia para la confirmación de la verdad y para poner fin a toda discusión, un juramento está justificado por la Palabra de Dios;[^4] así que debe prestarse un juramento lícito cuando la autoridad legítima lo exija en tales asuntos.[^5]
  - n: 3
    text: Todo aquel que preste un juramento justificado por la Palabra de Dios debe considerar debidamente el peso de un acto tan solemne, y no debe afirmar en ello nada más que lo que sabe es la verdad; pues por juramentos precipitados, falsos y vanos se provoca al Señor, y a causa de estos se ha enlutado la tierra.[^6]
  - n: 4
    text: Un juramento debe prestarse usando el significado claro y común de las palabras; sin equívocos ni reservas mentales.[^7]
  - n: 5
    text: Un voto, el cual no debe hacerse a ninguna criatura sino solo a Dios, debe hacerse y cumplirse con todo cuidado religioso y fidelidad.[^8] Pero los votos monásticos papistas de una vida soltera perpetua,[^9] de profesión de pobreza[^10] y de obediencia a las reglas monásticas distan tanto de ser grados de una perfección superior, que *en realidad* son trampas supersticiosas y pecaminosas en las que ningún cristiano tiene permiso para enredarse.[^11]
notes:
  "1": Éxo. 20:7. Deu. 10:20. Jer. 4:2.
  "2": 2 Cró. 6:22, 23.
  "3": Mat. 5:34, 37. Stg. 5:12.
  "4": Heb. 6:16. 2 Cor. 1:23.
  "5": Neh. 13:25.
  "6": Lev. 19:12. Jer. 23:10.
  "7": Sal. 24:4.
  "8": Sal. 76:11. Gén. 28:20, 21, 22.
  "9": 1 Cor. 7:2, 9.
  "10": Efe. 4:28.
  "11": Mat. 19:11.
