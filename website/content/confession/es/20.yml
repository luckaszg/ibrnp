# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 20
title: Del evangelio y del alcance de su gracia
paragraphs:
  - n: 1
    text: Habiendo sido quebrantado el Pacto de Obras, por el pecado, y habiéndose vuelto inútil para *dar* vida, agradó a Dios dar la promesa de Cristo, la Simiente de la mujer, como el medio para el llamamiento de los elegidos, y el engendramiento de la fe y el arrepentimiento en ellos;[^1] en esta promesa, el evangelio fue revelado en su sustancia y, por lo tanto, *fue hecho* eficaz para la conversión y la salvación de pecadores.[^2]
  - n: 2
    text: Esta promesa de Cristo, y la salvación *que es* por medio de Él, es revelada solo por la Palabra de Dios;[^3] ni las obras de la creación ni de la providencia, con la luz de la naturaleza, revelan a Cristo o la gracia *que es* por medio de Él, ni siquiera de una manera general u obscura;[^4] mucho menos *hacen* que los hombres *que están* privados de la revelación de Él *que es* por medio de la promesa, o evangelio, sean capacitados de este modo para alcanzar la fe salvadora o el arrepentimiento.[^5]
  - n: 3
    text: La revelación del evangelio a los pecadores, hecha en muchas ocasiones y en muchos lugares, con la adición de promesas y preceptos para la obediencia que esta requiere de las naciones y personas a los cuales es concedida, proviene solo de la voluntad soberana y el beneplácito de Dios;[^6] no obteniéndose en virtud de promesa alguna hecha a aquellos hombres que usen debidamente sus habilidades naturales en virtud de la luz común recibida aparte de esta *revelación*, lo cual nadie nunca hizo ni puede hacer.[^7] Por lo tanto, en todas las edades, la predicación del evangelio ha sido concedida a personas y naciones, con gran variedad en cuanto al alcance o limitación de esta, conforme al consejo de la voluntad de Dios.
  - n: 4
    text: Aunque el evangelio es el único medio externo para la revelación de Cristo y la gracia salvadora, y como tal es abundantemente suficiente para ello, aun así, para que los hombres que están muertos en sus delitos puedan nacer de nuevo, ser vivificados o regenerados, se necesita además una obra eficaz e insuperable del Espíritu Santo sobre toda el alma para que se produzca en ellos una nueva vida espiritual,[^8] sin la cual ningún otro medio efectuará su conversión a Dios.[^9]
notes:
  "1": Gén. 3:15.
  "2": Apo. 13:8.
  "3": Rom. 1:17.
  "4": Rom. 10:14, 15, 17.
  "5": Pro. 29:18. Isa. 25:7 con 60:2, 3.
  "6": Sal. 147:20. Hch. 16:7.
  "7": Rom. 1:18, etc.
  "8": Sal. 110:3. 1 Cor. 2:14. Efe. 1:19, 20.
  "9": Jua. 6:44. 2 Cor. 4:4, 6.
