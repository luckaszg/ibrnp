# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 11
title: De la justificación
paragraphs:
  - n: 1
    text: A quienes Dios llama eficazmente, Él también los justifica libre y gratuitamente,[^1] no infundiéndoles justicia, sino perdonando sus pecados, y considerando y aceptando sus personas como justas;[^2] no por nada que haya sido hecho en ellos o por ellos,[^3] sino solo por causa de Cristo, no imputándoles la fe misma ni el acto de creer, ni ninguna otra obediencia evangélica como su justicia, sino imputándoles la obediencia activa de Cristo a toda la ley y la obediencia pasiva *de Cristo* en Su muerte como su entera y única justicia, recibiéndolo a Él y descansando en Él y en Su justicia mediante la fe,[^4] la cual no tienen de sí mismos, sino que es don de Dios.[^5]
  - n: 2
    text: La fe que así recibe a Cristo y descansa en Él y en Su justicia es el único instrumento de justificación;[^6] sin embargo, no está sola en la persona justificada, sino que siempre va acompañada de todas las demás virtudes salvadoras, y no es una fe muerta, sino *una fe* que obra por el amor.[^7]
  - n: 3
    text: Cristo, por Su obediencia y muerte, saldó plenamente la deuda de todos aquellos que son justificados; y por el sacrificio de Sí mismo, en la sangre de Su Cruz, sufriendo en lugar de ellos el castigo que les correspondía, satisfizo adecuada, real y plenamente la justicia de Dios en favor de ellos;[^8] sin embargo, por cuanto Él fue dado por el Padre para ellos, y Su obediencia y satisfacción fueron aceptadas en lugar de las de ellos—y ambas libre y gratuitamente, no por nada en ellos—,[^9] su justificación es solo por gracia libre y gratuita, para que tanto la justicia exacta como la rica gracia de Dios sean glorificadas en la justificación de pecadores.[^10]
  - n: 4
    text: Dios, desde toda la eternidad, decretó justificar a todos los elegidos,[^11] y—en el cumplimiento del tiempo—Cristo murió por sus pecados y resucitó para su justificación;[^12] no obstante, *los elegidos* no son justificados personalmente hasta que el Espíritu Santo, a su debido tiempo, les aplica a Cristo actualmente.[^13]
  - n: 5
    text: Dios continúa perdonando los pecados de aquellos que son justificados,[^14] y aunque ellos nunca pueden caer del estado de justificación,[^15] aun así—por sus pecados—pueden caer en el desagrado paternal de Dios;[^16] en esa condición, la luz de Su rostro no les es restaurada usualmente, hasta que se humillen, confiesen sus pecados, rueguen por perdón, y renueven su fe y arrepentimiento.[^17]
  - n: 6
    text: La justificación de los creyentes bajo el Antiguo Testamento fue, en todos estos sentidos, exactamente la misma que la justificación de los creyentes bajo el Nuevo Testamento.[^18]
notes:
  "1": Rom. 3:24; 8:30.
  "2": Rom. 4:5, 6, 7, 8. Efe. 1:7.
  "3": 1 Cor. 1:30, 31. Rom. 5:17-19.
  "4": Fil. 3:8, 9. Efe. 2:8, 9, 10.
  "5": Jua. 1:12. Rom. 5:17.
  "6": Rom. 3:28.
  "7": Gál. 5:6. Stg. 2:17, 22, 26.
  "8": Heb. 10:14. 1 Ped. 1:18, 19. Isa. 53:5, 6.
  "9": Rom. 8:32. 2 Cor. 5:21.
  "10": Rom. 3:26. Efe. 1:6, 7; 2:7.
  "11": Gál. 3:8. 1 Ped. 1:2. 1 Tim. 2:6.
  "12": Rom. 4:25.
  "13": Col. 1:21, 22. Tit. 3:4-7.
  "14": Mat. 6:12. 1 Jua. 1:7, 9.
  "15": Jua. 10:28.
  "16": Sal. 89:31-33.
  "17": Sal. 32:5; y Sal. 51. Mat. 26:75.
  "18": Gál. 3:9. Rom. 4:22-24.
