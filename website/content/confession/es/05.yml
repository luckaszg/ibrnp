# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 5
title: De la divina providencia
paragraphs:
  - n: 1
    text: Dios, el buen Creador de todas las cosas, en Su poder y sabiduría infinitos, sostiene, dirige, dispone y gobierna todas las criaturas y cosas,[^1] desde la mayor hasta la menor,[^2] por Su sapientísima y santísima providencia, para el fin para el que fueron creadas, conforme a Su previo conocimiento infalible y el libre e inmutable consejo de Su voluntad, para alabanza de la gloria de Su sabiduría, poder, justicia, infinita bondad y misericordia.[^3]
  - n: 2
    text: Aunque, en relación con el previo conocimiento y decreto de Dios, *quien es* la causa primera, todas las cosas llegan a suceder inmutable e infaliblemente,[^4] de modo que nada ocurre a nadie por azar o fuera de Su providencia,[^5] aun así, mediante la misma providencia, Él las ordena para que ocurran conforme a la naturaleza de *las* causas secundarias, ya sea necesariamente, libremente, o contingentemente.[^6]
  - n: 3
    text: Dios, en Su providencia ordinaria, hace uso de medios;[^7] sin embargo, es libre para obrar sin estos,[^8] por encima de estos,[^9] y contra estos,[^10] según le plazca.
  - n: 4
    text: El poder omnipotente, la sabiduría inescrutable y la infinita bondad de Dios se manifiestan en Su providencia hasta tal punto que Su predeterminado consejo se extiende incluso hasta la primera Caída y a todas las demás acciones pecaminosas, tanto de los ángeles como de los hombres,[^11] (y eso no por un mero permiso), las cuales Él también sapientísima y poderosísimamente limita,[^12] y—además—ordena y gobierna en una multiforme dispensación para Sus santísimos fines;[^13] sin embargo, *lo hace* de tal modo que la pecaminosidad de las acciones de ellos procede solo de las criaturas, y no de Dios, quien siendo santísimo y justísimo no es, ni puede ser, autor ni aprobador del pecado.[^14]
  - n: 5
    text: El Dios sapientísimo, justísimo y clementísimo a menudo deja por un poco de tiempo a Sus propios hijos *expuestos* a muchas y diversas pruebas y a las corrupciones de sus propios corazones, para disciplinarlos por sus pecados anteriores, o para revelarles la fuerza oculta de la corrupción y el engaño de sus corazones, para que sean humillados; y para llevarlos a una dependencia más íntima y constante para que se apoyen en Él; y para hacerlos más vigilantes contra todas las futuras ocasiones de pecado, y para otros fines justos y santos.[^15] De modo que todo lo que ocurre a cualquiera de Sus elegidos es por Su designio, para Su gloria y *para* el bien de ellos.[^16]
  - n: 6
    text: En cuanto a aquellos hombres malvados e impíos a quienes Dios, como Juez justo, ciega y endurece por sus pecados anteriores,[^17] no solo les niega Su gracia, por la cual el entendimiento de ellos podría haber sido iluminado y se podría haber obrado en sus corazones,[^18] sino que a veces también les retira los dones que tenían,[^19] y los deja expuestos a aquellos objetos que sus corrupciones convierten en oportunidades para pecar;[^20] además, los entrega a sus propias concupiscencias, a las tentaciones del mundo y al poder de Satanás,[^21] por lo cual llega a suceder que ellos mismos se endurecen, incluso bajo aquellos *mismos* medios que Dios usa para ablandar a otros.[^22]
  - n: 7
    text: De la misma manera que la providencia de Dios alcanza en general a todas las criaturas, también—*pero* de una manera especialísima—cuida de Su Iglesia y dispone todas las cosas para el bien de esta.[^23]
notes:
