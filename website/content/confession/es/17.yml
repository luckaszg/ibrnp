# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 17
title: De la perseverancia de los santos
paragraphs:
  - n: 1
    text: Aquellos a quienes Dios ha aceptado en el Amado, ha llamado eficazmente y ha santificado por Su Espíritu, y ha dado la preciosa fe de Sus elegidos, no pueden caer total ni definitivamente del estado de gracia, sino que ciertamente perseverarán en este *estado* hasta el fin y serán salvos eternamente, en vista de que los dones y llamamientos de Dios son irrevocables (de ahí que Él todavía engendra y alimenta en ellos la fe, el arrepentimiento, el amor, el gozo, la esperanza y todas las virtudes del Espíritu para inmortalidad);[^1] aunque muchas tormentas e inundaciones se levanten contra ellos y los azoten, aun así, nunca podrán arrancarlos de ese fundamento y roca sobre el cual están sujetados firmemente por la fe, a pesar de que, por medio de la incredulidad y las tentaciones de Satanás, la visión perceptible de la luz y el amor de Dios puede que les sea nublada y oscurecida por un tiempo,[^2] aun así, Él sigue siendo el mismo y ellos estarán seguros de que serán guardados por el poder de Dios para salvación, donde gozarán de su posesión adquirida, al estar ellos grabados en la palma de Sus manos, y sus nombres haber sido escritos en el libro de la vida desde toda la eternidad.[^3]
  - n: 2
    text: Esta perseverancia de los santos no depende de su propio libre albedrío, sino de la inmutabilidad del decreto de elección[^4] que fluye del amor libre e inmutable de Dios el Padre, sobre la base de la eficacia de los méritos y la intercesión de Jesucristo y la unión con Él,[^5] del juramento de Dios,[^6] de la morada de Su Espíritu y la simiente de Dios dentro de ellos,[^7] y de la naturaleza del Pacto de Gracia,[^8] de todo lo cual surgen también la certeza e infalibilidad de esta perseverancia.
  - n: 3
    text: Y aunque *los santos*—por medio de la tentación de Satanás y del mundo, la prevalencia de la corrupción que queda en ellos y el descuido de los medios para su preservación—[^9] caigan en pecados graves y por un tiempo permanezcan en estos—por lo cual incurren en el desagrado de Dios y contristan a Su Espíritu,[^10] llegan a tener sus virtudes y consuelos dañados,[^11] su corazón endurecido y su conciencia herida,[^12] lastiman y escandalizan a otros, y traen juicios temporales sobre sí mismos—,[^13] aun así, renovarán su arrepentimiento y serán preservados por medio de la fe en Cristo Jesús hasta el fin.[^14]
notes:
  "1": Jua. 10:28, 29. Fil. 1:6. 2 Tim. 2:19. 1 Jua. 2:19.
  "2": Sal. 89:31, 32. 1 Cor. 11:32.
  "3": Mal. 3:6.
  "4": Rom. 8:30; 9:11, 16.
  "5": Rom. 5:9, 10. Jua. 14:19.
  "6": Heb. 6:17, 18.
  "7": 1 Jua. 3:9.
  "8": Jer. 32:40.
  "9": Mat. 26:70, 72, 74.
  "10": Isa. 64:5, 9. Efe. 4:30.
  "11": Sal. 51:10, 12.
  "12": Sal. 32:3, 4.
  "13": 2 Sam. 12:14.
  "14": Luc. 22:32 y los vv. 61, 62.
