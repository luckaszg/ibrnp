# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 12
title: De la adopción
paragraphs:
  - n: 1
    text: A todos aquellos que son justificados, Dios se dignó *conceder de buena gana*, en Su único Hijo Jesucristo y por causa de Él, *el enorme privilegio de* hacerlos partícipes de la gracia de la adopción,[^1] por la cual son incluidos en el número de los hijos de Dios, y gozan de sus libertades y privilegios,[^2] tienen Su nombre escrito sobre ellos,[^3] reciben el espíritu de adopción,[^4] tienen acceso al trono de la gracia con confianza, son capacitados para clamar:—¡Abba! ¡Padre!—,[^5] son objetos de compasión,[^6] son protegidos,[^7] provistos[^8] y disciplinados por Él como por un Padre,[^9] pero nunca son desechados,[^10] sino que son sellados para el día de la redención;[^11] y heredan las promesas como herederos de la salvación eterna.[^12]
notes:
  "1": Efe. 1:5. Gál. 4:4, 5.
  "2": Jua. 1:12. Rom. 8:17.
  "3": 2 Cor. 6:18. Apo. 3:12.
  "4": Rom. 8:15.
  "5": Gál. 4:6. Efe. 2:18.
  "6": Sal. 103:13.
  "7": Pro. 14:26.
  "8": 1 Ped. 5:7.
  "9": Heb. 12:6.
  "10": Isa. 54:8, 9. Lam. 3:31.
  "11": Efe. 4:30.
  "12": Heb. 1:14; 6:12.
