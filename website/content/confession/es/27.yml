# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 27
title: De la comunión de los santos
paragraphs:
  - n: 1
    text: Todos los santos que están unidos a Jesucristo, su Cabeza, por Su Espíritu y por la fe, aunque por ello no sean hechos una misma persona con Él, tienen comunión en Sus virtudes, padecimientos, muerte, resurrección y gloria;[^1] y al estar unidos unos a otros en amor, tienen comunión en los dones y virtudes de los unos y de los otros,[^2] y están obligados al cumplimiento de manera ordenada de los deberes públicos y privados que conducen a su bien mutuo, tanto en el hombre interior como en el exterior.[^3]
  - n: 2
    text: Los santos, por *su* profesión, están obligados a mantener *entre sí* un compañerismo y comunión santos en la adoración a Dios y en la realización de los otros servicios espirituales que tiendan a su edificación mutua;[^4] así como en ayudarse los unos a los otros en las cosas externas, según sus distintas posibilidades y necesidades.[^5] Aunque, conforme a la regla del evangelio, dicha comunión deba ser ejercida por ellos especialmente en las relaciones en que se encuentren, ya sea en las familias[^6] o en las iglesias,[^7] aun así—según Dios dé la oportunidad—debe extenderse a toda la familia de la fe, es decir, a todos los que en cualquier parte invocan el nombre del Señor Jesús. No obstante, su comunión mutua como santos no quita ni infringe el derecho o la propiedad que cada hombre tiene sobre sus bienes y posesiones.[^8]
notes:
  "1": 1 Jua. 1:3. Jua. 1:16. Fil. 3:10. Rom. 6:5, 6.
  "2": Efe. 4:15, 16. 1 Cor. 12:7. 1 Cor. 3:21-23.
  "3": 1 Tes. 5:11, 14. Rom. 1:12. 1 Jua. 3:17, 18. Gál. 6:10.
  "4": Heb. 10:24, 25; con 3:12, 13.
  "5": Hch. 11:29, 30.
  "6": Efe. 6:4.
  "7": 1 Cor. 12:14-27.
  "8": Hch. 5:4. Efe. 4:28.
