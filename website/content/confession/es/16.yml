# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 16
title: De las buenas obras
paragraphs:
  - n: 1
    text: Las buenas obras son solo aquellas que Dios ha ordenado en Su Santa Palabra[^1] y no las que, sin la justificación de esta, son inventadas por los hombres, por un fervor ciego, o con cualquier pretexto de buenas intenciones.[^2]
  - n: 2
    text: Estas buenas obras, hechas en obediencia a los mandamientos de Dios, son los frutos y evidencias de una fe verdadera y viva;[^3] y por estas los creyentes manifiestan su gratitud,[^4] fortalecen su seguridad,[^5] edifican a sus hermanos, adornan la profesión del evangelio,[^6] tapan la boca de los adversarios y glorifican a Dios,[^7] cuya hechura son, creados en Cristo Jesús para buenas obras,[^8] para que, teniendo por fruto la santificación, tengan como resultado la vida eterna.[^9]
  - n: 3
    text: La capacidad que tienen los creyentes para hacer buenas obras no es de ellos mismos en absoluto, sino *que procede* completamente del Espíritu de Cristo;[^10] y a fin de que puedan tener la capacidad para hacerlas, además de las virtudes que ya han recibido, es necesaria una influencia actual del mismo Espíritu Santo para obrar en ellos tanto el querer como el hacer, de Su beneplácito;[^11] sin embargo, no deben volverse negligentes por ello, como si no estuvieran obligados a cumplir deber alguno a no ser por una moción especial del Espíritu, sino que deben ser diligentes en avivar la gracia de Dios que está en ellos.[^12]
  - n: 4
    text: Quienes alcancen la máxima obediencia posible en esta vida se quedan tan lejos de poder supererogar y hacer más de lo que Dios requiere, que no alcanzan mucho de lo que por deber están obligados a hacer.[^13]
  - n: 5
    text: No podemos merecer el perdón del pecado o la vida eterna de la mano de Dios *ni siquiera* por nuestras mejores obras, a causa de la gran desproporción que hay entre estas y la gloria venidera, y la distancia infinita que hay entre nosotros y Dios, a quien no podemos beneficiar con estas obras, ni satisfacer con estas la deuda de nuestros pecados anteriores,[^14] sino que cuando hemos hecho todo lo que podemos, solo hemos hecho lo que debíamos haber hecho y somos siervos inútiles; y *tampoco podemos merecer el perdón del pecado o la vida eterna por nuestras mejores obras* porque las buenas obras son buenas en la medida en que proceden de Su Espíritu,[^15] y en la medida en que son hechas por nosotros, son impuras y están mezcladas con tanta debilidad e imperfección que no pueden soportar la severidad del juicio de Dios.[^16]
  - n: 6
    text: No obstante, al ser aceptados los creyentes por medio de Cristo, sus buenas obras también son aceptadas en Él;[^17] no como si sus buenas obras en esta vida fueran enteramente irreprensibles e irreprochables ante los ojos de Dios, sino que Él, mirándolas en Su Hijo, se complace en aceptar y recompensar aquello que es sincero, aunque *esté* acompañado de muchas debilidades e imperfecciones.[^18]
  - n: 7
    text: Las obras hechas por hombres no regenerados, aunque en sí mismas sean cosas que Dios ordena, y de utilidad tanto para ellos mismos como para otros,[^19] aun así, puesto que no proceden de un corazón purificado por la fe,[^20] ni son hechas de una manera correcta—conforme a la Palabra—,[^21] ni para un fin correcto—la gloria de Dios—,[^22] son, por lo tanto, pecaminosas y no pueden agradar a Dios ni pueden hacer que un hombre sea apto para recibir la gracia por parte de Dios;[^23] y a pesar de esto, su descuido de estas obras es *aún* más pecaminoso y desagradable para Dios.[^24]
