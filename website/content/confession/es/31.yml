# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 31
title: Del estado del hombre después de la muerte y de la resurrección de los muertos
paragraphs:
  - n: 1
    text: Los cuerpos de los hombres vuelven al polvo después de la muerte y ven corrupción,[^1] pero sus almas (que no mueren ni duermen), teniendo una subsistencia inmortal, vuelven inmediatamente a Dios que las dio;[^2] entonces las almas de los justos son hechas perfectas en santidad, son recibidas en el Paraíso, donde están con Cristo y contemplan el rostro de Dios en luz y gloria, aguardando la plena redención de sus cuerpos;[^3] y las almas de los malvados son arrojadas al infierno, donde permanecen en tormento y total oscuridad, reservadas para el Juicio del gran Día;[^4] aparte de estos dos lugares para las almas separadas de sus cuerpos, la Escritura no reconoce ningún otro.
  - n: 2
    text: En el último día, los santos que se encuentren vivos no dormirán, sino que serán transformados;[^5] y todos los muertos serán resucitados con sus mismos cuerpos, y no con otros *cuerpos*;[^6] aunque con diferentes cualidades, estos serán unidos otra vez a sus almas para siempre.[^7]
  - n: 3
    text: Los cuerpos de los injustos, por el poder de Cristo, serán resucitados para deshonra; los cuerpos de los justos, por Su Espíritu, *serán resucitados* para honra, y serán hechos en conformidad al propio cuerpo glorioso de Cristo.[^8]
notes:
  "1": Gén. 3:19. Hch. 13:36.
  "2": Ecl. 12:7.
  "3": Luc. 23:43. 2 Cor. 5:1, 6, 8. Fil. 1:23. Heb. 12:23.
  "4": Jud. 6, 7. 1 Ped. 3:19. Luc. 16:23, 24.
  "5": 1 Cor. 15:51, 52. 1 Tes. 4:17.
  "6": Job 19:26, 27.
  "7": 1 Cor. 15:42, 43.
  "8": Hch. 24:15. Jua. 5:28, 29. Fil. 3:21.
