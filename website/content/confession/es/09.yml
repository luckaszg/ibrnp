# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 9
title: Del libre albedrío
paragraphs:
  - n: 1
    text: Dios ha investido la voluntad del hombre de esa libertad natural y poder para actuar por elección propia, que no es forzada ni está determinada a hacer el bien o el mal por ninguna necesidad de la naturaleza.[^1]
  - n: 2
    text: El hombre, en su estado de inocencia, tenía libertad y poder para querer y hacer aquello que era bueno y agradable a Dios;[^2] pero, aun así, era mutable, por lo tanto, podía caer de dicho estado.[^3]
  - n: 3
    text: El hombre, por su Caída en un estado de pecado, ha perdido enteramente toda capacidad de la voluntad para cualquier bien espiritual que acompañe la salvación;[^4] por tanto, como hombre natural que está completamente opuesto a ese bien y muerto en pecado,[^5] no puede por sus propias fuerzas convertirse a sí mismo, o prepararse para ello.[^6]
  - n: 4
    text: Cuando Dios convierte a un pecador y lo traslada al estado de gracia, lo libra de su esclavitud natural bajo el pecado,[^7] y—por Su sola gracia—lo capacita para querer y hacer libremente lo que es espiritualmente bueno;[^8] sin embargo, por causa de sus corrupciones remanentes, no quiere ni perfecta ni únicamente lo que es bueno, sino también lo que es malo.[^9]
  - n: 5
    text: La voluntad del hombre es hecha perfecta e inmutablemente libre, para el bien únicamente, solo en el estado de gloria.[^10]
notes:
  "1": Mat. 17:12. Stg. 1:14. Deu. 30:19.
  "2": Ecl. 7:29.
  "3": Gén. 3:6.
  "4": Rom. 5:6; 8:7.
  "5": Efe. 2:1, 5.
  "6": Tit. 3:3, 4, 5. Jua. 6:44.
  "7": Col. 1:13. Jua. 8:36.
  "8": Fil. 2:13.
  "9": Rom. 7:15, 18, 19, 21, 23.
  "10": Efe. 4:13.
