# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 14
title: De la fe salvadora
paragraphs:
  - n: 1
    text: La gracia de la fe, por medio de la cual los elegidos son capacitados para creer para la salvación de sus almas, es la obra del Espíritu de Cristo en sus corazones;[^1] es obrada ordinariamente a través del ministerio de la Palabra;[^2] por medio de la cual también—y por la administración del bautismo, y la Cena del Señor, la oración y otros medios establecidos por Dios—es aumentada y fortalecida.[^3]
  - n: 2
    text: "Por medio de esta fe, el cristiano cree que es verdad todo lo que es revelado en la Palabra, por la autoridad de Dios mismo;[^4] también percibe en ella una excelencia superior a todos los demás escritos y todas las cosas en el mundo,[^5] ya que esta muestra la gloria de Dios en Sus atributos, la excelencia de Cristo en Su naturaleza y oficios, y el poder y la plenitud del Espíritu Santo en sus obras y operaciones; de tal forma *el cristiano* es capacitado para confiar su alma a la verdad así creída;[^6] y también actúa de manera diferente, según sea el contenido de cada pasaje de la Palabra en particular; rindiendo obediencia a los mandatos,[^7] temblando ante las amenazas[^8] y abrazando las promesas de Dios para esta vida y para la venidera.[^9] Pero los actos principales de la fe salvadora están directamente relacionados con Cristo: aceptarlo, recibirlo y descansar solo en Él para la justificación, la santificación y la vida eterna, en virtud del Pacto de Gracia.[^10]"
  - n: 3
    text: Esta fe, aunque tenga diferentes grados y pueda ser débil o fuerte,[^11] aun así, es—*incluso* en su menor grado—diferente en su clase o naturaleza (como lo es toda otra gracia salvadora) de la fe y la gracia común de aquellos que son creyentes solo por un tiempo;[^12] por lo tanto, aunque puede ser asaltada y debilitada muchas veces, aun así, obtiene la victoria,[^13] creciendo en muchos hasta alcanzar una plena seguridad por medio de Cristo,[^14] quien es tanto el autor como el consumador de nuestra fe.[^15]
notes:
  "1": 2 Cor. 4:13. Efe. 2:8.
  "2": Rom. 10:14, 17.
  "3": Luc. 17:5. 1 Ped. 2:2. Hch. 20:32.
  "4": Hch. 24:14.
  "5": Sal. 19:7-10. Sal. 119:72.
  "6": 2 Tim. 1:12.
  "7": Jua. 15:14.
  "8": Isa. 66:2.
  "9": Heb. 11:13.
  "10": Jua. 1:12. Hch. 16:31. Gál. 2:20. Hch. 15:11.
  "11": Heb. 5:13, 14. Mat. 6:30. Rom. 4:19, 20.
  "12": 2 Ped. 1:1.
  "13": Efe. 6:16. 1 Jua. 5:4, 5.
  "14": Heb. 6:11, 12. Col. 2:2.
  "15": Heb. 12:2.
