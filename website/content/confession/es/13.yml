# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 13
title: De la santificación
paragraphs:
  - n: 1
    text: Aquellos que son unidos a Cristo, *que son* llamados eficazmente y regenerados, teniendo un nuevo corazón y un nuevo espíritu, creado en ellos en virtud de la muerte y resurrección de Cristo, son también santificados aún más, real y personalmente,[^1] en virtud de *esta muerte y resurrección*, por medio de Su Palabra y Su Espíritu que habitan en ellos;[^2] el dominio de todo el cuerpo de pecado es destruido,[^3] y los diversos deseos del mismo son cada vez más debilitados y mortificados;[^4] y ellos *son* cada vez más vivificados y fortalecidos en todas las virtudes salvadoras,[^5] para la práctica de toda verdadera santidad, sin la cual nadie verá al Señor.[^6]
  - n: 2
    text: Esta santificación es por completo, en el hombre en su totalidad,[^7] aunque imperfecta en esta vida; aún quedan algunos remanentes de corrupción en cada parte,[^8] de donde surge una guerra continua e irreconciliable; el deseo de la carne siendo contra el Espíritu, y el del Espíritu contra la carne.[^9]
  - n: 3
    text: En dicha guerra, aunque la corrupción remanente prevalezca mucho por un tiempo,[^10] aun así, la parte regenerada vence mediante la continua provisión de fuerzas por parte del Espíritu santificador de Cristo;[^11] así los santos crecen en la gracia, perfeccionando la santidad en el temor de Dios, esforzándose en pos de una vida celestial, en obediencia evangélica a todos los mandatos que Cristo, como Cabeza y Rey, les ha prescrito en Su Palabra.[^12]
notes:
  "1": Hch. 20:32. Rom. 6:5, 6.
  "2": Jua. 17:17. Efe. 3:16-19. 1 Tes. 5:21-23.
  "3": Rom. 6:14.
  "4": Gál. 5:24.
  "5": Col. 1:11.
  "6": 2 Cor. 7:1. Heb. 12:14.
  "7": 1 Tes. 5:23.
  "8": Rom. 7:18, 23.
  "9": Gál. 5:17. 1 Ped. 2:11.
  "10": Rom. 7:23.
  "11": Rom. 6:14.
  "12": Efe. 4:15, 16. 2 Cor. 3:18; 7:1.
