# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 18
title: De la seguridad de la gracia y la salvación
paragraphs:
  - n: 1
    text: Aunque los que son creyentes solo por un tiempo y otros hombres no regenerados se engañen vanamente con falsas esperanzas y presunciones carnales de estar en el favor de Dios y *en* el estado de salvación, esperanza de ellos que perecerá,[^1] los que creen verdaderamente en el Señor Jesús y lo aman con sinceridad, esforzándose por andar con toda buena conciencia delante de Él, pueden estar absolutamente seguros en esta vida de que están en el estado de gracia,[^2] y pueden regocijarse en la esperanza de la gloria de Dios, esperanza que nunca los avergonzará.[^3]
  - n: 2
    text: Esta certeza *de la gracia y la salvación* no es un mero convencimiento conjetural y probable basado en una esperanza falible, sino una seguridad infalible de fe[^4] basada en la sangre y la justicia de Cristo reveladas en el evangelio;[^5] *basada* también en la evidencia interna de aquellas virtudes del Espíritu a las que se hacen promesas,[^6] y en el testimonio del Espíritu de adopción que testifica a nuestro espíritu que somos hijos de Dios;[^7] y, como fruto de ello, mantiene el corazón humilde y también santo.[^8]
  - n: 3
    text: Esta seguridad infalible *de la gracia y la salvación* no pertenece tanto a la esencia de la fe, sino que un verdadero creyente puede *tener que* esperar mucho tiempo y entrar en conflicto con muchas dificultades antes de ser partícipe de tal seguridad;[^9] sin embargo, al ser capacitado por el Espíritu para conocer las cosas que le son dadas libre y gratuitamente por Dios, puede alcanzarla sin *una* revelación extraordinaria, con el uso correcto de los medios;[^10] por lo cual, es deber de cada uno ser tanto más diligente para hacer firme su llamado y elección, para que—por este medio—su corazón se ensanche en paz y gozo en el Espíritu Santo, en amor y gratitud a Dios, y en fortaleza y alegría en los deberes de la obediencia, *que son* los frutos propios de esta seguridad;[^11] así de lejos está *esta seguridad* de inclinar a los hombres al libertinaje.[^12]
  - n: 4
    text: "La seguridad de la salvación de los verdaderos creyentes puede ser zarandeada, disminuida o interrumpida de diversas maneras: por negligencia en conservarla,[^13] por caer en algún pecado específico—lo cual hiere la conciencia y contrista al Espíritu—,[^14] por alguna tentación repentina o vehemente,[^15] por retirarles Dios la luz de Su rostro y permitir, incluso a los que lo temen, andar en tinieblas y no tener luz;[^16] sin embargo, los verdaderos creyentes nunca son privados de la simiente de Dios[^17] y de la vida de la fe,[^18] *de* ese amor de Cristo y de los hermanos, *de* esa sinceridad de corazón y conciencia del deber, por los cuales, esta seguridad puede ser avivada a su debido tiempo por la operación del Espíritu;[^19] y, por medio de los cuales, mientras tanto, los verdaderos creyentes son preservados de *caer en* total desesperación.[^20]"
notes:
