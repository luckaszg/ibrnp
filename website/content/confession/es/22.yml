# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 22
title: De la adoración religiosa y del día de reposo
paragraphs:
  - n: 1
    text: La luz de la naturaleza demuestra que hay un Dios que tiene señorío y soberanía sobre todo; *que* es justo, bueno y hace el bien a todos; y, por lo tanto, debe ser temido, amado, alabado, invocado, se debe confiar en Él y debe ser servido con todo el corazón, con toda el alma y con todas las fuerzas.[^1] Pero la manera aceptable de adorar al Dios verdadero está instituida por Él mismo,[^2] y *está* tan delimitada por Su propia voluntad revelada, que no puede ser adorado conforme a las imaginaciones e invenciones de los hombres ni las sugerencias de Satanás, *ni* por medio de ninguna representación visible, ni de ninguna otra manera no prescrita en las Santas Escrituras.[^3]
  - n: 2
    text: La adoración religiosa debe ser tributada a Dios el Padre, Hijo y Espíritu Santo, y solo a Él[^4]—no a ángeles, ni a santos, ni a ninguna otra criatura—;[^5] y desde la Caída, no *debe ser tributada* sin un Mediador,[^6] ni por la mediación de ningún otro, sino solo *por medio de* Cristo.[^7]
  - n: 3
    text: La oración con acción de gracias, al ser una parte especial de la adoración natural, Dios la demanda de todos los hombres.[^8] Pero, para que sea aceptada, debe ser hecha en el nombre del Hijo,[^9] por la ayuda del Espíritu,[^10] conforme a Su voluntad;[^11] con entendimiento, reverencia, humildad, fervor, fe, amor y perseverancia; y cuando *se ora* con otros, *debe hacerse* en una lengua conocida.[^12]
  - n: 4
    text: La oración debe hacerse por cosas lícitas, y por toda clase de hombres que viven o vivirán más adelante;[^13] pero no *debe hacerse* por los muertos,[^14] ni por aquellos de quienes se puede saber que han cometido el pecado que lleva a la muerte.[^15]
  - n: 5
    text: La lectura de las Escrituras,[^16] la predicación y oír la Palabra de Dios,[^17] la enseñanza y amonestación de unos a otros con salmos, himnos y cánticos espirituales, cantar con acción de gracias en nuestro corazón al Señor,[^18] así como la administración del bautismo[^19] y la Cena del Señor[^20] son todos partes de la adoración religiosa a Dios que deben realizarse en obediencia a Él, con entendimiento, fe, reverencia y temor piadoso; además, la humillación solemne con ayunos,[^21] y acciones de gracias en ocasiones especiales, deben usarse de una manera santa y religiosa.[^22]
  - n: 6
    text: Ni la oración ni ninguna otra parte de la adoración religiosa está atada a, o se hace más aceptable por, ningún lugar en que se realice o hacia el que esté dirigida ahora bajo el evangelio, sino que Dios debe ser adorado en todas partes en espíritu y en verdad;[^23] tanto en cada familia en particular[^24] diariamente,[^25] como cada uno en secreto por sí solo,[^26] así como de una manera más solemne en las asambleas públicas, las cuales no deben descuidarse o abandonarse ni por negligencia ni deliberadamente cuando Dios por Su Palabra o *Su* providencia llama a ello.[^27]
  - n: 7
    text: Así como la ley de la naturaleza es que, en general, una proporción de tiempo sea apartada por designio de Dios para la adoración a Dios, también por Su Palabra, con un mandamiento positivo, moral y perpetuo que obliga a todos los hombres en todas las edades, Dios ha señalado particularmente un día de cada siete como día de reposo, para que sea guardado santo para Él;[^28] el cual, desde el principio del mundo hasta la resurrección de Cristo, fue el último día de la semana, y desde la resurrección de Cristo fue cambiado al primer día de la semana, que es llamado «el día del Señor»;[^29] y debe continuar *siendo guardado* hasta el fin del mundo como el día de reposo cristiano, habiéndose abolido la observancia del último día de la semana.
  - n: 8
    text: Entonces, el día de reposo es guardado santo para el Señor cuando los hombres, después de una debida preparación de su corazón y haber ordenado de antemano *debidamente* sus asuntos cotidianos, no solo observan un santo reposo, durante todo el día, de sus propias labores, palabras y pensamientos acerca de sus ocupaciones y recreaciones en este mundo,[^30] sino que también se dedican todo el tiempo a los ejercicios públicos y privados de la adoración a Dios, y a los deberes que son por necesidad y por misericordia.[^31]
