# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 4
title: De la Creación
paragraphs:
  - n: 1
    text: En el principio agradó a Dios el Padre, Hijo y Espíritu Santo,[^1] para la manifestación de la gloria de Su poder, sabiduría y bondad eternos,[^2] crear o hacer el mundo y todas las cosas que en él hay, ya sean visibles o invisibles, en el lapso de seis días, y todas buenas en gran manera.[^3]
  - n: 2
    text: Después que Dios hizo todas las demás criaturas, creó al hombre, varón y hembra,[^4] con almas racionales e inmortales,[^5] haciéndolos aptos para esa vida para Dios, para la cual fueron creados; siendo hechos a imagen de Dios, en conocimiento, justicia y santidad de la verdad;[^6] teniendo la ley de Dios escrita en sus corazones,[^7] y *teniendo* el poder para cumplirla; sin embargo, con la posibilidad de transgredir, al haber sido dejados a la libertad de su propia voluntad, la cual estaba sujeta a cambio.[^8]
  - n: 3
    text: Además de la ley escrita en sus corazones, recibieron un mandato de no comer del árbol del conocimiento del bien y del mal;[^9] *y*, mientras lo guardaron, fueron felices en su comunión con Dios y tuvieron dominio sobre las criaturas.[^10]
notes:
  "1": Jua. 1:2, 3. Heb. 1:2. Job 26:13.
  "2": Rom. 1:20.
  "3": Col. 1:16. Gén. 2:1, 2.
  "4": Gén. 1:27.
  "5": Gén. 2:7.
  "6": Ecl. 7:29. Gén. 1:26.
  "7": Rom. 2:14, 15.
  "8": Gén. 3:6.
  "9": Gén. 2:17; y 3:8, 9, 10.
  "10": Gén. 1:26, 28.
