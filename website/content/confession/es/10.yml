# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 10
title: Del llamamiento eficaz
paragraphs:
  - n: 1
    text: A quienes Dios ha predestinado para vida, le agrada llamar eficazmente en Su tiempo señalado y aceptable,[^1] por medio de Su Palabra y Su Espíritu, sacándolos de ese estado de pecado y muerte en que están por naturaleza a la gracia y la salvación por medio de Jesucristo;[^2] iluminando sus mentes, espiritual y salvíficamente, para que entiendan las cosas de Dios;[^3] quitándoles su corazón de piedra y dándoles un corazón de carne;[^4] renovando sus voluntades y, por Su poder omnipotente, determinándolos a lo que es bueno y atrayéndolos eficazmente a Jesucristo;[^5] pero, de tal modo que vienen libérrimamente, habiendo sido hechos dispuestos *para ello* por Su gracia.[^6]
  - n: 2
    text: Este llamamiento eficaz proviene solo de la gracia libre, gratuita y especial de Dios, no de ninguna cosa en absoluto *que haya sido* prevista en el hombre, ni *proviene* de ningún poder o agencia en la criatura que coopere con Su gracia especial,[^7] siendo la criatura enteramente pasiva en esto, estando el hombre muerto en delitos y pecados, hasta que—*al ser* vivificado y renovado por el Espíritu Santo—[^8] es capacitado por este medio para responder a este llamamiento, y para recibir la gracia ofrecida y transmitida en este; y esto por un poder no menor que el que resucitó a Cristo de entre los muertos.[^9]
  - n: 3
    text: Los infantes elegidos que mueren en la infancia son regenerados y salvados por Cristo por medio del Espíritu,[^10] quien obra cuando, donde y como le place;[^11] así también son regenerados y salvados todos los demás elegidos que no tienen la capacidad para ser llamados externamente por el ministerio de la Palabra.
  - n: 4
    text: Otros, que no son elegidos, aunque sean llamados por el ministerio de la Palabra y tengan algunas operaciones comunes del Espíritu,[^12] aun así, al no ser atraídos eficazmente por el Padre,[^13] no quieren ni pueden venir a Cristo verdaderamente y, por lo tanto, tampoco pueden ser salvos; mucho menos pueden ser salvos los hombres que no reciben la Religión cristiana, por muy diligentes que sean para ajustar sus vidas conforme a la luz de la naturaleza y la ley de la religión que profesen.[^14]
notes:
  "1": Rom. 8:30. Rom. 11:7. Efe. 1:10, 11. 2 Tes. 3:13, 14.
  "2": Efe. 2:1-6.
  "3": Hch. 26:18. Efe. 1:17, 18.
  "4": Eze. 36:26.
  "5": Deu. 30:6. Eze. 36:27. Efe. 1:19.
  "6": Sal. 110:3. Cnt. 1:4.
  "7": 2 Tim. 1:9. Efe. 2:8.
  "8": 1 Cor. 2:14. Efe. 2:5. Jua. 5:25.
  "9": Efe. 1:19, 20.
  "10": Jua. 3:3, 5, 6.
  "11": Jua. 3:8.
  "12": Mat. 22:14; 13:20, 21. Heb. 6:4, 5.
  "13": Jua. 6:44, 45, 65. 1 Jua. 2:24, 25.
  "14": Hch. 4:12. Jua. 4:22; 17:3.
