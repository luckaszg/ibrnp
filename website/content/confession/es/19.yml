# Second London Baptist Confession of Faith (1677/1689), Spanish translation.
# Translation: Editorial Legado Bautista Confesional, used with permission. Source: assets/2lbc_reader_edition.pdf
# [^n] markers point to the proof texts in "notes".
chapter: 19
title: De la ley de Dios
paragraphs:
  - n: 1
    text: Dios dio a Adán una ley de obediencia universal, escrita en su corazón, y un precepto en particular de no comer del fruto del árbol del conocimiento del bien y del mal;[^1] por medio de los cuales obligó a Adán y a toda su posteridad a una obediencia personal, completa, exacta y perpetua;[^2] prometió la vida por su cumplimiento y amenazó su transgresión con la muerte; y lo dotó de poder y capacidad para guardarlos.[^3]
  - n: 2
    text: La misma ley que fue escrita primero en el corazón del hombre continuó siendo una regla perfecta de justicia después de la Caída;[^4] y fue dada por Dios en el monte Sinaí, en Diez Mandamientos, y escrita en dos tablas *de piedra*; los cuatro primeros *mandamientos* que contienen nuestro deber para con Dios, y los otros seis *que contienen* nuestro deber hacia el hombre.[^5]
  - n: 3
    text: Además de esta ley, comúnmente llamada *ley* moral, agradó a Dios dar al pueblo de Israel leyes ceremoniales que contenían varias ordenanzas típicas; en parte, de adoración, prefigurando a Cristo,[^6] Sus virtudes, acciones, sufrimientos y beneficios; y, en parte, dando diversas instrucciones sobre deberes morales;[^7] leyes ceremoniales todas estas que, al haber sido establecidas solo hasta el tiempo de reformar las cosas, han sido abrogadas y quitadas por Jesucristo, el verdadero Mesías y único Dador de la ley, quien fue investido con poder del Padre para ese fin.[^8]
  - n: 4
    text: Dios también dio a los israelitas varias leyes judiciales, las cuales caducaron junto con el estado de aquel pueblo, no siendo ahora obligatorias para nadie en virtud de aquella institución; siendo solo sus principios generales de equidad de utilidad moral.[^9]
  - n: 5
    text: La ley moral obliga para siempre a todos, tanto a los justificados como a los demás, a que se la obedezca,[^10] y no solo en lo referente a la materia contenida en esta, sino también en lo que se refiere a la autoridad de Dios el Creador, quien la dio.[^11] Tampoco Cristo, en el evangelio, cancela de ninguna manera esta obligación, sino que la refuerza mucho.[^12]
  - n: 6
    text: Aunque los verdaderos creyentes no estén bajo la ley como un pacto de obras para ser justificados o condenados por esta,[^13] aun así, la ley es de gran utilidad tanto para ellos como para otros, en el sentido de que, como una regla de vida que les informa acerca de la voluntad de Dios y su deber, los dirige y los obliga a andar en conformidad con esta; revelándoles también las contaminaciones pecaminosas de sus naturalezas, corazones y vidas; para que, al examinarse a sí mismos a la luz de esta, puedan llegar a una mayor convicción de *pecado*, humillación *por el pecado* y odio contra el pecado;[^14] junto con una visión más clara de la necesidad que tienen de Cristo y de la perfección de Su obediencia. La ley también es útil para los regenerados, para restringir sus corrupciones, en el sentido de que prohíbe el pecado; y sus amenazas sirven para mostrar lo que sus pecados todavía merecen y qué aflicciones pueden esperar por estos en esta vida, aunque estén libres de la maldición y del rigor implacable de la ley. Las promesas de la ley también muestran a los regenerados que Dios aprueba la obediencia, y qué bendiciones pueden esperar por el cumplimiento de la ley, aunque no como si se les debiera por la ley como un pacto de obras; de manera que hacer lo bueno y abstenerse de lo malo porque la ley anima a *hacer* lo uno y disuade de lo otro no es evidencia de que un hombre esté bajo la ley y no bajo la gracia.[^15]
  - n: 7
    text: Tampoco los usos de la ley mencionados anteriormente son contrarios a la gracia del evangelio, sino que obedecen a esta dulcemente;[^16] el Espíritu de Cristo subyugando y capacitando la voluntad del hombre para que haga libre y alegremente lo que la voluntad de Dios revelada en la ley requiere que se haga.[^17]
notes:
  "1": Gén. 1:27. Ecl. 7:29.
  "2": Rom. 10:5.
  "3": Gál. 3:10, 12.
  "4": Rom. 2:14, 15.
  "5": Deu. 10:4.
  "6": Heb. 10:1. Col. 2:17.
  "7": 1 Cor. 5:7.
  "8": Col. 2:14, 16, 17. Efe. 2:14, 16.
  "9": 1 Cor. 9:8-10.
  "10": Rom. 13:8-10. Stg. 2:8, 10-12.
  "11": Stg. 2:10, 11.
  "12": Mat. 5:17-19. Rom. 3:31.
  "13": Rom. 6:14. Gál. 2:16. Rom. 8:1; 10:4.
  "14": Rom. 3:20; 7:7, etc.
  "15": Rom. 6:12, 13, 14. 1 Ped. 3:8-13.
  "16": Gál. 3:21.
  "17": Eze. 36:27.
