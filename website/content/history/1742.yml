year: "1742"
part: heritage
title: { es: La Confesión de Filadelfia, en: The Philadelphia Confession }
description:
  es: La Asociación Bautista de Filadelfia adopta la Confesión de 1689, con dos artículos añadidos, y la confesión se extiende por las iglesias bautistas de América.
  en: The Philadelphia Baptist Association adopts the 1689 Confession, with two added articles, and the confession spreads through the Baptist churches of America.
