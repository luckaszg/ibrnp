year: "1689"
part: heritage
title: { es: La Asamblea General adopta la Confesión, en: The General Assembly adopts the Confession }
description:
  es: Tras el Acta de Tolerancia, representantes de más de cien iglesias se reúnen en Londres y suscriben la confesión, que desde entonces se conoce como la Confesión de 1689.
  en: After the Act of Toleration, representatives of more than a hundred churches meet in London and endorse the confession, known ever since as the 1689 Confession.
