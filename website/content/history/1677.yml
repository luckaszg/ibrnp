year: "1677"
part: heritage
title: { es: Segunda Confesión Bautista de Londres, en: Second London Baptist Confession }
description:
  es: En tiempos de persecución, los bautistas particulares publican una nueva confesión basada en la Confesión de Westminster y la Declaración de Saboya, mostrando su acuerdo con otros protestantes y sus convicciones sobre la Iglesia y el bautismo.
  en: In a time of persecution, the Particular Baptists publish a new confession based on the Westminster Confession and the Savoy Declaration, showing their agreement with other Protestants and their convictions on the Church and baptism.
