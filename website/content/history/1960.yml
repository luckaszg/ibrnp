year: "s. XX"
part: heritage
title: { es: Recuperación de la Confesión, en: Recovery of the Confession }
description:
  es: En la segunda mitad del siglo XX, iglesias en Inglaterra, Norteamérica y luego en todo el mundo recuperan la Confesión de 1689 y la fe de los bautistas particulares. Hoy es confesada por iglesias en América Latina y en muchas otras naciones.
  en: In the second half of the twentieth century, churches in England, North America and then around the world recover the 1689 Confession and the faith of the Particular Baptists. Today it is confessed by churches in Latin America and many other nations.
