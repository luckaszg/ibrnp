year: "1644"
part: heritage
title: { es: Primera Confesión Bautista de Londres, en: First London Baptist Confession }
description:
  es: Siete iglesias bautistas particulares de Londres publican una confesión de fe para mostrar que su doctrina era la fe reformada y para defenderse de falsas acusaciones.
  en: Seven Particular Baptist churches in London publish a confession of faith to show that their doctrine was the Reformed faith and to answer false accusations.
